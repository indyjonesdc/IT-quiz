// ─── PROFIL SCREEN ────────────────────────────────────
function ProfileScreen({ user, onSave, onBack, loading }) {
  const [profile, setProfile] = useState({
    company: user.company||'', position: user.position||'',
    fav_hw: user.fav_hw||'', os_religion: user.os_religion||'',
    coffee_cups: user.coffee_cups||'', debug_style: user.debug_style||'',
    superpower: user.superpower||'',
  });
  const [avatarPreview, setAvatarPreview] = useState(user.avatar_url ? avatarSrc(user.avatar_url) : null);
  const [avatarFile, setAvatarFile] = useState(null);     // komprimovaný Blob
  const [avatarUploading, setAvatarUploading] = useState(false);
  const [avatarError, setAvatarError] = useState('');
  const [avatarSize, setAvatarSize] = useState('');       // info o velikosti pro UI
  const fileRef = useRef(null);

  function pickFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { setAvatarError('Pouze obrázky (JPG, PNG, WebP)'); return; }
    setAvatarError('');
    // Komprimuj pomocí Canvas — max 800px, JPEG 0.82
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => {
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          setAvatarFile(blob);
          setAvatarSize(`${(blob.size/1024).toFixed(0)} KB`);
          setAvatarPreview(canvas.toDataURL('image/jpeg', 0.82));
        }, 'image/jpeg', 0.82);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function handleSave() {
    let avatarUrl = user.avatar_url ? user.avatar_url.split('?')[0] : null;
    if (avatarFile) {
      setAvatarUploading(true);
      try {
        const path = `${user.id}/avatar`;
        const { error: upErr } = await db.storage
          .from('avatars')
          .upload(path, avatarFile, { upsert: true, contentType: 'image/jpeg' });
        if (upErr) { setAvatarError('Upload selhal: ' + upErr.message); setAvatarUploading(false); return; }
        const { data: urlData } = db.storage.from('avatars').getPublicUrl(path);
        avatarUrl = urlData.publicUrl;
      } catch(e) { setAvatarError('Upload selhal'); setAvatarUploading(false); return; }
      setAvatarUploading(false);
    }
    onSave({ ...profile, avatar_url: avatarUrl });
  }

  const isWorking = loading || avatarUploading;

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'20px',overflowY:'auto'}}>
      <div className="slide-in" style={{width:'100%',maxWidth:480,textAlign:'center',paddingTop:30,paddingBottom:30}}>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,letterSpacing:4,color:'#4488ff',marginBottom:16}}>PROFIL HRÁČE</div>

        {/* AVATAR PICKER */}
        <div style={{marginBottom:20,display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
          <div className="avatar-upload-wrap" onClick={()=>fileRef.current?.click()}
            style={{width:96,height:96,borderRadius:'50%',border:`2px solid ${avatarPreview?'#4488ff':'#2a3a6a'}`,overflow:'hidden',flexShrink:0,background:'#0d1428'}}>
            {avatarPreview
              ? <img src={avatarPreview} alt="avatar" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:36,color:'#2a3a6a'}}>👤</div>
            }
            <div className="avatar-overlay">📷</div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={pickFile}/>
          <button onClick={()=>fileRef.current?.click()} style={{background:'transparent',border:'1px solid #2a3a6a',color:'#4488ff',fontSize:11,padding:'5px 16px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',letterSpacing:1}}>
            {avatarPreview ? '📷 ZMĚNIT FOTKU' : '📷 PŘIDAT FOTKU'}
          </button>
          {avatarError && <div style={{color:'#ff4444',fontSize:11}}>{avatarError}</div>}
          <div style={{fontSize:10,color:'#334455'}}>
            {avatarSize ? `Zkomprimováno na ${avatarSize} ✓` : 'Jakákoliv velikost · JPG, PNG, WebP · automaticky zkomprimováno'}
          </div>
        </div>

        <div style={{fontSize:20,fontWeight:700,color:'#fff',marginBottom:4}}>{user.name}</div>
        {user.company && <div style={{fontSize:13,color:'#556688',marginBottom:10}}>{user.company}{user.position?` · ${user.position}`:''}</div>}

        {/* Vtipný fakt */}
        <div style={{background:'rgba(68,136,255,0.06)',border:'1px dashed #2a3a6a',borderRadius:10,padding:'10px 14px',marginBottom:18,display:'flex',gap:10,alignItems:'flex-start',textAlign:'left'}}>
          <span style={{fontSize:18,flexShrink:0}}>💡</span>
          <div style={{fontSize:12,color:'#556688',lineHeight:1.55,fontStyle:'italic'}}>{getPlayerFact(user.name)}</div>
        </div>

        <div style={{background:'rgba(20,35,80,0.6)',border:'1px solid #2a3a6a',borderRadius:12,padding:24,textAlign:'left'}}>
          <ProfileFields profile={profile} setProfile={setProfile}/>
          <button className="btn" onClick={handleSave} disabled={isWorking}
            style={{marginTop:20,width:'100%',background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'13px',borderRadius:8,fontSize:14,color:'#fff',letterSpacing:3}}>
            {avatarUploading ? '📤 NAHRÁVÁM FOTKU...' : loading ? 'UKLÁDÁM...' : '💾 ULOŽIT PROFIL'}
          </button>
        </div>
        <button onClick={onBack} style={{marginTop:14,background:'transparent',border:'none',color:'#334455',fontSize:12,cursor:'pointer',letterSpacing:1}}>← ZPĚT</button>
      </div>

  );

// ─── LUCKY BOX SLOT (renderuje se místo klasických odpovědí) ─
function LuckyBoxSlot({ prizes, onPick, locked }) {
  const [opened, setOpened] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [done, setDone] = useState(false);       // hráč kliknul "Zobrazit výsledky"

  const prizeColor = (pts) => pts >= 500 ? '#ffd700' : pts >= 100 ? '#44ff88' : pts === 0 ? '#8899bb' : '#ff4444';
  const prizeLabel = (pts) => pts > 0 ? `+${pts}` : String(pts);

  function pick(i) {
    if (locked || opened !== null) return;
    setOpened(i);
    setTimeout(() => setRevealed(true), 900);
  }

  function confirm() {
    if (!revealed) return;
    setDone(true);
    onPick(prizes[opened]);
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16,paddingBottom:20}}>
      {opened === null && (
        <div style={{textAlign:'center',color:'#556688',fontSize:13,animation:'slideIn 0.4s ease'}}>
          Jedna bedna skrývá jackpot. Jedna zkázu. Vyber moudře... nebo vůbec ne.
        </div>
      )}

      {/* Truhličky */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,width:'100%',maxWidth:380}}>
        {prizes.map((pts, i) => {
          const isThis = opened === i;
          const col = prizeColor(pts);
          const isPositive = pts > 0;
          const isJackpot = pts === 1000;
          const isBomb = pts === -500;
          const showContent = isThis || (opened !== null);

          return (
            <button key={i} className="chest-btn" onClick={() => pick(i)}
              disabled={locked || opened !== null}
              style={{
                padding:'22px 12px', borderRadius:16,
                border: isThis ? `2px solid ${col}` : opened !== null ? `1px solid #1e2a4a` : '2px solid #2a3a6a',
                background: isThis
                  ? `rgba(${isPositive?'0,80,40':'80,0,0'},0.4)`
                  : opened !== null ? 'rgba(10,15,40,0.6)' : 'rgba(15,25,60,0.85)',
                display:'flex', flexDirection:'column', alignItems:'center', gap:10,
                animation: isThis ? 'chestOpen 0.5s ease forwards' : 'none',
                boxShadow: isThis && isJackpot ? '0 0 40px #ffd700aa' : 'none',
                transition:'all 0.3s',
                opacity: opened !== null && !isThis ? 0.6 : 1,
              }}>
              <div style={{
                fontSize: isThis ? 52 : 38, lineHeight:1,
                animation: isThis ? 'chestShake 0.4s ease' : 'none',
                filter: isThis ? `drop-shadow(0 0 12px ${col})` : 'none',
              }}>
                {opened !== null
                  ? (isThis
                      ? (isJackpot ? '🏆' : isBomb ? '💣' : isPositive ? '💰' : '🪦')
                      : '📦')
                  : '📦'}
              </div>

              {/* Hodnota po výběru — vždy zobrazit */}
              {opened !== null && (
                <div style={{
                  fontSize: isThis ? 22 : 15,
                  fontWeight:900, color: isThis ? col : '#445566',
                  fontFamily:"'Orbitron',sans-serif", letterSpacing:1,
                  animation: isThis && revealed ? 'prizePop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards' : 'none',
                  opacity: (!isThis || revealed) ? 1 : 0,
                }}>
                  {prizeLabel(pts)}
                </div>
              )}

              {/* Číslo bedny před výběrem */}
              {opened === null && (
                <div style={{fontSize:11,color:'#445566',letterSpacing:2}}>#{i+1}</div>
              )}
            </button>
          );
        })}
      </div>

      {/* Reakce po výběru */}
      {opened !== null && revealed && !done && (
        <div className="slide-in" style={{
          textAlign:'center', padding:'12px 18px', maxWidth:380, width:'100%',
          background:'rgba(20,30,70,0.7)', border:'1px solid #2a3a6a', borderRadius:12,
        }}>
          <div style={{fontSize:14, color: prizeColor(prizes[opened]), fontWeight:600, lineHeight:1.5, marginBottom:14}}>
            {getLuckyReaction(prizes[opened])}
          </div>
          <button className="btn" onClick={confirm} style={{
            background:'linear-gradient(135deg,#1a3a8a,#2255cc)',
            padding:'12px 32px', borderRadius:10, fontSize:14,
            color:'#fff', letterSpacing:2,
          }}>
            ZOBRAZIT VÝSLEDKY →
          </button>
        </div>
      )}

      {opened !== null && !revealed && (
        <div style={{color:'#4a6a9a',fontSize:13}}>otvírám...</div>
      )}
    </div>
  );
}

// ─── QUIZ ─────────────────────────────────────────────
function QuizScreen({ quiz: initQuiz, onFinish, onWrong, onCombo }) {
  const [quiz, setQuiz] = useState({...initQuiz});
  const [selected, setSelected] = useState(null);
  const [locked, setLocked] = useState(false);
  const [flash, setFlash] = useState(null);
  const [paused, setPaused] = useState(false);
  const [comboCount, setComboCount] = useState(0);
  const timer = useRef(null);
  const pausedRef = useRef(false);
  const pendingRef = useRef(null);
  // Používáme refy pro věci, kde nechceme stale closure:
  const timeLeftRef = useRef(initQuiz.timeLeft);
  const questionStartTimeRef = useRef(initQuiz.timeLeft);
  const comboCountRef = useRef(0);
  const playLogRef = useRef([]); // log každé odpovědi pro anti-cheat

  const q = quiz.questions[quiz.current];

  // Globální resume callback pro App overlay
  useEffect(() => {
    window._quizResumeCallback = () => {
      if (!pausedRef.current) return;
      pausedRef.current = false;
      setPaused(false);
      if (pendingRef.current) {
        const { idx, qSnap, answers, totalScore, current, questionsLen, allQuestions } = pendingRef.current;
        pendingRef.current = null;
        const newAns = [...answers, {q: qSnap.id, chosen: idx, correct: false, pts: 0, comboBonus: 0}];
        const next = current + 1;
        if (next >= questionsLen) {
          clearInterval(timer.current);
          onFinish({ questions: allQuestions, answers: newAns, totalScore, current: next, timeLeft: 0, playLog: playLogRef.current });
        } else {
          setFlash(null);
          // Reset komba a start time pro novou otázku
          comboCountRef.current = 0;
          setComboCount(0);
          questionStartTimeRef.current = timeLeftRef.current;
          setQuiz(p => {
            const updated = {...p, answers: newAns, current: next};
            saveActiveQuiz({...updated, timeLeft: timeLeftRef.current});
            return updated;
          });
          setSelected(null);
          setLocked(false);
        }
      }
    };
    return () => { window._quizResumeCallback = null; };
  }, []); // prázdné deps — používáme jen refy

  // Hlavní timer — tick každou sekundu
  useEffect(() => {
    timer.current = setInterval(() => {
      if (pausedRef.current) return;
      setQuiz(prev => {
        const newTime = prev.timeLeft - 1;
        timeLeftRef.current = newTime; // sync ref
        if (newTime <= 0) {
          clearInterval(timer.current);
          onFinish({...prev, timeLeft: 0, playLog: playLogRef.current});
          return {...prev, timeLeft: 0};
        }
        return {...prev, timeLeft: newTime};
      });
    }, 1000);
    return () => clearInterval(timer.current);
  }, []);

  function answer(idx) {
    if (locked) return;
    setLocked(true);
    setSelected(idx);
    const ok = idx === q.a;
    setFlash(ok ? 'ok' : 'no');

    // Kombo: čas strávený na otázce = čas při začátku - čas při odpovědi
    const timeSpent = questionStartTimeRef.current - timeLeftRef.current;
    const isQuick = ok && timeSpent <= COMBO_TIME_LIMIT;

    if (!ok) {
      // Zaznamenej špatnou odpověď do play logu
      playLogRef.current.push({
        qId: q.id,
        chosen: idx,
        correct: false,
        time_spent: questionStartTimeRef.current - timeLeftRef.current,
        time_left: timeLeftRef.current,
        pts: 0,
      });
      // Reset komba, zastavit timer, zobrazit overlay
      comboCountRef.current = 0;
      setComboCount(0);
      pausedRef.current = true;
      setPaused(true);
      pendingRef.current = {
        idx, qSnap: q,
        answers: quiz.answers, totalScore: quiz.totalScore,
        current: quiz.current, questionsLen: quiz.questions.length, allQuestions: quiz.questions,
      };
      onWrong(q);
    } else {
      // Správná odpověď
      const newCombo = isQuick ? comboCountRef.current + 1 : 1;
      comboCountRef.current = newCombo;
      setComboCount(newCombo);

      let bonus = 0;
      if (newCombo === 3) bonus = COMBO3_BONUS;
      else if (newCombo === 4) bonus = COMBO4_BONUS;
      else if (newCombo >= 5) bonus = COMBO5_BONUS;

      if (bonus > 0) onCombo(Math.min(newCombo, 5), bonus);

      const pts = calcPoints(timeLeftRef.current) + bonus;
      // Zaznamenej odpověď do play logu
      playLogRef.current.push({
        qId: q.id,
        chosen: idx,
        correct: true,
        time_spent: questionStartTimeRef.current - timeLeftRef.current,
        time_left: timeLeftRef.current,
        pts,
      });

      setTimeout(() => {
        setFlash(null);
        const newAns = [...quiz.answers, {q: q.id, chosen: idx, correct: true, pts, comboBonus: bonus}];
        const newScore = quiz.totalScore + pts;
        const next = quiz.current + 1;
        if (next >= quiz.questions.length) {
          clearInterval(timer.current);
          onFinish({...quiz, answers: newAns, totalScore: newScore, current: next, playLog: playLogRef.current});
        } else {
          // Reset start time pro novou otázku
          questionStartTimeRef.current = timeLeftRef.current;
          setQuiz(p => {
            const updated = {...p, answers: newAns, totalScore: newScore, current: next};
            saveActiveQuiz({...updated, timeLeft: timeLeftRef.current});
            return updated;
          });
          setSelected(null);
          setLocked(false);
        }
      }, 600);
    }
  }

  const isLucky = q && q.type === 'lucky';

  // Speciální handler pro Lucky Box
  function answerLucky(pts) {
    if (locked) return;
    setLocked(true);
    clearInterval(timer.current);
    comboCountRef.current = 0;
    setComboCount(0);
    // Zapiš Lucky Box do play logu
    playLogRef.current.push({
      qId: 'lucky',
      chosen: pts,
      correct: pts > 0,
      time_spent: questionStartTimeRef.current - timeLeftRef.current,
      time_left: timeLeftRef.current,
      pts: Math.max(pts, 0),
    });
    // Použij setQuiz callback aby měl vždy aktuální stav (ne stale closure)
    setQuiz(currentQuiz => {
      const newAns = [...currentQuiz.answers, {q: 'lucky', chosen: pts, correct: pts > 0, pts: Math.max(pts, 0), luckyPts: pts, comboBonus: 0}];
      const newScore = Math.max(currentQuiz.totalScore + pts, 0);
      // Zavolej onFinish s aktuálním stavem
      setTimeout(() => {
        onFinish({...currentQuiz, answers: newAns, totalScore: newScore, current: currentQuiz.current + 1, playLog: playLogRef.current});
      }, 0);
      return currentQuiz; // stav se nezmění — jen čteme
    });
  }

  const totalDuration = initQuiz.totalDuration || QUIZ_DURATION;
  const tc = quiz.timeLeft > 30 ? '#4488ff' : quiz.timeLeft > 10 ? '#ffaa22' : '#ff3333';
  const labels = ['A','B','C','D'];
  const COMBO_CFG = {3:{c:'#ff9900',e:'🔥×3'},4:{c:'#aa44ff',e:'⚡×4'},5:{c:'#ff2255',e:'💥×5+'}};
  const comboCfg = comboCount >= 3 ? (COMBO_CFG[Math.min(comboCount,5)] || COMBO_CFG[5]) : null;

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',padding:20,maxWidth:660,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:20,marginBottom:16}}>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:2,color: isLucky?'#ffd700':'#556688'}}>
          {isLucky ? '🎲 LUCKY BOX' : `OTÁZKA ${quiz.current+1}/${quiz.questions.length}`}
        </div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:30,fontWeight:900,color:paused?'#556688':tc,letterSpacing:2,textShadow:paused?'none':`0 0 15px ${tc}`,transition:'color 0.3s'}}>
          {paused ? <span style={{fontSize:20}}>⏸ {quiz.timeLeft}s</span> : `${quiz.timeLeft}s`}
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:13,color:'#88aaff',letterSpacing:1}}>{quiz.totalScore.toLocaleString()} b</div>
          {comboCfg && (
            <div style={{fontSize:12,fontWeight:700,color:comboCfg.c,animation:'counterBump 0.3s ease',letterSpacing:1}}>
              {comboCfg.e}
            </div>
          )}
          {!comboCfg && comboCount >= 2 && (
            <div style={{fontSize:11,color:'#445566'}}>🔥×{comboCount}</div>
          )}
        </div>
      </div>
      <div style={{background:'#1a2040',borderRadius:4,height:4,marginBottom:6,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(quiz.current/quiz.questions.length)*100}%`,background:'linear-gradient(90deg,#2255cc,#4488ff)',transition:'width 0.3s'}}/>
      </div>
      <div style={{background:'#1a2040',borderRadius:4,height:4,marginBottom:22,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(quiz.timeLeft/totalDuration)*100}%`,background:paused?'#556688':tc,transition:paused?'none':'width 1s linear',boxShadow:paused?'none':`0 0 6px ${tc}`}}/>
      </div>
      <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,letterSpacing:3,color: isLucky?'#ffd700':'#4488ff',marginBottom:10,textAlign:'center'}}>{q.cat}</div>
      <div className="slide-in" style={{background: isLucky ? 'linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,140,0,0.06))' : flash==='ok'?'rgba(0,70,0,0.35)':flash==='no'?'rgba(70,0,0,0.35)':'rgba(15,28,70,0.65)',border:`1px solid ${isLucky?'#ffd70066':flash==='ok'?'#22aa22':flash==='no'?'#aa2222':'#2a3a6a'}`,borderRadius:16,padding:'22px 22px 18px',marginBottom:18,transition:'all 0.3s'}}>
        {isLucky && <div style={{textAlign:'center',fontSize:36,marginBottom:10}}>🎲</div>}
        {q.img && !isLucky && <div style={{textAlign:'center',fontSize:44,marginBottom:14}}>{q.img}</div>}
        {q.hint && <div style={{fontSize:11,color:'#556688',marginBottom:10,textAlign:'center'}}>{q.hint}</div>}
        <div style={{fontSize:'clamp(15px,2.4vw,19px)',fontWeight: isLucky?700:500,lineHeight:1.55,textAlign:'center',color: isLucky?'#ffd700':'#ddeeff'}}>{q.q}</div>
        {isLucky && <div style={{textAlign:'center',fontSize:11,color:'#cc9900',marginTop:8,letterSpacing:0.5}}>Ceny: od -500 až +1000 bodů</div>}
      </div>

      {/* Lucky Box nebo klasické odpovědi */}
      {isLucky
        ? <LuckyBoxSlot prizes={q.prizes} onPick={answerLucky} locked={locked}/>
        : <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,flex:1}}>
            {q.opts.map((opt,i)=>{
              let bg='rgba(12,20,52,0.85)',br='#2a3a6a',col='#bbc8ee';
              if(selected!==null){ if(i===q.a){bg='rgba(0,70,0,0.55)';br='#22aa22';col='#88ff88';} else if(i===selected&&selected!==q.a){bg='rgba(70,0,0,0.55)';br='#aa2222';col='#ff8888';} }
              return (
                <button key={i} onClick={()=>answer(i)} disabled={locked} style={{background:bg,border:`1px solid ${br}`,borderRadius:10,padding:'13px 11px',cursor:locked?'default':'pointer',color:col,fontFamily:'inherit',textAlign:'left',transition:'all 0.2s',fontSize:'clamp(12px,1.7vw,14px)',fontWeight:500,letterSpacing:0.3,lineHeight:1.45,display:'flex',alignItems:'center',gap:9}}
                  onMouseEnter={e=>{if(!locked)e.currentTarget.style.borderColor='#4488ff';}}
                  onMouseLeave={e=>{if(!locked)e.currentTarget.style.borderColor=br;}}>
                  <span style={{minWidth:22,height:22,background:'rgba(68,136,255,0.18)',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#4488ff',flexShrink:0}}>{labels[i]}</span>
                  {opt}
                </button>
              );
            })}
          </div>
      }
    </div>
  );
}

  const luckyLog    = hasLog ? s.play_log.filter(e => e.qId === 'lucky')  : [];
  const totalNormal = hasLog ? normalLog.length : (s.total > 0 ? s.total - 1 : 0);
  const correctN    = hasLog ? normalLog.filter(e => e.correct).length : s.correct;
  const pct         = totalNormal > 0 ? Math.round((correctN / totalNormal) * 100) : 0;
  const col         = pct >= 80 ? '#44ffaa' : pct >= 60 ? '#ffd700' : '#ff8844';

  return (

          {isPerfect && <span style={{fontSize:9,color:'#ffd700',background:'rgba(255,215,0,0.1)',border:'1px solid #ffd70044',borderRadius:10,padding:'1px 7px'}}>💎 PERFECT</span>}
          {luckyPts !== null && <span style={{fontSize:9,color: luckyPts>0?'#ffd700':luckyPts<0?'#ff4444':'#8899bb',background:'rgba(100,50,200,0.1)',border:'1px solid #bb44ff44',borderRadius:10,padding:'1px 7px'}}>🎲 {luckyPts>0?'+':''}{luckyPts}</span>}
          {s.time_saved>0 && <span style={{fontSize:9,color:'#44ffaa',background:'rgba(0,80,50,0.2)',border:'1px solid #44ffaa33',borderRadius:10,padding:'1px 7px'}}>⏰ +{s.time_saved}s</span>}
        </div>

      </div>

      {/* Detail */}
      {open && (
        <div style={{background:'rgba(8,12,35,0.95)',border:'1px solid #4488ff',borderTop:'none',borderRadius:'0 0 8px 8px',padding:'10px 14px'}}>
          {hasLog ? (
            <div>
              {/* Normální otázky */}
              {normalLog.map((entry, idx) => {
                const q = ALL_QUESTIONS.find(q=>String(q.id)===String(entry.qId));
                const chosenOpt = q && entry.chosen !== undefined ? q.opts[entry.chosen] : null;
                const correctOpt = q ? q.opts[q.a] : null;
                return (
                  <div key={idx} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 0',borderBottom:'1px solid #121830',fontSize:11}}>
                    <span style={{flexShrink:0,fontSize:13}}>{entry.correct?'✅':'❌'}</span>
                    <div style={{flex:1,minWidth:0}}>
                      {q ? (
                        <>
                          <div style={{color:'#aabbcc',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:2}}>{q.q}</div>
                          <div style={{fontSize:9,color:'#334466'}}>
                            <span style={{color:'#556688'}}>{q.cat}</span>
                            {entry.correct ? (
                              <span style={{color:'#44aa44'}}> · ✓ {correctOpt}</span>
                            ) : (
                              <>
                                <span style={{color:'#aa3333'}}> · ✗ zvoleno: {chosenOpt || '?'}</span>
                                <span style={{color:'#44aa44'}}> · ✓ správně: {correctOpt}</span>
                              </>
                            )}
                          </div>
                        </>
                      ) : (
                        <span style={{color:'#445566'}}>Otázka #{entry.qId}</span>
                      )}
                    </div>
                    <div style={{textAlign:'right',flexShrink:0,minWidth:40}}>
                      <div style={{fontSize:9,color:'#334466'}}>{entry.time_spent||0}s</div>
                      <div style={{fontWeight:700,color:entry.correct?'#44ff44':'#ff4444',fontSize:11}}>

                  </div>

              })}

              {/* Lucky Box sekce */}
              {luckyLog.length > 0 && (
                <div style={{marginTop:8,padding:'8px 10px',background:'rgba(100,50,200,0.08)',border:'1px solid #bb44ff33',borderRadius:6}}>
                  {luckyLog.map((entry, idx) => {
                    const v = entry.chosen || 0;
                    const lcol = v >= 500 ? '#ffd700' : v > 0 ? '#44ffaa' : v === 0 ? '#8899bb' : '#ff4444';
                    const emoji = v === 1000 ? '🏆' : v === -500 ? '💣' : v > 0 ? '💰' : v === 0 ? '📦' : '🪦';
                    return (
                      <div key={idx} style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
                        <span style={{fontSize:16}}>{emoji}</span>
                        <span style={{color:'#8866aa',flex:1}}>Lucky Box</span>
                        <span style={{color:lcol,fontWeight:700,fontFamily:"'Orbitron',sans-serif",fontSize:12}}>
                          {v > 0 ? `+${v}` : String(v)}
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          ) : (
            <span style={{color:'#445566',fontSize:11}}>
              Kvíz odehrán před zavedením detailního záznamu.
              Výsledek: {correctN}/{totalNormal} správně, {s.score.toLocaleString()} bodů.
            </span>
          )}
        </div>
      )}
    </div>
  );
}

  // Celkové skóre (all-time)
  const allMap = {};
  modeScores.forEach(s=>{
    if(!allMap[s.user_id]) allMap[s.user_id]={id:s.user_id,user_id:s.user_id,name:s.user_name,total:0,played:0,best:0,perfects:0};
    allMap[s.user_id].total+=s.score; allMap[s.user_id].played+=1;
    allMap[s.user_id].best=Math.max(allMap[s.user_id].best,s.score);
    if(s.perfect) allMap[s.user_id].perfects+=1;
  });
  const allList = Object.values(allMap).sort((a,b)=>b.total-a.total);

  // Měsíční skóre (aktuální měsíc)
  const monthMap = {};
  modeScores.filter(s=>s.date.startsWith(currentMonth)).forEach(s=>{
    if(!monthMap[s.user_id]) monthMap[s.user_id]={id:s.user_id,user_id:s.user_id,name:s.user_name,total:0,played:0,best:0,perfects:0};
    monthMap[s.user_id].total+=s.score; monthMap[s.user_id].played+=1;
    monthMap[s.user_id].best=Math.max(monthMap[s.user_id].best,s.score);
    if(s.perfect) monthMap[s.user_id].perfects+=1;
  });
  const monthList = Object.values(monthMap).sort((a,b)=>b.total-a.total);

  const list = tab==='today' ? todayList : tab==='month' ? monthList : tab==='all' ? allList : [];
  const rc = ['#ffdd00','#cccccc','#cd7f32'];

  // Prefetch avatarů pro viditelné hráče (dávkově)
  useEffect(() => {
    const visible = (tab==='today' ? todayList : tab==='month' ? monthList : allList);
    const missing = visible.map(e=>e.user_id||e.id).filter(id => id && !(id in avatarCache));
    if (missing.length === 0) return;
    // Označ jako "načítá se" aby se netriggeroval znovu
    setAvatarCache(prev => {
      const next = {...prev};
      missing.forEach(id => { next[id] = null; }); // null = načítá se / nenalezeno
      return next;
    });
    // Batch fetch — načte avatar i cheater flag
    db.from('users').select('id,avatar_url,cheater').in('id', missing)
      .then(({data}) => {
        if (!data) return;
        setAvatarCache(prev => {
          const next = {...prev};
          data.forEach(u => { next[u.id] = u.avatar_url||null; });
          return next;
        });
        setCheaterCache(prev => {
          const next = {...prev};
          data.forEach(u => { next[u.id] = !!u.cheater; });
          return next;
        });
      }).catch(()=>{});
  }, [tab, scores]);

  async function openProfile(userId) {
    setProfileLoading(true);
    setProfileScores([]);
    setProfileTab('stats');
    try {
      const [{ data: userData }, { data: scoresData }] = await Promise.all([
        db.from('users').select('*').eq('id', userId).single(),
        db.from('scores').select('*').eq('user_id', userId).order('date', { ascending: true }),
      ]);
      if (userData) {
        setAvatarCache(prev => ({...prev, [userId]: userData.avatar_url||null}));
        setProfileView(userData);
      } else { setProfileView({name:'?', id: userId}); }
      setProfileScores(scoresData || []);
    } catch(e) { setProfileView({name:'?', id: userId}); }
    setProfileLoading(false);
  }

  const OS_LABELS = {linux:'🐧 Linux', windows:'🪟 Windows', macos:' macOS', bsd:'👹 BSD', arch:'💀 Arch (btw)'};
  const DEBUG_LABELS = {printstatements:'Print statements',debugger:'Debugger – profesionál',stackoverflow:'Stack Overflow + modlitba',rubber:'Gumová kachnička',restart:'Restart a doufám',ai:'Ptám se AI a nedůvěřuji',blame:'Blame git'};
  const COFFEE_LABELS = {'0':'0 – robot','1':'1☕','2':'2☕','3':'3☕','5':'5+☕ závislák',iv:'IV infuze rovnou do žíly'};

  return (
    <div style={{minHeight:'100vh',padding:20,maxWidth:660,margin:'0 auto'}}>

      {profileView && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'#0a0a0f',zIndex:200,overflowY:'auto'}}>

                ← ZPĚT DO ŽEBŘÍČKU
              </button>
            </div>

            {/* Hlavička hráče */}
            <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20,padding:'16px 20px',background:'rgba(15,25,60,0.8)',border:'1px solid #2a3a6a',borderRadius:14}}>
              <div style={{width:72,height:72,borderRadius:'50%',border:'2px solid #2a3a6a',overflow:'hidden',background:'#0a0a1f',flexShrink:0}}>
                {profileView.avatar_url

                    {profileView.coffee_cups && <span>☕ {COFFEE_LABELS[profileView.coffee_cups]||profileView.coffee_cups}</span>}
                    {profileView.debug_style && <span>🐛 {DEBUG_LABELS[profileView.debug_style]||profileView.debug_style}</span>}

            {profileTab==='stats' && !profileLoading && profileScores.length>0 && (()=>{
              const ps = profileScores;
              const totalPlayed = ps.length;
              const totalScore2 = ps.reduce((s,r)=>s+r.score,0);
              const avgSc = Math.round(totalScore2/totalPlayed);
              const bestSc = Math.max(...ps.map(r=>r.score));
              const perfects = ps.filter(r=>r.perfect).length;
              const totCorr = ps.reduce((s,r)=>s+(r.correct||0),0);
              const totQs = ps.reduce((s,r)=>s+(r.total||0),0);
              const accPct = totQs ? Math.round((totCorr/totQs)*100) : 0;

              // Streak
              let maxStreak2=0,tempS2=0,curStreak2=0;
              const days2=[...new Set(ps.map(r=>r.date))].sort();
              for(let i=0;i<days2.length;i++){
                if(i===0){tempS2=1;}
                else{const p=new Date(days2[i-1]);p.setDate(p.getDate()+1);tempS2=p.toISOString().slice(0,10)===days2[i]?tempS2+1:1;}
                maxStreak2=Math.max(maxStreak2,tempS2);
              }
              const tod2=getTodayKey();
              for(let i=days2.length-1;i>=0;i--){
                const ex=new Date(tod2);ex.setDate(ex.getDate()-(days2.length-1-i));
                if(days2[i]===ex.toISOString().slice(0,10)) curStreak2++;
                else break;
              }

              // Globální průměr a rank
              const globalAvg = scores.length ? Math.round(scores.reduce((s,r)=>s+r.score,0)/scores.length) : 0;
              const allPlayers = new Set(scores.map(s=>s.user_id)).size;
              const ranked = [...new Set(scores.map(s=>s.user_id))]
                .map(id=>({id,t:scores.filter(s=>s.user_id===id).reduce((a,r)=>a+r.score,0)}))
                .sort((a,b)=>b.t-a.t);
              const rank = ranked.findIndex(r=>r.id===profileView.id)+1;

              // Play log analýza
              const catData={};
              let totAnswers=0,totAnswerTime=0,fastAns=0,slowAns=0,maxSerie=0,curSerie=0;
              ps.forEach(s=>{
                if(!s.play_log) return;
                s.play_log.forEach(e=>{
                  if(e.qId==='lucky') return;
                  const q=ALL_QUESTIONS.find(q=>String(q.id)===String(e.qId));
                  const cat=q?q.cat:'Ostatní';
                  if(!catData[cat]) catData[cat]={correct:0,total:0,totalTime:0};
                  catData[cat].total++;
                  if(e.correct){catData[cat].correct++;curSerie++;}
                  else{maxSerie=Math.max(maxSerie,curSerie);curSerie=0;}
                  const t=e.time_spent||0;
                  catData[cat].totalTime+=t;
                  totAnswers++;totAnswerTime+=t;
                  if(t<=3)fastAns++;
                  if(t>=15)slowAns++;
                });
              });
              maxSerie=Math.max(maxSerie,curSerie);
              const avgT=(totAnswers?(totAnswerTime/totAnswers).toFixed(1):0);
              const fastPct=totAnswers?Math.round((fastAns/totAnswers)*100):0;
              const slowPct=totAnswers?Math.round((slowAns/totAnswers)*100):0;

              // Kategorie — správná logika bez překryvů
              const catList=Object.entries(catData)
                .filter(([,d])=>d.total>=2)
                .map(([cat,d])=>({
                  cat,
                  acc:Math.round((d.correct/d.total)*100),
                  total:d.total,
                  avgTime:d.total?(d.totalTime/d.total).toFixed(1):0,
                }))
                .sort((a,b)=>b.acc-a.acc);
              const avgCatAcc=catList.length?Math.round(catList.reduce((s,c)=>s+c.acc,0)/catList.length):50;
              const strongCats=catList.filter(c=>c.acc>avgCatAcc).slice(0,4);
              const weakCats=catList.filter(c=>c.acc<=avgCatAcc).sort((a,b)=>a.acc-b.acc).slice(0,4);

              // Odvětvová analýza
              const SECTORS={'Sítě & Infrastruktura':['Sítě','WiFi','Konektory','Telco','DC'],'Bezpečnost':['Bezpečnost','Šifrování'],'Cloud & DevOps':['Cloud','Virtualizace','Správa'],'Systémy & OS':['OS','Linux','Windows'],'Data & Protokoly':['Databáze','Protokoly','Email'],'Hardware':['Hardware','Periferie','Úložiště','Zálohy'],'AI & Moderní tech':['AI/ML','IoT','Telco']};
              const sectorData=Object.entries(SECTORS).map(([sector,cats])=>{
                let cor=0,tot=0;
                cats.forEach(c=>{if(catData[c]){cor+=catData[c].correct;tot+=catData[c].total;}});
                return{sector,acc:tot?Math.round((cor/tot)*100):null,total:tot};
              }).filter(s=>s.total>=2).sort((a,b)=>b.acc-a.acc);

              // Lucky box
              let lJack=0,lBomb=0,lTot=0,lPts=0,lWins=0,lZeros=0;
              ps.forEach(s=>{
                if(!s.play_log) return;
                s.play_log.filter(e=>e.qId==='lucky').forEach(e=>{
                  lTot++;const v=e.chosen||0;lPts+=v;
                  if(v===1000)lJack++;
                  else if(v===-500)lBomb++;
                  else if(v===0)lZeros++;
                  else if(v>0)lWins++;
                });
              });

              // Časové statistiky
              const timeScores=ps.filter(s=>s.time_saved!=null);
              const avgTimeSaved=timeScores.length?Math.round(timeScores.reduce((a,s)=>a+(s.time_saved||0),0)/timeScores.length):0;

              // Verdikt a persóna
              function speedRoast(avg){
                const a=parseFloat(avg);
                if(a<=2)return{e:'⚡',t:'Kvantový procesor',d:'Odpovídá rychleji než si stihne přečíst otázku.'};
                if(a<=4)return{e:'🚀',t:'Rychlý jako NVMe',d:'Průměr pod 4s. Připraven nebo odhaduje naslepo.'};
                if(a<=7)return{e:'🎯',t:'Rozvážný expert',d:'Přemýšlí před kliknutím. Zvyk správného admina.'};
                if(a<=12)return{e:'🐢',t:'Důkladný čtenář',d:'Čte otázku třikrát. Jednou by stačilo.'};
                return{e:'🦥',t:'Filosof v IT',d:'Každá odpověď je existenciální rozhodnutí.'};
              }
              function accuracyRoast(acc){
                if(acc>=95)return{e:'🧠',t:'Kyborg v lidském těle',d:'Podezřele správně. IT oddělení ho sleduje.'};
                if(acc>=85)return{e:'🎯',t:'Ostrý jako nový SSD',d:'Nemá odpovědi, on je odpověď.'};
                if(acc>=70)return{e:'💪',t:'Nadprůměrný člověk',d:'Ve firmě by byl ten co opravuje ostatní.'};
                if(acc>=55)return{e:'🤔',t:'Slušný pokus',d:'Senior developer styl — polovina správně, polovina kreativně.'};
                if(acc>=40)return{e:'😅',t:'Optimistický začátečník',d:'Aspoň heslo na WiFi ví. Doufáme.'};
                return{e:'💀',t:'Živoucí důkaz chaosu',d:'Tiskárna by ho přechytračila.'};
              }
              function streakRoast(s){
                if(s>=30)return{e:'🔥',t:'Na dovolené s laptopem',d:'Normální lidé odpočívají. Tento kvízuje.'};
                if(s>=14)return{e:'⚡',t:'Pravidelný jako cron job',d:`${s} dní v kuse. Terapeut o tom neví.`};
                if(s>=7)return{e:'📅',t:'Solidní návyk',d:'Týden v kuse. Víc než většina projektů.'};
                if(s>=3)return{e:'🌱',t:'Roste to',d:'Nezruší to zítra jako gym membership.'};
                if(s>=1)return{e:'🐢',t:'Začátek je těžký',d:'Aspoň tu je. Na rozdíl od dokumentace.'};
                return{e:'👻',t:'Přízrak čtenář',d:'Streak = 0. Ani cron by ho nenaplánoval.'};
              }
              const accR=accuracyRoast(accPct);
              const spdR=speedRoast(avgT);
              const strR=streakRoast(curStreak2);
              const C={gold:'#ffd700',blue:'#4488ff',green:'#44ffaa',red:'#ff4444',gray:'#556688',purple:'#bb44ff',orange:'#ff9900'};

              const trainingTips=[];
              if(accPct<60) trainingTips.push({e:'🎓',t:'IT základy',d:'Kurz "Proč je kabel důležitý a jiné záhady"'});
              if(parseFloat(avgT)>12) trainingTips.push({e:'⚡',t:'Rychlost rozhodování',d:'Trénink rychlého rozhodování — ideálně bez Google'});
              if(perfects===0&&totalPlayed>=5) trainingTips.push({e:'💎',t:'Konzistence',d:'Na perfect run potřebuje znalosti, ne štěstí'});
              if(weakCats.length&&weakCats[0].acc<50) trainingTips.push({e:'📚',t:weakCats[0].cat,d:`Přesnost ${weakCats[0].acc}% — tady by pomohlo školení`});
              if(lBomb>lJack&&lTot>=3) trainingTips.push({e:'🎲',t:'Risk management',d:'Instinkt na Lucky Box je statisticky tragický'});

              return (
                <div>
                  {/* Persóna */}
                  <div style={{background:'linear-gradient(135deg,rgba(68,136,255,0.12),rgba(34,85,200,0.06))',border:'1px solid #2a3a6a',borderRadius:14,padding:'14px 18px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
                    <span style={{fontSize:38,flexShrink:0}}>{accR.e}</span>
                    <div>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:'#88aaff',letterSpacing:2,marginBottom:3}}>{accR.t}</div>

                      {e:'🔥',l:'Streak',v:`${curStreak2}d`,c:curStreak2>=7?C.purple:curStreak2>=3?C.gold:C.gray},

                      {e:'🚀',l:'Rychlé ans.',v:`${fastPct}%`,c:C.blue,sub:'do 3s'},

                      {e:'⏱️',l:'Ušetřený čas',v:`${avgTimeSaved}s`,c:avgTimeSaved>=20?C.green:avgTimeSaved>=10?C.gold:C.gray,sub:'průměr/kvíz'},
                      {e:'🎯',l:'Nejdelší série',v:`${maxSerie}×`,c:maxSerie>=10?C.gold:maxSerie>=5?C.blue:C.gray,sub:'správných za sebou'},
                    ].map(s=>(
                      <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 6px',textAlign:'center'}}>
                        <div style={{fontSize:14,marginBottom:3}}>{s.e}</div>
                        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,fontWeight:900,color:s.c}}>{s.v}</div>
                        <div style={{fontSize:9,color:'#445566',marginTop:1}}>{s.l}</div>
                        {s.sub&&<div style={{fontSize:8,color:'#334455',marginTop:1}}>{s.sub}</div>}
                      </div>
                    ))}

                          )}
                          {!isCheater && isSuspect && (
                            <span title="Výsledek tohoto hráče je označen jako podezřelý" style={{fontSize:10,background:'rgba(255,150,0,0.12)',color:'#ff9900',border:'1px solid #ff990044',borderRadius:20,padding:'1px 8px',letterSpacing:0.5,flexShrink:0,cursor:'default'}}>
                              ⚠️ PODEZŘELÝ
                            </span>
                          )}
                        </div>
                        {tab==='all' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.played} {e.played===1?'kvíz':'kvízy'} • nejlepší: {e.best.toLocaleString()} b</div>}
                        {tab==='month' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.played} {e.played===1?'den':'dní'} • nejlepší: {e.best.toLocaleString()} b</div>}
                        {tab==='today' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.correct}/{e.total} správně</div>}
                      </div>

                      {/* Score */}
                      <div style={{textAlign:'right',flexShrink:0}}>
                        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:19,fontWeight:900,color:isPerfectToday?'#ffd700':i===0?'#ffdd00':'#4488ff'}}>{sc.toLocaleString()}</div>
                        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,color:'#334466',letterSpacing:1}}>BODŮ</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </>
        )}

        <div style={{textAlign:'center',marginTop:28}}>
          <button className="btn" onClick={onBack} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 30px',borderRadius:8,fontSize:12,color:'#88aaff',letterSpacing:2}}>← ZPĚT</button>
        </div>
      </div>
    </div>
  );
}

// ─── STATS SCREEN ─────────────────────────────────────
function StatsScreen({ user, scores, onBack }) {
  const myScores = scores.filter(s => s.user_id === user.id)
    .sort((a,b) => a.date.localeCompare(b.date));

  const totalPlayed  = myScores.length;
  const totalScore   = myScores.reduce((s,r) => s+r.score, 0);
  const avgScore     = totalPlayed ? Math.round(totalScore/totalPlayed) : 0;
  const bestScore    = totalPlayed ? Math.max(...myScores.map(r=>r.score)) : 0;
  const worstScore   = totalPlayed ? Math.min(...myScores.map(r=>r.score)) : 0;
  const perfectCount = myScores.filter(r=>r.perfect).length;
  const totalCorrect = myScores.reduce((s,r) => s+(r.correct||0), 0);
  const totalQs      = myScores.reduce((s,r) => s+(r.total||0), 0);
  const accuracy     = totalQs ? Math.round((totalCorrect/totalQs)*100) : 0;

  // Streak
  let maxStreak=0, tempStreak=0, currentStreak=0;
  const sortedDays = [...new Set(myScores.map(r=>r.date))].sort();
  for (let i=0; i<sortedDays.length; i++) {
    if (i===0){tempStreak=1;}
    else {
      const prev=new Date(sortedDays[i-1]); prev.setDate(prev.getDate()+1);
      tempStreak = prev.toISOString().slice(0,10)===sortedDays[i] ? tempStreak+1 : 1;
    }
    maxStreak=Math.max(maxStreak,tempStreak);
  }
  const today=getTodayKey();
  for (let i=sortedDays.length-1; i>=0; i--) {
    const exp=new Date(today); exp.setDate(exp.getDate()-(sortedDays.length-1-i));
    if (sortedDays[i]===exp.toISOString().slice(0,10)) currentStreak++;
    else break;
  }

  // ── Analýza play_log ──────────────────────────────────
  const catData = {}; // cat → {correct, total, totalTime, times[]}
  let totalAnswers=0, totalAnswerTime=0, fastAnswers=0, slowAnswers=0;
  let comboCount3=0, comboCount4=0, comboCount5=0;
  let wrongAfterRight=0, streakTracker=0, maxAnswerStreak=0, curAnswerStreak=0;

  myScores.forEach(s => {
    if (!s.play_log || !s.play_log.length) return;
    let localStreak=0;
    s.play_log.forEach(e => {
      if (e.qId==='lucky') return;
      const q = ALL_QUESTIONS.find(q=>String(q.id)===String(e.qId));
      const cat = q ? q.cat : 'Ostatní';
      if (!catData[cat]) catData[cat]={correct:0,total:0,totalTime:0,times:[]};
      catData[cat].total++;
      if (e.correct) catData[cat].correct++;

      const t = e.time_spent || 0;
      catData[cat].totalTime += t;
      catData[cat].times.push(t);
      totalAnswers++;
      totalAnswerTime += t;
      if (t <= 3) fastAnswers++;
      if (t >= 15) slowAnswers++;

      if (e.correct) { localStreak++; curAnswerStreak++; }
      else { maxAnswerStreak=Math.max(maxAnswerStreak,curAnswerStreak); curAnswerStreak=0; localStreak=0; }
    });
    maxAnswerStreak=Math.max(maxAnswerStreak,curAnswerStreak);
  });

  const avgAnswerTime = totalAnswers ? (totalAnswerTime/totalAnswers).toFixed(1) : 0;
  const fastPct = totalAnswers ? Math.round((fastAnswers/totalAnswers)*100) : 0;
  const slowPct = totalAnswers ? Math.round((slowAnswers/totalAnswers)*100) : 0;

  const catList = Object.entries(catData)
    .filter(([,d])=>d.total>=2)
    .map(([cat,d])=>({
      cat,
      acc: Math.round((d.correct/d.total)*100),
      total: d.total,
      avgTime: d.total ? (d.totalTime/d.total).toFixed(1) : 0,
    }))
    .sort((a,b)=>b.acc-a.acc);

  const topCats  = catList.slice(0,4);
  const weakCats = [...catList].sort((a,b)=>a.acc-b.acc).slice(0,4);

  // Odvětvové kategorie (skupiny)
  const SECTORS = {
    'Sítě & Infrastruktura': ['Sítě','WiFi','Konektory','Telco','DC'],
    'Bezpečnost': ['Bezpečnost','Šifrování'],
    'Cloud & DevOps': ['Cloud','Virtualizace','Správa'],
    'Systémy & OS': ['OS','Linux','Windows'],
    'Data & Protokoly': ['Databáze','Protokoly','Email'],
    'Hardware': ['Hardware','Periferie','Úložiště','Zálohy','Konektory'],
    'AI & Moderní tech': ['AI/ML','IoT','Telco'],
  };
  const sectorData = Object.entries(SECTORS).map(([sector, cats]) => {
    let correct=0, total=0;
    cats.forEach(c => {
      if (catData[c]) { correct+=catData[c].correct; total+=catData[c].total; }
    });
    return { sector, acc: total ? Math.round((correct/total)*100) : null, total };
  }).filter(s=>s.total>=2).sort((a,b)=>b.acc-a.acc);

  // Lucky Box
  const lucky={total:0,wins:0,losses:0,jackpots:0,bombs:0,zeros:0,totalPts:0};
  myScores.forEach(s=>{
    if(!s.play_log) return;
    s.play_log.filter(e=>e.qId==='lucky').forEach(e=>{
      lucky.total++;
      const v=e.chosen||0;
      lucky.totalPts+=v;
      if(v===1000) lucky.jackpots++;
      else if(v===-500) lucky.bombs++;
      else if(v===0) lucky.zeros++;
      else if(v>0) lucky.wins++;
      else lucky.losses++;
    });
  });

  // Časové statistiky per den
  const timeScores = myScores.filter(s=>s.time_saved!=null);
  const avgTimeSaved = timeScores.length ? Math.round(timeScores.reduce((a,s)=>a+(s.time_saved||0),0)/timeScores.length) : 0;

  // Globální
  const allAvg = scores.length ? Math.round(scores.reduce((s,r)=>s+r.score,0)/scores.length) : 0;
  const allPlayers = new Set(scores.map(s=>s.user_id)).size;
  const myRank = [...new Set(scores.map(s=>s.user_id))]
    .map(uid=>({uid,t:scores.filter(s=>s.user_id===uid).reduce((a,r)=>a+r.score,0)}))
    .sort((a,b)=>b.t-a.t).findIndex(r=>r.uid===user.id)+1;

  // ── Vtipné hodnocení ──────────────────────────────────
  function speedRoast(avg) {
    const a=parseFloat(avg);
    if(a<=2) return {e:'⚡',t:'Kvantový procesor',d:'Odpovídáš rychleji než si stihneš přečíst otázku. Hazard nebo génius?'};
    if(a<=4) return {e:'🚀',t:'Rychlý jako NVMe',d:'Průměr pod 4s. Jsi připravený. Nebo odhazuješ naslepo.'};
    if(a<=7) return {e:'🎯',t:'Rozvážný expert',d:'Přemýšlíš před kliknutím. Starý zvyk správného admina.'};
    if(a<=12) return {e:'🐢',t:'Důkladný čtenář',d:'Čteš otázku třikrát. Jednou by stačilo, ale respektujeme pečlivost.'};
    return {e:'🦥',t:'Filosof v IT',d:'Každá odpověď je existenciální rozhodnutí. Nebo jsi šel uvařit kávu.'};
  }
  function accuracyRoast(acc) {
    if(acc>=95) return {e:'🧠',t:'Kyborg v lidském těle',d:'Podezřele správně. IT oddělení tě sleduje.'};
    if(acc>=85) return {e:'🎯',t:'Ostrý jako nový SSD',d:'Nemáš odpovědi, ty jsi odpověď.'};
    if(acc>=70) return {e:'💪',t:'Nadprůměrný člověk',d:'Ve firmě bys byl ten co opravuje ostatní.'};
    if(acc>=55) return {e:'🤔',t:'Slušný pokus',d:'Senior developer styl — polovina správně, polovina kreativně.'};
    if(acc>=40) return {e:'😅',t:'Optimistický začátečník',d:'Aspoň heslo na WiFi víš. Doufáme.'};
    return {e:'💀',t:'Živoucí důkaz chaosu',d:'Tiskárna by tě přechytračila.'};
  }
  function streakRoast(s) {
    if(s>=30) return {e:'🔥',t:'Na dovolené s laptopem',d:'Normální lidé odpočívají. Ty kvízuješ.'};
    if(s>=14) return {e:'⚡',t:'Pravidelný jako cron job',d:`${s} dní v kuse. Tvůj terapeut o tom neví.`};
    if(s>=7)  return {e:'📅',t:'Solidní návyk',d:'Týden v kuse. Víc než většina projektů.'};
    if(s>=3)  return {e:'🌱',t:'Roste to',d:'Nezruš to zítra jako gym membership.'};
    if(s>=1)  return {e:'🐢',t:'Začátek je těžký',d:'Aspoň jsi tady. Na rozdíl od dokumentace.'};
    return {e:'👻',t:'Přízrak čtenář',d:'Streak = 0. Ani cron by tě nenaplánoval.'};
  }

  const accR  = accuracyRoast(accuracy);
  const spdR  = speedRoast(avgAnswerTime);
  const strR  = streakRoast(currentStreak);
  const C={gold:'#ffd700',blue:'#4488ff',green:'#44ffaa',red:'#ff4444',gray:'#556688',purple:'#bb44ff',orange:'#ff9900'};

  const trainingTips = [];
  if (accuracy<60)  trainingTips.push({e:'🎓',t:'IT základy',d:'Kurz "Proč je kabel důležitý a jiné záhady"'});
  if (parseFloat(avgAnswerTime)>12) trainingTips.push({e:'⚡',t:'Rychlost rozhodování',d:'Trénink rychlého rozhodování — ideálně bez Google a kávy'});
  if (perfectCount===0 && totalPlayed>=5) trainingTips.push({e:'💎',t:'Konzistence',d:'Na perfect run potřebuješ znalosti, ne štěstí'});
  if (weakCats.length && weakCats[0].acc<50) trainingTips.push({e:'📚',t:weakCats[0].cat,d:`Přesnost ${weakCats[0].acc}% — tady by pomohlo pořádné školení`});
  if (lucky.bombs>lucky.jackpots && lucky.total>=3) trainingTips.push({e:'🎲',t:'Risk management',d:'Tvůj instinkt na Lucky Box je statisticky tragický'});
  if (currentStreak===0 && totalPlayed>=3) trainingTips.push({e:'📅',t:'Pravidelnost',d:'Nepravidelné hraní = nepravidelné znalosti'});

  return (
    <div style={{minHeight:'100vh',padding:'20px',maxWidth:700,margin:'0 auto'}}>
      <div className="slide-in">
        <div style={{textAlign:'center',paddingTop:24,marginBottom:24}}>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,letterSpacing:4,color:'#4488ff',marginBottom:6}}>ANALÝZA HRÁČE</div>
          <h2 className="glow" style={{fontFamily:"'Orbitron',sans-serif",fontSize:28,fontWeight:900,color:'#fff',marginBottom:4}}>MÉ STATISTIKY</h2>
          <div style={{fontSize:12,color:'#445566'}}>{user.name} · {totalPlayed} {totalPlayed===1?'kvíz':'kvízů'}</div>
        </div>

        {totalPlayed===0 ? (
          <div style={{textAlign:'center',padding:'60px 0'}}>
            <div style={{fontSize:48,marginBottom:16}}>🥚</div>
            <div style={{color:'#445566',fontSize:14}}>Zatím žádná data.</div>
            <div style={{color:'#334455',fontSize:12,marginTop:6}}>Zahraj první kvíz a uvidíš co z tebe vyleze.</div>
          </div>
        ) : (<>

          {/* ── PERSÓNA ── */}
          <div style={{background:'linear-gradient(135deg,rgba(68,136,255,0.12),rgba(34,85,200,0.06))',border:'1px solid #2a3a6a',borderRadius:14,padding:'16px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
            <span style={{fontSize:42,flexShrink:0}}>{accR.e}</span>
            <div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,fontWeight:900,color:'#88aaff',letterSpacing:2,marginBottom:4}}>{accR.t}</div>
              <div style={{fontSize:12,color:'#556688',lineHeight:1.5}}>{accR.d}</div>
            </div>
          </div>

          {/* ── HLAVNÍ ČÍSLA (2×3 grid) ── */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:8}}>
            {[
              {e:'🎯',l:'Přesnost',v:`${accuracy}%`,c:accuracy>=70?C.green:accuracy>=50?C.gold:C.red},
              {e:'⚡',l:'Průměrný čas',v:`${avgAnswerTime}s`,c:parseFloat(avgAnswerTime)<=5?C.green:parseFloat(avgAnswerTime)<=10?C.gold:C.red},
              {e:'📊',l:'Průměr/kvíz',v:avgScore.toLocaleString(),c:avgScore>=allAvg?C.green:C.blue},
              {e:'🏆',l:'Nejlepší kvíz',v:bestScore.toLocaleString(),c:C.gold},
              {e:'💎',l:'Perfect runs',v:perfectCount,c:perfectCount>0?C.gold:C.gray},
              {e:'🔥',l:'Streak',v:`${currentStreak}d`,c:currentStreak>=7?C.purple:currentStreak>=3?C.gold:C.gray},
            ].map(s=>(
              <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'12px 6px',textAlign:'center'}}>
                <div style={{fontSize:18,marginBottom:4}}>{s.e}</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:9,color:'#445566',marginTop:3}}>{s.l}</div>
              </div>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
            {[
              {e:'🚀',l:'Rychlé odpovědi',v:`${fastPct}%`,c:C.blue, sub:'do 3s'},
              {e:'🐢',l:'Pomalé odpovědi',v:`${slowPct}%`,c:slowPct>40?C.red:C.gray, sub:'nad 15s'},
              {e:'🏅',l:'Rank',v:myRank?`#${myRank}`:'—',c:myRank<=3?C.gold:myRank<=10?C.blue:C.gray, sub:`z ${allPlayers} hráčů`},
              {e:'📈',l:'vs průměr',v:`${avgScore>=allAvg?'+':''}${avgScore-allAvg}`,c:avgScore>=allAvg?C.green:C.red, sub:`avg ${allAvg.toLocaleString()} b`},
              {e:'⏱️',l:'Ušetřený čas',v:`${avgTimeSaved}s`,c:avgTimeSaved>=20?C.green:avgTimeSaved>=10?C.gold:C.gray, sub:'průměr/kvíz'},
              {e:'🎯',l:'Nejdelší série',v:`${maxAnswerStreak}×`,c:maxAnswerStreak>=10?C.gold:maxAnswerStreak>=5?C.blue:C.gray, sub:'správných za sebou'},
            ].map(s=>(
              <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 6px',textAlign:'center'}}>
                <div style={{fontSize:16,marginBottom:3}}>{s.e}</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:9,color:'#445566',marginTop:1}}>{s.l}</div>
                {s.sub&&<div style={{fontSize:8,color:'#334455',marginTop:1}}>{s.sub}</div>}
              </div>
            ))}
          </div>

          {/* ── RYCHLOST komentář ── */}
          <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:28,flexShrink:0}}>{spdR.e}</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'#88aaff',marginBottom:2}}>{spdR.t}</div>
              <div style={{fontSize:11,color:'#556688'}}>{spdR.d}</div>
            </div>
            <div style={{marginLeft:'auto',textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:9,color:'#334455',marginBottom:2}}>průměrný čas</div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:C.blue}}>{avgAnswerTime}s</div>
            </div>
          </div>

          {/* ── ODVĚTVOVÁ ANALÝZA ── */}
          {sectorData.length >= 2 && (
            <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:14}}>🏭 JAKÁ ODVĚTVÍ TI JDOU</div>
              {sectorData.map((s,i)=>{
                const col=s.acc>=80?C.green:s.acc>=60?C.gold:s.acc>=40?C.orange:C.red;
                const emoji=s.acc>=80?'✅':s.acc>=60?'🟡':s.acc>=40?'⚠️':'❌';
                const label=s.acc>=80?'Ovládáš':s.acc>=60?'Solidní':s.acc>=40?'Slabší':'Potřebuje práci';
                return (
                  <div key={s.sector} style={{display:'flex',alignItems:'center',gap:10,marginBottom:i<sectorData.length-1?10:0,padding:'6px 0',borderBottom:i<sectorData.length-1?'1px solid #1a2040':'none'}}>
                    <span style={{fontSize:14,flexShrink:0}}>{emoji}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                        <span style={{fontSize:12,color:'#aabbdd',fontWeight:600}}>{s.sector}</span>
                        <span style={{fontSize:11,color:col,fontWeight:700,flexShrink:0,marginLeft:8}}>{s.acc}% — {label}</span>
                      </div>
                      <div style={{background:'#1a2040',borderRadius:3,height:6,overflow:'hidden'}}>
                        <div style={{height:'100%',width:`${s.acc}%`,background:col,borderRadius:3,boxShadow:`0 0 4px ${col}44`}}/>
                      </div>
                    </div>
                  </div>
                );
              })}
              <div style={{marginTop:12,fontSize:11,color:'#445566',textAlign:'center'}}>
                {sectorData[0] && `💪 Nejsilnější: ${sectorData[0].sector} (${sectorData[0].acc}%)`}
                {sectorData.length>1 && ` · 📚 Zlepšit: ${sectorData[sectorData.length-1].sector} (${sectorData[sectorData.length-1].acc}%)`}
              </div>
            </div>
          )}

          {/* ── KATEGORIE DETAIL ── */}
          {catList.length >= 2 && (
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
              <div style={{background:'rgba(0,50,30,0.3)',border:'1px solid #226644',borderRadius:10,padding:'12px'}}>
                <div style={{fontSize:9,color:'#44ffaa',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>✅ SILNÉ STRÁNKY</div>
                {topCats.map(c=>(
                  <div key={c.cat} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0',borderBottom:'1px solid #1a3020',fontSize:11}}>
                    <div style={{flex:1,overflow:'hidden'}}>
                      <span style={{color:'#8899bb',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block'}}>{c.cat}</span>
                      <span style={{fontSize:9,color:'#334455'}}>⏱ {c.avgTime}s průměr</span>
                    </div>
                    <span style={{color:C.green,fontWeight:700,marginLeft:8,flexShrink:0}}>{c.acc}%</span>
                  </div>
                ))}
              </div>
              <div style={{background:'rgba(60,10,10,0.3)',border:'1px solid #662222',borderRadius:10,padding:'12px'}}>
                <div style={{fontSize:9,color:'#ff8888',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>⚠️ SLABINY</div>
                {weakCats.map(c=>(
                  <div key={c.cat} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 0',borderBottom:'1px solid #301a1a',fontSize:11}}>
                    <div style={{flex:1,overflow:'hidden'}}>
                      <span style={{color:'#8899bb',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'block'}}>{c.cat}</span>
                      <span style={{fontSize:9,color:'#334455'}}>⏱ {c.avgTime}s průměr</span>
                    </div>
                    <span style={{color:C.red,fontWeight:700,marginLeft:8,flexShrink:0}}>{c.acc}%</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ── GRAF KATEGORIÍ ── */}
          {catList.length >= 3 && (
            <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:12}}>📊 PŘESNOST + RYCHLOST PER KATEGORIE</div>
              {catList.slice(0,8).map(c=>{
                const col=c.acc>=80?C.green:c.acc>=60?C.gold:C.red;
                const speedCol=parseFloat(c.avgTime)<=4?C.green:parseFloat(c.avgTime)<=8?C.gold:C.red;
                return (
                  <div key={c.cat} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                    <div style={{fontSize:10,color:'#778899',width:76,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.cat}</div>
                    <div style={{flex:1,background:'#1a2040',borderRadius:3,height:7,overflow:'hidden'}}>
                      <div style={{height:'100%',width:`${c.acc}%`,background:col,borderRadius:3,boxShadow:`0 0 4px ${col}44`}}/>
                    </div>
                    <div style={{fontSize:10,color:col,fontWeight:700,minWidth:28,textAlign:'right'}}>{c.acc}%</div>
                    <div style={{fontSize:9,color:speedCol,minWidth:28,textAlign:'right',opacity:0.8}}>{c.avgTime}s</div>
                  </div>
                );
              })}
              <div style={{fontSize:9,color:'#334455',textAlign:'right',marginTop:4}}>% přesnost · čas/odpověď</div>
            </div>
          )}

          {/* ── GRAF 14 DNÍ ── */}
          {(() => {
            const last14=[];
            for(let i=13;i>=0;i--){
              const d=new Date();d.setDate(d.getDate()-i);
              const dk=d.toISOString().slice(0,10);
              const r=myScores.find(s=>s.date===dk);
              last14.push({date:dk,score:r?.score||0,played:!!r,perfect:r?.perfect||false});
            }
            const maxB=Math.max(...last14.map(d=>d.score),1);
            return (
              <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:14}}>📈 POSLEDNÍCH 14 DNÍ</div>
                <div style={{display:'flex',alignItems:'flex-end',gap:3,height:72}}>
                  {last14.map((d,i)=>{
                    const h=d.played?Math.max(Math.round((d.score/maxB)*68),4):0;
                    const col=d.perfect?C.gold:d.played?C.blue:'#1a2040';
                    return (
                      <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,height:'100%',justifyContent:'flex-end'}}>
                        <div title={d.played?`${d.date}: ${d.score.toLocaleString()} b`:'Nehrál'}
                          style={{width:'100%',height:h||2,background:col,borderRadius:'2px 2px 0 0',opacity:d.played?1:0.2,boxShadow:d.played?`0 0 4px ${col}66`:'none'}}/>
                        <div style={{fontSize:7,color:'#334455'}}>{new Date(d.date).getDate()}</div>
                      </div>
                    );
                  })}
                </div>
                <div style={{display:'flex',gap:12,marginTop:6,fontSize:10,color:'#445566',justifyContent:'center'}}>
                  <span><span style={{color:C.gold}}>■</span> Perfect</span>
                  <span><span style={{color:C.blue}}>■</span> Odehráno</span>
                </div>
              </div>
            );
          })()}

          {/* ── LUCKY BOX ── */}
          {lucky.total >= 1 && (
            <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:12}}>🎲 LUCKY BOX PROFIL</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:10}}>
                {[
                  {e:'🏆',l:'Jackpoty',v:lucky.jackpots,c:C.gold},
                  {e:'💣',l:'Bomby',v:lucky.bombs,c:C.red},
                  {e:'💰',l:'Výhry',v:lucky.wins,c:C.green},
                  {e:'📦',l:'Celkem',v:lucky.total,c:C.blue},
                ].map(s=>(
                  <div key={s.l} style={{padding:'8px 4px',background:'rgba(8,12,35,0.6)',borderRadius:8,textAlign:'center',border:'1px solid #1a2a4a'}}>
                    <div style={{fontSize:18,marginBottom:3}}>{s.e}</div>
                    <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:9,color:'#445566',marginTop:2}}>{s.l}</div>
                  </div>
                ))}
              </div>
              {/* Celkový zisk/ztráta — velké číslo */}
              <div style={{background:'rgba(8,12,35,0.6)',border:`1px solid ${lucky.totalPts>=0?'#44ffaa44':'#ff444444'}`,borderRadius:8,padding:'10px',textAlign:'center'}}>
                <div style={{fontSize:9,color:'#445566',letterSpacing:2,marginBottom:4}}>CELKOVÝ ZISK / ZTRÁTA Z LUCKY BOXU</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:24,fontWeight:900,color:lucky.totalPts>0?C.green:lucky.totalPts<0?C.red:C.gray}}>
                  {lucky.totalPts>0?'+':''}{lucky.totalPts.toLocaleString()} b
                </div>
                <div style={{fontSize:10,color:'#556688',marginTop:4}}>
                  {lucky.totalPts>0
                    ? `Lucky box ti přinesl ${lucky.totalPts} bodů navíc`
                    : lucky.totalPts<0
                    ? `Lucky box tě stál ${Math.abs(lucky.totalPts)} bodů`
                    : 'Lucky box — přesná nula. Karmatická rovnováha.'}
                  {lucky.jackpots>lucky.bombs && <span style={{color:C.gold}}> · šťastlivec 🍀</span>}
                  {lucky.bombs>lucky.jackpots && <span style={{color:C.red}}> · smolař 💣</span>}
                </div>
              </div>
            </div>
          )}

          {/* ── STREAK KOMENTÁŘ ── */}
          <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:26,flexShrink:0}}>{strR.e}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:'#88aaff',marginBottom:2}}>{strR.t}</div>
              <div style={{fontSize:11,color:'#556688'}}>{strR.d}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:9,color:'#334455'}}>max streak</div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:C.purple}}>{maxStreak}d</div>
            </div>
          </div>

          {/* ── DOPORUČENÍ ŠKOLENÍ ── */}
          {trainingTips.length>0 && (
            <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #2a3a6a',borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:12}}>🎓 CO BY TI POMOHLO (aka školení která nutně potřebuješ)</div>
              {trainingTips.map((t,i)=>(
                <div key={i} style={{display:'flex',gap:10,padding:'7px 0',borderBottom:i<trainingTips.length-1?'1px solid #1a2040':'none'}}>
                  <span style={{fontSize:18,flexShrink:0}}>{t.e}</span>
                  <div>
                    <div style={{fontSize:12,fontWeight:700,color:'#88aaff'}}>{t.t}</div>
                    <div style={{fontSize:11,color:'#556688',marginTop:2}}>{t.d}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── SILNÉ STRÁNKY ── */}
          {(()=>{
            const str=[];
            if(accuracy>=75) str.push({e:'🎯',t:'Přesnost nad průměrem',d:`${accuracy}% — Stříháš otázky jako patch cable.`});
            if(perfectCount>=2) str.push({e:'💎',t:`${perfectCount}× perfect run`,d:'Buď génius, nebo výborná paměť. Obojí respektujeme.'});
            if(parseFloat(avgAnswerTime)<=4) str.push({e:'⚡',t:'Blesk v klávesnici',d:`Průměr ${avgAnswerTime}s — odpovídáš rychleji než se většina přihlásí do VPN.`});
            if(avgScore>=allAvg) str.push({e:'📈',t:'Nad průměrem',d:`+${avgScore-allAvg} b vs ostatní. Někdo tě platí víc než si zaslouží.`});
            if(maxAnswerStreak>=8) str.push({e:'🔗',t:`Max série ${maxAnswerStreak}×`,d:'Tohle je výkon. Nebo ti nahrávaly otázky z oblíbené kategorie.'});
            if(sectorData.length && sectorData[0].acc>=80) str.push({e:'🏭',t:`Expert: ${sectorData[0].sector}`,d:`${sectorData[0].acc}% — tady bys mohl školit ostatní.`});
            if(str.length===0) return null;
            return (
              <div style={{background:'rgba(0,50,30,0.3)',border:'1px solid #226644',borderRadius:12,padding:16,marginBottom:16}}>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#44ffaa',letterSpacing:2,marginBottom:12}}>✅ CO TI JDE (zaslouží si uznání)</div>
                {str.map((t,i)=>(
                  <div key={i} style={{display:'flex',gap:10,padding:'7px 0',borderBottom:i<str.length-1?'1px solid #1a3020':'none'}}>
                    <span style={{fontSize:18,flexShrink:0}}>{t.e}</span>
                    <div>
                      <div style={{fontSize:12,fontWeight:700,color:'#44ffaa'}}>{t.t}</div>
                      <div style={{fontSize:11,color:'#338866',marginTop:2}}>{t.d}</div>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}

          {/* ── VERDIKT ── */}
          <div style={{background:'rgba(12,18,50,0.8)',border:'1px dashed #2a3a6a',borderRadius:12,padding:16,marginBottom:16,textAlign:'center'}}>
            <div style={{fontSize:9,color:'#334455',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>CELKOVÝ VERDIKT</div>
            <div style={{fontSize:12,color:'#556688',lineHeight:1.8}}>
              {accuracy>=75&&avgScore>=allAvg&&parseFloat(avgAnswerTime)<=6
                ? `${user.name}, jsi ten člověk ve firmě co opravdu ví co dělá, dělá to rychle a nepotřebuje Stack Overflow. Ostatní to jen předstírají.`
                : accuracy>=75&&avgScore>=allAvg
                ? `${user.name}, znalosti i skóre máš výborné. Jen ta rychlost — ale kdo se nespěchá, taky někam dojde.`
                : accuracy>=75&&parseFloat(avgAnswerTime)<=6
                ? `${user.name}, rychlý a přesný. Jen to skóre by mohlo být vyšší — máš kombinace nebo se ti nevyplatí?`
                : accuracy>=75
                ? `${user.name}, přesnost výborná, zbytek má potenciál. Potenciál se ale nenapíše do CV.`
                : avgScore>=allAvg
                ? `${user.name}, skóre nad průměrem, ale přesnost to trochu kazí. Rychlost ano, přesnost... pracujeme na tom.`
                : `${user.name}, máš co zlepšovat — to je pozitivní zpráva. Horší by bylo kdybys měl pocit že ne.`
              }
            </div>
          </div>

        </>)}
        <div style={{textAlign:'center',marginBottom:24}}>
          <button className="btn" onClick={onBack} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 30px',borderRadius:8,fontSize:12,color:'#88aaff',letterSpacing:2}}>← ZPĚT</button>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
