// ─── TARGETS GAME ────────────────────────────────────
function TargetsGame({ onResult, swPts, phase }) {
  const [gameState, setGameState] = useState('waiting');
  const [score, setScore]   = useState(0);
  const [hits, setHits]     = useState(0);
  const [misses, setMisses] = useState(0);
  const [timeLeft, setTimeLeft] = useState(20);
  const [targets, setTargets]   = useState([]);
  const [floats, setFloats]     = useState([]);
  const scoreRef   = useRef(0);
  const hitsRef    = useRef(0);
  const missesRef  = useRef(0);
  const timerRef   = useRef(null);
  const spawnRef   = useRef(null);
  const nextIdRef  = useRef(0);
  const COLORS = ['#4488ff','#ff4488','#44cc88','#ffd700','#ff9944','#bb44ff'];

  function startGame() {
    setGameState('playing');
    scoreRef.current=0; hitsRef.current=0; missesRef.current=0;
    setScore(0); setHits(0); setMisses(0); setTimeLeft(20); setTargets([]);
    timerRef.current = setInterval(() => {
      setTimeLeft(t => { if (t<=1){endGame();return 0;} return t-1; });
    }, 1000);
    scheduleSpawn();
  }

  function scheduleSpawn() {
    const delay = 250 + Math.random()*500;
    spawnRef.current = setTimeout(() => { spawnTarget(); scheduleSpawn(); }, delay);
  }

  function spawnTarget() {
    const size  = 28+Math.random()*28;
    const x     = size/2+Math.random()*(390-size);
    const y     = size/2+Math.random()*(270-size);
    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
    const id    = nextIdRef.current++;
    const pts   = Math.round(180-((size-28)/28)*80);
    setTargets(prev=>[...prev,{id,x,y,size,color,pts}]);
    setTimeout(()=>setTargets(prev=>prev.filter(t=>t.id!==id)),1400);
  }

  function hitTarget(id,pts,x,y,e) {
    e.stopPropagation();
    if (gameState!=='playing') return;
    setTargets(prev=>prev.filter(t=>t.id!==id));
    scoreRef.current+=pts; hitsRef.current++;
    setScore(scoreRef.current); setHits(hitsRef.current);
    const fid=nextIdRef.current++;
    setFloats(prev=>[...prev,{id:fid,x,y,pts,miss:false}]);
    setTimeout(()=>setFloats(prev=>prev.filter(f=>f.id!==fid)),700);
  }

  function missClick(e) {
    if (gameState!=='playing') return;
    if (e.target!==e.currentTarget && e.target.parentElement!==e.currentTarget) return;
    scoreRef.current=Math.max(0,scoreRef.current-50);
    missesRef.current++;
    setScore(scoreRef.current); setMisses(missesRef.current);
    const rect=e.currentTarget.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    const fid=nextIdRef.current++;
    setFloats(prev=>[...prev,{id:fid,x,y,pts:-50,miss:true}]);
    setTimeout(()=>setFloats(prev=>prev.filter(f=>f.id!==fid)),600);
  }

  function endGame() {
    clearInterval(timerRef.current); clearTimeout(spawnRef.current);
    setGameState('done'); setTargets([]);
    const total=hitsRef.current+missesRef.current;
    const acc=total>0?Math.round(hitsRef.current/total*100):0;
    const finalPts=scoreRef.current+Math.round(acc*3);
    const verdict=acc>=90?'🎯 Ostrostřelec!':acc>=70?'💪 Dobrý střelec':acc>=50?'🙂 Průměrný výkon':'😅 Více tréninku!';
    setTimeout(()=>onResult(finalPts,{
      'Zásahy':hitsRef.current,'Minutí':missesRef.current,
      'Přesnost':acc+'%','Bonus za přesnost':'+'+Math.round(acc*3)+' b','Hodnocení':verdict,
    }),400);
  }

  useEffect(()=>()=>{clearInterval(timerRef.current);clearTimeout(spawnRef.current);},[]);

  const timeColor=timeLeft>10?'#44ffaa':timeLeft>5?'#ffd700':'#ff4444';

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>TERČOVÁ STŘELNICE</div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,padding:'0 4px'}}>
        <div style={{textAlign:'left'}}>
          <div style={{fontSize:9,color:'#445566',letterSpacing:1}}>SKÓRE</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:'#4488ff'}}>{score.toLocaleString()}</div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:9,color:'#445566',letterSpacing:1}}>ČAS</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:26,fontWeight:900,color:timeColor}}>{timeLeft}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:9,color:'#445566',letterSpacing:1}}>ZÁSAHY</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:'#44ffaa'}}>{hits}</div>
        </div>
      </div>
      {swPts>0 && (
        <div style={{background:'rgba(255,215,0,.08)',border:'1px solid rgba(255,215,0,.2)',borderRadius:8,padding:'5px 12px',marginBottom:8,fontSize:12,color:'#ffd700',fontFamily:"'Orbitron',sans-serif",fontWeight:700,letterSpacing:1}}>
          ⏱ Fáze 1: +{swPts.toLocaleString()} b
        </div>
      )}
      <div onClick={gameState==='waiting'?startGame:missClick} style={{
        position:'relative',width:'100%',maxWidth:400,height:280,margin:'0 auto 10px',
        background:'rgba(8,12,35,.9)',border:'1px solid #1e2a4a',borderRadius:12,
        overflow:'hidden',cursor:gameState==='waiting'?'pointer':'crosshair',
      }}>
        {gameState==='waiting' && (
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}>
            <div style={{fontSize:32}}>🎯</div>
            <div style={{fontSize:14,color:'#88aaff',fontWeight:700}}>Klikni pro start</div>
          </div>
        )}
        {targets.map(t=>(
          <div key={t.id} onClick={e=>hitTarget(t.id,t.pts,t.x,t.y,e)} style={{
            position:'absolute',left:t.x,top:t.y,width:t.size,height:t.size,
            borderRadius:'50%',background:t.color,border:'2px solid rgba(255,255,255,.3)',
            transform:'translate(-50%,-50%)',cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center',
            animation:'targetPop .15s ease',
          }}>
            <div style={{width:'35%',height:'35%',borderRadius:'50%',background:'rgba(255,255,255,.25)'}}/>
          </div>
        ))}
        {floats.map(f=>(
          <div key={f.id} style={{
            position:'absolute',left:f.x,top:f.y,
            color:f.miss?'#ff4444':'#44ffaa',fontWeight:900,fontSize:f.miss?12:13,
            fontFamily:"'Orbitron',sans-serif",
            transform:'translate(-50%,-50%)',pointerEvents:'none',
            animation:'floatUp .7s ease forwards',
          }}>{f.miss?'−50':'+'+f.pts}</div>
        ))}
      </div>
      {gameState==='playing' && <div style={{fontSize:10,color:'#334455'}}>Klikni mimo terč = −50 bodů</div>}
      {gameState==='done' && <div style={{fontSize:13,color:'#445566',padding:'10px 0'}}>Vyhodnocuji...</div>}
    </div>
  );
}

// ─── BALANCE GAME ────────────────────────────────────
function BalanceGame({ onResult, prevPts, phase }) {
  const [gState, setGState]   = useState('waiting');
  const [elapsed, setElapsed] = useState(0);
  const [pts, setPts]         = useState(0);
  const [maxW, setMaxW]       = useState(0);
  const [maxTilt, setMaxTilt] = useState(0);
  const canvasRef  = useRef(null);
  const stateRef   = useRef('waiting');
  const angleRef   = useRef(0);
  const omegaRef   = useRef(0);
  const weightsRef = useRef([]);
  const elapsedRef = useRef(0);
  const maxWRef    = useRef(0);
  const maxTiltRef = useRef(0);
  const dragRef    = useRef(null);
  const timerRef   = useRef(null);
  const spawnRef   = useRef(null);
  const rafRef     = useRef(0);
  const lastTRef   = useRef(0);
  const spawnDelay = useRef(4000);

  const W=360,H=240,PX=180,PY=100,BARLEN=290,MAXANG=Math.PI/4;
  const WCOLS=[
    {top:'#7ab8ff',mid:'#2266dd',rim:'#1a44aa'},
    {top:'#ff8ab8',mid:'#cc3366',rim:'#aa1144'},
    {top:'#70ddaa',mid:'#1d9e75',rim:'#0f6e56'},
    {top:'#ffdd66',mid:'#cc8800',rim:'#996600'},
    {top:'#cc99ff',mid:'#7744cc',rim:'#5522aa'},
    {top:'#ffaa66',mid:'#cc5500',rim:'#993300'},
  ];

  function lerp(a,b,t){
    const p=s=>parseInt(s,16);
    const ah=[p(a.slice(1,3)),p(a.slice(3,5)),p(a.slice(5,7))];
    const bh=[p(b.slice(1,3)),p(b.slice(3,5)),p(b.slice(5,7))];
    return '#'+ah.map((v,i)=>Math.round(v+(bh[i]-v)*t).toString(16).padStart(2,'0')).join('');
  }

  function draw(cv) {
    const cx=cv.getContext('2d');
    cx.clearRect(0,0,W,H);

    // Pozadí
    cx.fillStyle='#0a0d1e';
    cx.beginPath(); cx.roundRect(0,0,W,H,10); cx.fill();

    // Jemná mřížka
    cx.strokeStyle='rgba(255,255,255,.025)'; cx.lineWidth=1;
    for(let x=0;x<W;x+=28){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
    for(let y=0;y<H;y+=28){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}

    const ang=angleRef.current;

    // Limit čáry
    cx.save(); cx.translate(PX,PY);
    const lx=Math.cos(MAXANG)*BARLEN/2,ly=Math.sin(MAXANG)*BARLEN/2;
    cx.strokeStyle='rgba(255,60,60,.2)'; cx.lineWidth=1.5; cx.setLineDash([5,5]);
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(lx,ly);cx.stroke();
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(-lx,ly);cx.stroke();
    cx.setLineDash([]); cx.restore();

    // Stojan
    cx.save(); cx.translate(PX,PY);
    const sg=cx.createLinearGradient(-14,6,14,6);
    sg.addColorStop(0,'#1a1a2e'); sg.addColorStop(.5,'#3a3a5a'); sg.addColorStop(1,'#1a1a2e');
    cx.fillStyle=sg;
    cx.beginPath();cx.moveTo(0,7);cx.lineTo(-17,44);cx.lineTo(17,44);cx.closePath();cx.fill();
    const bg=cx.createLinearGradient(-28,44,28,52);
    bg.addColorStop(0,'#1a1a2e'); bg.addColorStop(.5,'#4a4a6a'); bg.addColorStop(1,'#1a1a2e');
    cx.fillStyle=bg; cx.beginPath(); cx.roundRect(-28,44,56,8,3); cx.fill();
    cx.restore();

    cx.save(); cx.translate(PX,PY); cx.rotate(ang);

    // Tyč — čistý gradient bez blur
    const tiltF=Math.min(1,Math.abs(ang)/MAXANG);
    const c1=tiltF<.5?lerp('#1d9e75','#ba7517',tiltF*2):lerp('#ba7517','#ee3333',(tiltF-.5)*2);
    const c2=tiltF<.5?lerp('#2aaa80','#ddaa00',tiltF*2):lerp('#ddaa00','#ff5555',(tiltF-.5)*2);
    const barG=cx.createLinearGradient(0,-5,0,5);
    barG.addColorStop(0,'rgba(255,255,255,.18)');
    barG.addColorStop(.35,c2); barG.addColorStop(.7,c1);
    barG.addColorStop(1,'rgba(0,0,0,.45)');
    cx.fillStyle=barG;
    cx.beginPath(); cx.roundRect(-BARLEN/2,-5,BARLEN,10,5); cx.fill();
    // Rýhy
    cx.strokeStyle='rgba(255,255,255,.07)'; cx.lineWidth=1;
    for(let x=-BARLEN/2+24;x<BARLEN/2;x+=24){cx.beginPath();cx.moveTo(x,-4);cx.lineTo(x,4);cx.stroke();}

    // Závaží — bez shadowBlur, čistá grafika
    weightsRef.current.forEach(w=>{
      const r=9+w.mass*.2;
      const wy=w.dropping?w.dy:0;
      const wx=w.pos;

      // Těleso — radiální gradient
      const wg=cx.createRadialGradient(wx-r*.28,wy+r*.28,r*.05,wx,wy+r,r);
      wg.addColorStop(0,w.col.top);
      wg.addColorStop(.55,w.col.mid);
      wg.addColorStop(1,w.col.rim);
      cx.fillStyle=wg;
      cx.beginPath(); cx.arc(wx,wy+r,r,0,Math.PI*2); cx.fill();

      // Tenký lem
      cx.strokeStyle=w.col.rim; cx.lineWidth=1.2;
      cx.beginPath(); cx.arc(wx,wy+r,r,0,Math.PI*2); cx.stroke();

      // Lesk — malý kruhový highlight
      const sg2=cx.createRadialGradient(wx-r*.32,wy+r*.28,0,wx-r*.32,wy+r*.28,r*.45);
      sg2.addColorStop(0,'rgba(255,255,255,.38)');
      sg2.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=sg2;
      cx.beginPath(); cx.arc(wx,wy+r,r,0,Math.PI*2); cx.fill();

      // Hmotnost
      cx.fillStyle='rgba(255,255,255,.88)';
      cx.font=`700 ${Math.max(9,Math.round(r*.58))}px system-ui`;
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(Math.round(w.mass)+'g',wx,wy+r);
    });

    cx.restore();

    // Pivot — chromový
    const pvG=cx.createRadialGradient(PX-2,PY-2,0,PX,PY,8);
    pvG.addColorStop(0,'#999'); pvG.addColorStop(.5,'#444'); pvG.addColorStop(1,'#111');
    cx.fillStyle=pvG; cx.beginPath(); cx.arc(PX,PY,7,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(255,255,255,.55)';
    cx.beginPath(); cx.arc(PX-2,PY-2,2.5,0,Math.PI*2); cx.fill();
  }

  function startBonusRound() {
    const s = stateRef.current;
    s.bonusActive = true;
    s.objects = [];
    s.bonusTrace = [];
    s.bonusTracing = false;
    s.bonusTimer = 8.0;
    s.bonusCount++;
    const shape = BONUS_SHAPES[Math.floor(Math.random() * BONUS_SHAPES.length)];
    s.bonusShape = shape;
    // Velké ovoce uprostřed
    const R = Math.min(s.W, s.H) * 0.32;
    s.bonusObj = {
      cx: s.W / 2,
      cy: s.H / 2,
      R,
      emoji: shape.emoji,
      // Checkpointy v absolutních souřadnicích
      checkpoints: shape.strokes.flatMap((stroke, si) =>
        stroke.map(([rx, ry], pi) => ({
          x: s.W / 2 + rx * R,
          y: s.H / 2 + ry * R,
          hit: false,
          minDist: 9999,
          stroke: si,
          idx: pi,
        }))
      ),
    };
    showBanner('🌟 BONUS! Vysekni: ' + shape.name, '#ffd700');
    if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
  }

  function evaluateBonus() {
    const s = stateRef.current;
    const obj = s.bonusObj;
    if (!obj) return;
    const threshold = obj.R * 0.35;

    // Pro každý checkpoint najdi nejbližší bod v trace
    obj.checkpoints.forEach(cp => {
      let minD = 9999;
      s.bonusTrace.forEach(pt => {
        const d = Math.hypot(pt.x - cp.x, pt.y - cp.y);
        if (d < minD) minD = d;
      });
      cp.minDist = minD;
      cp.hit = minD < threshold;
    });

    // Skóre podle přesnosti
    let totalAcc = 0;
    obj.checkpoints.forEach(cp => {
      totalAcc += Math.max(0, 1 - cp.minDist / threshold);
    });
    const accuracy = totalAcc / obj.checkpoints.length; // 0-1
    const hitCount = obj.checkpoints.filter(cp => cp.hit).length;
    const coverage = hitCount / obj.checkpoints.length;

    // Finální přesnost = kombinace
    const finalAcc = accuracy * 0.6 + coverage * 0.4;
    const pts = Math.round(8000 * finalAcc);
    s.score += pts;

    const grade =
      finalAcc >= 0.9 ? '⭐ DOKONALÉ!' :
      finalAcc >= 0.7 ? '✨ SKVĚLÉ!' :
      finalAcc >= 0.5 ? '👍 DOBRÉ' :
      finalAcc >= 0.3 ? '~ slušné' : '✗ minul';

    // Velká exploze ovoce
    s.shake = 30;
    s.flash = 0.8;
    s.flashColor = finalAcc >= 0.7 ? '255,215,0' : '255,255,255';
    for (let i = 0; i < 50; i++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 12;
      s.particles.push({
        x: obj.cx, y: obj.cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1.5,
        color: ['#ff4488', '#44ff88', '#ffaa44', '#ffd700'][i % 4],
        size: 4 + Math.random() * 4,
      });
    }
    s.floats.push({ x: obj.cx, y: obj.cy - 40, pts, color: '#ffd700', life: 2 });
    s.floats.push({ x: obj.cx, y: obj.cy + 10, text: grade + ' (' + Math.round(finalAcc * 100) + '%)', color: finalAcc >= 0.7 ? '#ffd700' : '#88aaff', life: 2, isLabel: true });
    showBanner(grade + ' +' + pts.toLocaleString(), finalAcc >= 0.7 ? '#ffd700' : '#88aaff');

    if (finalAcc >= 0.9 && navigator.vibrate) navigator.vibrate([15, 40, 15, 40, 15]);

    // Konec bonus kola
    s.bonusActive = false;
    s.bonusObj = null;
    s.bonusShape = null;
    s.bonusTrace = [];
    s.slicesSinceBonus = 0;
    s.spawnTimer = 0.8;
  }

  function gameLoop(now) {
    if (stateRef.current!=='playing') return;
    const dt=Math.min((now-lastTRef.current)/1000,.05);
    lastTRef.current=now;

    weightsRef.current.forEach(w=>{if(w.dropping){w.dy+=190*dt;if(w.dy>=0){w.dy=0;w.dropping=false;}}});
    let torque=0;
    weightsRef.current.forEach(w=>{if(!w.dropping)torque+=w.mass*w.pos*Math.cos(angleRef.current)*.000065;});
    omegaRef.current=(omegaRef.current+torque*dt)*.988;
    angleRef.current+=omegaRef.current*dt;

    const deg=Math.abs(angleRef.current*180/Math.PI);
    if(deg>maxTiltRef.current){maxTiltRef.current=deg;setMaxTilt(Math.round(deg));}

    if(Math.abs(angleRef.current)>MAXANG){endGame();return;}
    if(canvasRef.current) draw(canvasRef.current);
    rafRef.current=requestAnimationFrame(gameLoop);
  }

  function startGame() {
    stateRef.current='playing'; setGState('playing');
    angleRef.current=0; omegaRef.current=0;
    weightsRef.current=[]; elapsedRef.current=0;
    maxWRef.current=0; maxTiltRef.current=0;
    spawnDelay.current=4000;
    clearInterval(timerRef.current); clearTimeout(spawnRef.current); cancelAnimationFrame(rafRef.current);
    timerRef.current=setInterval(()=>{
      elapsedRef.current++;
      setElapsed(elapsedRef.current);
      const p=Math.round(elapsedRef.current*40+maxWRef.current*15);
      setPts(p);
      if(elapsedRef.current%8===0&&spawnDelay.current>1400) spawnDelay.current=Math.max(1400,spawnDelay.current-350);
    },1000);
    setTimeout(()=>{if(stateRef.current==='playing'){spawnWeight();scheduleSpawn();}},2000);
    lastTRef.current=performance.now();
    rafRef.current=requestAnimationFrame(gameLoop);
  }

  function scheduleSpawn(){
    spawnRef.current=setTimeout(()=>{
      if(stateRef.current!=='playing') return;
      spawnWeight(); scheduleSpawn();
    },spawnDelay.current+(Math.random()-.5)*600);
  }

  function spawnWeight(){
    const side=Math.random()<.5?1:-1;
    const pos=side*(55+Math.random()*75);
    const mass=18+Math.random()*30+elapsedRef.current*.4;
    const col=WCOLS[weightsRef.current.length%WCOLS.length];
    weightsRef.current.push({pos,mass,col,dropping:true,dy:-70});
    const wc=weightsRef.current.length;
    maxWRef.current=Math.max(maxWRef.current,wc);
    setMaxW(wc);
  }

  function endGame(){
    stateRef.current='done'; setGState('done');
    clearInterval(timerRef.current); clearTimeout(spawnRef.current); cancelAnimationFrame(rafRef.current);
    const finalPts=Math.round(elapsedRef.current*40+maxWRef.current*15);
    const verdict=elapsedRef.current>=40?'Mistr rovnováhy 🏆':elapsedRef.current>=20?'Skvělý výkon ⭐':elapsedRef.current>=10?'Dobrý pokus 👍':'Zkus znovu 💪';
    setTimeout(()=>onResult(finalPts,{
      'Vydržel jsi':elapsedRef.current+' s',
      'Max závaží':maxWRef.current,
      'Max náklon':Math.round(maxTiltRef.current)+'°',
      'Hodnocení':verdict,
    }),400);
  }

  useEffect(()=>{
    if(canvasRef.current) draw(canvasRef.current);
  },[]);
  useEffect(()=>()=>{clearInterval(timerRef.current);clearTimeout(spawnRef.current);cancelAnimationFrame(rafRef.current);},[]);

  function handlePointerDown(e){
    if(stateRef.current==='waiting'){startGame();return;}
    if(stateRef.current!=='playing') return;
    const rect=canvasRef.current.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width)-PX;
    const my=(e.clientY-rect.top)*(H/rect.height)-PY;
    let best=null,bestD=40;
    weightsRef.current.forEach(w=>{
      if(w.dropping) return;
      const r=9+w.mass*.2;
      const bx=w.pos*Math.cos(angleRef.current), by=w.pos*Math.sin(angleRef.current)+r;
      const d=Math.hypot(mx-bx,my-by);
      if(d<bestD+r*.5){bestD=d;best=w;}
    });
    if(best){dragRef.current={w:best,x0:mx,p0:best.pos};}
    canvasRef.current.setPointerCapture(e.pointerId);
  }
  function handlePointerMove(e){
    if(!dragRef.current||stateRef.current!=='playing') return;
    const rect=canvasRef.current.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width)-PX;
    dragRef.current.w.pos=Math.max(-BARLEN/2+15,Math.min(BARLEN/2-15,dragRef.current.p0+(mx-dragRef.current.x0)));
  }
  function handlePointerUp(){dragRef.current=null;}

  const tiltColor=maxTilt>28?'#ff4444':maxTilt>16?'#ffaa00':'#44ffaa';

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>ROVNOVÁHA</div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,padding:'0 2px'}}>
        {[{l:'ČAS',v:elapsed+' s',c:'#fff'},{l:'NÁKLON',v:Math.round(maxTilt)+'°',c:tiltColor},{l:'BODY',v:pts.toLocaleString(),c:'#4488ff'}].map(x=>(
          <div key={x.l} style={{background:'rgba(12,18,52,.8)',border:'1px solid #1a2448',borderRadius:8,padding:'7px 12px',textAlign:'center',flex:1,margin:'0 3px'}}>
            <div style={{fontSize:9,color:'#334455',letterSpacing:1}}>{x.l}</div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:x.c}}>{x.v}</div>
          </div>
        ))}
      </div>
      {prevPts>0 && <div style={{background:'rgba(255,215,0,.08)',border:'1px solid rgba(255,215,0,.2)',borderRadius:8,padding:'5px 12px',marginBottom:8,fontSize:12,color:'#ffd700',fontFamily:"'Orbitron',sans-serif",fontWeight:700}}>
        Fáze 1+2: +{prevPts.toLocaleString()} b
      </div>}
      <canvas ref={canvasRef} width={W} height={H}
        style={{width:'100%',borderRadius:12,touchAction:'none',cursor:gState==='waiting'?'pointer':'grab',display:'block'}}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
      />
      <div style={{marginTop:6,fontSize:11,color:'rgba(255,255,255,.25)',textAlign:'center'}}>
        {gState==='waiting'?'Klikni pro start':gState==='playing'?'Táhni závaží · Limit 45°':'Vyhodnocuji...'}
      </div>
    </div>
  );
}

// ─── TOWER BUILDER ─────────────────────────────────────
function TowerGame({ onResult }) {
  const canvasRef = useRef(null);
  const [gState, setGState] = useState('waiting'); // waiting | playing | done
  const [score, setScore]   = useState(0);
  const [floor, setFloor]   = useState(0);
  const [combo, setCombo]   = useState(0);
  const [lastDelta, setLastDelta] = useState('');

  const W = 360, H = 440;
  const FLOOR_H = 22;
  const stateRef = useRef('waiting');
  const towerRef = useRef([]);     // [{x, w, color, y}]
  const currentRef = useRef(null); // {x, w, dir, speed, color, y}
  const cameraYRef = useRef(0);    // posun kamery dolů s rostoucí věží
  const scoreRef = useRef(0);
  const floorRef = useRef(0);
  const comboRef = useRef(0);
  const rafRef   = useRef(0);
  const flashRef = useRef(0);  // flash effect intensity 0-1
  const particlesRef = useRef([]);

  function colorForFloor(n) {
    // HSL rainbow spirálka
    const h = (n * 18) % 360;
    return { fill: `hsl(${h}, 70%, 55%)`, edge: `hsl(${h}, 80%, 35%)`, light: `hsl(${h}, 70%, 70%)` };
  }

  function initGame() {
    // Základní podlaha
    const baseW = 180;
    const baseX = (W - baseW) / 2;
    const baseY = H - FLOOR_H - 30;
    towerRef.current = [{ x: baseX, w: baseW, y: baseY, color: colorForFloor(0) }];
    cameraYRef.current = 0;
    scoreRef.current = 0;
    floorRef.current = 0;
    comboRef.current = 0;
    particlesRef.current = [];
    flashRef.current = 0;
    setScore(0); setFloor(0); setCombo(0); setLastDelta('');
    spawnBlock();
  }

  function spawnBlock() {
    const top = towerRef.current[towerRef.current.length - 1];
    const baseSpeed = 1.8 + Math.min(3.5, floorRef.current * 0.12);
    const dir = Math.random() < 0.5 ? 1 : -1;
    // Spawn na opačné straně podle směru
    const startX = dir > 0 ? -top.w : W;
    currentRef.current = {
      x: startX,
      w: top.w,
      dir,
      speed: baseSpeed,
      color: colorForFloor(floorRef.current + 1),
      y: top.y - FLOOR_H,
    };
  }

  function placeBlock() {
    const cur = currentRef.current;
    const top = towerRef.current[towerRef.current.length - 1];
    if (!cur || !top) return;

    // Vypočítej překryv
    const overlapL = Math.max(cur.x, top.x);
    const overlapR = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap  = overlapR - overlapL;

    if (overlap <= 0) {
      // Mine — game over
      if (navigator.vibrate) navigator.vibrate([50,30,50]);
      currentRef.current = null;
      // Spustit padání bloku jako game-over efekt
      towerRef.current.push({ ...cur, falling: true, vy: 0 });
      endGame();
      return;
    }

    // Vypočítej body
    const delta = Math.abs(cur.x - top.x);
    let pts, msg;
    if (delta < 3) {
      // PERFECT — věž neořezává, kombo
      if (navigator.vibrate) navigator.vibrate(comboRef.current >= 3 ? [10,30,10] : 15);
      comboRef.current++;
      const comboBonus = comboRef.current * 200;
      pts = 1500 + comboBonus;
      msg = comboRef.current >= 3 ? `🔥 PERFECT × ${comboRef.current}` : '🎯 PERFECT';
      flashRef.current = 1;
      // Particles
      for (let i = 0; i < 16; i++) {
        particlesRef.current.push({
          x: cur.x + cur.w / 2,
          y: cur.y + FLOOR_H / 2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 1.2) * 7,
          life: 1,
          color: cur.color.light,
        });
      }
      // Drobné rozšíření bloku (max +5px) za perfect streak
      const widthBonus = Math.min(5, comboRef.current);
      towerRef.current.push({
        x: top.x - widthBonus / 2,
        w: top.w + widthBonus,
        y: cur.y,
        color: cur.color,
        perfect: true,
      });
    } else {
      // Ořezání
      comboRef.current = 0;
      pts = Math.max(50, Math.round(800 * (overlap / cur.w)));
      msg = delta < 8 ? '✨ Skvěle' : delta < 25 ? '👍 Dobře' : '⚠️ Těsně';
      towerRef.current.push({
        x: overlapL,
        w: overlap,
        y: cur.y,
        color: cur.color,
      });
      // Spadnutý kus (pro vizuální efekt)
      const fallX = cur.x < top.x ? cur.x : overlapR;
      const fallW = cur.w - overlap;
      if (fallW > 1) {
        particlesRef.current.push({
          x: fallX + fallW / 2,
          y: cur.y + FLOOR_H,
          vx: cur.x < top.x ? -2 : 2,
          vy: 0,
          gravity: true,
          life: 1.5,
          color: cur.color.fill,
          isBlock: true,
          w: fallW,
          h: FLOOR_H,
        });
      }
    }

    scoreRef.current += pts;
    floorRef.current++;
    setScore(scoreRef.current);
    setFloor(floorRef.current);
    setCombo(comboRef.current);
    setLastDelta(msg + ' +' + pts);
    setTimeout(() => setLastDelta(''), 1100);

    // Posun kamery dolů aby věž zůstala ve view
    const topY = cur.y;
    const desiredTopY = H * 0.35;
    if (topY < desiredTopY) {
      const shift = desiredTopY - topY;
      cameraYRef.current += shift;
      // Posuň všechny bloky a current
      towerRef.current.forEach(b => { b.y += shift; });
    }

    spawnBlock();
  }

  function endGame() {
    stateRef.current = 'done';
    setGState('done');
    cancelAnimationFrame(rafRef.current);

    // Pokračuj v animaci pádu pro dramatický efekt
    let endRafId;
    function endAnim() {
      const cv = canvasRef.current;
      if (!cv) return;
      towerRef.current.forEach(b => {
        if (b.falling) {
          b.vy = (b.vy || 0) + 0.8;
          b.y += b.vy;
        }
      });
      draw(cv);
      // Stop after block falls out
      const allFallen = towerRef.current.every(b => !b.falling || b.y > H + 200);
      if (!allFallen) endRafId = requestAnimationFrame(endAnim);
    }
    endRafId = requestAnimationFrame(endAnim);

    setTimeout(() => {
      const verdict =
        floorRef.current >= 25 ? '🏆 Architekt!' :
        floorRef.current >= 15 ? '⭐ Výborně' :
        floorRef.current >= 8  ? '👍 Slušné' :
        floorRef.current >= 4  ? '🙂 Můžeš líp' :
        '🐌 Trénuj rytmus';
      onResult(scoreRef.current, {
        'Pater': floorRef.current,
        'Skóre': scoreRef.current.toLocaleString(),
        'Hodnocení': verdict,
      });
    }, 1500);
  }

  function loop() {
    const cv = canvasRef.current;
    if (!cv || stateRef.current !== 'playing') return;

    // Update current block
    const cur = currentRef.current;
    if (cur) {
      cur.x += cur.dir * cur.speed;
      // Pohyb sem-tam: když přejede přes přední/zadní hranici, otoč
      const leftLimit  = -cur.w + 5;
      const rightLimit = W - 5;
      if (cur.x <= leftLimit) { cur.x = leftLimit; cur.dir = 1; }
      if (cur.x >= rightLimit) { cur.x = rightLimit; cur.dir = -1; }
    }

    // Update particles
    particlesRef.current = particlesRef.current.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.gravity) p.vy += 0.5;
      else p.vy += 0.3;
      p.life -= 0.025;
      return p.life > 0 && p.y < H + 50;
    });

    flashRef.current *= 0.88;

    draw(cv);
    rafRef.current = requestAnimationFrame(loop);
  }

  function draw(cv) {
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    // Pozadí — gradient
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0d1e');
    bg.addColorStop(0.5, '#0d1530');
    bg.addColorStop(1, '#1a0d2a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Jemná mřížka
    ctx.strokeStyle = 'rgba(255,255,255,.02)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 36) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 36) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Hvězdy
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    for (let i = 0; i < 30; i++) {
      const x = (i * 73) % W;
      const y = (i * 41) % H;
      ctx.fillRect(x, y, 1.5, 1.5);
    }

    // Vykreslení věže (zdola nahoru)
    towerRef.current.forEach((b, i) => {
      drawBlock(ctx, b.x, b.y, b.w, FLOOR_H, b.color, b.perfect);
    });

    // Aktuální blok
    if (currentRef.current && stateRef.current === 'playing') {
      const cur = currentRef.current;
      // Vodící linie nad blokem (kde je top)
      const top = towerRef.current[towerRef.current.length - 1];
      if (top) {
        ctx.strokeStyle = 'rgba(255,170,68,.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(top.x, cur.y + FLOOR_H);
        ctx.lineTo(top.x + top.w, cur.y + FLOOR_H);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      drawBlock(ctx, cur.x, cur.y, cur.w, FLOOR_H, cur.color, false, true);
    }

    // Particles
    particlesRef.current.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.isBlock) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });

    // Perfect flash overlay
    if (flashRef.current > 0.05) {
      ctx.fillStyle = `rgba(255,215,0,${flashRef.current * 0.25})`;
      ctx.fillRect(0, 0, W, H);
    }

    // UI overlay — patro indicator
    if (stateRef.current === 'playing') {
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = '700 13px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Patro: ' + floorRef.current, 10, 22);
    }
  }

  function drawBlock(ctx, x, y, w, h, color, perfect, isMoving) {
    // Tělo
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, color.light);
    grad.addColorStop(0.5, color.fill);
    grad.addColorStop(1, color.edge);
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    // Lem
    ctx.strokeStyle = color.edge;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    // Horní highlight
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(x + 1, y + 1, w - 2, 2);

    // Perfect glow
    if (perfect) {
      ctx.strokeStyle = 'rgba(255,215,0,.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
    }

    // Moving block — subtle glow
    if (isMoving) {
      ctx.strokeStyle = color.light;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6;
      ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
      ctx.globalAlpha = 1;
    }
  }

  function handleClick() {
    if (stateRef.current === 'waiting') {
      stateRef.current = 'playing';
      setGState('playing');
      initGame();
      rafRef.current = requestAnimationFrame(loop);
      return;
    }
    if (stateRef.current === 'playing') {
      placeBlock();
    }
  }

  function handleKey(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      handleClick();
    }
  }

  useEffect(() => {
    const cv = canvasRef.current;
    if (cv) draw(cv);
    window.addEventListener('keydown', handleKey);
    return () => { cancelAnimationFrame(rafRef.current); window.removeEventListener('keydown', handleKey); };
  }, []);

  const comboBg = combo >= 3 ? 'linear-gradient(135deg,rgba(255,68,68,.15),rgba(255,170,68,.15))'
              : combo >= 1 ? 'rgba(255,215,0,.08)' : 'rgba(12,18,52,.8)';

  return ReactDOM.createPortal(
    <div style={{
      position:'fixed',inset:0,zIndex:9999,
      background:'#0a0d1e',
      display:'flex',flexDirection:'column',alignItems:'center',
      touchAction:'none',userSelect:'none',overflow:'hidden',
    }}>
      <canvas ref={canvasRef} width={W} height={H}
        onPointerDown={(e)=>{ e.preventDefault(); handleClick(); }}
        style={{
          position:'absolute',top:'50%',left:'50%',

        textAlign:'center',fontSize:13,color:'#667',pointerEvents:'none',padding:'0 20px',
      }}>
        {gState==='waiting' ? '👆 Klikni / mezerník pro start'
         : gState==='playing' ? 'Klikni v pravý čas — perfect = bonus'
         : 'Vyhodnocuji…'}
      </div>
    </div>,
    document.body
  );
}


// Perfect streak HUD - rerendery se podle interval
function PerfectStreakHUD({ sRef }) {
  const [, force] = useState(0);
  useEffect(() => {
    const id = setInterval(() => force(n => n + 1), 250);
    return () => clearInterval(id);
  }, []);
  const s = sRef.current;
  if (!s) return null;
  const streak = s.perfectStreak || 0;
  const color = streak >= 10 ? '#ffd700' : streak >= 5 ? '#ff6644' : streak >= 2 ? '#44ffaa' : '#445566';
  return (
    <div style={{
      background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',
      borderRadius:10,padding:'4px 10px',
      display:'flex',alignItems:'center',gap:5,
      border: streak >= 5 ? `1px solid ${color}` : 'none',
    }}>
      <span style={{fontSize:14}}>🎯</span>
      <span style={{fontSize:12,fontWeight:900,color,fontFamily:"'Orbitron',sans-serif"}}>{streak}</span>
    </div>
  );
}

// PowerUp HUD - rerendery se podle interval
function PowerUpIndicators({ sRef }) {
  const [, force] = useState(0);
  useEffect(() => {
    const id = setInterval(() => force(n => n + 1), 250);
    return () => clearInterval(id);
  }, []);
  const s = sRef.current;
  if (!s) return null;
  const items = [];
  if (s.multiplierTime > 0) items.push({ icon:'✨', text:'×2', t:s.multiplierTime, color:'#ff88ff', max:5 });
  if (s.perfectZoneTime > 0) items.push({ icon:'🎯', text:'ZONE', t:s.perfectZoneTime, color:'#ffd700', max:4 });
  if (s.iceTime > 0) items.push({ icon:'❄️', text:'SLOW', t:s.iceTime, color:'#88ddff', max:3 });
  if (!items.length) return null;
  return (
    <>
      {items.map((it,i)=>(
        <div key={i} style={{
          background:'rgba(0,0,0,.6)',backdropFilter:'blur(8px)',
          border:`1px solid ${it.color}`,
          borderRadius:8,padding:'3px 8px',
          fontSize:11,color:it.color,fontWeight:700,
          display:'flex',alignItems:'center',gap:4,
        }}>
          <span>{it.icon}</span>
          <span>{it.text}</span>
          <span style={{
            display:'inline-block',width:18,height:3,background:'rgba(255,255,255,.2)',borderRadius:2,marginLeft:2,
          }}>
            <span style={{
              display:'block',height:'100%',width:`${Math.min(100, (it.t/it.max)*100)}%`,
              background:it.color,borderRadius:2,
            }}/>
          </span>
        </div>
      ))}
    </>
  );
}

// ─── SLASH MASTER (10 zón přesnosti, zrychluje, multi-spawn) ──
function SlashMasterGame({ onResult }) {
  const [phase, setPhase] = useState('intro');
  const [score, setScore] = useState(0);
  const [level, setLevel] = useState(1);
  const [lives, setLives] = useState(3);
  const [combo, setCombo] = useState(0);
  const [cleanStreak, setCleanStreak] = useState(0);

  const canvasRef = useRef(null);
  const stateRef = useRef({
    W: 360, H: 600,
    objects: [],       // pole přilétajících objektů
    slashes: [],
    particles: [],
    halves: [],
    score: 0, lives: 3, level: 1, combo: 0, maxCombo: 0,
    sliced: 0, perfectCuts: 0, bullseyes: 0,
    cleanStreak: 0, maxCleanStreak: 0,
    nextId: 0,
    flash: 0, flashColor: '255,255,255', shake: 0,
    raf: 0, lastT: 0, running: false,
    floats: [], banner: null,
    spawnTimer: 0, gameTime: 0,
    lastUIUpdate: 0, bgCanvas: null,
    // Bonus round
    bonusActive: false,
    bonusObj: null,
    bonusShape: null,
    bonusTrace: [],
    bonusTimer: 0,
    bonusTracing: false,
    slicesSinceBonus: 0,
    bonusCount: 0,
  });

  const FRUITS = ['🍎','🍊','🍋','🍉','🍓','🍇','🍑','🥝','🍐','🥭'];

  // Tvary pro prémiová kola - checkpointy relativně (-1..1), pořadí = směr tahu
  const BONUS_SHAPES = [
    { name:'Z', emoji:'🍉', strokes:[[[-0.6,-0.6],[0.6,-0.6],[-0.6,0.6],[0.6,0.6]]] },
    { name:'X', emoji:'🍉', strokes:[[[-0.6,-0.6],[0.6,0.6]],[[0.6,-0.6],[-0.6,0.6]]] },
    { name:'N', emoji:'🍈', strokes:[[[-0.6,0.6],[-0.6,-0.6],[0.6,0.6],[0.6,-0.6]]] },
    { name:'V', emoji:'🍑', strokes:[[[-0.6,-0.6],[0,0.6],[0.6,-0.6]]] },
    { name:'L', emoji:'🍐', strokes:[[[-0.5,-0.6],[-0.5,0.6],[0.6,0.6]]] },
    { name:'C', emoji:'🍊', strokes:[[[0.5,-0.5],[-0.2,-0.6],[-0.6,0],[-0.2,0.6],[0.5,0.5]]] },
    { name:'W', emoji:'🍉', strokes:[[[-0.7,-0.5],[-0.35,0.6],[0,-0.3],[0.35,0.6],[0.7,-0.5]]] },
  ];

  function resizeCanvas() {
    const s = stateRef.current;
    s.W = window.innerWidth; s.H = window.innerHeight;
    const cv = canvasRef.current;
    if (cv) {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      cv.width = s.W * dpr; cv.height = s.H * dpr;
      cv.getContext('2d').scale(dpr, dpr);
    }
    s.bgCanvas = null;
  }

  function showBanner(text, color) {
    stateRef.current.banner = { text, color: color || '#fff', time: 1.4, width: null };
  }

  function maxObjectsForLevel(lvl) {
    return Math.min(5, 1 + Math.floor((lvl - 1) / 3)); // L1-3:1, L4-6:2, L7-9:3, L10-12:4, L13+:5
  }

  function spawnObject() {
    const s = stateRef.current;
    const level = s.level;
    const bombChance = Math.min(0.25, 0.08 + (level - 1) * 0.02);
    const r = Math.random();
    let type;
    if (r < bombChance) type = 'bomb';
    else if (r < bombChance + 0.05) type = 'star';
    else if (r < bombChance + 0.09) type = 'diamond';
    else type = 'fruit';

    const emojiMap = { bomb:'💣', star:'⭐', diamond:'💎' };
    const emoji = type === 'fruit' ? FRUITS[Math.floor(Math.random()*FRUITS.length)] : emojiMap[type];

    // Globální zrychlení podle času + levelu
    const speedMult = 1 + s.gameTime / 80 + (level - 1) * 0.08;
    // Bomby lítají 3× rychleji (rychle proletí, musíš se vyhnout)
    const bombMult = type === 'bomb' ? 3 : 1;
    const baseSpeed = (0.30 + Math.random() * 0.08) * speedMult * bombMult;

    // Spawn blízko středu (objekt v dálce) s vektorem ven - poletí kolem hráče
    const angle = Math.random() * Math.PI * 2;
    const startDist = 25 + Math.random() * 70;
    const cx = s.W / 2 + (Math.random() - 0.5) * 60;  // mírně posunuté ohnisko
    const cy = s.H / 2 + (Math.random() - 0.5) * 60;
    const spawnX = cx + Math.cos(angle) * startDist;
    const spawnY = cy + Math.sin(angle) * startDist;

    s.objects.push({
      id: s.nextId++,
      type, emoji,
      scale: 0.12,
      scaleSpeed: baseSpeed,
      x: spawnX, y: spawnY,
      outX: Math.cos(angle),   // směr letu ven od středu
      outY: Math.sin(angle),
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 1.5,
      baseSize: 88,
      alive: true, sliced: false,
    });
  }

  function pointLineDist(px, py, x1, y1, x2, y2) {
    const dx = x2-x1, dy = y2-y1, len2 = dx*dx+dy*dy;
    if (len2 < 0.01) return Math.hypot(px-x1, py-y1);
    const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/len2));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  // ZÓNY: 10 = přesný střed (bullseye), 1 = okraj
  const ZONE_MULT = [0,0.3,0.4,0.55,0.7,0.9,1.2,1.7,2.4,3.5,5.0]; // index 1-10
  const ZONE_LABEL = {
    10:'🎯 BULLSEYE!', 9:'⚔️ ČISTÝ ŘEZ!', 8:'✨ SKVĚLE!', 7:'✨ VÝBORNĚ',
    6:'👍 DOBŘE', 5:'👍 OK', 4:'~ slušné', 3:'~ odřeno', 2:'~ těsně', 1:'~ okraj',
  };
  const ZONE_COLOR = {
    10:'#ffd700', 9:'#ffdd33', 8:'#44ffaa', 7:'#66ffaa',
    6:'#88aaff', 5:'#88aaff', 4:'#aa99cc', 3:'#aa88aa', 2:'#996688', 1:'#886677',
  };

  function sliceObj(o, ratio, sliceAngle) {
    const s = stateRef.current;
    if (!o.alive || o.sliced) return;
    o.sliced = true; o.alive = false;

    if (o.type === 'bomb') {
      if (navigator.vibrate) navigator.vibrate([60,40,60]);
      s.shake = 40; s.lives--; setLives(s.lives);
      s.combo = 0; s.cleanStreak = 0; setCleanStreak(0);
      for (let i=0;i<25;i++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*12;s.particles.push({x:o.x,y:o.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.2,color:['#ff4400','#ffaa00','#ff8800'][i%3],size:4+Math.random()*4});}
      s.flash=1; s.flashColor='255,68,0';
      if (s.lives<=0){showBanner('💀 GAME OVER!','#ff4444');setTimeout(()=>endGame(),1400);}
      else showBanner('💔 -1 ŽIVOT! ('+s.lives+')','#ff4488');
      return;
    }

    // Výpočet zóny 1-10
    const zone = Math.min(10, Math.max(1, Math.ceil((1 - ratio) * 10)));
    const zoneMult = ZONE_MULT[zone];
    const isClean = zone >= 9;       // čistý řez = zóna 9-10
    const isBullseye = zone === 10;

    // Clean streak (3× čistý řez za sebou se násobí)
    let streakMult = 1;
    if (isClean) {
      s.cleanStreak++;
      if (s.cleanStreak > s.maxCleanStreak) s.maxCleanStreak = s.cleanStreak;
      setCleanStreak(s.cleanStreak);
      // 3+ = ×2, 6+ = ×3, 9+ = ×4, 12+ = ×5
      streakMult = s.cleanStreak >= 12 ? 5 : s.cleanStreak >= 9 ? 4 : s.cleanStreak >= 6 ? 3 : s.cleanStreak >= 3 ? 2 : 1;
      if (navigator.vibrate) navigator.vibrate(isBullseye ? [10,20,10] : 15);
      s.perfectCuts++;
      if (isBullseye) s.bullseyes++;
    } else {
      if (s.cleanStreak >= 3) showBanner('Streak ztracen!', '#888');
      s.cleanStreak = 0;
      setCleanStreak(0);
    }

    // Combo (jakýkoliv úspěšný řez zóna >= 4)
    if (zone >= 4) s.combo++;
    else s.combo = 0;
    if (s.combo > s.maxCombo) s.maxCombo = s.combo;

    // Timing bonus
    const sizeDiff = Math.abs(o.scale - 1.0);
    const timingMult = sizeDiff < 0.15 ? 1.3 : sizeDiff < 0.3 ? 1.1 : 1.0;

    const baseMap = { star:500, diamond:1200, fruit:100 };
    const basePts = baseMap[o.type] || 100;
    const comboMult = Math.min(8, Math.max(1, s.combo));
    const pts = Math.round(basePts * zoneMult * timingMult * comboMult * streakMult);
    s.score += pts;
    s.sliced++;
    s.slicesSinceBonus = (s.slicesSinceBonus || 0) + 1;

    // Float - body + zóna label + streak
    s.floats.push({ x:o.x, y:o.y-22, pts, color:isClean?'#ffd700':'#fff', life:1.2 });
    let label = ZONE_LABEL[zone];
    if (streakMult > 1) label += ` ×${streakMult}`;
    s.floats.push({ x:o.x, y:o.y+24, text:label, color:ZONE_COLOR[zone], life:1.4, isLabel:true });

    if (isBullseye) { s.flash=0.8; s.flashColor='255,215,0'; }
    else if (isClean) { s.flash=0.5; s.flashColor='255,221,51'; }

    // Streak achievementy
    if (s.cleanStreak === 3)  showBanner('🔥 STREAK ×2!', '#ff6644');
    if (s.cleanStreak === 6)  showBanner('🔥🔥 STREAK ×3!', '#ff4400');
    if (s.cleanStreak === 9)  showBanner('💎 STREAK ×4!', '#ffd700');
    if (s.cleanStreak === 12) showBanner('👑 STREAK ×5 MAX!', '#ff44ff');
    if (s.bullseyes === 10) showBanner('🎯 10× BULLSEYE!', '#ffd700');
    if (s.sliced === 25) showBanner('⚔️ MISTR MEČE!', '#44ffaa');
    if (s.sliced === 50) showBanner('👑 SAMURAJ!', '#ffd700');

    // Level up
    const newLevel = Math.min(20, Math.floor(s.score / 2500) + 1);
    if (newLevel !== s.level) {
      s.level = newLevel;
      const maxObj = maxObjectsForLevel(newLevel);
      showBanner(`⬆️ LEVEL ${newLevel} (${maxObj}× najednou)`, '#88ccff');
    }

    // Trigger bonus round po 18 nasekaných předmětech
    if (s.slicesSinceBonus >= 18 && s.level >= 2) {
      setTimeout(() => { if (s.running) startBonusRound(); }, 600);
      s.slicesSinceBonus = 0;
    }

    if (o.type === 'star') showBanner('⭐ +' + pts.toLocaleString(), '#ffd700');
    if (o.type === 'diamond') { s.flash=Math.max(s.flash,0.6); s.flashColor='136,221,255'; }

    // Půlky
    const perpAngle = sliceAngle + Math.PI/2;
    const sz = o.baseSize * o.scale;
    for (let side=0;side<2;side++){
      const dir = side===0?1:-1;
      s.halves.push({ x:o.x,y:o.y, vx:Math.cos(perpAngle)*dir*3+Math.cos(sliceAngle)*2, vy:Math.sin(perpAngle)*dir*3+Math.sin(sliceAngle)*2-2, rot:o.rot, rotSpd:dir*4, emoji:o.emoji, size:sz, life:1.2, sliceAngle, side });
    }
    // Šťáva
    const jc = o.type==='diamond'?['#88ddff','#fff']:o.type==='star'?['#ffd700','#ffaa00']:['#ff4488','#44ff88','#ffaa44','#ff66aa'];
    for (let i=0;i<(isClean?18:10);i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;s.particles.push({x:o.x,y:o.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color:jc[i%jc.length],size:3+Math.random()*3});}
  }

  function gameLoop(now) {
    const s = stateRef.current;
    if (!s.running) return;
    const dt = Math.min((now - s.lastT)/1000, 0.05);
    s.lastT = now;
    s.gameTime += dt;

    // ── BONUS ROUND mode ──
    if (s.bonusActive) {
      s.bonusTimer -= dt;
      // Slash trace
      const tNow = Date.now();
      s.slashes = s.slashes.filter(p => tNow - p.t < 220);
      // Particles a floats stále aktualizuj
      s.particles = s.particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life-=0.022; return p.life>0; });
      s.floats = s.floats.filter(f => { f.y -= f.isLabel?0.6:1.2; f.life -= f.isLabel?0.012:0.016; return f.life>0; });
      s.flash *= 0.92; s.shake *= 0.85;
      if (s.banner) { s.banner.time -= dt; if (s.banner.time<=0) s.banner=null; }
      if (s.bonusTimer <= 0 && s.bonusObj) {
        evaluateBonus();
      }
      if (now - s.lastUIUpdate > 200) { s.lastUIUpdate = now; setScore(s.score); }
      draw();
      s.raf = requestAnimationFrame(gameLoop);
      return;
    }

    // Spawn - drž počet objektů podle levelu
    const maxObj = maxObjectsForLevel(s.level);
    const activeCount = s.objects.filter(o => o.alive && !o.sliced).length;
    s.spawnTimer -= dt;
    if (activeCount < maxObj && s.spawnTimer <= 0) {
      spawnObject();
      // Rychlejší spawn s vyšším levelem
      s.spawnTimer = Math.max(0.5, 1.1 - s.level * 0.04);
    }

    // Update objekty - perspektivní pohyb ven (čím větší = blíž = rychleji letí kolem)
    s.objects.forEach(o => {
      if (!o.alive) return;
      o.scale += o.scaleSpeed * dt;
      // Rychlost ven roste s druhou mocninou velikosti = perspektiva
      const persp = o.scale * o.scale * 130;
      o.x += o.outX * persp * dt;
      o.y += o.outY * persp * dt;
      o.rot += o.rotSpd * dt;
      // Proletěl mimo obrazovku nebo příliš velký = miss
      const margin = 120;
      if (o.scale > 2.4 || o.x < -margin || o.x > s.W + margin || o.y < -margin || o.y > s.H + margin) {
        if (o.type !== 'bomb') {
          s.combo = 0;
          s.cleanStreak = 0; setCleanStreak(0);
          s.floats.push({ x:Math.max(40,Math.min(s.W-40,o.x)), y:Math.max(60,Math.min(s.H-60,o.y)), text:'MISS', color:'#ff6644', life:1, isLabel:true });
        }
        o.alive = false;
      }
    });
    s.objects = s.objects.filter(o => o.alive && !o.sliced);

    // Slash detection - projdi všechny objekty
    const tNow = Date.now();
    s.slashes = s.slashes.filter(p => tNow - p.t < 220);
    if (s.slashes.length >= 2) {
      for (let i = s.slashes.length-1; i>0; i--) {
        const a = s.slashes[i-1], b = s.slashes[i];
        const moved = Math.hypot(b.x-a.x, b.y-a.y);
        if (moved < 10) continue;
        const ang = Math.atan2(b.y-a.y, b.x-a.x);
        for (const o of s.objects) {
          if (!o.alive || o.sliced) continue;
          const radius = o.baseSize * o.scale * 0.5;
          const dist = pointLineDist(o.x, o.y, a.x, a.y, b.x, b.y);
          if (o.type === 'bomb') {
            if (moved >= 20 && dist <= radius * 0.7) sliceObj(o, dist/radius, ang);
          } else {
            if (o.scale >= 0.45 && dist <= radius) sliceObj(o, dist/radius, ang);
          }
        }
      }
    }

    // Half pieces
    s.halves = s.halves.filter(h => { h.x+=h.vx; h.y+=h.vy; h.vy+=0.35; h.rot+=h.rotSpd*dt; h.life-=0.02; return h.life>0; });
    // Particles
    s.particles = s.particles.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life-=0.022; return p.life>0; });
    if (s.particles.length > 150) s.particles = s.particles.slice(-150);
    // Floats
    s.floats = s.floats.filter(f => { f.y -= f.isLabel?0.7:1.3; f.life -= f.isLabel?0.014:0.018; return f.life>0; });

    s.flash *= 0.92; s.shake *= 0.85;
    if (s.banner) { s.banner.time -= dt; if (s.banner.time<=0) s.banner=null; }

    if (now - s.lastUIUpdate > 200) {
      s.lastUIUpdate = now;
      setScore(s.score); setCombo(s.combo); setLives(s.lives); setLevel(s.level);
    }

    draw();
    s.raf = requestAnimationFrame(gameLoop);
  }

  function draw() {
    const s = stateRef.current;
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');

    if (!s.bgCanvas || s.bgCanvas.width !== s.W) {
      s.bgCanvas = document.createElement('canvas');
      s.bgCanvas.width = s.W; s.bgCanvas.height = s.H;
      const b = s.bgCanvas.getContext('2d');
      const g = b.createRadialGradient(s.W/2, s.H/2, 30, s.W/2, s.H/2, Math.max(s.W,s.H)*0.7);
      g.addColorStop(0,'#1a2545'); g.addColorStop(0.6,'#0d1530'); g.addColorStop(1,'#080a1e');
      b.fillStyle=g; b.fillRect(0,0,s.W,s.H);
      b.fillStyle='rgba(255,255,255,.25)';
      for (let i=0;i<40;i++) b.fillRect((i*73+13)%s.W,(i*41+7)%s.H,1.5,1.5);
    }
    ctx.clearRect(0,0,s.W,s.H);
    ctx.drawImage(s.bgCanvas,0,0);

    const shX=(Math.random()-0.5)*s.shake, shY=(Math.random()-0.5)*s.shake;
    ctx.save(); ctx.translate(shX,shY);
    ctx.textAlign='center'; ctx.textBaseline='middle';

    // ── BONUS ROUND rendering ──
    if (s.bonusActive && s.bonusObj) {
      const o = s.bonusObj;
      // Velké ovoce
      ctx.font = `${o.R * 2}px sans-serif`;
      ctx.fillText(o.emoji, o.cx, o.cy);

      // Vzor k vysekání - tečkovaná čára spojující checkpointy
      s.bonusShape.strokes.forEach(stroke => {
        ctx.strokeStyle = 'rgba(255,215,0,.85)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        stroke.forEach(([rx, ry], i) => {
          const px = o.cx + rx * o.R;
          const py = o.cy + ry * o.R;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Checkpointy jako kruhy (zelené = trefené)
      o.checkpoints.forEach((cp, i) => {
        const isStart = cp.idx === 0;
        ctx.fillStyle = 'rgba(255,215,0,.9)';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, isStart ? 12 : 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        if (isStart) {
          ctx.fillStyle = '#000';
          ctx.font = '900 12px system-ui';
          ctx.fillText('▶', cp.x, cp.y);
        }
      });

      // Hráčův trace
      if (s.bonusTrace.length >= 2) {
        ctx.strokeStyle = 'rgba(68,255,170,.9)';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(s.bonusTrace[0].x, s.bonusTrace[0].y);
        for (let i = 1; i < s.bonusTrace.length; i++) ctx.lineTo(s.bonusTrace[i].x, s.bonusTrace[i].y);
        ctx.stroke();
      }

      // Timer bar
      const barW = s.W * 0.7;
      const barX = (s.W - barW) / 2;
      const barY = s.H * 0.85;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.beginPath(); ctx.roundRect(barX, barY, barW, 10, 5); ctx.fill();
      const prog = Math.max(0, s.bonusTimer / 8);
      ctx.fillStyle = prog > 0.3 ? '#ffd700' : '#ff4444';
      ctx.beginPath(); ctx.roundRect(barX, barY, barW * prog, 10, 5); ctx.fill();

      // Particles + floats over bonus
      ctx.shadowBlur = 0;
      s.particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; const sz = p.size * p.life; ctx.fillRect(p.x - sz, p.y - sz, sz * 2, sz * 2); });
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      s.floats.forEach(f => { ctx.globalAlpha = Math.max(0, f.life); ctx.fillStyle = f.color; if (f.isLabel) { ctx.font = '900 20px system-ui'; ctx.fillText(f.text, f.x, f.y); } else { ctx.font = '900 30px system-ui'; ctx.fillText('+' + f.pts.toLocaleString(), f.x, f.y); } });
      ctx.globalAlpha = 1;

      ctx.restore();

      // Flash + banner pro bonus
      if (s.flash > 0.05) { ctx.fillStyle = `rgba(${s.flashColor},${s.flash * 0.25})`; ctx.fillRect(0, 0, s.W, s.H); }
      if (s.banner) {
        const t = s.banner.time;
        const alpha = t > 1.0 ? (1.4 - t) * 2.5 : t < 0.3 ? t / 0.3 : 1;
        ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
        const by = s.H * 0.16;
        ctx.font = '900 26px system-ui';
        if (s.banner.width === null) s.banner.width = ctx.measureText(s.banner.text).width + 40;
        const bw = s.banner.width;
        ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.beginPath(); ctx.roundRect(s.W / 2 - bw / 2, by - 24, bw, 48, 12); ctx.fill();
        ctx.strokeStyle = s.banner.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = s.banner.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(s.banner.text, s.W / 2, by);
        ctx.restore();
      }
      return; // bonus rendering hotov
    }

    // Objekty s terčem (10 zón)
    s.objects.forEach(o => {
      if (!o.alive) return;
      const sz = o.baseSize * o.scale;
      // Stín
      ctx.globalAlpha = Math.min(0.4, o.scale*0.3);
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(o.x, o.y+sz*0.55, sz*0.4, sz*0.15, 0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;

      if (o.type === 'bomb') {
        const pulse=(Math.sin(Date.now()*0.012)+1)*0.5;
        ctx.strokeStyle=`rgba(255,50,50,${0.5+pulse*0.5})`;
        ctx.lineWidth=2.5+pulse*2;
        ctx.beginPath(); ctx.arc(o.x,o.y,sz*0.55,0,Math.PI*2); ctx.stroke();
      } else if (o.scale > 0.5) {
        // Terč - koncentrické kruhy ukazující zóny
        const R = sz * 0.55;
        // Vnější (zóna 1-4) - tlumený
        ctx.strokeStyle='rgba(120,140,180,.25)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(o.x,o.y,R,0,Math.PI*2); ctx.stroke();
        // Střední (zóna 5-7)
        ctx.strokeStyle='rgba(100,170,255,.3)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(o.x,o.y,R*0.6,0,Math.PI*2); ctx.stroke();
        // Vnitřní clean zóna (8-9)
        ctx.strokeStyle='rgba(68,255,170,.4)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(o.x,o.y,R*0.3,0,Math.PI*2); ctx.stroke();
        // Bullseye (10) - pulzující zlatý
        const pulse=(Math.sin(Date.now()*0.008)+1)*0.5;
        ctx.strokeStyle=`rgba(255,215,0,${0.6+pulse*0.4})`; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(o.x,o.y,R*0.1,0,Math.PI*2); ctx.stroke();
      }

      ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.rot);
      ctx.font=`${sz}px sans-serif`; ctx.fillText(o.emoji,0,0);
      ctx.restore();
    });

    // Půlky
    s.halves.forEach(h => {
      ctx.save(); ctx.globalAlpha=Math.max(0,h.life);
      ctx.translate(h.x,h.y); ctx.rotate(h.sliceAngle);
      ctx.beginPath();
      if (h.side===0) ctx.rect(-h.size,-h.size,h.size*2,h.size);
      else ctx.rect(-h.size,0,h.size*2,h.size);
      ctx.clip(); ctx.rotate(-h.sliceAngle); ctx.rotate(h.rot);
      ctx.font=`${h.size}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(h.emoji,0,0);
      ctx.restore();
    });

    // Particles
    ctx.shadowBlur=0;
    s.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;const sz=p.size*p.life;ctx.fillRect(p.x-sz,p.y-sz,sz*2,sz*2);});
    ctx.globalAlpha=1;

    // Slash trail
    if (s.slashes.length>=2){
      ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(s.slashes[0].x,s.slashes[0].y);
      for(let i=1;i<s.slashes.length;i++)ctx.lineTo(s.slashes[i].x,s.slashes[i].y);
      ctx.strokeStyle='rgba(136,255,255,.25)';ctx.lineWidth=14;ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.slashes[0].x,s.slashes[0].y);
      for(let i=1;i<s.slashes.length;i++)ctx.lineTo(s.slashes[i].x,s.slashes[i].y);
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.stroke();
    }

    // Floats
    ctx.textAlign='center';
    s.floats.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.color;if(f.isLabel){ctx.font='900 18px system-ui';ctx.fillText(f.text,f.x,f.y);}else{ctx.font='900 26px system-ui';ctx.fillText('+'+f.pts.toLocaleString(),f.x,f.y);}});
    ctx.globalAlpha=1;
    ctx.restore();

    if (s.flash>0.05){ctx.fillStyle=`rgba(${s.flashColor},${s.flash*0.25})`;ctx.fillRect(0,0,s.W,s.H);}

    if (s.banner){
      const t=s.banner.time;
      const alpha=t>1.0?(1.4-t)*2.5:t<0.3?t/0.3:1;
      ctx.save();ctx.globalAlpha=Math.max(0,alpha);
      const by=s.H*0.28;
      ctx.font='900 30px system-ui';
      if(s.banner.width===null)s.banner.width=ctx.measureText(s.banner.text).width+40;
      const bw=s.banner.width;
      ctx.fillStyle='rgba(0,0,0,.7)';ctx.beginPath();ctx.roundRect(s.W/2-bw/2,by-25,bw,50,12);ctx.fill();
      ctx.strokeStyle=s.banner.color;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=s.banner.color;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(s.banner.text,s.W/2,by);
      ctx.restore();
    }
  }

  function getPos(e){const cv=canvasRef.current;const rect=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-rect.left,y:t.clientY-rect.top};}
  function onTouchStart(e){
    e.preventDefault();
    const s = stateRef.current;
    const pos = getPos(e);
    s.slashes.push({...pos, t:Date.now()});
    if (s.bonusActive) { s.bonusTracing = true; s.bonusTrace.push(pos); }
  }
  function onTouchMove(e){
    e.preventDefault();
    const s = stateRef.current;
    const pos = getPos(e);
    s.slashes.push({...pos, t:Date.now()});
    if (s.bonusActive && s.bonusTracing) s.bonusTrace.push(pos);
  }

  function startGame(){
    const s=stateRef.current;
    s.objects=[];s.slashes=[];s.particles=[];s.halves=[];s.floats=[];
    s.score=0;s.lives=3;s.level=1;s.combo=0;s.maxCombo=0;
    s.sliced=0;s.perfectCuts=0;s.bullseyes=0;s.cleanStreak=0;s.maxCleanStreak=0;
    s.flash=0;s.shake=0;s.spawnTimer=0;s.gameTime=0;s.lastUIUpdate=0;
    setScore(0);setLives(3);setLevel(1);setCombo(0);setCleanStreak(0);
    setPhase('playing');s.running=true;s.lastT=performance.now();
    setTimeout(()=>{resizeCanvas();s.raf=requestAnimationFrame(gameLoop);},50);
  }

  function endGame(){
    const s=stateRef.current;
    if(!s.running)return;
    s.running=false;cancelAnimationFrame(s.raf);setPhase('done');
    const verdict=s.level>=15?'⚔️ SAMURAJ MISTR!':s.level>=10?'🥷 Ostrá čepel':s.level>=6?'✨ Dobrý řez':s.level>=3?'👍 Slušné':'🐢 Trénuj řez!';
    setTimeout(()=>onResult(s.score,{
      'Dosažený level':s.level,
      'Bonus kol 🌟':s.bonusCount,
      'Bullseye 🎯':s.bullseyes,
      'Čistých řezů':s.perfectCuts,
      'Max clean streak':'×'+s.maxCleanStreak,
      'Max combo':'×'+s.maxCombo,
      'Rozseknuto':s.sliced,
      'Zbývající životy':'❤️ × '+s.lives,
      'Hodnocení':verdict,
    }),1000);
  }

  function quitToMenu(){const s=stateRef.current;s.running=false;cancelAnimationFrame(s.raf);endGame();}

  useEffect(()=>{
    const s=stateRef.current;
    const hr=()=>resizeCanvas();
    window.addEventListener('resize',hr);window.addEventListener('orientationchange',hr);
    return()=>{s.running=false;cancelAnimationFrame(s.raf);window.removeEventListener('resize',hr);window.removeEventListener('orientationchange',hr);};
  },[]);

  if (phase==='intro'){
    return (
      <div style={{animation:'slideIn .3s ease',textAlign:'center',padding:'10px 0'}}>
        <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:14}}>SLASH MASTER</div>
        <div style={{fontSize:64,marginBottom:16}}>🎯⚔️</div>
        <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:14,padding:18,marginBottom:18,textAlign:'left'}}>
          <div style={{fontSize:12,color:'#44ffaa',fontWeight:700,marginBottom:10,letterSpacing:1}}>🎯 PRAVIDLA</div>
          <div style={{fontSize:12.5,color:'#aabbcc',lineHeight:1.6}}>
            <div style={{marginBottom:6}}>🍎 Předměty <strong style={{color:'#fff'}}>přilétají z různých míst</strong> a rostou</div>
            <div style={{marginBottom:6}}>🎯 Mají <strong style={{color:'#ffd700'}}>10 zón přesnosti</strong> jako terč</div>
            <div style={{marginBottom:6}}>⚔️ Sekni <strong style={{color:'#ffd700'}}>BULLSEYE střed = ×5</strong></div>
            <div style={{marginBottom:6}}>🔥 <strong style={{color:'#ff6644'}}>3× čistý řez za sebou</strong> = streak ×2 (až ×5!)</div>
            <div style={{marginBottom:6}}>⏩ Hra se <strong style={{color:'#88ccff'}}>postupně zrychluje</strong></div>
            <div style={{marginBottom:6}}>➕ Vyšší level = <strong>víc předmětů najednou</strong> (až 5)</div>
            <div style={{marginBottom:6}}>💎 Diamant 1200 · ⭐ Hvězda 500</div>
            <div style={{marginBottom:6}}>💣 <strong style={{color:'#ff4444'}}>Bomba</strong> = –1 ❤️ (3 životy)</div>
            <div style={{marginBottom:6}}>🌟 <strong style={{color:'#ffd700'}}>BONUS kola</strong> = vysekni tvar (Z, X, W…) do ovoce!</div>
          </div>
        </div>
        <button onClick={startGame} style={{width:'100%',padding:'18px',fontSize:18,fontWeight:900,letterSpacing:2,background:'linear-gradient(135deg,#1a8a4a,#22cc66)',color:'#fff',border:'none',borderRadius:14,cursor:'pointer',fontFamily:"'Orbitron',sans-serif",boxShadow:'0 4px 20px rgba(68,255,170,.3)'}}>⚔️ START</button>
        <div style={{fontSize:10,color:'#445566',marginTop:10}}>Hra běží na celé obrazovce</div>
      </div>
    );
  }

  return ReactDOM.createPortal(
    <div style={{position:'fixed',inset:0,zIndex:9999,background:'#080a1e',display:'flex',flexDirection:'column',touchAction:'none',userSelect:'none',overflow:'hidden'}}>
      <canvas ref={canvasRef}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove}
        onMouseDown={onTouchStart} onMouseMove={(e)=>{if(e.buttons)onTouchMove(e);}}
        style={{position:'absolute',inset:0,width:'100%',height:'100%',touchAction:'none',background:'#080a1e'}}
      />
      <div style={{position:'absolute',top:0,left:0,right:0,padding:'env(safe-area-inset-top,14px) 12px 8px',display:'flex',justifyContent:'space-between',alignItems:'flex-start',pointerEvents:'none',gap:8}}>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <div style={{background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 12px'}}>
            <div style={{fontSize:9,color:'#88aaff',letterSpacing:1}}>SKÓRE</div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,fontWeight:900,color:'#ffd700',lineHeight:1}}>{score.toLocaleString()}</div>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>
            <div style={{background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',borderRadius:8,padding:'4px 8px',fontSize:11,color:'#fff'}}>L{level}</div>
            {combo>=2 && <div style={{background:combo>=5?'rgba(255,68,68,.85)':'rgba(255,170,0,.75)',borderRadius:8,padding:'4px 10px',fontSize:13,fontWeight:900,color:'#fff',fontFamily:"'Orbitron',sans-serif",animation:'comboPulse .3s ease'}}>×{combo} {combo>=5?'🔥':'✨'}</div>}
            {cleanStreak>=3 && <div style={{background:'rgba(255,215,0,.85)',borderRadius:8,padding:'4px 10px',fontSize:12,fontWeight:900,color:'#000',fontFamily:"'Orbitron',sans-serif"}}>🎯×{cleanStreak>=12?5:cleanStreak>=9?4:cleanStreak>=6?3:2}</div>}
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end',pointerEvents:'auto'}}>
          <button onClick={quitToMenu} style={{background:'rgba(255,68,68,.3)',border:'1px solid rgba(255,68,68,.5)',color:'#fff',borderRadius:10,padding:'6px 10px',fontSize:11,fontWeight:700,cursor:'pointer',backdropFilter:'blur(8px)'}}>✕ KONEC</button>
          <div style={{background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 10px',display:'flex',gap:3,fontSize:18,lineHeight:1}}>
            {[...Array(3)].map((_,i)=>(<span key={i} style={{opacity:i<lives?1:0.2}}>{i<lives?'❤️':'🖤'}</span>))}
          </div>
        </div>
      </div>
      {phase==='done' && (
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.7)',backdropFilter:'blur(10px)',display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn .5s ease'}}>
          <div style={{textAlign:'center',color:'#fff'}}>
            <div style={{fontSize:48,marginBottom:10}}>💀</div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:32,fontWeight:900,color:'#ff4488',letterSpacing:3}}>GAME OVER</div>
            <div style={{fontSize:14,color:'#88aaff',marginTop:8}}>Vyhodnocuji…</div>
          </div>
        </div>
      )}
    </div>,
    document.body
  );
}

// Projekce - bounding box + aspect-correct
const MAP_LON_MIN = 12.05, MAP_LON_MAX = 18.90;
const MAP_LAT_MIN = 48.50, MAP_LAT_MAX = 51.10;
const MAP_CLAT = (MAP_LAT_MIN + MAP_LAT_MAX) / 2;
const MAP_VIEW_W = 1000;
const MAP_VIEW_H = Math.round(MAP_VIEW_W * ((MAP_LAT_MAX-MAP_LAT_MIN)*111.3) / ((MAP_LON_MAX-MAP_LON_MIN)*111.3*Math.cos(MAP_CLAT*Math.PI/180)));

function lonToX(lon){ return (lon - MAP_LON_MIN) / (MAP_LON_MAX - MAP_LON_MIN) * MAP_VIEW_W; }
function latToY(lat){ return (MAP_LAT_MAX - lat) / (MAP_LAT_MAX - MAP_LAT_MIN) * MAP_VIEW_H; }
function xToLon(x){ return MAP_LON_MIN + (x / MAP_VIEW_W) * (MAP_LON_MAX - MAP_LON_MIN); }
function yToLat(y){ return MAP_LAT_MAX - (y / MAP_VIEW_H) * (MAP_LAT_MAX - MAP_LAT_MIN); }
function geoDistKm(lat1,lon1,lat2,lon2){
  const dLat = (lat1-lat2)*111.3;
  const dLon = (lon1-lon2)*111.3*Math.cos((lat1+lat2)/2*Math.PI/180);
  return Math.sqrt(dLat*dLat + dLon*dLon);
}
