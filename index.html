<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>

<meta name="theme-color" content="#0a0a0f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="IT Quiz"/>
<meta name="description" content="IT Quiz — denní kvízy a minihry"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext y='.9em' font-size='80' x='10'%3E💻%3C/text%3E%3C/svg%3E"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext y='.9em' font-size='80' x='10'%3E💻%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#0d1430 0%,#0a0a0f 60%);
    color:#dde;font-family:'Orbitron',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;overflow-x:hidden;
  }
  .logo{font-size:13px;letter-spacing:6px;color:#4488ff;opacity:.8;margin-bottom:6px}
  h1{font-size:30px;font-weight:900;letter-spacing:2px;margin-bottom:6px;
     background:linear-gradient(135deg,#88aaff,#cc88ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:12px;color:#667;letter-spacing:2px;margin-bottom:38px}
  .tiles{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%;max-width:760px}
  a.tile{
    flex:1 1 300px;min-width:260px;text-decoration:none;color:inherit;
    border-radius:18px;padding:34px 28px;position:relative;overflow:hidden;
    border:1px solid #243056;background:rgba(20,28,60,.45);
    transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
  }
  a.tile:hover{transform:translateY(-4px)}
  a.quiz{box-shadow:0 0 0 rgba(0,0,0,0)}
  a.quiz:hover{border-color:#4488ff;box-shadow:0 12px 40px rgba(68,136,255,.25)}
  a.games:hover{border-color:#aa55cc;box-shadow:0 12px 40px rgba(180,60,200,.25)}
  .emoji{font-size:54px;line-height:1;margin-bottom:18px}
  .tt{font-size:20px;font-weight:900;letter-spacing:1px;margin-bottom:8px}
  a.quiz .tt{color:#88aaff}
  a.games .tt{color:#ff88cc}
  .td{font-size:12.5px;line-height:1.6;color:#8899bb;font-family:system-ui,sans-serif;letter-spacing:.3px}
  .go{margin-top:18px;font-size:12px;letter-spacing:2px;color:#556}
  .foot{margin-top:40px;font-size:10px;letter-spacing:2px;color:#445}
</style>
</head>
<body>
  <div class="logo">IT QUIZ</div>
  <h1>Vyber si</h1>
  <div class="sub">DENNÍ KVÍZY · MINIHRY</div>

  <div class="tiles">
    <a class="tile quiz" href="kvizy.html">
      <div class="emoji">🧠</div>
      <div class="tt">DENNÍ KVÍZY</div>
      <div class="td">Otestuj své znalosti každý den. IT a obecný kvíz, žebříček, statistiky a denní výzva.</div>
      <div class="go">VSTOUPIT →</div>
    </a>

    <a class="tile games" href="minihry.html">
      <div class="emoji">🎮</div>
      <div class="tt">MINIHRY</div>
      <div class="td">Zastav čas, terče, rovnováha, tower builder, katana master, slepá mapa ČR a kvízová aréna.</div>
      <div class="go">HRÁT →</div>
    </a>
  </div>

  <div class="foot">© IT QUIZ</div>
</body>
</html>
