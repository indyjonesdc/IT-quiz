// Statistiky přesnosti hráče (localStorage)
function loadMapStats() {
  try {
    const raw = localStorage.getItem('indyq_mapstats');
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return s; }
  } catch(e) {}
  return { v:1, games:0, rounds:0, sumKm:0, bestKm:null, close25:0, perfect5:0, totalPts:0, byType:{}, recent:[] };
}
function saveMapStats(s) {
  try { localStorage.setItem('indyq_mapstats', JSON.stringify(s)); } catch(e) {}
}
function recordMapGuess(place, km, pts) {
  const s = loadMapStats();
  s.rounds++;
  s.sumKm += km;
  s.totalPts += pts;
  if (s.bestKm === null || km < s.bestKm) s.bestKm = km;
  if (km < 25) s.close25++;
  if (km < 5) s.perfect5++;
  const t = place.t || 'jiné';
  if (!s.byType[t]) s.byType[t] = { n:0, sumKm:0 };
  s.byType[t].n++;
  s.byType[t].sumKm += km;
  s.recent.unshift({ n:place.n, t, km:Math.round(km), pts, d:Date.now() });
  s.recent = s.recent.slice(0, 25);
  saveMapStats(s);
  return s;
}
function recordMapGameDone() {
  const s = loadMapStats();
  s.games++;
  saveMapStats(s);
}
function mapRank(avgKm) {
  if (avgKm == null) return { icon:'🗺️', name:'Nováček', color:'#88aaff' };
  if (avgKm < 12)  return { icon:'🏆', name:'Geografický mistr', color:'#ffd700' };
  if (avgKm < 25)  return { icon:'🥇', name:'Znalec ČR', color:'#ffcc44' };
  if (avgKm < 45)  return { icon:'🥈', name:'Dobrý turista', color:'#cccccc' };
  if (avgKm < 75)  return { icon:'🥉', name:'Občasný cestovatel', color:'#cd7f32' };
  return { icon:'🧭', name:'Začátečník', color:'#88aaff' };
}
const TYPE_ICON = { 'město':'🏙️', 'hora':'⛰️', 'hrad':'⚔️', 'zámek':'🏰', 'přehrada':'🌊', 'jezero':'🏞️', 'příroda':'🌲', 'vesnice':'🏡', 'řeka':'💧', 'jiné':'📍' };

// Cloud synchronizace statistik (Supabase tabulka map_stats)
// ═══ SQL pro vytvoření tabulky (spusť jednou v Supabase SQL editoru): ═══
// CREATE TABLE IF NOT EXISTS map_stats (
//   user_name TEXT PRIMARY KEY,
//   rounds INT DEFAULT 0, sum_km FLOAT DEFAULT 0, best_km FLOAT,
//   close25 INT DEFAULT 0, perfect5 INT DEFAULT 0,
//   total_pts BIGINT DEFAULT 0, games INT DEFAULT 0,
//   by_type JSONB DEFAULT '{}', updated_at TIMESTAMPTZ DEFAULT now()
// );
// ALTER TABLE map_stats ENABLE ROW LEVEL SECURITY;
// CREATE POLICY "map_stats read"  ON map_stats FOR SELECT USING (true);
// CREATE POLICY "map_stats write" ON map_stats FOR ALL USING (true) WITH CHECK (true);
// ═══════════════════════════════════════════════════════
async function syncMapStatsToCloud(userName) {
  if (!userName) return false;
  const s = loadMapStats();
  try {
    const { error } = await db.from('map_stats').upsert({
      user_name: userName,
      rounds: s.rounds, sum_km: s.sumKm, best_km: s.bestKm,
      close25: s.close25, perfect5: s.perfect5,
      total_pts: s.totalPts, games: s.games,
      by_type: s.byType, updated_at: new Date().toISOString(),
    }, { onConflict: 'user_name' });
    return !error;
  } catch(e) { return false; }
}
async function loadGlobalMapStats() {
  try {
    const { data, error } = await db.from('map_stats').select('*');
    if (error || !data) return null;
    return data;
  } catch(e) { return null; }
}




// ─── MAPA ČR - online multiplayer (Supabase Realtime) ──
function MapBattleGame({ user, onExit }) {
  const [view, setView] = useState('menu');   // menu | lobby | playing | reveal | final
  const [roomCode, setRoomCode] = useState('');
  const [joinCode, setJoinCode] = useState('');
  const [isHost, setIsHost] = useState(false);
  const [players, setPlayers] = useState({});  // id -> {name, score, ready}
  const [myId] = useState(() => 'p_' + Math.random().toString(36).slice(2, 9));
  const myName = user?.name || 'Hráč';
  const [error, setError] = useState('');
  const [connecting, setConnecting] = useState(false);

  const [round, setRound] = useState(0);
  const [totalRounds] = useState(5);
  const [place, setPlace] = useState(null);     // aktuální místo
  const [myGuess, setMyGuess] = useState(null);  // {x,y}
  const [locked, setLocked] = useState(false);
  const [results, setResults] = useState([]);    // reveal výsledky
  const [roundDeadline, setRoundDeadline] = useState(0);
  const [now, setNow] = useState(Date.now());
  const [statsTab, setStatsTab] = useState('me');     // me | global
  const [globalStats, setGlobalStats] = useState(null);
  const [loadingGlobal, setLoadingGlobal] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [viewX, setViewX] = useState(0);
  const [viewY, setViewY] = useState(0);
  const panRef = useRef({ active:false, moved:false, startX:0, startY:0, startVX:0, startVY:0 });

  const canvasRef = useRef(null);
  const chanRef = useRef(null);
  const placesRef = useRef([]);     // host: vybraná místa pro kola
  const guessesRef = useRef({});    // host: tipy pro aktuální kolo
  const scoresRef = useRef({});     // host: kumulativní skóre
  const revealTimerRef = useRef(null); // host: timeout pro deadline
  const revealedRef = useRef(false);   // host: guard proti dvojímu reveal
  const curRoundRef = useRef(0);       // host: aktuální kolo
  const usedPlacesRef = useRef([]);    // host: použitá místa (neopakovat)

  // Tick pro časovač
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 200);
    return () => clearInterval(id);
  }, []);

  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  }

  function setupChannel(code, asHost) {
    const channel = db.channel('mapbattle-' + code, {
      config: { presence: { key: myId }, broadcast: { self: true } },
    });

    // Presence - kdo je v roomu
    channel.on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      const pl = {};
      Object.keys(state).forEach(k => {
        const meta = state[k][0];
        pl[k] = { name: meta.name, score: scoresRef.current[k] || 0 };
      });
      setPlayers(pl);
    });

    // Broadcast eventy
    channel.on('broadcast', { event: 'restart_lobby' }, () => {
      scoresRef.current = {};
      setResults([]);
      setRound(0);
      setView('lobby');
    });

    channel.on('broadcast', { event: 'round_start' }, ({ payload }) => {
      setPlace(payload.place);
      setRound(payload.round);
      setMyGuess(null);
      setLocked(false);
      setResults([]);
      setRoundDeadline(payload.deadline);
      setZoom(1); setViewX(0); setViewY(0);
      setView('playing');
    });

    channel.on('broadcast', { event: 'reveal' }, ({ payload }) => {
      setResults(payload.results);
      // Zaznamenej můj výsledek do statistik
      const mine = payload.results.find(r => r.id === myId);
      if (mine && mine.km != null && payload.place) {
        recordMapGuess(payload.place, mine.km, mine.pts);
      }
      // Aktualizuj lokální skóre z payloadu
      const sc = {};
      payload.results.forEach(r => { sc[r.id] = r.totalScore; });
      scoresRef.current = sc;
      setPlayers(prev => {
        const np = { ...prev };
        payload.results.forEach(r => { if (np[r.id]) np[r.id] = { ...np[r.id], score: r.totalScore }; });
        return np;
      });
      setView('reveal');
    });

    channel.on('broadcast', { event: 'game_over' }, ({ payload }) => {
      recordMapGameDone();
      syncMapStatsToCloud(myName);  // sdílení statistik online
      // Ulož moje finální skóre do žebříčku
      const mine = payload.standings.find(s => s.id === myId);
      if (mine && user) {
        try {
          db.from('minigame_scores').insert({
            user_id: user.id, user_name: myName,
            date: new Date().toISOString().slice(0,10),
            score: mine.totalScore, game: 'mapbattle',
          }).then(()=>{});
        } catch(e) {}
      }
      setResults(payload.standings);
      setView('final');
    });

    // Host sbírá tipy - vyhodnotí hned jak mají všichni
    if (asHost) {
      channel.on('broadcast', { event: 'guess' }, ({ payload }) => {
        guessesRef.current[payload.id] = payload;
        const playerCount = Object.keys(channel.presenceState()).length;
        const guessCount = Object.keys(guessesRef.current).length;
        if (guessCount >= playerCount && !revealedRef.current) {
          hostReveal(curRoundRef.current);
        }
      });
    }

    channel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await channel.track({ name: myName });
        setConnecting(false);
      }
    });

    chanRef.current = channel;
    return channel;
  }

  function hostCreate() {
    const code = genCode();
    setRoomCode(code);
    setIsHost(true);
    setConnecting(true);
    scoresRef.current = {};
    setupChannel(code, true);
    setView('lobby');
  }

  function joinRoom() {
    const code = joinCode.trim().toUpperCase();
    if (code.length !== 4) { setError('Kód má 4 znaky'); return; }
    setRoomCode(code);
    setIsHost(false);
    setConnecting(true);
    setError('');
    setupChannel(code, false);
    setView('lobby');
  }

  function hostStartGame() {
    // Vyber místa která ještě nebyla použita
    let pool = CR_PLACES.filter(p => !usedPlacesRef.current.includes(p.n));
    if (pool.length < totalRounds) {
      // Došla nepoužitá místa - reset historie
      usedPlacesRef.current = [];
      pool = [...CR_PLACES];
    }
    const shuffled = pool.sort(() => Math.random() - 0.5);
    placesRef.current = shuffled.slice(0, totalRounds);
    usedPlacesRef.current.push(...placesRef.current.map(p => p.n));
    // Init skóre
    const sc = {};
    Object.keys(players).forEach(id => sc[id] = 0);
    scoresRef.current = sc;
    hostStartRound(0);
  }

  function hostStartRound(r) {
    guessesRef.current = {};
    revealedRef.current = false;
    curRoundRef.current = r;
    const place = placesRef.current[r];
    const deadline = Date.now() + 60000; // 60s limit
    chanRef.current.send({ type:'broadcast', event:'round_start', payload:{ round:r, place:{n:place.n,t:place.t,lat:place.lat,lon:place.lon}, deadline } });
    // Fallback: vyhodnoť po vypršení času (pokud někdo nepotvrdí)
    if (revealTimerRef.current) clearTimeout(revealTimerRef.current);
    revealTimerRef.current = setTimeout(() => hostReveal(r), 60500);
  }

  function hostReveal(r) {
    if (revealedRef.current) return;
    revealedRef.current = true;
    if (revealTimerRef.current) { clearTimeout(revealTimerRef.current); revealTimerRef.current = null; }
    const place = placesRef.current[r];
    const results = [];
    const pstate = chanRef.current.presenceState();
    Object.keys(pstate).forEach(id => {
      const name = pstate[id][0].name;
      const g = guessesRef.current[id];
      let km = null, pts = 0, basePts = 0, timeBonus = 0;
      if (g) {
        km = geoDistKm(place.lat, place.lon, g.lat, g.lon);
        basePts = distToPoints(km);
        // Časový bonus za ušetřený čas - jen když je tip přesný
        const secSaved = (g.remainingMs || 0) / 1000;
        const accFactor = Math.max(0, Math.min(1, (100 - km) / 75)); // <25km=plný, 100km=0
        timeBonus = Math.round(secSaved * 5 * accFactor);
        pts = basePts + timeBonus;
      }
      scoresRef.current[id] = (scoresRef.current[id] || 0) + pts;
      results.push({ id, name, km, pts, basePts, timeBonus, guess: g ? {lat:g.lat, lon:g.lon} : null, totalScore: scoresRef.current[id] });
    });
    results.sort((a,b) => (a.km ?? 9999) - (b.km ?? 9999));
    chanRef.current.send({ type:'broadcast', event:'reveal', payload:{ results, place:{lat:place.lat, lon:place.lon, n:place.n, t:place.t} } });

    // Po 6s další kolo nebo konec
    setTimeout(() => {
      if (r + 1 < totalRounds) hostStartRound(r + 1);
      else {
        const standings = Object.keys(scoresRef.current).map(id => ({
          id, name: (pstate[id] && pstate[id][0].name) || '?', totalScore: scoresRef.current[id],
        })).sort((a,b) => b.totalScore - a.totalScore);
        chanRef.current.send({ type:'broadcast', event:'game_over', payload:{ standings } });
      }
    }, 6000);
  }

  function curViewW() { return MAP_VIEW_W / zoom; }
  function curViewH() { return MAP_VIEW_H / zoom; }

  function clampView(vx, vy, z) {
    const vw = MAP_VIEW_W / z, vh = MAP_VIEW_H / z;
    return {
      x: Math.max(0, Math.min(MAP_VIEW_W - vw, vx)),
      y: Math.max(0, Math.min(MAP_VIEW_H - vh, vy)),
    };
  }

  function doZoom(factor, cx, cy) {
    // cx,cy = bod ve SVG souřadnicích kolem kterého zoomovat (default střed viewportu)
    const newZoom = Math.max(1, Math.min(6, zoom * factor));
    if (newZoom === zoom) return;
    const vw = MAP_VIEW_W / zoom, vh = MAP_VIEW_H / zoom;
    const centerX = cx != null ? cx : viewX + vw / 2;
    const centerY = cy != null ? cy : viewY + vh / 2;
    const nvw = MAP_VIEW_W / newZoom, nvh = MAP_VIEW_H / newZoom;
    let nvx = centerX - nvw / 2;
    let nvy = centerY - nvh / 2;
    const cl = clampView(nvx, nvy, newZoom);
    setZoom(newZoom); setViewX(cl.x); setViewY(cl.y);
  }

  function svgPointFromEvent(e) {
    const svg = canvasRef.current;
    const rect = svg.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    const relY = (e.clientY - rect.top) / rect.height;
    return { x: viewX + relX * (MAP_VIEW_W / zoom), y: viewY + relY * (MAP_VIEW_H / zoom) };
  }

  // Touch: 1 prst = pan/tap, 2 prsty = pinch zoom
  function getTouchSvgPoint(touch) {
    const svg = canvasRef.current;
    const rect = svg.getBoundingClientRect();
    const relX = (touch.clientX - rect.left) / rect.width;
    const relY = (touch.clientY - rect.top) / rect.height;
    return { x: viewX + relX * (MAP_VIEW_W / zoom), y: viewY + relY * (MAP_VIEW_H / zoom) };
  }

  function onMapTouchStart(e) {
    if (view !== 'playing') return;
    const p = panRef.current;
    if (e.touches.length === 2) {
      // Pinch start
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      p.pinchStartDist = Math.hypot(dx, dy);
      p.pinchStartZoom = zoom;
      // Střed pinche ve SVG souř.
      const svg = canvasRef.current;
      const rect = svg.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      p.pinchCx = viewX + ((mx - rect.left) / rect.width) * (MAP_VIEW_W / zoom);
      p.pinchCy = viewY + ((my - rect.top) / rect.height) * (MAP_VIEW_H / zoom);
      p.pinching = true;
      p.moved = true;
    } else if (e.touches.length === 1) {
      p.active = true; p.moved = false; p.pinching = false;
      p.startX = e.touches[0].clientX; p.startY = e.touches[0].clientY;
      p.startVX = viewX; p.startVY = viewY;
    }
  }

  function onMapTouchMove(e) {
    if (view !== 'playing') return;
    e.preventDefault();
    const p = panRef.current;
    if (e.touches.length === 2 && p.pinching) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const ratio = dist / (p.pinchStartDist || dist);
      const newZoom = Math.max(1, Math.min(6, p.pinchStartZoom * ratio));
      const nvw = MAP_VIEW_W / newZoom, nvh = MAP_VIEW_H / newZoom;
      let nvx = p.pinchCx - nvw / 2;
      let nvy = p.pinchCy - nvh / 2;
      const cl = clampView(nvx, nvy, newZoom);
      setZoom(newZoom); setViewX(cl.x); setViewY(cl.y);
    } else if (e.touches.length === 1 && p.active && zoom > 1) {
      const dx = e.touches[0].clientX - p.startX, dy = e.touches[0].clientY - p.startY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) p.moved = true;
      const svg = canvasRef.current;
      const rect = svg.getBoundingClientRect();
      const scaleX = (MAP_VIEW_W / zoom) / rect.width;
      const scaleY = (MAP_VIEW_H / zoom) / rect.height;
      const cl = clampView(p.startVX - dx * scaleX, p.startVY - dy * scaleY, zoom);
      setViewX(cl.x); setViewY(cl.y);
    }
  }

  function onMapTouchEnd(e) {
    if (view !== 'playing') return;
    const p = panRef.current;
    if (p.pinching && e.touches.length < 2) { p.pinching = false; p.active = false; return; }
    if (p.active && e.touches.length === 0) {
      p.active = false;
      if (!p.moved && !locked) {
        const t = e.changedTouches[0];
        const pt = getTouchSvgPoint(t);
        setMyGuess({ x: pt.x, y: pt.y });
      }
    }
  }

  // Mouse (desktop) - klik umístí, kolečko zoom
  function onMapMouseDown(e) {
    if (view !== 'playing' || locked) return;
    const p = panRef.current;
    p.active = true; p.moved = false;
    p.startX = e.clientX; p.startY = e.clientY;
    p.startVX = viewX; p.startVY = viewY;
  }
  function onMapMouseMove(e) {
    const p = panRef.current;
    if (!p.active || zoom <= 1) return;
    const dx = e.clientX - p.startX, dy = e.clientY - p.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) p.moved = true;
    const svg = canvasRef.current;
    const rect = svg.getBoundingClientRect();
    const scaleX = (MAP_VIEW_W / zoom) / rect.width;
    const scaleY = (MAP_VIEW_H / zoom) / rect.height;
    const cl = clampView(p.startVX - dx * scaleX, p.startVY - dy * scaleY, zoom);
    setViewX(cl.x); setViewY(cl.y);
  }
  function onMapMouseUp(e) {
    const p = panRef.current;
    if (!p.active) return;
    p.active = false;
    if (!p.moved && !locked) {
      const pt = svgPointFromEvent(e);
      setMyGuess({ x: pt.x, y: pt.y });
    }
  }
  function onMapWheel(e) {
    if (view !== 'playing') return;
    e.preventDefault();
    const pt = svgPointFromEvent(e);
    doZoom(e.deltaY < 0 ? 1.2 : 1/1.2, pt.x, pt.y);
  }

  function lockGuess() {
    if (!myGuess) return;
    setLocked(true);
    const lon = xToLon(myGuess.x);
    const lat = yToLat(myGuess.y);
    const remainingMs = Math.max(0, roundDeadline - Date.now());
    chanRef.current.send({ type:'broadcast', event:'guess', payload:{ id:myId, name:myName, lat, lon, remainingMs } });
  }

  function leaveRoom() {
    if (chanRef.current) { db.removeChannel(chanRef.current); chanRef.current = null; }
    onExit();
  }

  useEffect(() => () => { if (chanRef.current) db.removeChannel(chanRef.current); }, []);

  const playerList = Object.entries(players);
  const timeLeft = Math.max(0, Math.ceil((roundDeadline - now) / 1000));

  // ── MENU ──
  if (view === 'menu') {
    return (
      <div style={{animation:'slideIn .3s ease',maxWidth:420,margin:'0 auto'}}>
        <div style={{textAlign:'center',marginBottom:18}}>
          <div style={{fontSize:54,marginBottom:8}}>🗺️</div>
          <div style={{fontSize:20,fontWeight:900,color:'#fff',fontFamily:"'Orbitron',sans-serif"}}>SLEPÁ MAPA ČR</div>
          <div style={{fontSize:12,color:'#88aaff',marginTop:4}}>Online multiplayer · 2-6 hráčů</div>
          <div style={{fontSize:10,color:'#667',marginTop:4}}>⚡ Rychlý + přesný tip = bonus za ušetřený čas</div>
        </div>
        <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:'12px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22}}>👤</span>
          <div style={{textAlign:'left'}}>
            <div style={{fontSize:10,color:'#88aaff',letterSpacing:1}}>HRAJEŠ JAKO</div>
            <div style={{fontSize:16,fontWeight:700,color:'#fff'}}>{myName}</div>
          </div>
        </div>
        <button onClick={hostCreate} style={{width:'100%',padding:16,fontSize:16,fontWeight:900,letterSpacing:1,background:'linear-gradient(135deg,#1a8a4a,#22cc66)',color:'#fff',border:'none',borderRadius:12,cursor:'pointer',marginBottom:10,fontFamily:"'Orbitron',sans-serif"}}>🎮 VYTVOŘIT HRU</button>
        <div style={{display:'flex',gap:8,alignItems:'stretch'}}>
          <input value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase())} placeholder="KÓD" maxLength={4}
            style={{flex:1,padding:'12px',borderRadius:10,border:'1px solid #2a3a5a',background:'#0a1228',color:'#fff',fontSize:18,textAlign:'center',letterSpacing:4,fontFamily:"'Orbitron',sans-serif",boxSizing:'border-box'}}/>
          <button onClick={joinRoom} style={{padding:'12px 20px',fontSize:14,fontWeight:900,background:'linear-gradient(135deg,#1a3a8a,#2255cc)',color:'#fff',border:'none',borderRadius:10,cursor:'pointer'}}>PŘIPOJIT</button>
        </div>
        {error && <div style={{color:'#ff6644',fontSize:12,marginTop:10,textAlign:'center'}}>{error}</div>}
        <button onClick={()=>setView('stats')} style={{width:'100%',marginTop:12,padding:12,background:'rgba(68,221,255,.1)',border:'1px solid rgba(68,221,255,.3)',color:'#44ddff',borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:700}}>📊 Moje statistiky</button>
        <button onClick={onExit} style={{width:'100%',marginTop:10,padding:10,background:'transparent',border:'1px solid #2a3a5a',color:'#778',borderRadius:8,cursor:'pointer',fontSize:13}}>← Zpět</button>
      </div>
    );
  }

  // ── STATISTIKY ──
  if (view === 'stats') {
    const st = loadMapStats();
    const avg = st.rounds > 0 ? st.sumKm / st.rounds : null;
    const rank = mapRank(avg);
    const closePct = st.rounds > 0 ? Math.round(st.close25 / st.rounds * 100) : 0;
    const typeRows = Object.entries(st.byType)
      .map(([t, d]) => ({ t, avg: d.sumKm / d.n, n: d.n }))
      .sort((a, b) => a.avg - b.avg);
    const worstType = typeRows.length ? typeRows[typeRows.length - 1] : null;
    const bestType = typeRows.length ? typeRows[0] : null;

    function openGlobal() {
      setStatsTab('global');
      setLoadingGlobal(true);
      loadGlobalMapStats().then(data => {
        setGlobalStats(data);
        setLoadingGlobal(false);
      });
    }

    // Připrav globální žebříček
    let globalRows = null;
    if (globalStats) {
      globalRows = globalStats
        .filter(r => r.rounds >= 3)
        .map(r => ({
          name: r.user_name,
          rounds: r.rounds,
          games: r.games,
          avg: r.sum_km / r.rounds,
          best: r.best_km,
          closePct: Math.round((r.close25 / r.rounds) * 100),
          perfect5: r.perfect5,
        }))
        .sort((a, b) => a.avg - b.avg);
    }

    return (
      <div style={{animation:'slideIn .3s ease',maxWidth:460,margin:'0 auto'}}>
        <div style={{textAlign:'center',marginBottom:14}}>
          <div style={{fontSize:40,marginBottom:4}}>📊</div>
          <div style={{fontSize:18,fontWeight:900,color:'#fff',fontFamily:"'Orbitron',sans-serif"}}>STATISTIKY</div>
        </div>

        {/* Tab switcher */}
        <div style={{display:'flex',gap:6,marginBottom:14,background:'rgba(12,18,52,.6)',borderRadius:10,padding:4}}>
          <button onClick={()=>setStatsTab('me')} style={{flex:1,padding:'9px',borderRadius:8,border:'none',cursor:'pointer',fontSize:13,fontWeight:700,background:statsTab==='me'?'linear-gradient(135deg,#1a3a8a,#2255cc)':'transparent',color:statsTab==='me'?'#fff':'#778'}}>👤 Já</button>
          <button onClick={()=>{ if(statsTab!=='global') openGlobal(); else setStatsTab('global'); }} style={{flex:1,padding:'9px',borderRadius:8,border:'none',cursor:'pointer',fontSize:13,fontWeight:700,background:statsTab==='global'?'linear-gradient(135deg,#1a8a4a,#22cc66)':'transparent',color:statsTab==='global'?'#fff':'#778'}}>🌍 Žebříček</button>
        </div>

        {/* ── TAB: JÁ ── */}
        {statsTab === 'me' && (st.rounds === 0 ? (
          <div style={{textAlign:'center',padding:30,color:'#667',fontSize:14}}>
            Zatím žádná data.<br/>Zahraj si pár kol a vrať se! 🗺️
          </div>
        ) : (
          <>
            <div style={{textAlign:'center',background:`linear-gradient(135deg,${rank.color}22,${rank.color}11)`,border:`1px solid ${rank.color}55`,borderRadius:14,padding:16,marginBottom:12}}>
              <div style={{fontSize:40}}>{rank.icon}</div>
              <div style={{fontSize:18,fontWeight:900,color:rank.color,fontFamily:"'Orbitron',sans-serif"}}>{rank.name}</div>
              <div style={{fontSize:12,color:'#88aaff',marginTop:4}}>průměrná odchylka <strong>{Math.round(avg)} km</strong></div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
              <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
                <div style={{fontSize:9,color:'#88aaff',letterSpacing:1}}>ODEHRÁNO KOL</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:22,fontWeight:900,color:'#fff'}}>{st.rounds}</div>
                <div style={{fontSize:9,color:'#556'}}>{st.games} her</div>
              </div>
              <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
                <div style={{fontSize:9,color:'#88aaff',letterSpacing:1}}>NEJLEPŠÍ TIP</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:22,fontWeight:900,color:'#44ffaa'}}>{st.bestKm!=null?Math.round(st.bestKm):'—'}</div>
                <div style={{fontSize:9,color:'#556'}}>km od cíle</div>
              </div>
              <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
                <div style={{fontSize:9,color:'#88aaff',letterSpacing:1}}>PŘESNÉ (&lt;25km)</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:22,fontWeight:900,color:'#ffd700'}}>{closePct}%</div>
                <div style={{fontSize:9,color:'#556'}}>{st.close25}/{st.rounds}</div>
              </div>
              <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
                <div style={{fontSize:9,color:'#88aaff',letterSpacing:1}}>TREFY (&lt;5km)</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:22,fontWeight:900,color:'#ff88ff'}}>{st.perfect5}</div>
                <div style={{fontSize:9,color:'#556'}}>🎯 zásahů</div>
              </div>
            </div>
            <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:14,marginBottom:12}}>
              <div style={{fontSize:11,color:'#88aaff',letterSpacing:1,marginBottom:10}}>PŘESNOST PODLE TYPU</div>
              {typeRows.map(r => {
                const pct = Math.max(5, 100 - Math.min(100, r.avg / 120 * 100));
                const col = r.avg < 25 ? '#44ffaa' : r.avg < 50 ? '#ffd700' : '#ff8866';
                return (
                  <div key={r.t} style={{marginBottom:8}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:3}}>
                      <span style={{color:'#ccd'}}>{TYPE_ICON[r.t]||'📍'} {r.t} <span style={{color:'#556',fontSize:9}}>({r.n}×)</span></span>
                      <span style={{color:col,fontWeight:700}}>⌀ {Math.round(r.avg)} km</span>
                    </div>
                    <div style={{height:5,background:'rgba(20,30,70,.8)',borderRadius:3,overflow:'hidden'}}>
                      <div style={{height:'100%',width:pct+'%',background:col,borderRadius:3}}/>
                    </div>
                  </div>
                );
              })}
              {bestType && worstType && bestType.t !== worstType.t && (
                <div style={{fontSize:11,color:'#778',marginTop:8,lineHeight:1.5}}>
                  💪 Nejlepší: <strong style={{color:'#44ffaa'}}>{TYPE_ICON[bestType.t]} {bestType.t}</strong> · 
                  😅 Zabrat dá: <strong style={{color:'#ff8866'}}>{TYPE_ICON[worstType.t]} {worstType.t}</strong>
                </div>
              )}
            </div>
            {st.recent.length > 0 && (
              <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:14,marginBottom:12}}>
                <div style={{fontSize:11,color:'#88aaff',letterSpacing:1,marginBottom:8}}>POSLEDNÍ TIPY</div>
                {st.recent.slice(0,8).map((r,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',borderBottom:i<7?'1px solid rgba(255,255,255,.04)':'none'}}>
                    <span style={{fontSize:13}}>{TYPE_ICON[r.t]||'📍'}</span>
                    <span style={{flex:1,fontSize:12,color:'#ccd'}}>{r.n}</span>
                    <span style={{fontSize:11,fontWeight:700,color:r.km<25?'#44ffaa':r.km<60?'#ffd700':'#ff8866'}}>{r.km} km</span>
                    <span style={{fontSize:11,color:'#ffd700',width:50,textAlign:'right'}}>+{r.pts}</span>
                  </div>
                ))}
              </div>
            )}
            <button onClick={()=>{ if(confirm('Opravdu smazat všechny statistiky?')){ try{localStorage.removeItem('indyq_mapstats');}catch(e){} setView('menu'); } }}
              style={{width:'100%',padding:9,background:'transparent',border:'1px solid rgba(255,68,68,.3)',color:'#ff6644',borderRadius:8,cursor:'pointer',fontSize:11,marginBottom:8}}>🗑 Vymazat moje statistiky</button>
          </>
        ))}

        {/* ── TAB: GLOBÁLNÍ ŽEBŘÍČEK ── */}
        {statsTab === 'global' && (
          loadingGlobal ? (
            <div style={{textAlign:'center',padding:30,color:'#88aaff',fontSize:14}}>⏳ Načítám žebříček…</div>
          ) : globalStats === null ? (
            <div style={{textAlign:'center',padding:24,color:'#ff8866',fontSize:13,lineHeight:1.6}}>
              ⚠️ Žebříček nedostupný.<br/>
              <span style={{fontSize:11,color:'#778'}}>Pro sdílené statistiky je potřeba vytvořit tabulku <code style={{color:'#ffd700'}}>map_stats</code> v Supabase (SQL je v kódu).</span>
            </div>
          ) : globalRows && globalRows.length === 0 ? (
            <div style={{textAlign:'center',padding:30,color:'#667',fontSize:14}}>Zatím nikdo nezahrál 3+ kola.<br/>Buď první! 🏆</div>
          ) : (
            <>
              <div style={{fontSize:11,color:'#88aaff',letterSpacing:1,marginBottom:10,textAlign:'center'}}>SEŘAZENO PODLE PŘESNOSTI (min. 3 kola)</div>
              {globalRows.map((r,i) => {
                const rk = mapRank(r.avg);
                const isMe = r.name === myName;
                const medal = ['🥇','🥈','🥉'][i] || `${i+1}.`;
                return (
                  <div key={r.name} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:isMe?'rgba(68,255,170,.12)':i===0?'rgba(255,215,0,.1)':'rgba(12,18,52,.8)',border:`1px solid ${isMe?'rgba(68,255,170,.4)':i===0?'rgba(255,215,0,.3)':'#1e2a4a'}`,borderRadius:10,marginBottom:6}}>
                    <span style={{fontSize:18,width:28,textAlign:'center'}}>{medal}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,color:'#fff',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.name}{isMe?' (ty)':''}</div>
                      <div style={{fontSize:10,color:rk.color}}>{rk.icon} {rk.name}</div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:'#44ffaa'}}>⌀{Math.round(r.avg)}km</div>
                      <div style={{fontSize:9,color:'#778'}}>{r.rounds} kol · {r.closePct}% přesných</div>
                    </div>
                  </div>
                );
              })}
              <div style={{fontSize:10,color:'#556',textAlign:'center',marginTop:8}}>Čím menší průměrná odchylka, tím lepší geograf 🧭</div>
            </>
          )
        )}

        <button onClick={()=>setView('menu')} style={{width:'100%',marginTop:10,padding:12,background:'linear-gradient(135deg,#1a3a8a,#2255cc)',color:'#fff',border:'none',borderRadius:10,cursor:'pointer',fontSize:14,fontWeight:700}}>← Zpět</button>
      </div>
    );
  }

  // ── LOBBY ──
  if (view === 'lobby') {
    return (
      <div style={{animation:'slideIn .3s ease',maxWidth:420,margin:'0 auto',textAlign:'center'}}>
        <div style={{fontSize:11,color:'#88aaff',letterSpacing:2,marginBottom:6}}>KÓD MÍSTNOSTI</div>
        <div style={{fontSize:44,fontWeight:900,color:'#ffd700',fontFamily:"'Orbitron',sans-serif",letterSpacing:8,marginBottom:6}}>{roomCode}</div>
        <div style={{fontSize:12,color:'#778',marginBottom:18}}>{connecting ? 'Připojuji…' : 'Sdílej kód s ostatními'}</div>
        <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
          <div style={{fontSize:11,color:'#88aaff',letterSpacing:1,marginBottom:10}}>HRÁČI ({playerList.length})</div>
          {playerList.map(([id,p])=>(
            <div key={id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',background:'rgba(68,170,255,.08)',borderRadius:8,marginBottom:6}}>
              <span style={{fontSize:16}}>{id===myId?'⭐':'👤'}</span>
              <span style={{color:'#fff',fontWeight:600,fontSize:14}}>{p.name}{id===myId?' (ty)':''}</span>
              {id===Object.keys(players)[0] && <span style={{marginLeft:'auto',fontSize:10,color:'#ffd700'}}>HOST</span>}
            </div>
          ))}
          {playerList.length === 0 && <div style={{color:'#556',fontSize:13}}>Čekám na hráče…</div>}
        </div>
        {isHost ? (
          <button onClick={hostStartGame} disabled={playerList.length < 2}
            style={{width:'100%',padding:16,fontSize:16,fontWeight:900,letterSpacing:1,background:playerList.length<2?'#2a3a5a':'linear-gradient(135deg,#1a8a4a,#22cc66)',color:'#fff',border:'none',borderRadius:12,cursor:playerList.length<2?'default':'pointer',fontFamily:"'Orbitron',sans-serif"}}>
            {playerList.length < 2 ? 'Čekej na 2+ hráče' : '🚀 SPUSTIT HRU'}
          </button>
        ) : (
          <div style={{color:'#88aaff',fontSize:14,padding:14}}>⏳ Čekání na hosta…</div>
        )}
        <button onClick={leaveRoom} style={{width:'100%',marginTop:12,padding:10,background:'transparent',border:'1px solid #2a3a5a',color:'#778',borderRadius:8,cursor:'pointer',fontSize:13}}>← Opustit</button>
      </div>
    );
  }

  // ── PLAYING / REVEAL - mapa ──
  if (view === 'playing' || view === 'reveal') {
    const showReveal = view === 'reveal';
    const correctPt = showReveal && place ? { x: lonToX(place.lon), y: latToY(place.lat) } : null;
    return (
      <div style={{animation:'slideIn .3s ease',maxWidth:600,margin:'0 auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{fontSize:12,color:'#88aaff'}}>Kolo {round+1}/{totalRounds}</div>
          {!showReveal && <div style={{fontSize:18,fontWeight:900,color:timeLeft<=5?'#ff4444':'#ffd700',fontFamily:"'Orbitron',sans-serif"}}>⏱ {timeLeft}s</div>}
        </div>

        <div style={{textAlign:'center',marginBottom:10,padding:'10px',background:'rgba(255,215,0,.1)',border:'1px solid rgba(255,215,0,.3)',borderRadius:10}}>
          <div style={{fontSize:10,color:'#ffaa44',letterSpacing:1}}>{showReveal?'SPRÁVNĚ:':`NAJDI (${place?.t}):`}</div>
          <div style={{fontSize:22,fontWeight:900,color:'#fff'}}>{place?.n}</div>
        </div>

        {!showReveal && zoom > 1.05 && (
          <div style={{display:'flex',justifyContent:'center',marginBottom:6}}>
            <button onPointerDown={(e)=>{e.preventDefault();setZoom(1);setViewX(0);setViewY(0);}} style={{padding:'6px 14px',borderRadius:8,border:'1px solid #2a3a5a',background:'rgba(12,18,52,.9)',color:'#88aaff',fontSize:11,cursor:'pointer',touchAction:'manipulation'}}>⟲ Oddálit ({Math.round(zoom*100)}%)</button>
          </div>
        )}
        <svg ref={!showReveal ? canvasRef : null}
          viewBox={`${showReveal?0:viewX} ${showReveal?0:viewY} ${showReveal?MAP_VIEW_W:MAP_VIEW_W/zoom} ${showReveal?MAP_VIEW_H:MAP_VIEW_H/zoom}`}
          onTouchStart={showReveal?undefined:onMapTouchStart}
          onTouchMove={showReveal?undefined:onMapTouchMove}
          onTouchEnd={showReveal?undefined:onMapTouchEnd}
          onMouseDown={showReveal?undefined:onMapMouseDown}
          onMouseMove={showReveal?undefined:onMapMouseMove}
          onMouseUp={showReveal?undefined:onMapMouseUp}
          onWheel={showReveal?undefined:onMapWheel}
          style={{width:'100%',height:'auto',background:'#0a1530',borderRadius:12,border:'1px solid #1e2a4a',touchAction:'none',cursor:locked||showReveal?'default':zoom>1?'grab':'crosshair'}}>
          <polygon points={CR_OUTLINE_PTS} fill="#16243f" stroke="#3a5a8a" strokeWidth="3"/>
          {/* Krajské hranice */}
          {CR_REGIONS.map((line,i)=>(
            <polyline key={'reg'+i} points={line.map(([lo,la])=>`${lonToX(lo).toFixed(1)},${latToY(la).toFixed(1)}`).join(' ')}
              fill="none" stroke="#4a6a9a" strokeWidth="1" strokeDasharray="4 5" opacity="0.45"/>
          ))}
          {/* Řeky */}
          {CR_RIVERS.map((r,i)=>(
            <polyline key={'riv'+i} points={r.pts.map(([lo,la])=>`${lonToX(lo).toFixed(1)},${latToY(la).toFixed(1)}`).join(' ')}
              fill="none" stroke="#3d7fc4" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" opacity="0.75"/>
          ))}
          {/* Vodní plochy */}
          {CR_WATER.map((w,i)=>(
            <ellipse key={'wat'+i} cx={lonToX(w.x)} cy={latToY(w.lon)}
              rx={Math.abs(lonToX(w.x+w.w)-lonToX(w.x))} ry={Math.abs(latToY(w.lon+w.h)-latToY(w.lon))}
              transform={`rotate(${w.a} ${lonToX(w.x)} ${latToY(w.lon)})`}
              fill="#3d7fc4" opacity="0.7"/>
          ))}
          {/* Reveal: spojnice + správný bod + tipy ostatních */}
          {showReveal && results.map((r,i) => {
            if (!r.guess) return null;
            const gx = lonToX(r.guess.lon), gy = latToY(r.guess.lat);
            const isMe = r.id === myId;
            return (
              <g key={r.id}>
                {correctPt && <line x1={gx} y1={gy} x2={correctPt.x} y2={correctPt.y} stroke={isMe?'#44ffaa':'#ff668855'} strokeWidth="2" strokeDasharray="6 4"/>}
                <circle cx={gx} cy={gy} r={isMe?14:10} fill={isMe?'#44ffaa':'#ff6688'} stroke="#fff" strokeWidth="2"/>
                <text x={gx} y={gy-20} fill="#fff" fontSize="22" fontWeight="900" textAnchor="middle">{r.name}</text>
              </g>
            );
          })}
          {showReveal && correctPt && (
            <g>
              <circle cx={correctPt.x} cy={correctPt.y} r="18" fill="none" stroke="#ffd700" strokeWidth="4"/>
              <circle cx={correctPt.x} cy={correctPt.y} r="7" fill="#ffd700"/>
              <text x={correctPt.x} y={correctPt.y+40} fill="#ffd700" fontSize="26" fontWeight="900" textAnchor="middle">📍</text>
            </g>
          )}
          {/* Můj tip během hry */}
          {!showReveal && myGuess && (
            <g>
              <circle cx={myGuess.x} cy={myGuess.y} r="14" fill={locked?'#44ffaa':'#ffd700'} stroke="#fff" strokeWidth="3"/>
              <circle cx={myGuess.x} cy={myGuess.y} r="5" fill="#fff"/>
            </g>
          )}
        </svg>

        {/* Spodní panel */}
        {!showReveal ? (
          <div style={{marginTop:12}}>
            {!locked ? (
              <button onClick={lockGuess} disabled={!myGuess}
                style={{width:'100%',padding:15,fontSize:16,fontWeight:900,letterSpacing:1,background:myGuess?'linear-gradient(135deg,#1a8a4a,#22cc66)':'#2a3a5a',color:'#fff',border:'none',borderRadius:12,cursor:myGuess?'pointer':'default',fontFamily:"'Orbitron',sans-serif"}}>
                {myGuess ? '✓ POTVRDIT TIP' : (zoom>1?'Klepni pro umístění · táhni pro posun':'Klepni na mapu · 🤏 přibliž dvěma prsty')}
              </button>
            ) : (
              <div style={{textAlign:'center',color:'#44ffaa',fontSize:15,fontWeight:700,padding:14}}>✓ Tip potvrzen · čekání na ostatní…</div>
            )}
          </div>
        ) : (
          <div style={{marginTop:12,background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:14}}>
            <div style={{fontSize:11,color:'#88aaff',letterSpacing:1,marginBottom:8}}>VÝSLEDKY KOLA</div>
            {results.map((r,i) => (
              <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',background:r.id===myId?'rgba(68,255,170,.1)':'transparent',borderRadius:6,marginBottom:4}}>
                <span style={{fontSize:13,color:'#778',width:20}}>{i+1}.</span>
                <span style={{color:'#fff',fontWeight:600,fontSize:14,flex:1}}>{r.name}{r.id===myId?' (ty)':''}</span>
                <span style={{fontSize:12,color:'#88aaff'}}>{r.km!=null?`${Math.round(r.km)} km`:'—'}</span>
                <div style={{width:78,textAlign:'right'}}>
                  <span style={{fontSize:14,fontWeight:900,color:'#ffd700'}}>+{r.pts}</span>
                  {r.timeBonus>0 && <div style={{fontSize:9,color:'#44ffaa'}}>⚡+{r.timeBonus} za čas</div>}
                </div>
              </div>
            ))}
          </div>
        )}
        <button onClick={leaveRoom} style={{width:'100%',marginTop:10,padding:9,background:'transparent',border:'1px solid #2a3a5a',color:'#778',borderRadius:8,cursor:'pointer',fontSize:12}}>Opustit hru</button>
      </div>
    );
  }

  // ── FINAL ──
  if (view === 'final') {
    const medals = ['🥇','🥈','🥉'];
    return (
      <div style={{animation:'slideIn .3s ease',maxWidth:420,margin:'0 auto',textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:8}}>🏆</div>
        <div style={{fontSize:22,fontWeight:900,color:'#fff',fontFamily:"'Orbitron',sans-serif",marginBottom:18}}>KONEČNÉ POŘADÍ</div>
        {results.map((r,i) => (
          <div key={r.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:i===0?'rgba(255,215,0,.15)':'rgba(12,18,52,.8)',border:`1px solid ${i===0?'rgba(255,215,0,.4)':'#1e2a4a'}`,borderRadius:12,marginBottom:8}}>
            <span style={{fontSize:24}}>{medals[i]||`${i+1}.`}</span>
            <span style={{color:'#fff',fontWeight:700,fontSize:16,flex:1,textAlign:'left'}}>{r.name}{r.id===myId?' (ty)':''}</span>
            <span style={{fontSize:18,fontWeight:900,color:'#ffd700',fontFamily:"'Orbitron',sans-serif"}}>{r.totalScore.toLocaleString()}</span>
          </div>
        ))}
        {isHost ? (
          <button onClick={()=>{ chanRef.current.send({type:'broadcast',event:'restart_lobby',payload:{}}); }}
            style={{width:'100%',marginTop:18,padding:15,fontSize:16,fontWeight:900,letterSpacing:1,background:'linear-gradient(135deg,#1a8a4a,#22cc66)',color:'#fff',border:'none',borderRadius:12,cursor:'pointer',fontFamily:"'Orbitron',sans-serif"}}>🔄 HRÁT ZNOVU</button>
        ) : (
          <div style={{marginTop:18,padding:14,color:'#88aaff',fontSize:14,textAlign:'center'}}>⏳ Čekání na hosta (může spustit novou hru)</div>
        )}
        <button onClick={leaveRoom} style={{width:'100%',marginTop:10,padding:12,fontSize:14,fontWeight:700,background:'transparent',border:'1px solid #2a3a5a',color:'#778',borderRadius:10,cursor:'pointer'}}>← Odejít do menu</button>
      </div>
    );
  }

  return null;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
