// ─── TARGETS GAME ────────────────────────────────────
function TargetsGame({ onResult, swPts, phase }) {
  const [gameState, setGameState] = useState('waiting');
  const [score, setScore]   = useState(0);
  const [hits, setHits]     = useState(0);
  const [misses, setMisses] = useState(0);
  const [timeLeft, setTimeLeft] = useState(20);
  const [targets, setTargets]   = useState([]);
  const [floats, setFloats]     = useState([]);
  const scoreRef   = useRef(0);
  const hitsRef    = useRef(0);
  const missesRef  = useRef(0);
  const timerRef   = useRef(null);
  const spawnRef   = useRef(null);
  const nextIdRef  = useRef(0);
  const COLORS = ['#4488ff','#ff4488','#44cc88','#ffd700','#ff9944','#bb44ff'];

  function startGame() {
    setGameState('playing');
    scoreRef.current=0; hitsRef.current=0; missesRef.current=0;
    setScore(0); setHits(0); setMisses(0); setTimeLeft(20); setTargets([]);
    timerRef.current = setInterval(() => {
      setTimeLeft(t => { if (t<=1){endGame();return 0;} return t-1; });
    }, 1000);
    scheduleSpawn();
  }

  function scheduleSpawn() {
    const delay = 250 + Math.random()*500;
    spawnRef.current = setTimeout(() => { spawnTarget(); scheduleSpawn(); }, delay);
  }

  function spawnTarget() {
    const size  = 28+Math.random()*28;
    const x     = size/2+Math.random()*(390-size);
    const y     = size/2+Math.random()*(270-size);
    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
    const id    = nextIdRef.current++;
    const pts   = Math.round(180-((size-28)/28)*80);
    setTargets(prev=>[...prev,{id,x,y,size,color,pts}]);
    setTimeout(()=>setTargets(prev=>prev.filter(t=>t.id!==id)),1400);
  }

  function hitTarget(id,pts,x,y,e) {
    e.stopPropagation();
    if (gameState!=='playing') return;
    setTargets(prev=>prev.filter(t=>t.id!==id));
    scoreRef.current+=pts; hitsRef.current++;
    setScore(scoreRef.current); setHits(hitsRef.current);
    const fid=nextIdRef.current++;
    setFloats(prev=>[...prev,{id:fid,x,y,pts,miss:false}]);
    setTimeout(()=>setFloats(prev=>prev.filter(f=>f.id!==fid)),700);
  }

  function missClick(e) {
    if (gameState!=='playing') return;
    if (e.target!==e.currentTarget && e.target.parentElement!==e.currentTarget) return;
    scoreRef.current=Math.max(0,scoreRef.current-50);
    missesRef.current++;
    setScore(scoreRef.current); setMisses(missesRef.current);
    const rect=e.currentTarget.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    const fid=nextIdRef.current++;
    setFloats(prev=>[...prev,{id:fid,x,y,pts:-50,miss:true}]);
    setTimeout(()=>setFloats(prev=>prev.filter(f=>f.id!==fid)),600);
  }

  function endGame() {
    clearInterval(timerRef.current); clearTimeout(spawnRef.current);
    setGameState('done'); setTargets([]);
    const total=hitsRef.current+missesRef.current;
    const acc=total>0?Math.round(hitsRef.current/total*100):0;
    const finalPts=scoreRef.current+Math.round(acc*3);
    const verdict=acc>=90?'🎯 Ostrostřelec!':acc>=70?'💪 Dobrý střelec':acc>=50?'🙂 Průměrný výkon':'😅 Více tréninku!';
    setTimeout(()=>onResult(finalPts,{
      'Zásahy':hitsRef.current,'Minutí':missesRef.current,
      'Přesnost':acc+'%','Bonus za přesnost':'+'+Math.round(acc*3)+' b','Hodnocení':verdict,
    }),400);
  }

  useEffect(()=>()=>{clearInterval(timerRef.current);clearTimeout(spawnRef.current);},[]);

  const timeColor=timeLeft>10?'#44ffaa':timeLeft>5?'#ffd700':'#ff4444';

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>TERČOVÁ STŘELNICE</div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,padding:'0 4px'}}>
        <div style={{textAlign:'left'}}>
          <div style={{fontSize:9,color:'#445566',letterSpacing:1}}>SKÓRE</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:'#4488ff'}}>{score.toLocaleString()}</div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:9,color:'#445566',letterSpacing:1}}>ČAS</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:26,fontWeight:900,color:timeColor}}>{timeLeft}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:9,color:'#445566',letterSpacing:1}}>ZÁSAHY</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:'#44ffaa'}}>{hits}</div>
        </div>
      </div>
      {swPts>0 && (
        <div style={{background:'rgba(255,215,0,.08)',border:'1px solid rgba(255,215,0,.2)',borderRadius:8,padding:'5px 12px',marginBottom:8,fontSize:12,color:'#ffd700',fontFamily:"'Orbitron',sans-serif",fontWeight:700,letterSpacing:1}}>
          ⏱ Fáze 1: +{swPts.toLocaleString()} b
        </div>
      )}
      <div onClick={gameState==='waiting'?startGame:missClick} style={{
        position:'relative',width:'100%',maxWidth:400,height:280,margin:'0 auto 10px',
        background:'rgba(8,12,35,.9)',border:'1px solid #1e2a4a',borderRadius:12,
        overflow:'hidden',cursor:gameState==='waiting'?'pointer':'crosshair',
      }}>
        {gameState==='waiting' && (
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}>
            <div style={{fontSize:32}}>🎯</div>
            <div style={{fontSize:14,color:'#88aaff',fontWeight:700}}>Klikni pro start</div>
          </div>
        )}
        {targets.map(t=>(
          <div key={t.id} onClick={e=>hitTarget(t.id,t.pts,t.x,t.y,e)} style={{
            position:'absolute',left:t.x,top:t.y,width:t.size,height:t.size,
            borderRadius:'50%',background:t.color,border:'2px solid rgba(255,255,255,.3)',
            transform:'translate(-50%,-50%)',cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center',
            animation:'targetPop .15s ease',
          }}>
            <div style={{width:'35%',height:'35%',borderRadius:'50%',background:'rgba(255,255,255,.25)'}}/>
          </div>
        ))}
        {floats.map(f=>(
          <div key={f.id} style={{
            position:'absolute',left:f.x,top:f.y,
            color:f.miss?'#ff4444':'#44ffaa',fontWeight:900,fontSize:f.miss?12:13,
            fontFamily:"'Orbitron',sans-serif",
            transform:'translate(-50%,-50%)',pointerEvents:'none',
            animation:'floatUp .7s ease forwards',
          }}>{f.miss?'−50':'+'+f.pts}</div>
        ))}
      </div>
      {gameState==='playing' && <div style={{fontSize:10,color:'#334455'}}>Klikni mimo terč = −50 bodů</div>}
      {gameState==='done' && <div style={{fontSize:13,color:'#445566',padding:'10px 0'}}>Vyhodnocuji...</div>}
    </div>
  );
}

// ─── BALANCE GAME ────────────────────────────────────
function BalanceGame({ onResult, prevPts, phase }) {
  const [gState, setGState]   = useState('waiting');
  const [elapsed, setElapsed] = useState(0);
  const [pts, setPts]         = useState(0);
  const [maxW, setMaxW]       = useState(0);
  const [maxTilt, setMaxTilt] = useState(0);
  const canvasRef  = useRef(null);
  const stateRef   = useRef('waiting');
  const angleRef   = useRef(0);
  const omegaRef   = useRef(0);
  const weightsRef = useRef([]);
  const elapsedRef = useRef(0);
  const maxWRef    = useRef(0);
  const maxTiltRef = useRef(0);
  const dragRef    = useRef(null);
  const timerRef   = useRef(null);
  const spawnRef   = useRef(null);
  const rafRef     = useRef(0);
  const lastTRef   = useRef(0);
  const spawnDelay = useRef(4000);

  const W=360,H=240,PX=180,PY=100,BARLEN=290,MAXANG=Math.PI/4;
  const WCOLS=[
    {top:'#7ab8ff',mid:'#2266dd',rim:'#1a44aa'},
    {top:'#ff8ab8',mid:'#cc3366',rim:'#aa1144'},
    {top:'#70ddaa',mid:'#1d9e75',rim:'#0f6e56'},
    {top:'#ffdd66',mid:'#cc8800',rim:'#996600'},
    {top:'#cc99ff',mid:'#7744cc',rim:'#5522aa'},
    {top:'#ffaa66',mid:'#cc5500',rim:'#993300'},
  ];

  function lerp(a,b,t){
    const p=s=>parseInt(s,16);
    const ah=[p(a.slice(1,3)),p(a.slice(3,5)),p(a.slice(5,7))];
    const bh=[p(b.slice(1,3)),p(b.slice(3,5)),p(b.slice(5,7))];
    return '#'+ah.map((v,i)=>Math.round(v+(bh[i]-v)*t).toString(16).padStart(2,'0')).join('');
  }

  function draw(cv) {
    const cx=cv.getContext('2d');
    cx.clearRect(0,0,W,H);

    // Pozadí
    cx.fillStyle='#0a0d1e';
    cx.beginPath(); cx.roundRect(0,0,W,H,10); cx.fill();

    // Jemná mřížka
    cx.strokeStyle='rgba(255,255,255,.025)'; cx.lineWidth=1;
    for(let x=0;x<W;x+=28){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
    for(let y=0;y<H;y+=28){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}

    const ang=angleRef.current;

    // Limit čáry
    cx.save(); cx.translate(PX,PY);
    const lx=Math.cos(MAXANG)*BARLEN/2,ly=Math.sin(MAXANG)*BARLEN/2;
    cx.strokeStyle='rgba(255,60,60,.2)'; cx.lineWidth=1.5; cx.setLineDash([5,5]);
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(lx,ly);cx.stroke();
    cx.beginPath();cx.moveTo(0,0);cx.lineTo(-lx,ly);cx.stroke();
    cx.setLineDash([]); cx.restore();

    // Stojan
    cx.save(); cx.translate(PX,PY);
    const sg=cx.createLinearGradient(-14,6,14,6);
    sg.addColorStop(0,'#1a1a2e'); sg.addColorStop(.5,'#3a3a5a'); sg.addColorStop(1,'#1a1a2e');
    cx.fillStyle=sg;
    cx.beginPath();cx.moveTo(0,7);cx.lineTo(-17,44);cx.lineTo(17,44);cx.closePath();cx.fill();
    const bg=cx.createLinearGradient(-28,44,28,52);
    bg.addColorStop(0,'#1a1a2e'); bg.addColorStop(.5,'#4a4a6a'); bg.addColorStop(1,'#1a1a2e');
    cx.fillStyle=bg; cx.beginPath(); cx.roundRect(-28,44,56,8,3); cx.fill();
    cx.restore();

    cx.save(); cx.translate(PX,PY); cx.rotate(ang);

    // Tyč — čistý gradient bez blur
    const tiltF=Math.min(1,Math.abs(ang)/MAXANG);
    const c1=tiltF<.5?lerp('#1d9e75','#ba7517',tiltF*2):lerp('#ba7517','#ee3333',(tiltF-.5)*2);
    const c2=tiltF<.5?lerp('#2aaa80','#ddaa00',tiltF*2):lerp('#ddaa00','#ff5555',(tiltF-.5)*2);
    const barG=cx.createLinearGradient(0,-5,0,5);
    barG.addColorStop(0,'rgba(255,255,255,.18)');
    barG.addColorStop(.35,c2); barG.addColorStop(.7,c1);
    barG.addColorStop(1,'rgba(0,0,0,.45)');
    cx.fillStyle=barG;
    cx.beginPath(); cx.roundRect(-BARLEN/2,-5,BARLEN,10,5); cx.fill();
    // Rýhy
    cx.strokeStyle='rgba(255,255,255,.07)'; cx.lineWidth=1;
    for(let x=-BARLEN/2+24;x<BARLEN/2;x+=24){cx.beginPath();cx.moveTo(x,-4);cx.lineTo(x,4);cx.stroke();}

    // Závaží — bez shadowBlur, čistá grafika
    weightsRef.current.forEach(w=>{
      const r=9+w.mass*.2;
      const wy=w.dropping?w.dy:0;
      const wx=w.pos;

      // Těleso — radiální gradient
      const wg=cx.createRadialGradient(wx-r*.28,wy+r*.28,r*.05,wx,wy+r,r);
      wg.addColorStop(0,w.col.top);
      wg.addColorStop(.55,w.col.mid);
      wg.addColorStop(1,w.col.rim);
      cx.fillStyle=wg;
      cx.beginPath(); cx.arc(wx,wy+r,r,0,Math.PI*2); cx.fill();

      // Tenký lem
      cx.strokeStyle=w.col.rim; cx.lineWidth=1.2;
      cx.beginPath(); cx.arc(wx,wy+r,r,0,Math.PI*2); cx.stroke();

      // Lesk — malý kruhový highlight
      const sg2=cx.createRadialGradient(wx-r*.32,wy+r*.28,0,wx-r*.32,wy+r*.28,r*.45);
      sg2.addColorStop(0,'rgba(255,255,255,.38)');
      sg2.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=sg2;
      cx.beginPath(); cx.arc(wx,wy+r,r,0,Math.PI*2); cx.fill();

      // Hmotnost
      cx.fillStyle='rgba(255,255,255,.88)';
      cx.font=`700 ${Math.max(9,Math.round(r*.58))}px system-ui`;
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(Math.round(w.mass)+'g',wx,wy+r);
    });

    cx.restore();

    // Pivot — chromový
    const pvG=cx.createRadialGradient(PX-2,PY-2,0,PX,PY,8);
    pvG.addColorStop(0,'#999'); pvG.addColorStop(.5,'#444'); pvG.addColorStop(1,'#111');
    cx.fillStyle=pvG; cx.beginPath(); cx.arc(PX,PY,7,0,Math.PI*2); cx.fill();
    cx.fillStyle='rgba(255,255,255,.55)';
    cx.beginPath(); cx.arc(PX-2,PY-2,2.5,0,Math.PI*2); cx.fill();
  }

  function gameLoop(now) {
    if (stateRef.current!=='playing') return;
    const dt=Math.min((now-lastTRef.current)/1000,.05);
    lastTRef.current=now;

    weightsRef.current.forEach(w=>{if(w.dropping){w.dy+=190*dt;if(w.dy>=0){w.dy=0;w.dropping=false;}}});
    let torque=0;
    weightsRef.current.forEach(w=>{if(!w.dropping)torque+=w.mass*w.pos*Math.cos(angleRef.current)*.000065;});
    omegaRef.current=(omegaRef.current+torque*dt)*.988;
    angleRef.current+=omegaRef.current*dt;

    const deg=Math.abs(angleRef.current*180/Math.PI);
    if(deg>maxTiltRef.current){maxTiltRef.current=deg;setMaxTilt(Math.round(deg));}

    if(Math.abs(angleRef.current)>MAXANG){endGame();return;}
    if(canvasRef.current) draw(canvasRef.current);
    rafRef.current=requestAnimationFrame(gameLoop);
  }

  function startGame() {
    stateRef.current='playing'; setGState('playing');
    angleRef.current=0; omegaRef.current=0;
    weightsRef.current=[]; elapsedRef.current=0;
    maxWRef.current=0; maxTiltRef.current=0;
    spawnDelay.current=4000;
    clearInterval(timerRef.current); clearTimeout(spawnRef.current); cancelAnimationFrame(rafRef.current);
    timerRef.current=setInterval(()=>{
      elapsedRef.current++;
      setElapsed(elapsedRef.current);
      const p=Math.round(elapsedRef.current*40+maxWRef.current*15);
      setPts(p);
      if(elapsedRef.current%8===0&&spawnDelay.current>1400) spawnDelay.current=Math.max(1400,spawnDelay.current-350);
    },1000);
    setTimeout(()=>{if(stateRef.current==='playing'){spawnWeight();scheduleSpawn();}},2000);
    lastTRef.current=performance.now();
    rafRef.current=requestAnimationFrame(gameLoop);
  }

  function scheduleSpawn(){
    spawnRef.current=setTimeout(()=>{
      if(stateRef.current!=='playing') return;
      spawnWeight(); scheduleSpawn();
    },spawnDelay.current+(Math.random()-.5)*600);
  }

  function spawnWeight(){
    const side=Math.random()<.5?1:-1;
    const pos=side*(55+Math.random()*75);
    const mass=18+Math.random()*30+elapsedRef.current*.4;
    const col=WCOLS[weightsRef.current.length%WCOLS.length];
    weightsRef.current.push({pos,mass,col,dropping:true,dy:-70});
    const wc=weightsRef.current.length;
    maxWRef.current=Math.max(maxWRef.current,wc);
    setMaxW(wc);
  }

  function endGame(){
    stateRef.current='done'; setGState('done');
    clearInterval(timerRef.current); clearTimeout(spawnRef.current); cancelAnimationFrame(rafRef.current);
    const finalPts=Math.round(elapsedRef.current*40+maxWRef.current*15);
    const verdict=elapsedRef.current>=40?'Mistr rovnováhy 🏆':elapsedRef.current>=20?'Skvělý výkon ⭐':elapsedRef.current>=10?'Dobrý pokus 👍':'Zkus znovu 💪';
    setTimeout(()=>onResult(finalPts,{
      'Vydržel jsi':elapsedRef.current+' s',
      'Max závaží':maxWRef.current,
      'Max náklon':Math.round(maxTiltRef.current)+'°',
      'Hodnocení':verdict,
    }),400);
  }

  useEffect(()=>{
    if(canvasRef.current) draw(canvasRef.current);
  },[]);
  useEffect(()=>()=>{clearInterval(timerRef.current);clearTimeout(spawnRef.current);cancelAnimationFrame(rafRef.current);},[]);

  function handlePointerDown(e){
    if(stateRef.current==='waiting'){startGame();return;}
    if(stateRef.current!=='playing') return;
    const rect=canvasRef.current.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width)-PX;
    const my=(e.clientY-rect.top)*(H/rect.height)-PY;
    let best=null,bestD=40;
    weightsRef.current.forEach(w=>{
      if(w.dropping) return;
      const r=9+w.mass*.2;
      const bx=w.pos*Math.cos(angleRef.current), by=w.pos*Math.sin(angleRef.current)+r;
      const d=Math.hypot(mx-bx,my-by);
      if(d<bestD+r*.5){bestD=d;best=w;}
    });
    if(best){dragRef.current={w:best,x0:mx,p0:best.pos};}
    canvasRef.current.setPointerCapture(e.pointerId);
  }
  function handlePointerMove(e){
    if(!dragRef.current||stateRef.current!=='playing') return;
    const rect=canvasRef.current.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width)-PX;
    dragRef.current.w.pos=Math.max(-BARLEN/2+15,Math.min(BARLEN/2-15,dragRef.current.p0+(mx-dragRef.current.x0)));
  }
  function handlePointerUp(){dragRef.current=null;}

  const tiltColor=maxTilt>28?'#ff4444':maxTilt>16?'#ffaa00':'#44ffaa';

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>ROVNOVÁHA</div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,padding:'0 2px'}}>
        {[{l:'ČAS',v:elapsed+' s',c:'#fff'},{l:'NÁKLON',v:Math.round(maxTilt)+'°',c:tiltColor},{l:'BODY',v:pts.toLocaleString(),c:'#4488ff'}].map(x=>(
          <div key={x.l} style={{background:'rgba(12,18,52,.8)',border:'1px solid #1a2448',borderRadius:8,padding:'7px 12px',textAlign:'center',flex:1,margin:'0 3px'}}>
            <div style={{fontSize:9,color:'#334455',letterSpacing:1}}>{x.l}</div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:x.c}}>{x.v}</div>
          </div>
        ))}
      </div>
      {prevPts>0 && <div style={{background:'rgba(255,215,0,.08)',border:'1px solid rgba(255,215,0,.2)',borderRadius:8,padding:'5px 12px',marginBottom:8,fontSize:12,color:'#ffd700',fontFamily:"'Orbitron',sans-serif",fontWeight:700}}>
        Fáze 1+2: +{prevPts.toLocaleString()} b
      </div>}
      <canvas ref={canvasRef} width={W} height={H}
        style={{width:'100%',borderRadius:12,touchAction:'none',cursor:gState==='waiting'?'pointer':'grab',display:'block'}}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
      />
      <div style={{marginTop:6,fontSize:11,color:'rgba(255,255,255,.25)',textAlign:'center'}}>
        {gState==='waiting'?'Klikni pro start':gState==='playing'?'Táhni závaží · Limit 45°':'Vyhodnocuji...'}
      </div>
    </div>
  );
}

// ─── TOWER BUILDER ─────────────────────────────────────
function TowerGame({ onResult }) {
  const canvasRef = useRef(null);
  const [gState, setGState] = useState('waiting'); // waiting | playing | done
  const [score, setScore]   = useState(0);
  const [floor, setFloor]   = useState(0);
  const [combo, setCombo]   = useState(0);
  const [lastDelta, setLastDelta] = useState('');

  const W = 360, H = 440;
  const FLOOR_H = 22;
  const stateRef = useRef('waiting');
  const towerRef = useRef([]);     // [{x, w, color, y}]
  const currentRef = useRef(null); // {x, w, dir, speed, color, y}
  const cameraYRef = useRef(0);    // posun kamery dolů s rostoucí věží
  const scoreRef = useRef(0);
  const floorRef = useRef(0);
  const comboRef = useRef(0);
  const rafRef   = useRef(0);
  const flashRef = useRef(0);  // flash effect intensity 0-1
  const particlesRef = useRef([]);

  function colorForFloor(n) {
    // HSL rainbow spirálka
    const h = (n * 18) % 360;
    return { fill: `hsl(${h}, 70%, 55%)`, edge: `hsl(${h}, 80%, 35%)`, light: `hsl(${h}, 70%, 70%)` };
  }

  function initGame() {
    // Základní podlaha
    const baseW = 180;
    const baseX = (W - baseW) / 2;
    const baseY = H - FLOOR_H - 30;
    towerRef.current = [{ x: baseX, w: baseW, y: baseY, color: colorForFloor(0) }];
    cameraYRef.current = 0;
    scoreRef.current = 0;
    floorRef.current = 0;
    comboRef.current = 0;
    particlesRef.current = [];
    flashRef.current = 0;
    setScore(0); setFloor(0); setCombo(0); setLastDelta('');
    spawnBlock();
  }

  function spawnBlock() {
    const top = towerRef.current[towerRef.current.length - 1];
    const baseSpeed = 1.8 + Math.min(3.5, floorRef.current * 0.12);
    const dir = Math.random() < 0.5 ? 1 : -1;
    // Spawn na opačné straně podle směru
    const startX = dir > 0 ? -top.w : W;
    currentRef.current = {
      x: startX,
      w: top.w,
      dir,
      speed: baseSpeed,
      color: colorForFloor(floorRef.current + 1),
      y: top.y - FLOOR_H,
    };
  }

  function placeBlock() {
    const cur = currentRef.current;
    const top = towerRef.current[towerRef.current.length - 1];
    if (!cur || !top) return;

    // Vypočítej překryv
    const overlapL = Math.max(cur.x, top.x);
    const overlapR = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap  = overlapR - overlapL;

    if (overlap <= 0) {
      // Mine — game over
      // Spadne mimo věž
      currentRef.current = null;
      // Spustit padání bloku jako game-over efekt
      towerRef.current.push({ ...cur, falling: true, vy: 0 });
      endGame();
      return;
    }

    // Vypočítej body
    const delta = Math.abs(cur.x - top.x);
    let pts, msg;
    if (delta < 3) {
      // PERFECT — věž neořezává, kombo
      comboRef.current++;
      const comboBonus = comboRef.current * 200;
      pts = 1500 + comboBonus;
      msg = comboRef.current >= 3 ? `🔥 PERFECT × ${comboRef.current}` : '🎯 PERFECT';
      flashRef.current = 1;
      // Particles
      for (let i = 0; i < 16; i++) {
        particlesRef.current.push({
          x: cur.x + cur.w / 2,
          y: cur.y + FLOOR_H / 2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 1.2) * 7,
          life: 1,
          color: cur.color.light,
        });
      }
      // Drobné rozšíření bloku (max +5px) za perfect streak
      const widthBonus = Math.min(5, comboRef.current);
      towerRef.current.push({
        x: top.x - widthBonus / 2,
        w: top.w + widthBonus,
        y: cur.y,
        color: cur.color,
        perfect: true,
      });
    } else {
      // Ořezání
      comboRef.current = 0;
      pts = Math.max(50, Math.round(800 * (overlap / cur.w)));
      msg = delta < 8 ? '✨ Skvěle' : delta < 25 ? '👍 Dobře' : '⚠️ Těsně';
      towerRef.current.push({
        x: overlapL,
        w: overlap,
        y: cur.y,
        color: cur.color,
      });
      // Spadnutý kus (pro vizuální efekt)
      const fallX = cur.x < top.x ? cur.x : overlapR;
      const fallW = cur.w - overlap;
      if (fallW > 1) {
        particlesRef.current.push({
          x: fallX + fallW / 2,
          y: cur.y + FLOOR_H,
          vx: cur.x < top.x ? -2 : 2,
          vy: 0,
          gravity: true,
          life: 1.5,
          color: cur.color.fill,
          isBlock: true,
          w: fallW,
          h: FLOOR_H,
        });
      }
    }

    scoreRef.current += pts;
    floorRef.current++;
    setScore(scoreRef.current);
    setFloor(floorRef.current);
    setCombo(comboRef.current);
    setLastDelta(msg + ' +' + pts);
    setTimeout(() => setLastDelta(''), 1100);

    // Posun kamery dolů aby věž zůstala ve view
    const topY = cur.y;
    const desiredTopY = H * 0.35;
    if (topY < desiredTopY) {
      const shift = desiredTopY - topY;
      cameraYRef.current += shift;
      // Posuň všechny bloky a current
      towerRef.current.forEach(b => { b.y += shift; });
    }

    spawnBlock();
  }

  function endGame() {
    stateRef.current = 'done';
    setGState('done');
    cancelAnimationFrame(rafRef.current);

    // Pokračuj v animaci pádu pro dramatický efekt
    let endRafId;
    function endAnim() {
      const cv = canvasRef.current;
      if (!cv) return;
      towerRef.current.forEach(b => {
        if (b.falling) {
          b.vy = (b.vy || 0) + 0.8;
          b.y += b.vy;
        }
      });
      draw(cv);
      // Stop after block falls out
      const allFallen = towerRef.current.every(b => !b.falling || b.y > H + 200);
      if (!allFallen) endRafId = requestAnimationFrame(endAnim);
    }
    endRafId = requestAnimationFrame(endAnim);

    setTimeout(() => {
      const verdict =
        floorRef.current >= 25 ? '🏆 Architekt!' :
        floorRef.current >= 15 ? '⭐ Výborně' :
        floorRef.current >= 8  ? '👍 Slušné' :
        floorRef.current >= 4  ? '🙂 Můžeš líp' :
        '🐌 Trénuj rytmus';
      onResult(scoreRef.current, {
        'Pater': floorRef.current,
        'Skóre': scoreRef.current.toLocaleString(),
        'Hodnocení': verdict,
      });
    }, 1500);
  }

  function loop() {
    const cv = canvasRef.current;
    if (!cv || stateRef.current !== 'playing') return;

    // Update current block
    const cur = currentRef.current;
    if (cur) {
      cur.x += cur.dir * cur.speed;
      // Pohyb sem-tam: když přejede přes přední/zadní hranici, otoč
      const leftLimit  = -cur.w + 5;
      const rightLimit = W - 5;
      if (cur.x <= leftLimit) { cur.x = leftLimit; cur.dir = 1; }
      if (cur.x >= rightLimit) { cur.x = rightLimit; cur.dir = -1; }
    }

    // Update particles
    particlesRef.current = particlesRef.current.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.gravity) p.vy += 0.5;
      else p.vy += 0.3;
      p.life -= 0.025;
      return p.life > 0 && p.y < H + 50;
    });

    flashRef.current *= 0.88;

    draw(cv);
    rafRef.current = requestAnimationFrame(loop);
  }

  function draw(cv) {
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    // Pozadí — gradient
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0d1e');
    bg.addColorStop(0.5, '#0d1530');
    bg.addColorStop(1, '#1a0d2a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Jemná mřížka
    ctx.strokeStyle = 'rgba(255,255,255,.02)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 36) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 36) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Hvězdy
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    for (let i = 0; i < 30; i++) {
      const x = (i * 73) % W;
      const y = (i * 41) % H;
      ctx.fillRect(x, y, 1.5, 1.5);
    }

    // Vykreslení věže (zdola nahoru)
    towerRef.current.forEach((b, i) => {
      drawBlock(ctx, b.x, b.y, b.w, FLOOR_H, b.color, b.perfect);
    });

    // Aktuální blok
    if (currentRef.current && stateRef.current === 'playing') {
      const cur = currentRef.current;
      // Vodící linie nad blokem (kde je top)
      const top = towerRef.current[towerRef.current.length - 1];
      if (top) {
        ctx.strokeStyle = 'rgba(255,170,68,.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(top.x, cur.y + FLOOR_H);
        ctx.lineTo(top.x + top.w, cur.y + FLOOR_H);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      drawBlock(ctx, cur.x, cur.y, cur.w, FLOOR_H, cur.color, false, true);
    }

    // Particles
    particlesRef.current.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.isBlock) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });

    // Perfect flash overlay
    if (flashRef.current > 0.05) {
      ctx.fillStyle = `rgba(255,215,0,${flashRef.current * 0.25})`;
      ctx.fillRect(0, 0, W, H);
    }

    // UI overlay — patro indicator
    if (stateRef.current === 'playing') {
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = '700 13px system-ui';
      ctx.textAlign = 'left';
      ctx.fillText('Patro: ' + floorRef.current, 10, 22);
    }
  }

  function drawBlock(ctx, x, y, w, h, color, perfect, isMoving) {
    // Tělo
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, color.light);
    grad.addColorStop(0.5, color.fill);
    grad.addColorStop(1, color.edge);
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    // Lem
    ctx.strokeStyle = color.edge;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    // Horní highlight
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(x + 1, y + 1, w - 2, 2);

    // Perfect glow
    if (perfect) {
      ctx.strokeStyle = 'rgba(255,215,0,.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
    }

    // Moving block — subtle glow
    if (isMoving) {
      ctx.strokeStyle = color.light;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.6;
      ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
      ctx.globalAlpha = 1;
    }
  }

  function handleClick() {
    if (stateRef.current === 'waiting') {
      stateRef.current = 'playing';
      setGState('playing');
      initGame();
      rafRef.current = requestAnimationFrame(loop);
      return;
    }
    if (stateRef.current === 'playing') {
      placeBlock();
    }
  }

  function handleKey(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      handleClick();
    }
  }

  useEffect(() => {
    const cv = canvasRef.current;
    if (cv) draw(cv);
    window.addEventListener('keydown', handleKey);
    return () => { cancelAnimationFrame(rafRef.current); window.removeEventListener('keydown', handleKey); };
  }, []);

  const comboBg = combo >= 3 ? 'linear-gradient(135deg,rgba(255,68,68,.15),rgba(255,170,68,.15))'
              : combo >= 1 ? 'rgba(255,215,0,.08)' : 'rgba(12,18,52,.8)';

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:4}}>TOWER BUILDER</div>

      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8,padding:'0 2px',gap:6}}>
        <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1a2448',borderRadius:8,padding:'7px 12px',textAlign:'center',flex:1}}>
          <div style={{fontSize:9,color:'#334455',letterSpacing:1}}>PATRO</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:'#fff'}}>{floor}</div>
        </div>
        <div style={{background:comboBg,border:`1px solid ${combo>=3?'rgba(255,68,68,.4)':combo>=1?'rgba(255,215,0,.3)':'#1a2448'}`,borderRadius:8,padding:'7px 12px',textAlign:'center',flex:1.2,transition:'all .3s'}}>
          <div style={{fontSize:9,color:'#334455',letterSpacing:1}}>{combo>=3?'🔥 KOMBO':'KOMBO'}</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:combo>=3?'#ff6644':combo>=1?'#ffd700':'#445566'}}>{combo}×</div>
        </div>
        <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1a2448',borderRadius:8,padding:'7px 12px',textAlign:'center',flex:1.3}}>
          <div style={{fontSize:9,color:'#334455',letterSpacing:1}}>BODY</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:'#ffaa44'}}>{score.toLocaleString()}</div>
        </div>
      </div>

      {lastDelta && (
        <div style={{
          background: lastDelta.includes('PERFECT') ? 'rgba(255,215,0,.12)' : 'rgba(68,170,255,.08)',
          border: `1px solid ${lastDelta.includes('PERFECT') ? 'rgba(255,215,0,.4)' : 'rgba(68,170,255,.2)'}`,
          borderRadius:8, padding:'5px 12px', marginBottom:8,
          fontSize:12, color:lastDelta.includes('PERFECT')?'#ffd700':'#88aaff',
          fontFamily:"'Orbitron',sans-serif", fontWeight:700, textAlign:'center',
          animation:'fadeIn .2s ease',
        }}>{lastDelta}</div>
      )}

      <canvas ref={canvasRef} width={W} height={H} onClick={handleClick}
        style={{width:'100%',maxWidth:360,height:'auto',borderRadius:12,display:'block',margin:'0 auto',cursor:gState==='waiting'?'pointer':'crosshair',touchAction:'manipulation'}}
      />

      <div style={{marginTop:8,fontSize:11,color:'#445566',textAlign:'center'}}>
        {gState==='waiting' ? '🖱️ Klikni / mezerník pro start'
         : gState==='playing' ? `Klikni v pravý čas — perfect = bonus, mine = konec`
         : 'Vyhodnocuji...'}
      </div>
    </div>
  );
}


// Perfect streak HUD - rerendery se podle interval
function PerfectStreakHUD({ sRef }) {
  const [, force] = useState(0);
  useEffect(() => {
    const id = setInterval(() => force(n => n + 1), 250);
    return () => clearInterval(id);
  }, []);
  const s = sRef.current;
  if (!s) return null;
  const streak = s.perfectStreak || 0;
  const color = streak >= 10 ? '#ffd700' : streak >= 5 ? '#ff6644' : streak >= 2 ? '#44ffaa' : '#445566';
  return (
    <div style={{
      background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',
      borderRadius:10,padding:'4px 10px',
      display:'flex',alignItems:'center',gap:5,
      border: streak >= 5 ? `1px solid ${color}` : 'none',
    }}>
      <span style={{fontSize:14}}>🎯</span>
      <span style={{fontSize:12,fontWeight:900,color,fontFamily:"'Orbitron',sans-serif"}}>{streak}</span>
    </div>
  );
}

// PowerUp HUD - rerendery se podle interval
function PowerUpIndicators({ sRef }) {
  const [, force] = useState(0);
  useEffect(() => {
    const id = setInterval(() => force(n => n + 1), 250);
    return () => clearInterval(id);
  }, []);
  const s = sRef.current;
  if (!s) return null;
  const items = [];
  if (s.multiplierTime > 0) items.push({ icon:'✨', text:'×2', t:s.multiplierTime, color:'#ff88ff', max:5 });
  if (s.perfectZoneTime > 0) items.push({ icon:'🎯', text:'ZONE', t:s.perfectZoneTime, color:'#ffd700', max:4 });
  if (s.iceTime > 0) items.push({ icon:'❄️', text:'SLOW', t:s.iceTime, color:'#88ddff', max:3 });
  if (!items.length) return null;
  return (
    <>
      {items.map((it,i)=>(
        <div key={i} style={{
          background:'rgba(0,0,0,.6)',backdropFilter:'blur(8px)',
          border:`1px solid ${it.color}`,
          borderRadius:8,padding:'3px 8px',
          fontSize:11,color:it.color,fontWeight:700,
          display:'flex',alignItems:'center',gap:4,
        }}>
          <span>{it.icon}</span>
          <span>{it.text}</span>
          <span style={{
            display:'inline-block',width:18,height:3,background:'rgba(255,255,255,.2)',borderRadius:2,marginLeft:2,
          }}>
            <span style={{
              display:'block',height:'100%',width:`${Math.min(100, (it.t/it.max)*100)}%`,
              background:it.color,borderRadius:2,
            }}/>
          </span>
        </div>
      ))}
    </>
  );
}

// ─── SLASH MASTER (Fruit Ninja style, fullscreen) ──────
function SlashMasterGame({ onResult }) {
  const [phase, setPhase] = useState('intro'); // intro | playing | done
  const [score, setScore] = useState(0);
  const [level, setLevel] = useState(1);
  const [lives, setLives] = useState(3);
  const [combo, setCombo] = useState(0);
  const [bestScore, setBestScore] = useState(0);

  const canvasRef = useRef(null);
  const stateRef = useRef({
    W: 360, H: 600,
    objects: [],
    slashes: [],
    particles: [],
    score: 0,
    lives: 3,
    maxLives: 3,
    level: 1,
    combo: 0,
    frenzyTimer: 35,    // sekund do next frenzy
    frenzyEnd: 0,       // jak dlouho ještě frenzy běží
    frenzyActive: false,
    bossSpawnTimer: 25, // sekund do next boss
    chainSpawnCooldown: 0,
    combo: 0,
    maxCombo: 0,
    sliced: 0,
    perfectStreak: 0,
    maxPerfectStreak: 0,
    nextId: 0,
    lastSpawn: 0,
    spawnInterval: 900,
    flash: 0,
    flashColor: '255,255,255',
    shake: 0,
    iceTime: 0,
    multiplierTime: 0,  // ×2 score boost time
    perfectZoneTime: 0, // all cuts = perfect
    bombShake: 0,
    raf: 0,
    lastT: 0,
    running: false,
    floats: [],
    lastComboTime: 0,
    achievements: {},
    banner: null,  // { text, color, time }
    bgPulse: 0,
  });

  function resizeCanvas() {
    const s = stateRef.current;
    s.W = window.innerWidth;
    s.H = window.innerHeight;
    const cv = canvasRef.current;
    if (cv) {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      cv.width  = s.W * dpr;
      cv.height = s.H * dpr;
      const ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
    }
  }

  const FRUITS = ['🍎','🍊','🍋','🍉','🍓','🍇','🍑','🥝','🍐','🥭'];

  function spawnChainBurst() {
    const s = stateRef.current;
    // 4 ovoce v oblouku ze stejné strany
    const fromLeft = Math.random() < 0.5;
    const startBaseX = fromLeft ? 40 : s.W - 40;
    for (let i = 0; i < 4; i++) {
      setTimeout(() => {
        if (!s.running) return;
        const targetX = fromLeft ? s.W * 0.4 + Math.random() * (s.W * 0.5) : s.W * 0.6 - Math.random() * (s.W * 0.5);
        const launchPower = 850 + Math.random() * 100;
        s.objects.push({
          id: s.nextId++,
          type: 'fruit',
          x: startBaseX + (Math.random() - 0.5) * 20,
          y: s.H + 60,
          vx: (targetX - startBaseX) / 2.2,
          vy: -launchPower,
          rot: 0,
          rotSpd: (Math.random() - 0.5) * 6,
          size: 60,
          emoji: FRUITS[Math.floor(Math.random() * FRUITS.length)],
          alive: true,
          sliced: false,
          hp: 1,
          isChain: true,
        });
      }, i * 180);
    }
  }

  function spawnBoss() {
    const s = stateRef.current;
    showBanner('🍉 BOSS PŘICHÁZÍ!', '#ff4488');
    setTimeout(() => {
      if (!s.running) return;
      const startX = s.W * 0.5;
      s.objects.push({
        id: s.nextId++,
        type: 'boss',
        x: startX + (Math.random() - 0.5) * 80,
        y: s.H + 60,
        vx: (Math.random() - 0.5) * 80,
        vy: -1000,
        rot: 0,
        rotSpd: (Math.random() - 0.5) * 3,
        size: 110,
        emoji: '🍉',
        alive: true,
        sliced: false,
        hp: 3,
      });
    }, 1200);
  }

  function spawnObject() {
    const s = stateRef.current;
    const r = Math.random();
    const level = s.level;

    // Žádné bomby ve Frenzy módu
    const inFrenzy = s.frenzyActive;

    // Vážený výběr typu objektu
    const bombW    = inFrenzy ? 0 : Math.min(14, 3.5 + (level - 1) * 1.0);
    const starW    = 5;
    const iceW     = 4;
    const diamondW = level >= 2 ? 2 : 0;
    const heartW   = level >= 3 ? 1.2 : 0;
    const lightningW = level >= 4 ? 3 : 0;
    const cocoW    = level >= 2 ? 3 : 0;
    const rainbowW = level >= 5 ? 2 : 0;
    const x2W      = level >= 3 ? 1.5 : 0;
    const fruitW   = 70;

    const items = [
      { type:'bomb',     w:bombW   },
      { type:'star',     w:starW   },
      { type:'ice',      w:iceW    },
      { type:'diamond',  w:diamondW},
      { type:'heart',    w:heartW  },
      { type:'lightning',w:lightningW },
      { type:'coco',     w:cocoW   },
      { type:'rainbow',  w:rainbowW},
      { type:'x2',       w:x2W     },
      { type:'fruit',    w:fruitW  },
    ];
    const totalW = items.reduce((a,b)=>a+b.w, 0);
    let pick = r * totalW;
    let type = 'fruit';
    for (const it of items) {
      pick -= it.w;
      if (pick <= 0) { type = it.type; break; }
    }

    const fromLeft = Math.random() < 0.5;
    const startX = fromLeft ? 50 + Math.random() * (s.W * 0.3) : s.W * 0.7 - 50 + Math.random() * (s.W * 0.3);
    const targetX = fromLeft ? s.W * 0.5 + Math.random() * (s.W * 0.4) : s.W * 0.5 - Math.random() * (s.W * 0.4) + 50;
    const launchPower = 850 + Math.random() * 150;

    const sizeMap = {
      bomb:64, star:70, ice:60, diamond:62, heart:62,
      lightning:60, coco:66, rainbow:64, x2:60, fruit:60,
    };
    const emojiMap = {
      bomb:'💣', star:'⭐', ice:'🧊', diamond:'💎', heart:'❤️',
      lightning:'⚡', coco:'🥥', rainbow:'🌈', x2:'✨',
    };
    const emoji = type === 'fruit'
      ? FRUITS[Math.floor(Math.random() * FRUITS.length)]
      : emojiMap[type];

    s.objects.push({
      id: s.nextId++,
      type,
      x: startX,
      y: s.H + 60,
      vx: (targetX - startX) / 2.2,
      vy: -launchPower,
      rot: 0,
      rotSpd: (Math.random() - 0.5) * 6,
      size: sizeMap[type] || 60,
      emoji,
      alive: true,
      sliced: false,
      hp: type === 'coco' ? 2 : 1,  // Coco needs 2 cuts
    });
  }

  function lineCircleData(x1, y1, x2, y2, cx, cy, r) {
    // Vrátí {hit, ratio} kde ratio je vzdálenost od středu / r (0=přesný střed, 1=okraj)
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    if (len2 < 0.01) {
      const d = Math.hypot(cx - x1, cy - y1);
      return { hit: d <= r, ratio: d / r };
    }
    const t = Math.max(0, Math.min(1, ((cx - x1) * dx + (cy - y1) * dy) / len2));
    const projX = x1 + t * dx;
    const projY = y1 + t * dy;
    const dist = Math.hypot(cx - projX, cy - projY);
    return { hit: dist <= r, ratio: dist / r };
  }

  function showBanner(text, color) {
    const s = stateRef.current;
    s.banner = { text, color: color || '#fff', time: 1.5, width: null };
  }

    function sliceObject(o, accuracyRatio) {
    const s = stateRef.current;
    if (!o.alive || o.sliced) return;
    o.sliced = true;
    o.alive = false;

    if (o.type === 'bomb') {
      // BOOM! -1 život
      s.shake = 40;
      s.bombShake = 1;
      s.lives--;
      setLives(s.lives);
      s.combo = 0;
      for (let i = 0; i < 25; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 4 + Math.random() * 14;
        s.particles.push({
          x: o.x, y: o.y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1.2,
          color: ['#ff4400', '#ffaa00', '#ff8800', '#ffdd00'][Math.floor(Math.random() * 4)],
          size: 4 + Math.random() * 5,
        });
      }
      s.flash = 1;
      s.flashColor = '255,68,0';
      if (s.lives <= 0) {
        showBanner('💀 GAME OVER!', '#ff4444');
        setTimeout(() => endGame(), 1500);
      } else {
        showBanner('💔 -1 ŽIVOT! (' + s.lives + ' zbývá)', '#ff4488');
      }
      return;
    }

    // Coco needs 2 cuts
    if (o.type === 'coco' && o.hp > 1) {
      o.hp--;
      o.alive = true;
      o.sliced = false;
      o.size = o.size * 0.85;
      for (let i = 0; i < 5; i++) {
        const a = Math.random() * Math.PI * 2;
        s.particles.push({
          x: o.x, y: o.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
          life: 0.5, color: '#8b6f47', size: 3,
        });
      }
      s.floats.push({ x: o.x, y: o.y + 20, text: 'CRACK!', color: '#ffaa66', life: 0.8, isLabel: true });
      return;
    }

    // Boss watermelon: 3 HP
    if (o.type === 'boss' && o.hp > 1) {
      o.hp--;
      o.alive = true;
      o.sliced = false;
      o.size = o.size * 0.92;
      // Velký feedback
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2;
        s.particles.push({
          x: o.x, y: o.y,
          vx: Math.cos(a) * (3 + Math.random() * 5),
          vy: Math.sin(a) * (3 + Math.random() * 5),
          life: 0.8, color: '#ff4488', size: 4,
        });
      }
      s.floats.push({ x: o.x, y: o.y + 20, text: `HP ${o.hp}/3`, color: '#ff4488', life: 0.8, isLabel: true });
      s.shake = 12;
      return;
    }

    // Combo logic
    const now = performance.now();
    if (now - s.lastComboTime < 800) s.combo++;
    else s.combo = 1;
    s.lastComboTime = now;
    if (s.combo > s.maxCombo) s.maxCombo = s.combo;

    // Base points per type
    const baseMap = {
      star: 500, ice: 200, diamond: 1500, heart: 300,
      lightning: 300, coco: 800, rainbow: 600, x2: 200, fruit: 100,
    };
    let basePts = baseMap[o.type] || 100;

    // Accuracy multiplikátor
    const ratio = accuracyRatio !== undefined ? accuracyRatio : 0.5;
    const inPerfectZone = s.perfectZoneTime > 0;
    let accuracyMult, accuracyLabel, accuracyColor;
    if (inPerfectZone || ratio < 0.12) { accuracyMult = 2.5; accuracyLabel = '🎯 PERFECT!'; accuracyColor = '#ffd700'; }
    else if (ratio < 0.30) { accuracyMult = 1.8; accuracyLabel = '✨ SKVĚLE!';   accuracyColor = '#44ffaa'; }
    else if (ratio < 0.55) { accuracyMult = 1.2; accuracyLabel = '👍';           accuracyColor = '#88aaff'; }
    else                   { accuracyMult = 0.6; accuracyLabel = '~okraj';       accuracyColor = '#aa88aa'; }

    const comboMult = Math.min(8, s.combo);
    const x2Mult = (s.multiplierTime > 0 ? 2 : 1) * (s.frenzyActive ? 3 : 1);
    const pts = Math.round(basePts * accuracyMult * comboMult * x2Mult);
    s.score += pts;
    s.sliced++;

    // Perfect streak tracking
    if (ratio < 0.12 || inPerfectZone) {
      s.perfectStreak++;
      if (s.perfectStreak > s.maxPerfectStreak) s.maxPerfectStreak = s.perfectStreak;
      // Achievements for streaks
      if (s.perfectStreak === 5)  showBanner('🔥 PERFECT 5!',  '#ff6644');
      if (s.perfectStreak === 10) showBanner('💎 PERFECT 10!', '#ffd700');
      if (s.perfectStreak === 20) showBanner('👑 LEGENDA!',     '#ff44ff');
    } else if (ratio >= 0.55) {
      s.perfectStreak = 0;
    }

    // Cut count achievements
    if (s.sliced === 10)  showBanner('🥷 ROOKIE!', '#88ccff');
    if (s.sliced === 25)  showBanner('⚔️ MASTER!', '#44ffaa');
    if (s.sliced === 50)  showBanner('👑 LEGEND!', '#ffd700');
    if (s.sliced === 100) showBanner('🌟 SLASH GOD!', '#ff44ff');

    // Combo achievements
    if (s.combo === 5 && comboMult === 5) showBanner('🔥 COMBO ×5!', '#ff6644');
    if (s.combo === 8) showBanner('💥 MAX COMBO ×8!', '#ff44ff');

    // Level up every 1500 points
    const newLevel = Math.min(20, Math.floor(s.score / 1500) + 1);
    if (newLevel !== s.level) {
      s.level = newLevel;
      s.spawnInterval = Math.max(280, 900 - (newLevel - 1) * 35);
      showBanner('⬆️ LEVEL ' + newLevel, '#88ccff');
    }

    // Floating points
    s.floats.push({ x: o.x, y: o.y - 10, pts, color: x2Mult>1?'#ff88ff':(o.type === 'star'||o.type==='diamond'?'#ffd700':'#fff'), life: 1.2 });
    if (ratio < 0.30 || inPerfectZone) {
      s.floats.push({ x: o.x, y: o.y + 18, text: inPerfectZone ? '🎯 ZONE!' : accuracyLabel, color: accuracyColor, life: 1.4, isLabel: true });
      if (ratio < 0.12) { s.flash = 0.8; s.flashColor = '255,215,0'; }
    }

    // ── SPECIAL TYPE EFFECTS ──────────────────────────
    if (o.type === 'ice') {
      s.iceTime = 2.0;
      showBanner('❄️ SLOW MOTION', '#88ddff');
    }
    if (o.type === 'diamond') {
      s.flash = 0.6; s.flashColor = '136,221,255';
      s.iceTime = Math.max(s.iceTime, 1.0);
    }
    if (o.type === 'heart') {
      if (s.lives < s.maxLives) {
        s.lives++;
        showBanner('❤️ +1 ŽIVOT!', '#ff4488');
      } else {
        s.score += 1000;
        s.floats.push({ x: o.x, y: o.y - 30, text: '+1000', color: '#ff4488', life: 1.5, isLabel: true });
        showBanner('❤️ +1000 BONUS', '#ff4488');
      }
    }
    if (o.type === 'lightning') {
      // Sekni 3 nejbližší ovoce automaticky
      showBanner('⚡ BLESK!', '#ffd700');
      const others = s.objects.filter(obj => obj.alive && !obj.sliced && obj.type !== 'bomb' && obj.id !== o.id);
      others.sort((a, b) => Math.hypot(a.x - o.x, a.y - o.y) - Math.hypot(b.x - o.x, b.y - o.y));
      const targets = others.slice(0, 3);
      targets.forEach(t => {
        // Lightning bolt particles z lightning na cíl
        const steps = 5;
        for (let i = 0; i <= steps; i++) {
          const t_ratio = i / steps;
          const lx = o.x + (t.x - o.x) * t_ratio + (Math.random() - 0.5) * 30;
          const ly = o.y + (t.y - o.y) * t_ratio + (Math.random() - 0.5) * 30;
          s.particles.push({
            x: lx, y: ly, vx: 0, vy: 0, life: 0.4, color: '#ffff88', size: 4,
          });
        }
        // Trigger slice on target (after small delay for visual)
        setTimeout(() => { if (s.running && t.alive) sliceObject(t, 0.1); }, 80);
      });
    }
    if (o.type === 'rainbow') {
      // Náhodný power-up
      const fx = Math.floor(Math.random() * 4);
      if (fx === 0) {
        s.multiplierTime = 5.0;
        showBanner('✨ ×2 SCORE 5s!', '#ff88ff');
      } else if (fx === 1) {
        s.perfectZoneTime = 4.0;
        showBanner('🎯 PERFECT ZÓNA 4s!', '#ffd700');
      } else if (fx === 2) {
        s.iceTime = 3.0;
        showBanner('❄️ SLOW 3s!', '#88ddff');
      } else {
        s.score += 1500; showBanner('+1500 BONUS', '#ffd700');
      }
    }
    if (o.type === 'x2') {
      s.multiplierTime = 4.0;
      showBanner('✨ ×2 SCORE!', '#ff88ff');
    }
    if (o.type === 'boss') {
      // Mega reward
      s.score += 3000;
      s.floats.push({ x: o.x, y: o.y - 30, text: '+3000 BOSS!', color: '#ff4488', life: 1.8, isLabel: true });
      showBanner('🍉 BOSS DOWN! ×2 zóna!', '#ff44ff');
      s.perfectZoneTime = 5.0;
      s.flash = 1.0;
      s.flashColor = '255,68,136';
      s.shake = 25;
      // Velký particle burst
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 3 + Math.random() * 10;
        s.particles.push({
          x: o.x, y: o.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 1.5,
          color: ['#ff4488', '#ffd700', '#44ff88', '#88ddff'][Math.floor(Math.random() * 4)],
          size: 4 + Math.random() * 4,
        });
      }
    }

    // Ice = slow motion 2s
    if (o.type === 'ice') s.iceTime = 2.0;

    s.flash = 0.4;

    // Particles
    const colors = o.type === 'star' ? ['#ffd700', '#ffaa00', '#ffffff']
                 : o.type === 'ice' ? ['#88ddff', '#ffffff', '#aaeeff']
                 : ['#ff4488', '#44ff88', '#ffaa44', '#aa44ff', '#44aaff'];
    for (let i = 0; i < (o.type === 'star' ? 14 : 8); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 3 + Math.random() * 6;
      s.particles.push({
        x: o.x, y: o.y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 3 + Math.random() * 3,
      });
    }
  }

  function gameLoop(now) {
    const s = stateRef.current;
    if (!s.running) return;
    let dt = Math.min((now - s.lastT) / 1000, 0.05);
    s.lastT = now;

    // Ice slowmo
    if (s.iceTime > 0) {
      s.iceTime -= dt;
      dt *= 0.4;
    }

    // Spawn
    if (now - s.lastSpawn > s.spawnInterval) {
      // Sometimes spawn 2-3 at once for higher levels
      const burstSize = s.level >= 5 && Math.random() < 0.2 ? 2 : 1;
      for (let i = 0; i < burstSize; i++) setTimeout(() => { if (s.running) spawnObject(); }, i * 120);
      s.lastSpawn = now;
    }

    // Update objects
    s.objects.forEach(o => {
      if (!o.alive) return;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      o.vy += 550 * dt; // gravity
      o.rot += o.rotSpd * dt;
      if (o.y > s.H + 80 && o.vy > 0) {
        o.alive = false;
        // Propadnutí jen resetuje combo - žádné životy se neztrácí
        if (o.type === 'fruit' && s.combo > 0) {
          s.combo = 0;
        }
      }
    });

    // Slash collisions
    const tNow = Date.now();
    s.slashes = s.slashes.filter(p => tNow - p.t < 250);
    if (s.slashes.length >= 2) {
      for (let i = s.slashes.length - 1; i > 0; i--) {
        const a = s.slashes[i - 1], b = s.slashes[i];
        const moved = Math.hypot(b.x - a.x, b.y - a.y);
        if (moved < 8) continue;
        s.objects.forEach(o => {
          if (!o.alive || o.sliced) return;
          // Bomba má menší hit radius (0.35) - jen střed způsobí explosi
          // A vyžaduje rychlejší slash (moved > 18)
          if (o.type === 'bomb') {
            if (moved < 18) return; // pomalý prst = nevybuchne
            const cd = lineCircleData(a.x, a.y, b.x, b.y, o.x, o.y, o.size * 0.35);
            if (cd.hit) sliceObject(o, cd.ratio);
          } else {
            const cd = lineCircleData(a.x, a.y, b.x, b.y, o.x, o.y, o.size * 0.5);
            if (cd.hit) sliceObject(o, cd.ratio);
          }
        });
      }
    }

    // Particles - capped at 180 pro performance
    s.particles = s.particles.filter(p => {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.4;
      p.life -= 0.022;
      return p.life > 0;
    });
    if (s.particles.length > 180) s.particles = s.particles.slice(-180);

    // Floats
    s.floats = s.floats.filter(f => {
      f.y -= f.isLabel ? 0.8 : 1.5;
      f.life -= f.isLabel ? 0.014 : 0.018;
      return f.life > 0;
    });

    // Clean dead
    s.objects = s.objects.filter(o => o.alive || o.y < s.H + 100);

    s.flash *= 0.92;
    s.shake *= 0.85;
    s.bombShake *= 0.92;
    s.bgPulse = (s.bgPulse + dt * (s.multiplierTime > 0 ? 4 : 1)) % (Math.PI * 2);

    // Throttle React HUD update - jen 5×/s místo při každém cut (eliminuje jank)
    if (now - (s.lastUIUpdate || 0) > 200) {
      s.lastUIUpdate = now;
      setScore(s.score);
      setCombo(s.combo);
      setLives(s.lives);
      setLevel(s.level);
    }

    // Power-up timer decay
    if (s.multiplierTime > 0) {
      s.multiplierTime = Math.max(0, s.multiplierTime - dt);
      if (s.multiplierTime === 0) showBanner('×2 end', '#888');
    }
    if (s.perfectZoneTime > 0) s.perfectZoneTime = Math.max(0, s.perfectZoneTime - dt);
    if (s.banner) {
      s.banner.time -= dt;
      if (s.banner.time <= 0) s.banner = null;
    }

    // ── FRENZY MODE ── každých 35s start, trvá 8s ──
    if (!s.frenzyActive && s.frenzyTimer > 0) {
      s.frenzyTimer -= dt;
      if (s.frenzyTimer <= 0) {
        s.frenzyActive = true;
        s.frenzyEnd = 8;
        s.spawnInterval = 220;
        showBanner('🔥 FRENZY MODE — ×3 SCORE!', '#ff6600');
      }
    }
    if (s.frenzyActive) {
      s.frenzyEnd -= dt;
      if (s.frenzyEnd <= 0) {
        s.frenzyActive = false;
        s.frenzyTimer = 35;  // reset
        s.spawnInterval = Math.max(280, 900 - (s.level - 1) * 35);
        showBanner('Frenzy konec', '#888');
      }
    }

    // ── BOSS spawn ── každých 25s ──
    s.bossSpawnTimer -= dt;
    if (s.bossSpawnTimer <= 0 && !s.frenzyActive) {
      spawnBoss();
      s.bossSpawnTimer = 28 + Math.random() * 12;
    }

    // ── CHAIN BURST ── náhodně mezi spawn ──
    s.chainSpawnCooldown -= dt;
    if (s.chainSpawnCooldown <= 0 && Math.random() < 0.12 && s.level >= 2) {
      spawnChainBurst();
      s.chainSpawnCooldown = 6 + Math.random() * 6;
    }

    draw();
    s.raf = requestAnimationFrame(gameLoop);
  }

  function draw() {
    const s = stateRef.current;
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');

    // Background
    const bg = ctx.createLinearGradient(0, 0, 0, s.H);
    bg.addColorStop(0, '#0a0820');
    bg.addColorStop(0.5, '#1a1040');
    bg.addColorStop(1, '#100620');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, s.W, s.H);



    // Screen shake offset
    const shakeX = (Math.random() - 0.5) * s.shake;
    const shakeY = (Math.random() - 0.5) * s.shake;
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Ice tint
    if (s.iceTime > 0) {
      ctx.fillStyle = `rgba(100,200,255,${Math.min(0.2, s.iceTime * 0.1)})`;
      ctx.fillRect(0, 0, s.W, s.H);
    }

    // Objects - ŽÁDNÝ shadowBlur (drahý na mobilu), jen levné prsteny pro bomb/boss
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    s.objects.forEach(o => {
      if (!o.alive) return;

      // Levný glow ring pro speciální objekty (jen stroke, žádný shadowBlur)
      if (o.type === 'bomb') {
        const pulse = (Math.sin(Date.now() * 0.012) + 1) * 0.5;
        ctx.strokeStyle = `rgba(255, 50, 50, ${0.5 + pulse * 0.5})`;
        ctx.lineWidth = 2.5 + pulse * 1.5;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.size * 0.55, 0, Math.PI * 2);
        ctx.stroke();
      } else if (o.type === 'boss') {
        for (let h = 0; h < o.hp; h++) {
          ctx.strokeStyle = `rgba(255, 68, 136, ${0.7 - h * 0.15})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.size * 0.5 + 8 + h * 6, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot);
      ctx.font = `${o.size}px sans-serif`;
      ctx.fillText(o.emoji, 0, 0);
      ctx.restore();
    });

    // Particles - fillRect je 3-5× rychlejší než arc, žádné shadowBlur
    ctx.shadowBlur = 0;
    s.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      const sz = p.size * p.life;
      ctx.fillRect(p.x - sz, p.y - sz, sz * 2, sz * 2);
    });
    ctx.globalAlpha = 1;

    // Slash trail - žádný shadowBlur, místo toho dvojitá čára (glow efekt levně)
    if (s.slashes.length >= 2) {
      const tNow = Date.now();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // Vnější glow vrstva (širší, průhledná)
      ctx.beginPath();
      ctx.moveTo(s.slashes[0].x, s.slashes[0].y);
      for (let i = 1; i < s.slashes.length; i++) ctx.lineTo(s.slashes[i].x, s.slashes[i].y);
      ctx.strokeStyle = 'rgba(136,255,255,.25)';
      ctx.lineWidth = 14;
      ctx.stroke();
      // Vnitřní jasná čára
      ctx.beginPath();
      ctx.moveTo(s.slashes[0].x, s.slashes[0].y);
      for (let i = 1; i < s.slashes.length; i++) ctx.lineTo(s.slashes[i].x, s.slashes[i].y);
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 5;
      ctx.stroke();
    }

    // Floating score - bez shadowBlur
    ctx.textAlign = 'center';
    s.floats.forEach(f => {
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color;
      if (f.isLabel) {
        ctx.font = '900 18px system-ui';
        ctx.fillText(f.text, f.x, f.y);
      } else {
        ctx.font = '900 26px system-ui';
        ctx.fillText('+' + f.pts.toLocaleString(), f.x, f.y);
      }
    });
    ctx.globalAlpha = 1;

    ctx.restore();

    // ×2 multiplier active - pulsing border
    if (s.multiplierTime > 0) {
      const pulse = (Math.sin(s.bgPulse) + 1) * 0.5;
      ctx.strokeStyle = `rgba(255, 136, 255, ${0.4 + pulse * 0.5})`;
      ctx.lineWidth = 6 + pulse * 4;
      ctx.strokeRect(3, 3, s.W - 6, s.H - 6);
      ctx.fillStyle = `rgba(255, 136, 255, ${pulse * 0.06})`;
      ctx.fillRect(0, 0, s.W, s.H);
    }
    // Perfect zone active - subtle gold tint
    if (s.perfectZoneTime > 0) {
      const pulse = (Math.sin(s.bgPulse * 1.5) + 1) * 0.5;
      ctx.fillStyle = `rgba(255, 215, 0, ${pulse * 0.05})`;
      ctx.fillRect(0, 0, s.W, s.H);
    }

    // Flash overlay
    if (s.flash > 0.05) {
      ctx.fillStyle = `rgba(${s.flashColor || '255,255,255'},${s.flash * 0.25})`;
      ctx.fillRect(0, 0, s.W, s.H);
    }

    // Achievement banner (center of screen)
    if (s.banner) {
      const t = s.banner.time;
      const alpha = t > 1.0 ? (1.5 - t) * 2 : t < 0.3 ? t / 0.3 : 1;
      const yOffset = t > 1.0 ? (t - 1.0) * -200 : t < 0.3 ? (0.3 - t) * 100 : 0;
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      const bannerY = s.H * 0.35 + yOffset;
      // Background
      ctx.fillStyle = 'rgba(0,0,0,.7)';
      const tw = ctx.measureText ? 0 : 0;
      ctx.font = '900 32px system-ui';
      if (s.banner.width === null) s.banner.width = ctx.measureText(s.banner.text).width + 40;
      const bw = s.banner.width;
      const bh = 50;
      ctx.beginPath();
      ctx.roundRect(s.W/2 - bw/2, bannerY - bh/2, bw, bh, 12);
      ctx.fill();
      // Border
      ctx.strokeStyle = s.banner.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      // Text
      ctx.fillStyle = s.banner.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.banner.text, s.W/2, bannerY);
      ctx.restore();
    }
  }

  // Touch / pointer handling
  function getPos(e) {
    const cv = canvasRef.current;
    const rect = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: t.clientX - rect.left,
      y: t.clientY - rect.top,
    };
  }

  function onTouchStart(e) {
    e.preventDefault();
    const s = stateRef.current;
    const pos = getPos(e);
    s.slashes.push({ ...pos, t: Date.now() });
  }
  function onTouchMove(e) {
    e.preventDefault();
    const s = stateRef.current;
    const pos = getPos(e);
    s.slashes.push({ ...pos, t: Date.now() });
  }
  function onTouchEnd() {
    // Trail will fade naturally
  }

  function startGame() {
    const s = stateRef.current;
    s.objects = [];
    s.slashes = [];
    s.particles = [];
    s.floats = [];
    s.score = 0;
    s.lives = 3;
    s.level = 1;
    s.combo = 0;
    s.maxCombo = 0;
    s.sliced = 0;
    s.lastSpawn = performance.now();
    s.spawnInterval = 900;
    s.flash = 0;
    s.shake = 0;
    s.iceTime = 0;
    s.lastComboTime = 0;
    setScore(0); setLives(3); setLevel(1); setCombo(0);
    setPhase('playing');
    s.running = true;
    s.lastT = performance.now();

    setTimeout(() => {
      resizeCanvas();
      s.raf = requestAnimationFrame(gameLoop);
    }, 50);
  }

  function endGame() {
    const s = stateRef.current;
    if (!s.running) return;
    s.running = false;
    cancelAnimationFrame(s.raf);
    setPhase('done');

    const finalScore = s.score;
    const verdict =
      s.level >= 15 ? '⚔️ NINJA MASTER!' :
      s.level >= 10 ? '🥷 Skvělý slasher' :
      s.level >= 6  ? '✨ Dobrý reflex' :
      s.level >= 3  ? '👍 Slušné' :
      '🐢 Trénuj!';

    setTimeout(() => onResult(finalScore, {
      'Dosažený level': s.level,
      'Max combo': '×' + s.maxCombo,
      'Max perfect streak': s.maxPerfectStreak,
      'Sekuto objektů': s.sliced,
      'Zbývající životy': '❤️ × ' + s.lives,
      'Hodnocení': verdict,
    }), 1000);
  }

  function quitToMenu() {
    const s = stateRef.current;
    s.running = false;
    cancelAnimationFrame(s.raf);
    endGame();
  }

  useEffect(() => {
    const s = stateRef.current;
    const handleResize = () => resizeCanvas();
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    return () => {
      s.running = false;
      cancelAnimationFrame(s.raf);
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('orientationchange', handleResize);
    };
  }, []);

  // INTRO
  if (phase === 'intro') {
    return (
      <div style={{animation:'slideIn .3s ease',textAlign:'center',padding:'10px 0'}}>
        <div style={{fontSize:10,color:'#bb44ff',letterSpacing:3,fontFamily:"'Orbitron',sans-serif",marginBottom:14}}>SLASH MASTER</div>
        <div style={{fontSize:64,marginBottom:16}}>⚔️</div>
        <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:14,padding:18,marginBottom:18,textAlign:'left'}}>
          <div style={{fontSize:12,color:'#44ffaa',fontWeight:700,marginBottom:10,letterSpacing:1}}>🎯 PRAVIDLA</div>
          <div style={{fontSize:12,color:'#aabbcc',lineHeight:1.55}}>
            <div style={{marginBottom:4}}>👆 <strong style={{color:'#fff'}}>Tahej prstem</strong> abys sekl objekty</div>
            <div style={{marginBottom:4}}>🎯 <strong style={{color:'#ffd700'}}>Sekni střed</strong> = ×2.5 bonus (PERFECT)</div>
            <div style={{marginBottom:4}}>🍎 Ovoce 100 · ⭐ Hvězda 500 · 💎 Diamant 1500 · 🥥 Kokos 800</div>
            <div style={{marginBottom:4}}>⚡ <strong style={{color:'#ffd700'}}>Blesk</strong> = sekne 3 nejbližší automaticky</div>
            <div style={{marginBottom:4}}>❤️ <strong style={{color:'#ff4488'}}>Srdce</strong> = +1 život</div>
            <div style={{marginBottom:4}}>🌈 <strong>Duha</strong> = náhodný power-up · ✨ <strong>×2 score</strong></div>
            <div style={{marginBottom:4}}>🧊 <strong style={{color:'#88ddff'}}>Led</strong> = slow motion</div>
            <div style={{marginBottom:4}}>💣 <strong style={{color:'#ff4444'}}>Bomba</strong> = –1 ❤️ život (3 životy total)</div>
            <div style={{marginBottom:4}}>🍉 <strong style={{color:'#ff4488'}}>BOSS</strong> = 3 hp, drop 3000 + perfect zóna</div>
            <div style={{marginBottom:4}}>🔥 <strong style={{color:'#ff6600'}}>FRENZY</strong> každých 35s = ×3 score, bez bomb</div>
            <div style={{marginBottom:4}}>🥷 <strong>Combo</strong> ×8 max · <strong>Perfect streak</strong> = achievementy</div>
          </div>
        </div>
        <button onClick={startGame} style={{
          width:'100%',padding:'18px',fontSize:18,fontWeight:900,letterSpacing:2,
          background:'linear-gradient(135deg,#1a8a4a,#22cc66)',color:'#fff',
          border:'none',borderRadius:14,cursor:'pointer',
          fontFamily:"'Orbitron',sans-serif",
          boxShadow:'0 4px 20px rgba(68,255,170,.3)',
        }}>⚔️ START</button>
        <div style={{fontSize:10,color:'#445566',marginTop:10}}>Hra běží na celé obrazovce</div>
      </div>
    );
  }

  // PLAYING / DONE — fullscreen overlay
  return ReactDOM.createPortal(
    <div style={{
      position:'fixed',inset:0,zIndex:9999,
      background:'#000',
      display:'flex',flexDirection:'column',
      touchAction:'none',userSelect:'none',
      overflow:'hidden',
    }}>
      <canvas ref={canvasRef}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        onMouseDown={onTouchStart} onMouseMove={(e)=>{if(e.buttons)onTouchMove(e);}} onMouseUp={onTouchEnd}
        style={{
          position:'absolute',inset:0,
          width:'100%',height:'100%',
          touchAction:'none',
          background:'#0a0820',
        }}
      />

      {/* HUD - top */}
      <div style={{
        position:'absolute',top:0,left:0,right:0,
        padding:'env(safe-area-inset-top,16px) 12px 8px',
        display:'flex',justifyContent:'space-between',alignItems:'flex-start',
        pointerEvents:'none',
      }}>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          <div style={{background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'6px 12px'}}>
            <div style={{fontSize:9,color:'#88aaff',letterSpacing:1}}>SKÓRE</div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,fontWeight:900,color:'#ffd700',lineHeight:1}}>{score.toLocaleString()}</div>
          </div>
          <div style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>
            <div style={{background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',borderRadius:8,padding:'4px 8px',fontSize:11,color:'#fff'}}>L{level}</div>
            {combo >= 2 && (
              <div style={{
                background: combo >= 5 ? 'rgba(255,68,68,.85)' : 'rgba(255,170,0,.75)',
                borderRadius:8,padding:'4px 10px',fontSize:13,fontWeight:900,
                color:'#fff',fontFamily:"'Orbitron',sans-serif",
                animation:'comboPulse .3s ease',
              }}>
                ×{combo} {combo >= 5 ? '🔥' : '✨'}
              </div>
            )}
            <PowerUpIndicators sRef={stateRef} />
          </div>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end',pointerEvents:'auto'}}>
          <button onClick={quitToMenu} style={{
            background:'rgba(255,68,68,.3)',border:'1px solid rgba(255,68,68,.5)',
            color:'#fff',borderRadius:10,padding:'6px 10px',fontSize:11,fontWeight:700,
            cursor:'pointer',backdropFilter:'blur(8px)',
          }}>✕ KONEC</button>
          <div style={{background:'rgba(0,0,0,.5)',backdropFilter:'blur(8px)',borderRadius:10,padding:'4px 10px',display:'flex',gap:3,fontSize:16,lineHeight:1,alignItems:'center'}}>
            {[...Array(3)].map((_,i)=>(
              <span key={i} style={{opacity:i<lives?1:0.25,transition:'opacity .3s'}}>{i<lives?'❤️':'🖤'}</span>
            ))}
          </div>
          <PerfectStreakHUD sRef={stateRef} />
        </div>
      </div>

      {/* DONE OVERLAY */}
      {phase === 'done' && (
        <div style={{
          position:'absolute',inset:0,
          background:'rgba(0,0,0,.7)',backdropFilter:'blur(10px)',
          display:'flex',alignItems:'center',justifyContent:'center',
          animation:'fadeIn .5s ease',
        }}>
          <div style={{textAlign:'center',color:'#fff'}}>
            <div style={{fontSize:48,marginBottom:10}}>💀</div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:32,fontWeight:900,color:'#ff4488',letterSpacing:3}}>GAME OVER</div>
            <div style={{fontSize:14,color:'#88aaff',marginTop:8}}>Vyhodnocuji výsledky…</div>
          </div>
        </div>
      )}
    </div>,
    document.body
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
