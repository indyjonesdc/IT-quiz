<!-- ═══ DONATE: Kup mi rohlík ═══ -->
<style>
  .donate-fab{position:fixed;right:16px;bottom:16px;z-index:9000;background:linear-gradient(135deg,#e8a33d,#d4822a);color:#1a1206;border:none;border-radius:999px;padding:11px 18px;font-family:'Orbitron',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 22px rgba(212,130,42,.45);display:flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
  .donate-fab:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(212,130,42,.6)}
  .donate-fab span.emoji{font-size:17px}
  @media(max-width:600px){.donate-fab{padding:10px 14px;font-size:12px}.donate-fab .lbl{display:none}.donate-fab span.emoji{font-size:20px}}
  .donate-ov{position:fixed;inset:0;z-index:9001;background:rgba(5,7,16,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
  .donate-ov.show{display:flex}
  .donate-card{width:100%;max-width:380px;background:linear-gradient(160deg,#161e3a,#0f1428);border:1px solid #2a3a6a;border-radius:20px;padding:26px 24px;text-align:center;position:relative;animation:donatePop .25s cubic-bezier(.34,1.56,.64,1)}
  @keyframes donatePop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
  .donate-card h3{font-family:'Orbitron',system-ui,sans-serif;font-size:19px;font-weight:900;color:#f0c070;margin:0 0 6px;letter-spacing:.5px}
  .donate-card .sub{font-size:13px;color:#9aa8c8;line-height:1.55;margin-bottom:18px;font-family:system-ui,sans-serif}
  .donate-qr{background:#fff;border-radius:14px;padding:14px;display:inline-block;line-height:0;box-shadow:0 4px 18px rgba(0,0,0,.4)}
  .donate-qr svg{display:block;width:200px;height:200px}
  .donate-amts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 10px}
  .donate-amts button{background:rgba(232,163,61,.12);border:1px solid #5a4420;color:#e8a33d;border-radius:10px;padding:9px 14px;font-family:'Orbitron',system-ui,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
  .donate-amts button.active{background:linear-gradient(135deg,#e8a33d,#d4822a);color:#1a1206;border-color:#e8a33d}
  .donate-amts button:hover{border-color:#e8a33d}
  .donate-custom{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
  .donate-custom input{width:110px;background:rgba(8,12,30,.8);border:1px solid #2a3a6a;border-radius:9px;padding:9px 12px;color:#e0e8ff;font-family:system-ui,sans-serif;font-size:14px;text-align:center;outline:none}
  .donate-custom input:focus{border-color:#e8a33d}
  .donate-custom span{color:#9aa8c8;font-size:13px;font-family:system-ui,sans-serif}
  .donate-iban{font-family:'Courier New',monospace;font-size:12px;color:#88aaff;background:rgba(68,136,255,.08);border:1px solid #2a3a6a;border-radius:8px;padding:8px 10px;margin-top:6px;word-break:break-all;cursor:pointer;transition:background .15s}
  .donate-iban:hover{background:rgba(68,136,255,.16)}
  .donate-iban .copied{color:#44dd88}
  .donate-hint{font-size:11px;color:#667799;margin-top:12px;font-family:system-ui,sans-serif}
  .donate-or{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:#556;font-size:11px;letter-spacing:2px;font-family:"Orbitron",system-ui,sans-serif}
