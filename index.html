      { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext y='.9em' font-size='80' x='10'%3E💻%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = url;
  document.head.appendChild(link);

  // Service Worker inline jako blob pro offline support
  const swCode = `
    const CACHE = 'itquiz-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      // Smaž staré cache při aktivaci nové verze
      e.waitUntil(
        caches.keys().then(keys =>
          Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
        )
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }

  // Zachyť install prompt — uložíme pro pozdější použití
  window._pwaInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window._pwaInstallPrompt = e;
    // Vyvolej React event aby se tlačítko zobrazilo
    window.dispatchEvent(new Event('pwa-installable'));
  });
})();
</script>

// Bonus čas: kolik sekund dostane hráč zítra za každou ušetřenou sekundu
const TIME_BONUS_RATIO = 1;  // 1 ušetřená sekunda = 1 bonusová sekunda
const MAX_TIME_BONUS   = 30; // max 30 sekund navíc

function seededShuffle(arr, seed) {
  const a=[...arr]; let s=seed;
  for(let i=a.length-1;i>0;i--){
      s=(s*1664525+1013904223)&0xffffffff;
      const j=Math.abs(s)%(i+1);
      [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getDailyQuestions(dateKey, mode) {
  const pool = mode === QUIZ_MODES.GENERAL ? ALL_GENERAL_QUESTIONS
             : mode === QUIZ_MODES.FILM    ? ALL_FILM_QUESTIONS
             : ALL_QUESTIONS;
  if (!pool || pool.length < QUESTIONS_PER_QUIZ) return [];
  const seed = dateKey.split('-').reduce((a,b) => a*31+parseInt(b), 0);

  // Vyloučíme otázky z posledních 6 dní aby se neopakovaly
  const usedIds = new Set();
  for (let i = 1; i <= 6; i++) {
    const d = new Date(dateKey);
    d.setDate(d.getDate() - i);
    const pastKey = d.toISOString().slice(0, 10);
    const pastSeed = pastKey.split('-').reduce((a,b) => a*31+parseInt(b), 0);
    seededShuffle(pool, pastSeed).slice(0, QUESTIONS_PER_QUIZ).forEach(q => usedIds.add(q.id));
  }

  const available = pool.filter(q => !usedIds.has(q.id));
  // Pokud je málo dostupných otázek, použij celý pool
  const pickFrom = available.length >= QUESTIONS_PER_QUIZ ? available : pool;
  const selectedQs = seededShuffle(pickFrom, seed).slice(0, QUESTIONS_PER_QUIZ);

  selectedQs.push({
    id: 'lucky', type: 'lucky', cat: '🎲 Lucky Box',
    q: 'Zkus štěstí! Vyber jednu ze 4 skrytých truhliček.',
    prizes: null,
  });

  return selectedQs;
}

// Náhodné zamíchání Lucky Box prizes (volá se při startu kvízu, různé pro každého hráče)
function randomLuckyPrizes() {
  const pool = [...LUCKY_PRIZES];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 4);
}

// Zamíchá otázky i odpovědi náhodně (Math.random) — každý hráč, každý start jinak
function shuffleQuestionsAndAnswers(questions) {
  // 1) Zamíchej pořadí otázek (Lucky Box zůstane vždy poslední)
  const normal = questions.filter(q => q.type !== 'lucky');
  const lucky  = questions.filter(q => q.type === 'lucky');
  for (let i = normal.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [normal[i], normal[j]] = [normal[j], normal[i]];
  }
  const ordered = [...normal, ...lucky];

  // 2) Zamíchej odpovědi každé otázky
  return ordered.map(q => {
    if (q.type === 'lucky') return { ...q, prizes: randomLuckyPrizes() };
    const opts = q.opts.map((opt, i) => ({ opt, i }));
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    const newA = opts.findIndex(o => o.i === q.a);
    return { ...q, opts: opts.map(o => o.opt), a: newA };
  });
}

function loadActiveQuiz(todayKey, mode) {
  const saved = ls('itq_active_quiz', null);
  if (!saved) return null;
  if (saved.savedAt !== todayKey) { lsDel('itq_active_quiz'); return null; }
  if (saved.finished) { lsDel('itq_active_quiz'); return null; }
  // Pokud mód neodpovídá, ignoruj
  if (mode && (saved.quiz_mode || QUIZ_MODES.IT) !== mode) return null;
  return saved;
}

let ALL_QUESTIONS = [];
let ALL_GENERAL_QUESTIONS = [];
let ALL_FILM_QUESTIONS = [];


// ─── NAČÍTÁNÍ OTÁZEK Z DB ────────────────────────────
async function loadQuestionsFromDB() {
  try {
    const { data, error } = await db
      .from('questions')
      .select('id,cat,q,opts,a,mode,explanation')
      .order('id', { ascending: true });
    if (error || !data) { console.error('Questions load error:', error); return false; }
    const parse = q => ({...q, opts: Array.isArray(q.opts) ? q.opts : JSON.parse(q.opts)});
    ALL_QUESTIONS         = data.filter(q => q.mode === 'it').map(parse);
    ALL_GENERAL_QUESTIONS = data.filter(q => q.mode === 'general').map(parse);
    ALL_FILM_QUESTIONS    = data.filter(q => q.mode === 'film').map(parse);
    console.log(`Loaded ${ALL_QUESTIONS.length} IT + ${ALL_GENERAL_QUESTIONS.length} general + ${ALL_FILM_QUESTIONS.length} film`);
    return true;
  } catch(e) { console.error('Questions load exception:', e); return false; }
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{color:'#ff4444',padding:20,fontFamily:'monospace',fontSize:12,background:'#0a0a0f',minHeight:'100vh'}}>
          <div style={{fontSize:18,marginBottom:12}}>❌ Chyba aplikace</div>
          <div>{this.state.error.message}</div>
          <pre style={{marginTop:12,color:'#ff8888',fontSize:10,overflow:'auto'}}>{this.state.error.stack}</pre>
          <button onClick={()=>window.location.reload()} style={{marginTop:16,padding:'8px 16px',background:'#4488ff',border:'none',color:'#fff',borderRadius:6,cursor:'pointer'}}>Obnovit stránku</button>
        </div>
      );
    }
    return this.props.children;
  }
}

          50%{transform:scale(1.25) translateY(-12px) rotate(2deg);opacity:1}
          70%{transform:scale(0.92) translateY(4px) rotate(-1deg)}
          85%{transform:scale(1.06) translateY(-2px)}
          100%{transform:scale(1) translateY(0) rotate(0);opacity:1}
        }
        @keyframes comboFade{
          0%{opacity:1;transform:scale(1) translateY(0)}
          80%{opacity:0.8;transform:scale(1.08) translateY(-10px)}
          100%{opacity:0;transform:scale(0.7) translateY(-40px)}
        }
        @keyframes comboToast{
          0%{transform:translateX(120px) scale(0.8);opacity:0}
          100%{transform:translateX(0) scale(1);opacity:1}
        }
        @keyframes comboToastOut{
          0%{transform:translateX(0);opacity:1}
          100%{transform:translateX(120px);opacity:0}
        }        @keyframes edgeFlash{
          0%{opacity:0}10%{opacity:1}50%{opacity:0.5}100%{opacity:0}
        }
        @keyframes particleFly{
          0%{transform:translateY(0) translateX(0) scale(1);opacity:1}
          100%{transform:translateY(-100px) translateX(var(--dx,0px)) scale(0.2);opacity:0}
        }
        @keyframes sparkle{0%,100%{opacity:0;transform:scale(0) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
        @keyframes counterBump{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(0.85)}100%{transform:scale(1)}}
        @keyframes comboStreakIn{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
        @keyframes perfectPulse{0%,100%{box-shadow:0 0 20px #ffd70066}50%{box-shadow:0 0 60px #ffd700cc,0 0 100px #ffd70044}}

        @keyframes perfectRain{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
        @keyframes chestShake{0%,100%{transform:rotate(0deg) scale(1)}20%{transform:rotate(-8deg) scale(1.1)}40%{transform:rotate(8deg) scale(1.1)}60%{transform:rotate(-5deg) scale(1.05)}80%{transform:rotate(5deg) scale(1.05)}}
        @keyframes chestOpen{0%{transform:scale(1) translateY(0)}30%{transform:scale(1.3) translateY(-10px)}60%{transform:scale(0.95) translateY(5px)}100%{transform:scale(1.1) translateY(-5px)}}
        @keyframes prizePop{0%{transform:scale(0) translateY(20px);opacity:0}60%{transform:scale(1.2) translateY(-5px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
        @keyframes chestGlow{0%,100%{box-shadow:0 0 10px #ffd70044}50%{box-shadow:0 0 30px #ffd700aa,0 0 60px #ffd70044}}
        .chest-btn{cursor:pointer;border:none;background:transparent;transition:transform 0.2s}
        .chest-btn:hover:not(:disabled){transform:translateY(-4px) scale(1.05)}
        .avatar-upload-wrap{position:relative;display:inline-block;cursor:pointer}
        .avatar-upload-wrap:hover .avatar-overlay{opacity:1}
        .avatar-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;font-size:22px}
        .tab-btn{background:transparent;border:1px solid #2a3a6a;color:#8899bb;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:1px;transition:all 0.2s}
        .tab-btn.active{background:#1a2a5a;border-color:#4488ff;color:#88aaff}
        input,select,textarea{background:#0d1428;border:1px solid #2a3a6a;color:#e0e8ff;padding:12px 16px;border-radius:8px;font-family:inherit;font-size:15px;width:100%;outline:none;transition:border-color 0.2s}
        input:focus,select:focus,textarea:focus{border-color:#4488ff;box-shadow:0 0 0 3px rgba(68,136,255,0.15)}
        select option{background:#0d1428}
        .field-label{font-size:11px;color:#4a5a7a;letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
      `}</style>
      <div style={S.grid}/>
      <div style={S.scan}/>
      {!dbOk && (
        <div style={{position:'fixed',top:0,left:0,right:0,background:'#440000',padding:'10px',textAlign:'center',zIndex:999,fontSize:13,color:'#ff8888'}}>
          ⚠️ Databáze není připojena — vyplň SUPABASE_URL a SUPABASE_KEY v HTML souboru
        </div>
      )}
      {/* KOMBO POPUP — efektní s edge flashem a particles */}
      {comboPopup && (() => {
        const cfg = {
          3:{emoji:'🔥',label:'SUPER KOMBO', c1:'#ff9900', border:'#ff9900'},
          4:{emoji:'⚡',label:'MEGA KOMBO',  c1:'#bb44ff', border:'#bb44ff'},
          5:{emoji:'💥',label:'ULTRA KOMBO', c1:'#ff2255', border:'#ff2255'},
        }[comboPopup.level] || {emoji:'🔥',label:'KOMBO',c1:'#ff9900',border:'#ff9900'};
        return (
          <div key={comboPopup.key} style={{
            position:'fixed', top:16, right:16, zIndex:150,
            pointerEvents:'none',
            animation:'comboToast 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards, comboToastOut 0.3s ease 0.85s forwards',
          }}>
            <div style={{
              display:'flex',alignItems:'center',gap:10,
              background:'rgba(10,14,35,0.92)',
              border:`1px solid ${cfg.border}88`,
              borderRadius:12,
              padding:'10px 16px',
              boxShadow:`0 0 20px ${cfg.border}44`,
              backdropFilter:'blur(8px)',
            }}>
              <span style={{fontSize:22,lineHeight:1}}>{cfg.emoji}</span>
              <div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,fontWeight:900,color:cfg.c1,letterSpacing:2}}>{cfg.label}</div>
                <div style={{fontSize:12,color:cfg.c1,fontWeight:700,letterSpacing:1}}>+{comboPopup.bonus.toLocaleString()} bodů</div>
              </div>
            </div>
          </div>
        );
      })()}

      {wrongData && (
        <div onClick={()=>{
          if(window._quizResumeCallback) window._quizResumeCallback();
          setWrongData(null);
        }} style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.93)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:'20px',overflowY:'auto'}}>
          <div className="shake" style={{textAlign:'center',maxWidth:540,width:'100%',paddingBottom:10}}>
            <div style={{fontSize:64,marginBottom:10}}>💀</div>
            <div style={{fontSize:'clamp(15px,2.8vw,21px)',color:'#ff4444',fontWeight:700,lineHeight:1.45,marginBottom:22,padding:'0 8px'}}>
              {wrongData.insult}
            </div>
            <div style={{background:'rgba(0,80,0,0.4)',border:'1px solid #22aa44',borderRadius:12,padding:'14px 18px',marginBottom:12,textAlign:'left'}}>
              <div style={{fontSize:10,color:'#22aa44',letterSpacing:2,marginBottom:6,fontFamily:"'Orbitron',sans-serif"}}>✅ SPRÁVNÁ ODPOVĚĎ</div>
              <div style={{fontSize:16,fontWeight:700,color:'#88ff88'}}>{wrongData.correctAnswer}</div>
            </div>
            <div style={{background:'rgba(10,20,60,0.8)',border:'1px solid #2a3a6a',borderRadius:12,padding:'14px 18px',marginBottom:14,textAlign:'left'}}>
              <div style={{fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>💡 PROČ JE TO TAK</div>
              <div style={{fontSize:14,color:'#b0c4e8',lineHeight:1.65}}>{wrongData.explanation}</div>
            </div>
            <div style={{fontSize:13,color:'#445566',fontStyle:'italic',marginBottom:18,padding:'0 8px'}}>{wrongData.ending}</div>
            <div style={{fontSize:11,color:'#2a3a5a',letterSpacing:2}}>— KLIKNI KAMKOLIV PRO POKRAČOVÁNÍ —</div>
          </div>
        </div>
      )}

      <div style={S.content}>
        {/* Loading dokud se nenačtou otázky */}
        {!questionsLoaded ? (
          <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'#0a0a0f',zIndex:999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:24,color:'#4488ff',letterSpacing:4}}>INDYQ</div>
            <div style={{fontSize:13,color:'#445566'}}>Načítám otázky...</div>
            <div style={{width:200,height:3,background:'#1a2040',borderRadius:2,overflow:'hidden',marginTop:8}}>
              <div style={{height:'100%',background:'#4488ff',borderRadius:2,animation:'progressBar 1.5s ease infinite'}}/>
            </div>
          </div>
        ) : (<>
        {screen===SCREENS.HOME && <HomeScreen user={user} hasPlayedToday={hasPlayedToday} hasPlayedOtherMode={hasPlayedOtherMode} hasPlayedModes={hasPlayedModes} todayKey={todayKey} todayQuestions={todayQuestions}
          timeBonusToday={timeBonusToday}
          resumableQuiz={resumableQuiz}
          quizMode={quizMode}
          onSwitchMode={(m)=>{ setQuizMode(m); setResumableQuiz(loadActiveQuiz(getTodayKey(), m)||null); }}
          onResume={()=>{
            setCurrentQuiz(resumableQuiz);
            setResumableQuiz(null);
            setScreen(SCREENS.QUIZ);
          }}
          onRegister={()=>setScreen(SCREENS.REGISTER)}
          onLogin={()=>setScreen(SCREENS.LOGIN)}
          onProfile={()=>setScreen(SCREENS.PROFILE)}
          onStart={()=>{
            const totalTime = QUIZ_DURATION + timeBonusToday;
            const questions = shuffleQuestionsAndAnswers(todayQuestions);
            const newQuiz = {
              questions, answers: [], current: 0,
              timeLeft: totalTime, totalDuration: totalTime,
              totalScore: 0, timeBonusUsed: timeBonusToday,
              savedAt: getTodayKey(),
              quiz_mode: quizMode,
            };
            saveActiveQuiz(newQuiz, quizMode);
            setResumableQuiz(null);
            setCurrentQuiz(newQuiz);
            setScreen(SCREENS.QUIZ);
          }}
          onBoard={()=>setScreen(SCREENS.BOARD)}
          onStats={()=>setScreen(SCREENS.STATS)}
          onMinigames={()=>setScreen(SCREENS.MINIGAMES)}
          onLogout={()=>{setUser(null);lss('itq_user',null);}}
          loading={loading}/>}
        {screen===SCREENS.REGISTER && <RegisterScreen onRegister={registerUser} onBack={()=>setScreen(SCREENS.HOME)} loading={loading} initialTab="register"/>}
        {screen===SCREENS.LOGIN    && <RegisterScreen onRegister={registerUser} onBack={()=>setScreen(SCREENS.HOME)} loading={loading} initialTab="login"/>}
        {screen===SCREENS.PROFILE && user && <ProfileScreen user={user} onSave={saveProfile} onBack={()=>setScreen(SCREENS.HOME)} loading={loading}/>}
        {screen===SCREENS.QUIZ && currentQuiz && <QuizScreen quiz={currentQuiz} onFinish={finishQuiz}
          onWrong={(q)=>{
            if(!q) return;
            const insult=INSULTS[Math.floor(Math.random()*INSULTS.length)];
            const ending=INSULT_ENDINGS[Math.floor(Math.random()*INSULTS.length%INSULT_ENDINGS.length)];
            const correctAnswer=q.opts[q.a];
            const explanation = q?.explanation || `Správná odpověď je: "${correctAnswer}".`;
            setWrongData({insult,ending,correctAnswer,explanation});
          }}
          onCombo={(level,bonus)=>{
            setComboPopup({level,bonus,key:Date.now()});
            setTimeout(()=>setComboPopup(null),1200);
          }}
        />}
        {screen===SCREENS.RESULT && currentQuiz && <ResultScreen quiz={currentQuiz} timeSaved={currentQuiz.timeSaved||0} onHome={()=>setScreen(SCREENS.HOME)} onBoard={()=>setScreen(SCREENS.BOARD)}/>}
        {screen===SCREENS.BOARD && <BoardScreen scores={scores} user={user} todayKey={todayKey} monthlyChampions={monthlyChampions} quizMode={quizMode} onBack={()=>setScreen(SCREENS.HOME)}/>}
        {screen===SCREENS.STATS && user && <StatsScreen user={user} scores={scores} quizMode={quizMode} onBack={()=>setScreen(SCREENS.HOME)}/>}
        {screen===SCREENS.MINIGAMES && <MinigamesScreen user={user} onBack={()=>setScreen(SCREENS.HOME)} onScoreSaved={loadScores}/>}
        </>)}
      </div>
    </div>
  );
}

// ─── HOME ─────────────────────────────────────────────
function HomeScreen({ user, hasPlayedToday, hasPlayedOtherMode, hasPlayedModes, todayKey, todayQuestions, timeBonusToday, resumableQuiz, quizMode, onSwitchMode, onResume, onRegister, onLogin, onStart, onBoard, onStats, onMinigames, onLogout, onProfile, loading }) {
  const cats = todayQuestions && todayQuestions.length > 0
    ? [...new Set(todayQuestions.map(q=>q.cat).filter(c=>c!=='🎲 Lucky Box'))]
    : [];
  const isGeneral = quizMode === QUIZ_MODES.GENERAL;
  const isFilm    = quizMode === QUIZ_MODES.FILM;
  const otherMode = quizMode === QUIZ_MODES.IT ? QUIZ_MODES.GENERAL : QUIZ_MODES.IT;


  const modeColor = isFilm ? '#ff88cc' : isGeneral ? '#44cc88' : '#88aaff';
  const modeBorder = isFilm ? '#8a1a5a' : isGeneral ? '#226644' : '#1e3a6a';
  const modeBg = isFilm ? 'rgba(150,0,80,0.15)' : isGeneral ? 'rgba(0,80,40,0.15)' : 'rgba(30,60,160,0.15)';
  const modeTagBg = isFilm ? 'rgba(180,0,100,0.2)' : isGeneral ? 'rgba(0,100,50,0.25)' : 'rgba(40,80,200,0.25)';
  const modeTagBorder = isFilm ? '#8a1a5a' : isGeneral ? '#226644' : '#2a4a9a';
  const OS_LABELS = {linux:'🐧 Linux', windows:'🪟 Windows', macos:' macOS', bsd:'👹 BSD', arch:'💀 Arch (btw)'};
  const totalTime = QUIZ_DURATION + (timeBonusToday||0);
  const resumeProgress = resumableQuiz ? resumableQuiz.answers.length : 0;
  const resumeTotal = resumableQuiz ? resumableQuiz.questions.length : 0;

  // PWA install logika
  const [installable, setInstallable] = useState(!!window._pwaInstallPrompt);
  const [installed, setInstalled] = useState(
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true
  );
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  useEffect(() => {
    const onInstallable = () => setInstallable(true);
    const onAppInstalled = () => { setInstalled(true); setInstallable(false); };
    window.addEventListener('pwa-installable', onInstallable);
    window.addEventListener('appinstalled', onAppInstalled);
    return () => {
      window.removeEventListener('pwa-installable', onInstallable);
      window.removeEventListener('appinstalled', onAppInstalled);
    };
  }, []);

  async function handleInstall() {
    if (window._pwaInstallPrompt) {
      await window._pwaInstallPrompt.prompt();
      const result = await window._pwaInstallPrompt.userChoice;
      if (result.outcome === 'accepted') { setInstalled(true); setInstallable(false); }
      window._pwaInstallPrompt = null;
    }
  }

  // Zobraz install banner: jen mobil, není nainstalováno, buď installable nebo iOS
  const showInstallBanner = isMobile && !installed && (installable || isIOS);
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
      <div className="slide-in" style={{width:'100%',maxWidth:640,textAlign:'center',position:'relative'}}>

        {/* PWA Install Banner — jen mobil, jen pokud není nainstalováno */}
        {showInstallBanner && (
          <div style={{
            background:'linear-gradient(135deg,rgba(68,136,255,0.18),rgba(34,85,200,0.1))',
            border:'1px solid #4488ff66',borderRadius:12,
            padding:'12px 16px',marginBottom:20,
            display:'flex',alignItems:'center',gap:12,
          }}>
            <div style={{fontSize:26,flexShrink:0}}>📲</div>
            <div style={{flex:1,textAlign:'left'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#88aaff',marginBottom:2}}>Přidat na plochu</div>
              <div style={{fontSize:11,color:'#4a6a9a'}}>
                {isIOS
                  ? 'Klepni na Sdílet → Přidat na plochu'
                  : 'Nainstaluj appku pro rychlý přístup'}
              </div>
            </div>
            {!isIOS && (
              <button onClick={handleInstall} className="btn" style={{
                background:'linear-gradient(135deg,#1a3a8a,#2255cc)',
                padding:'8px 16px',borderRadius:8,fontSize:12,
                color:'#fff',letterSpacing:1,flexShrink:0,
              }}>INSTALOVAT</button>
            )}
            {isIOS && (
              <div style={{fontSize:20,flexShrink:0}}>⬆️</div>
            )}
          </div>
        )}

        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:6,color:'#4488ff',marginBottom:8,opacity:0.8}}>DAILY CHALLENGE</div>
        <h1 className="glow" style={{fontFamily:"'Orbitron', sans-serif",fontSize:'clamp(40px,9vw,80px)',fontWeight:900,letterSpacing:4,color:'#fff',lineHeight:1}}>
          INDY<span style={{color:'#4488ff'}}>Q</span>
        </h1>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:13,letterSpacing:2,color:'#7799cc',marginTop:8,marginBottom:20,fontWeight:600}}>KAŽDÝ DEN NOVÝ KVÍZ · NOVÉ OTÁZKY</div>

        {/* Přepínač módu */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:24,background:'rgba(10,15,40,0.6)',borderRadius:10,padding:4,border:'1px solid #1e2a4a',maxWidth:440,margin:'0 auto 24px'}}>
          {[{m:QUIZ_MODES.IT,l:'💻 IT'},{m:QUIZ_MODES.GENERAL,l:'🌍 Obecný'},{m:QUIZ_MODES.FILM,l:'🎬 Film'}].map(({m,l})=>{
            const played = hasPlayedModes && hasPlayedModes[m];
            const active = quizMode===m;
            return (
              <button key={m} onClick={()=>onSwitchMode(m)} style={{
                padding:'11px',borderRadius:8,border:'none',cursor:'pointer',
                fontFamily:'inherit',fontSize:13,fontWeight:700,
                transition:'all 0.2s',position:'relative',
                background: active ? 'linear-gradient(135deg,#1a3a8a,#2255cc)' : 'transparent',
                color: active ? '#fff' : '#4a5a7a',
                boxShadow: active ? '0 0 20px rgba(68,136,255,0.3)' : 'none',
              }}>
                {l}
                {/* Tečka — zelená pokud odehráno, pulsující oranžová pokud ne */}
                {user && (
                  <span style={{
                    position:'absolute',top:5,right:5,
                    width:7,height:7,borderRadius:'50%',
                    background: played ? '#44cc88' : '#ff9944',
                    animation: played ? 'none' : 'dotPulse 1.5s ease-in-out infinite',

          })}
        </div>

        <div style={{background:'rgba(10,15,40,0.8)',border:`1px solid ${modeBorder}`,borderRadius:16,overflow:'hidden',marginBottom:timeBonusToday>0?12:28}}>

          {/* Header — 15 otázek + celkový limit v jednom řádku */}
          <div style={{

            borderBottom:`1px solid ${modeBorder}`,
            background:modeBg,
            display:'flex',alignItems:'center',justifyContent:'center',gap:8,flexWrap:'wrap',

            <span style={{
              fontSize:12,fontWeight:700,padding:'5px 13px',borderRadius:20,whiteSpace:'nowrap',
              background:'rgba(255,180,0,0.12)',color:'#ffd700',border:'1px solid #7a5500',
            }}>📝 15 otázek</span>
            <span style={{color:'#2a3a5a',fontSize:16}}>·</span>
            <span style={{
              fontSize:12,fontWeight:700,padding:'5px 13px',borderRadius:20,whiteSpace:'nowrap',
              background:'rgba(255,100,50,0.12)',color:'#ff9966',border:'1px solid #7a3311',
            }}>⏱ Celkový limit {totalTime}s{timeBonusToday>0?` (+${timeBonusToday}s)`:''}</span>
          </div>

          {/* Témata — vycentrovaná */}
          <div style={{padding:'14px',borderBottom:'1px solid #1a2040',textAlign:'center'}}>
            <div style={{fontSize:11,fontWeight:700,color:modeColor,marginBottom:8,letterSpacing:1}}>
              {isFilm?'🎬':isGeneral?'🌍':'💻'} TÉMATA
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:5,justifyContent:'center'}}>
              {cats.map(c=>(
                <span key={c} style={{
                  fontSize:12,padding:'4px 11px',borderRadius:20,fontWeight:600,
                  background:modeTagBg,
                  color:modeColor,
                  border:`1px solid ${modeTagBorder}`,
                }}>{c}</span>
              ))}
            </div>
          </div>

          {/* Pravidla — tlumenější */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr'}}>
            {[
              {e:'⚡',l:'Body za otázku',v:'100 – 1 000'},
              {e:'🔥',l:'Kombo',v:'3–5× = +2 000'},
              {e:'💎',l:'Perfect run',v:'15/15 = +2 000'},
              {e:'🎁',l:'Lucky box',v:'−500 až +1 000'},
            ].map((r,i)=>(
              <div key={r.l} style={{
                padding:'9px 12px',display:'flex',alignItems:'center',gap:8,
                borderRight:i%2===0?'1px solid #151f3a':'none',
                borderBottom:i<2?'1px solid #151f3a':'none',
              }}>
                <span style={{fontSize:14,flexShrink:0,opacity:0.7}}>{r.e}</span>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:9,color:'#334455',marginBottom:1,letterSpacing:0.5}}>{r.l.toUpperCase()}</div>
                  <div style={{fontSize:11,fontWeight:600,color:'#6677aa',whiteSpace:'nowrap'}}>{r.v}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Time bonus banner */}
        {timeBonusToday > 0 && !hasPlayedToday && (
          <div style={{background:'rgba(0,80,50,0.4)',border:'1px solid #22cc88',borderRadius:10,padding:'12px 18px',marginBottom:24,display:'flex',alignItems:'center',gap:12,justifyContent:'center'}}>
            <span style={{fontSize:22}}>⏰</span>
            <div style={{textAlign:'left'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#44ffaa',letterSpacing:0.5}}>Máš {timeBonusToday}s bonusový čas!</div>
              <div style={{fontSize:11,color:'#338866'}}>Ušetřils ho včera dokončením kvízu dřív. Dnes ho využij.</div>
            </div>
          </div>
        )}

        {/* Resume banner — rozehraný kvíz */}
        {user && resumableQuiz && !hasPlayedToday && (
          <div style={{
            background:'linear-gradient(135deg,rgba(68,136,255,0.18),rgba(34,85,200,0.1))',
            border:'1px solid #4488ff88', borderRadius:12,
            padding:'14px 18px', marginBottom:16,
            display:'flex', alignItems:'center', gap:14,

// ─── PROFIL SCREEN ────────────────────────────────────
function ProfileScreen({ user, onSave, onBack, loading }) {
  const [profile, setProfile] = useState({
    company: user.company||'', position: user.position||'',
    fav_hw: user.fav_hw||'', os_religion: user.os_religion||'',
    coffee_cups: user.coffee_cups||'', debug_style: user.debug_style||'',
    superpower: user.superpower||'',
  });
  const [avatarPreview, setAvatarPreview] = useState(user.avatar_url ? avatarSrc(user.avatar_url) : null);
  const [avatarFile, setAvatarFile] = useState(null);     // komprimovaný Blob
  const [avatarUploading, setAvatarUploading] = useState(false);
  const [avatarError, setAvatarError] = useState('');
  const [avatarSize, setAvatarSize] = useState('');       // info o velikosti pro UI
  const fileRef = useRef(null);

  // Změna hesla
  const [showPwd, setShowPwd] = useState(false);
  const [oldPwd, setOldPwd] = useState('');
  const [newPwd, setNewPwd] = useState('');
  const [newPwd2, setNewPwd2] = useState('');
  const [pwdMsg, setPwdMsg] = useState('');
  const [pwdLoading, setPwdLoading] = useState(false);

  async function changePassword() {
    if (!oldPwd) { setPwdMsg('Zadej staré heslo.'); return; }
    if (newPwd.length < 4) { setPwdMsg('Nové heslo musí mít aspoň 4 znaky.'); return; }
    if (newPwd !== newPwd2) { setPwdMsg('Nová hesla se neshodují.'); return; }
    setPwdLoading(true); setPwdMsg('');
    try {
      const { data: ok } = await db.rpc('verify_password', { p_name: user.name, p_password: oldPwd });
      if (!ok || ok.length === 0) { setPwdMsg('❌ Staré heslo je špatně.'); setPwdLoading(false); return; }
      // Použij ID z verify_password výsledku (ne z localStorage — může být zastaralé)
      const userId = ok[0].id || user.id;
      const { error } = await db.rpc('change_password', { p_user_id: userId, p_new_password: newPwd });
      if (error) { setPwdMsg('❌ Chyba: ' + error.message); }
      else { setPwdMsg('✅ Heslo bylo změněno!'); setOldPwd(''); setNewPwd(''); setNewPwd2(''); setShowPwd(false); }
    } catch(e) { setPwdMsg('❌ Chyba připojení.'); }
    setPwdLoading(false);
  }

  function pickFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { setAvatarError('Pouze obrázky (JPG, PNG, WebP)'); return; }
    setAvatarError('');
    // Komprimuj pomocí Canvas — max 800px, JPEG 0.82
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => {
      img.onload = () => {
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          setAvatarFile(blob);
          setAvatarSize(`${(blob.size/1024).toFixed(0)} KB`);
          setAvatarPreview(canvas.toDataURL('image/jpeg', 0.82));
        }, 'image/jpeg', 0.82);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function handleSave() {
    let avatarUrl = user.avatar_url ? user.avatar_url.split('?')[0] : null;
    if (avatarFile) {
      setAvatarUploading(true);
      try {
        const path = `${user.id}/avatar`;
        const { error: upErr } = await db.storage
          .from('avatars')
          .upload(path, avatarFile, { upsert: true, contentType: 'image/jpeg' });
        if (upErr) { setAvatarError('Upload selhal: ' + upErr.message); setAvatarUploading(false); return; }
        const { data: urlData } = db.storage.from('avatars').getPublicUrl(path);
        avatarUrl = urlData.publicUrl;
      } catch(e) { setAvatarError('Upload selhal'); setAvatarUploading(false); return; }
      setAvatarUploading(false);
    }
    onSave({ ...profile, avatar_url: avatarUrl });
  }

  const isWorking = loading || avatarUploading;

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'20px',overflowY:'auto'}}>
      <div className="slide-in" style={{width:'100%',maxWidth:480,textAlign:'center',paddingTop:30,paddingBottom:30}}>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,letterSpacing:4,color:'#4488ff',marginBottom:16}}>PROFIL HRÁČE</div>

        {/* AVATAR PICKER */}
        <div style={{marginBottom:20,display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
          <div className="avatar-upload-wrap" onClick={()=>fileRef.current?.click()}
            style={{width:96,height:96,borderRadius:'50%',border:`2px solid ${avatarPreview?'#4488ff':'#2a3a6a'}`,overflow:'hidden',flexShrink:0,background:'#0d1428'}}>
            {avatarPreview
              ? <img src={avatarPreview} alt="avatar" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:36,color:'#2a3a6a'}}>👤</div>
            }
            <div className="avatar-overlay">📷</div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={pickFile}/>
          <button onClick={()=>fileRef.current?.click()} style={{background:'transparent',border:'1px solid #2a3a6a',color:'#4488ff',fontSize:11,padding:'5px 16px',borderRadius:20,cursor:'pointer',fontFamily:'inherit',letterSpacing:1}}>
            {avatarPreview ? '📷 ZMĚNIT FOTKU' : '📷 PŘIDAT FOTKU'}
          </button>
          {avatarError && <div style={{color:'#ff4444',fontSize:11}}>{avatarError}</div>}
          <div style={{fontSize:10,color:'#334455'}}>
            {avatarSize ? `Zkomprimováno na ${avatarSize} ✓` : 'Jakákoliv velikost · JPG, PNG, WebP · automaticky zkomprimováno'}
          </div>
        </div>

        <div style={{fontSize:20,fontWeight:700,color:'#fff',marginBottom:4}}>{user.name}</div>
        {user.company && <div style={{fontSize:13,color:'#556688',marginBottom:10}}>{user.company}{user.position?` · ${user.position}`:''}</div>}

        {/* Vtipný fakt */}
        <div style={{background:'rgba(68,136,255,0.06)',border:'1px dashed #2a3a6a',borderRadius:10,padding:'10px 14px',marginBottom:18,display:'flex',gap:10,alignItems:'flex-start',textAlign:'left'}}>
          <span style={{fontSize:18,flexShrink:0}}>💡</span>
          <div style={{fontSize:12,color:'#556688',lineHeight:1.55,fontStyle:'italic'}}>{getPlayerFact(user.name)}</div>
        </div>

        <div style={{background:'rgba(20,35,80,0.6)',border:'1px solid #2a3a6a',borderRadius:12,padding:24,textAlign:'left'}}>
          <ProfileFields profile={profile} setProfile={setProfile}/>
          <button className="btn" onClick={handleSave} disabled={isWorking}
            style={{marginTop:20,width:'100%',background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'13px',borderRadius:8,fontSize:14,color:'#fff',letterSpacing:3}}>
            {avatarUploading ? '📤 NAHRÁVÁM FOTKU...' : loading ? 'UKLÁDÁM...' : '💾 ULOŽIT PROFIL'}
          </button>
        </div>

        {/* Změna hesla */}
        <div style={{background:'rgba(20,35,80,0.4)',border:'1px solid #2a3a6a',borderRadius:12,padding:20,textAlign:'left',marginTop:12}}>
          <button onClick={()=>{setShowPwd(v=>!v);setPwdMsg('');}} style={{
            background:'transparent',border:'none',color:'#88aaff',
            fontSize:13,cursor:'pointer',letterSpacing:1,padding:0,
          }}>🔑 {showPwd ? '▲ Skrýt změnu hesla' : '▼ Změnit heslo'}</button>

          {showPwd && (
            <div style={{marginTop:14}}>
              <div className="field-label">Staré heslo</div>
              <input type="password" value={oldPwd} onChange={e=>setOldPwd(e.target.value)} placeholder="Tvé současné heslo..." maxLength={50}/>
              <div className="field-label" style={{marginTop:10}}>Nové heslo</div>
              <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Min. 4 znaky..." maxLength={50}/>
              <div className="field-label" style={{marginTop:10}}>Nové heslo znovu</div>
              <input type="password" value={newPwd2} onChange={e=>setNewPwd2(e.target.value)} onKeyDown={e=>e.key==='Enter'&&changePassword()} placeholder="Zopakuj nové heslo..." maxLength={50}/>
              {pwdMsg && <div style={{fontSize:12,marginTop:8,color:pwdMsg.startsWith('✅')?'#44ffaa':'#ff6666'}}>{pwdMsg}</div>}
              <button className="btn" onClick={changePassword} disabled={pwdLoading}
                style={{marginTop:14,width:'100%',background:'linear-gradient(135deg,#1a2a5a,#2244aa)',padding:'11px',borderRadius:8,fontSize:13,color:'#fff',letterSpacing:2}}>
                {pwdLoading ? 'MĚNÍM...' : '🔑 ZMĚNIT HESLO'}
              </button>
            </div>
          )}
        </div>

        <button onClick={onBack} style={{marginTop:14,background:'transparent',border:'none',color:'#334455',fontSize:12,cursor:'pointer',letterSpacing:1}}>← ZPĚT</button>
      </div>
    </div>
  );
}

function RegisterScreen({ onRegister, onBack, loading, initialTab='login' }) {
  const [tab, setTab] = useState(initialTab); // 'login' | 'register'
  const [name, setName] = useState('');
  const [password, setPassword] = useState('');
  const [showProfile, setShowProfile] = useState(false);
  const [profile, setProfile] = useState({company:'',position:'',fav_hw:'',os_religion:'',coffee_cups:'',debug_style:'',superpower:''});
  const [err, setErr] = useState('');

  function reset() { setName(''); setPassword(''); setErr(''); setShowProfile(false); }

  function submit() {
    const n = name.trim(), p = password.trim();
    if (!n || n.length < 2) { setErr('Aspoň 2 znaky pro jméno!'); return; }
    if (n.length > 20) { setErr('Max 20 znaků!'); return; }
    if (!p || p.length < 4) { setErr('Heslo musí mít alespoň 4 znaky!'); return; }
    // Přihlášení = onRegister bez profilu (backend pozná existující účet)
    // Registrace = onRegister s profilem
    onRegister(n, p, tab === 'register' ? profile : null);
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:20,overflowY:'auto'}}>
      <div className="slide-in" style={{width:'100%',maxWidth:440,textAlign:'center',paddingTop:40,paddingBottom:30}}>

            <button key={t.k} onClick={()=>{setTab(t.k);reset();}} style={{
              padding:'10px',borderRadius:8,border:'none',cursor:'pointer',
              fontFamily:'inherit',fontSize:13,fontWeight:700,letterSpacing:0.5,
              transition:'all 0.2s',
              background: tab===t.k ? 'linear-gradient(135deg,#1a3a8a,#2255cc)' : 'transparent',
              color: tab===t.k ? '#fff' : '#4a5a7a',
              boxShadow: tab===t.k ? '0 0 20px rgba(68,136,255,0.3)' : 'none',
            }}>{t.l}</button>
          ))}
        </div>

        <div style={{background:'rgba(20,35,80,0.6)',border:'1px solid #2a3a6a',borderRadius:12,padding:24,textAlign:'left'}}>
          {tab === 'login' ? (
            <>
              <div style={{fontSize:12,color:'#445566',marginBottom:16,lineHeight:1.5}}>
                Zadej přezdívku a heslo svého účtu.
              </div>
              <div className="field-label">Přezdívka</div>
              <input value={name} onChange={e=>{setName(e.target.value);setErr('');}} placeholder="Tvá přezdívka..." maxLength={20} autoFocus/>
              <div className="field-label" style={{marginTop:12}}>Heslo</div>
              <input type="password" value={password} onChange={e=>{setPassword(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="Heslo..." maxLength={50}/>

            <>

              </div>
              <div className="field-label">Přezdívka</div>
              <input value={name} onChange={e=>{setName(e.target.value);setErr('');}} placeholder="Tvá přezdívka..." maxLength={20} autoFocus/>
              <div className="field-label" style={{marginTop:12}}>Heslo</div>
              <input type="password" value={password} onChange={e=>{setPassword(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&submit()} placeholder="Zvol si heslo..." maxLength={50}/>
              <button onClick={()=>setShowProfile(!showProfile)} style={{marginTop:14,background:'transparent',border:'1px dashed #2a3a6a',color:'#4488ff',padding:'8px 16px',borderRadius:8,cursor:'pointer',fontSize:12,width:'100%',letterSpacing:1}}>
                {showProfile?'▲ SKRÝT PROFIL':'▼ VYPLNIT PROFIL (nepovinné)'}
              </button>
              {showProfile && <ProfileFields profile={profile} setProfile={setProfile}/>}
            </>
          )}

          {err && <div style={{color:'#ff4444',fontSize:12,marginTop:10,textAlign:'center'}}>{err}</div>}
          <button className="btn" onClick={submit} disabled={loading}
            style={{marginTop:18,width:'100%',background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'13px',borderRadius:8,fontSize:14,color:'#fff',letterSpacing:3,textAlign:'center'}}>
            {loading ? 'NAČÍTÁM...' : tab==='login' ? '↩ PŘIHLÁSIT SE' : '✦ VYTVOŘIT ÚČET'}
          </button>
        </div>

        <button onClick={onBack} style={{marginTop:14,background:'transparent',border:'none',color:'#334455',fontSize:12,cursor:'pointer',letterSpacing:1}}>← ZPĚT</button>
      </div>
    </div>
  );
}

// ─── LUCKY BOX SLOT ─────────────────────────────────
function LuckyBoxSlot({ prizes, onPick, locked }) {
  const [opened, setOpened] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const calledRef = useRef(false);

  const prizeColor = (pts) => pts >= 500 ? '#ffd700' : pts >= 100 ? '#44ff88' : pts === 0 ? '#8899bb' : '#ff4444';
  const prizeLabel = (pts) => pts > 0 ? `+${pts}` : String(pts);

  function pick(i) {
    if (locked || opened !== null || calledRef.current) return;
    calledRef.current = true;
    setOpened(i);
    setTimeout(() => setRevealed(true), 800);
    setTimeout(() => onPick(prizes[i]), 900); // volej onPick ihned po odkrytí
  }


  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16,paddingBottom:20}}>
      {opened === null && (
        <div style={{textAlign:'center',color:'#556688',fontSize:13,animation:'slideIn 0.4s ease'}}>
          Jedna bedna skrývá jackpot. Jedna zkázu. Vyber moudře... nebo vůbec ne.
        </div>
      )}

      {/* Truhličky */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,width:'100%',maxWidth:380}}>
        {prizes.map((pts, i) => {
          const isThis = opened === i;
          const col = prizeColor(pts);
          const isPositive = pts > 0;
          const isJackpot = pts === 1000;
          const isBomb = pts === -500;
          const showContent = isThis || (opened !== null);

          return (
            <button key={i} className="chest-btn" onClick={() => pick(i)}
              disabled={locked || opened !== null}
              style={{
                padding:'22px 12px', borderRadius:16,
                border: isThis ? `2px solid ${col}` : opened !== null ? `1px solid #1e2a4a` : '2px solid #2a3a6a',
                background: isThis
                  ? `rgba(${isPositive?'0,80,40':'80,0,0'},0.4)`
                  : opened !== null ? 'rgba(10,15,40,0.6)' : 'rgba(15,25,60,0.85)',
                display:'flex', flexDirection:'column', alignItems:'center', gap:10,
                animation: isThis ? 'chestOpen 0.5s ease forwards' : 'none',
                boxShadow: isThis && isJackpot ? '0 0 40px #ffd700aa' : 'none',
                transition:'all 0.3s',
                opacity: opened !== null && !isThis ? 0.6 : 1,
              }}>
              <div style={{
                fontSize: isThis ? 52 : 38, lineHeight:1,
                animation: isThis ? 'chestShake 0.4s ease' : 'none',
                filter: isThis ? `drop-shadow(0 0 12px ${col})` : 'none',
              }}>
                {opened !== null
                  ? (isThis
                      ? (isJackpot ? '🏆' : isBomb ? '💣' : isPositive ? '💰' : '🪦')
                      : '📦')
                  : '📦'}
              </div>

              {/* Hodnota po výběru — vždy zobrazit */}
              {opened !== null && (
                <div style={{
                  fontSize: isThis ? 22 : 15,
                  fontWeight:900, color: isThis ? col : '#445566',
                  fontFamily:"'Orbitron',sans-serif", letterSpacing:1,
                  animation: isThis && revealed ? 'prizePop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards' : 'none',
                  opacity: (!isThis || revealed) ? 1 : 0,
                }}>
                  {prizeLabel(pts)}
                </div>
              )}

              {/* Číslo bedny před výběrem */}
              {opened === null && (
                <div style={{fontSize:11,color:'#445566',letterSpacing:2}}>#{i+1}</div>
              )}
            </button>
          );
        })}
      </div>

      {/* Reakce po výběru */}
      {opened !== null && revealed && (
        <div className="slide-in" style={{
          textAlign:'center', padding:'12px 18px', maxWidth:380, width:'100%',
          background:'rgba(20,30,70,0.7)', border:'1px solid #2a3a6a', borderRadius:12,
        }}>
          <div style={{fontSize:14, color: prizeColor(prizes[opened]), fontWeight:600, lineHeight:1.5, marginBottom:6}}>
            {getLuckyReaction(prizes[opened])}
          </div>
          <div style={{fontSize:11, color:'#4a5a7a'}}>přechod na výsledky...</div>
        </div>
      )}

      {opened !== null && !revealed && (
        <div style={{color:'#4a6a9a',fontSize:13}}>otvírám...</div>
      )}
    </div>
  );
}

// ─── QUIZ ─────────────────────────────────────────────
function QuizScreen({ quiz: initQuiz, onFinish, onWrong, onCombo }) {
  const [quiz, setQuiz] = useState({...initQuiz});
  const quizRef = useRef({...initQuiz}); // vždy aktuální kopie stavu
  const [selected, setSelected] = useState(null);
  const [locked, setLocked] = useState(false);
  const [flash, setFlash] = useState(null);
  const [paused, setPaused] = useState(false);
  const [comboCount, setComboCount] = useState(0);
  const timer = useRef(null);
  const pausedRef = useRef(false);
  const pendingRef = useRef(null);
  // Používáme refy pro věci, kde nechceme stale closure:
  const timeLeftRef = useRef(initQuiz.timeLeft);
  const questionStartTimeRef = useRef(initQuiz.timeLeft);
  const comboCountRef = useRef(0);
  const playLogRef = useRef([]); // log každé odpovědi pro anti-cheat

  const q = quiz.questions[quiz.current];

  // Globální resume callback pro App overlay
  useEffect(() => {
    window._quizResumeCallback = () => {
      if (!pausedRef.current) return;
      pausedRef.current = false;
      setPaused(false);
      if (pendingRef.current) {
        const { idx, qSnap, answers, totalScore, current, questionsLen, allQuestions } = pendingRef.current;
        pendingRef.current = null;
        const newAns = [...answers, {q: qSnap.id, chosen: idx, correct: false, pts: 0, comboBonus: 0}];
        const next = current + 1;
        if (next >= questionsLen) {
          clearInterval(timer.current);
          onFinish({ questions: allQuestions, answers: newAns, totalScore, current: next, timeLeft: 0, playLog: playLogRef.current });
        } else {
          setFlash(null);
          // Reset komba a start time pro novou otázku
          comboCountRef.current = 0;
          setComboCount(0);
          questionStartTimeRef.current = timeLeftRef.current;
          setQuiz(p => {
            const updated = {...p, answers: newAns, current: next};
            saveActiveQuiz({...updated, timeLeft: timeLeftRef.current}, initQuiz.quiz_mode);
            return updated;
          });
          setSelected(null);
          setLocked(false);
        }
      }
    };
    return () => { window._quizResumeCallback = null; };
  }, []); // prázdné deps — používáme jen refy

  // Hlavní timer — tick každou sekundu
  useEffect(() => {
    timer.current = setInterval(() => {
      if (pausedRef.current) return;
      setQuiz(prev => {
        const newTime = prev.timeLeft - 1;
        timeLeftRef.current = newTime; // sync ref
        if (newTime <= 0) {
          clearInterval(timer.current);
          onFinish({...prev, timeLeft: 0, playLog: playLogRef.current});
          return {...prev, timeLeft: 0};
        }
        return {...prev, timeLeft: newTime};
      });
    }, 1000);
    return () => clearInterval(timer.current);
  }, []);

  function answer(idx) {
    if (locked) return;
    setLocked(true);
    setSelected(idx);
    const ok = idx === q.a;
    setFlash(ok ? 'ok' : 'no');

    // Kombo: čas strávený na otázce = čas při začátku - čas při odpovědi
    const timeSpent = questionStartTimeRef.current - timeLeftRef.current;
    const isQuick = ok && timeSpent <= COMBO_TIME_LIMIT;

    if (!ok) {
      // Zaznamenej špatnou odpověď do play logu
      playLogRef.current.push({
        qId: q.id,
        chosen: idx,
        chosenText: q.opts[idx], // uložíme přímo text odpovědi
        correct: false,
        time_spent: questionStartTimeRef.current - timeLeftRef.current,
        time_left: timeLeftRef.current,
        pts: 0,
      });
      // Reset komba, zastavit timer, zobrazit overlay
      comboCountRef.current = 0;
      setComboCount(0);
      pausedRef.current = true;
      setPaused(true);
      pendingRef.current = {
        idx, qSnap: q,
        answers: quiz.answers, totalScore: quiz.totalScore,
        current: quiz.current, questionsLen: quiz.questions.length, allQuestions: quiz.questions,
      };
      onWrong(q);
    } else {
      // Správná odpověď
      const newCombo = isQuick ? comboCountRef.current + 1 : 1;
      comboCountRef.current = newCombo;
      setComboCount(newCombo);

      let bonus = 0;
      if (newCombo === 3) bonus = COMBO3_BONUS;
      else if (newCombo === 4) bonus = COMBO4_BONUS;
      else if (newCombo >= 5) bonus = COMBO5_BONUS;

      if (bonus > 0) onCombo(Math.min(newCombo, 5), bonus);

      const pts = calcPoints(timeLeftRef.current) + bonus;
      // Zaznamenej odpověď do play logu
      playLogRef.current.push({
        qId: q.id,
        chosen: idx,
        chosenText: q.opts[idx], // uložíme přímo text odpovědi
        correct: true,
        time_spent: questionStartTimeRef.current - timeLeftRef.current,
        time_left: timeLeftRef.current,
        pts,
      });

      setTimeout(() => {
        setFlash(null);
        const newAns = [...quiz.answers, {q: q.id, chosen: idx, correct: true, pts, comboBonus: bonus}];
        const newScore = quiz.totalScore + pts;
        const next = quiz.current + 1;
        if (next >= quiz.questions.length) {
          clearInterval(timer.current);
          onFinish({...quiz, answers: newAns, totalScore: newScore, current: next, playLog: playLogRef.current});
        } else {
          // Reset start time pro novou otázku
          questionStartTimeRef.current = timeLeftRef.current;
          setQuiz(p => {
            const updated = {...p, answers: newAns, totalScore: newScore, current: next};
            saveActiveQuiz({...updated, timeLeft: timeLeftRef.current}, initQuiz.quiz_mode);
            return updated;
          });
          setSelected(null);
          setLocked(false);
        }
      }, 600);
    }
  }

  const isLucky = q && q.type === 'lucky';

  // quizRef — synchronizujeme při každém renderu (ne jen v useEffect)
  quizRef.current = quiz;

  // Lucky Box handler
  const luckyCalledRef = useRef(false);
  function answerLucky(pts) {
    if (luckyCalledRef.current) return;
    luckyCalledRef.current = true;
    clearInterval(timer.current);
    comboCountRef.current = 0;
    setComboCount(0);

    const logEntry = {
      qId: 'lucky', chosen: pts, correct: pts > 0,
      time_spent: Math.max(0, questionStartTimeRef.current - timeLeftRef.current),
      time_left: timeLeftRef.current, pts: Math.max(pts, 0),
    };
    playLogRef.current.push(logEntry);

    // Použij quizRef.current — synchronizuje se přímo v render (ne v useEffect)
    const q = quizRef.current;
    const newAnswers = [...(q.answers||[]), {q:'lucky', chosen:pts, correct:pts>0, pts:Math.max(pts,0), luckyPts:pts, comboBonus:0}];
    const newScore = Math.max((q.totalScore||0) + pts, 0);

    // Přejdi na výsledky po 1200ms (čas na zobrazení reakce)
    setTimeout(() => {
      onFinish({
        ...q,
        answers: newAnswers,
        totalScore: newScore,
        current: (q.current||0) + 1,
        playLog: playLogRef.current,
      });
    }, 1200);
  }

  const totalDuration = initQuiz.totalDuration || QUIZ_DURATION;
  const tc = quiz.timeLeft > 30 ? '#4488ff' : quiz.timeLeft > 10 ? '#ffaa22' : '#ff3333';
  const labels = ['A','B','C','D'];
  const COMBO_CFG = {3:{c:'#ff9900',e:'🔥×3'},4:{c:'#aa44ff',e:'⚡×4'},5:{c:'#ff2255',e:'💥×5+'}};
  const comboCfg = comboCount >= 3 ? (COMBO_CFG[Math.min(comboCount,5)] || COMBO_CFG[5]) : null;

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',padding:20,maxWidth:660,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:20,marginBottom:16}}>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:2,color: isLucky?'#ffd700':'#556688'}}>
          {isLucky ? '🎲 LUCKY BOX' : `OTÁZKA ${quiz.current+1}/${quiz.questions.length}`}
        </div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:30,fontWeight:900,color:paused?'#556688':tc,letterSpacing:2,textShadow:paused?'none':`0 0 15px ${tc}`,transition:'color 0.3s'}}>
          {paused ? <span style={{fontSize:20}}>⏸ {quiz.timeLeft}s</span> : `${quiz.timeLeft}s`}
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:13,color:'#88aaff',letterSpacing:1}}>{quiz.totalScore.toLocaleString()} b</div>
          {comboCfg && (
            <div style={{fontSize:12,fontWeight:700,color:comboCfg.c,animation:'counterBump 0.3s ease',letterSpacing:1}}>
              {comboCfg.e}
            </div>
          )}
          {!comboCfg && comboCount >= 2 && (
            <div style={{fontSize:11,color:'#445566'}}>🔥×{comboCount}</div>
          )}
        </div>
      </div>
      <div style={{background:'#1a2040',borderRadius:4,height:4,marginBottom:6,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(quiz.current/quiz.questions.length)*100}%`,background:'linear-gradient(90deg,#2255cc,#4488ff)',transition:'width 0.3s'}}/>
      </div>
      <div style={{background:'#1a2040',borderRadius:4,height:4,marginBottom:22,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(quiz.timeLeft/totalDuration)*100}%`,background:paused?'#556688':tc,transition:paused?'none':'width 1s linear',boxShadow:paused?'none':`0 0 6px ${tc}`}}/>
      </div>
      <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,letterSpacing:3,color: isLucky?'#ffd700':'#4488ff',marginBottom:10,textAlign:'center'}}>{q.cat}</div>
      <div className="slide-in" style={{background: isLucky ? 'linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,140,0,0.06))' : flash==='ok'?'rgba(0,70,0,0.35)':flash==='no'?'rgba(70,0,0,0.35)':'rgba(15,28,70,0.65)',border:`1px solid ${isLucky?'#ffd70066':flash==='ok'?'#22aa22':flash==='no'?'#aa2222':'#2a3a6a'}`,borderRadius:16,padding:'22px 22px 18px',marginBottom:18,transition:'all 0.3s'}}>
        {isLucky && <div style={{textAlign:'center',fontSize:36,marginBottom:10}}>🎲</div>}
        {q.img && !isLucky && <div style={{textAlign:'center',fontSize:44,marginBottom:14}}>{q.img}</div>}
        {q.hint && <div style={{fontSize:11,color:'#556688',marginBottom:10,textAlign:'center'}}>{q.hint}</div>}
        <div style={{fontSize:'clamp(15px,2.4vw,19px)',fontWeight: isLucky?700:500,lineHeight:1.55,textAlign:'center',color: isLucky?'#ffd700':'#ddeeff'}}>{q.q}</div>
        {isLucky && <div style={{textAlign:'center',fontSize:11,color:'#cc9900',marginTop:8,letterSpacing:0.5}}>Ceny: od -500 až +1000 bodů</div>}
      </div>

      {/* Lucky Box nebo klasické odpovědi */}
      {isLucky
        ? <LuckyBoxSlot prizes={q.prizes} onPick={answerLucky} locked={locked}/>
        : <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,flex:1}}>
            {q.opts.map((opt,i)=>{
              let bg='rgba(12,20,52,0.85)',br='#2a3a6a',col='#dde8ff';
              if(selected!==null){ if(i===q.a){bg='rgba(0,70,0,0.55)';br='#22aa22';col='#aaffaa';} else if(i===selected&&selected!==q.a){bg='rgba(70,0,0,0.55)';br='#aa2222';col='#ffaaaa';} }
              return (
                <button key={i} onClick={()=>answer(i)} disabled={locked} style={{background:bg,border:`1px solid ${br}`,borderRadius:10,padding:'13px 11px',cursor:locked?'default':'pointer',color:col,fontFamily:'inherit',textAlign:'left',transition:'all 0.2s',fontSize:'clamp(13px,1.9vw,15px)',fontWeight:600,letterSpacing:0.3,lineHeight:1.45,display:'flex',alignItems:'center',gap:9}}
                  onMouseEnter={e=>{if(!locked)e.currentTarget.style.borderColor='#4488ff';}}
                  onMouseLeave={e=>{if(!locked)e.currentTarget.style.borderColor=br;}}>
                  <span style={{minWidth:22,height:22,background:'rgba(68,136,255,0.18)',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#4488ff',flexShrink:0}}>{labels[i]}</span>
                  {opt}
                </button>
              );
            })}
          </div>
      }
    </div>
  );
}

            <div style={{textAlign:'left',flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:'#44ffaa',marginBottom:3}}>
                Dokončil jsi kvíz s {timeSaved}s předstihem!
              </div>
              <div style={{fontSize:11,color:'#338866',lineHeight:1.5}}>
                Zítra dostaneš <strong style={{color:'#44ffaa'}}>+{bonusNextDay}s bonusový čas</strong> (celkem {QUIZ_DURATION+bonusNextDay}s).
              </div>
            </div>
          </div>
        )}

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:16}}>
          {[{l:'Správně',v:`${correct}/${quiz.questions.length}`,c: isPerfect?'#ffd700':'#22aa22'},{l:'Přesnost',v:`${pct}%`,c:g.c},{l:'Body',v:quiz.totalScore.toLocaleString(),c:'#4488ff'}].map(s=>(
            <div key={s.l} style={{background: isPerfect&&s.l==='Správně'?'rgba(255,215,0,0.1)':'rgba(20,35,80,0.6)',border:`1px solid ${isPerfect&&s.l==='Správně'?'#ffd700':'#2a3a6a'}`,borderRadius:10,padding:'14px 6px'}}>
              <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:10,color:'#556688',letterSpacing:1,marginTop:3}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{background:'rgba(8,12,35,0.85)',border:'1px solid #1a2a5a',borderRadius:12,padding:14,marginBottom:20,maxHeight:200,overflowY:'auto',textAlign:'left'}}>
          {quiz.answers.map((a,i)=>{
            const q2 = quiz.questions[i];
            const isLuckyAns = a.q === 'lucky';
            const luckyPts = a.luckyPts;
            const luckyCol = luckyPts > 0 ? '#ffd700' : luckyPts < 0 ? '#ff4444' : '#8899bb';
            return (
              <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid #121830',fontSize:11}}>
                <span>{isLuckyAns ? '🎲' : a.correct ? '✅' : '❌'}</span>
                <span style={{color: isLuckyAns ? '#8866aa' : '#7788aa',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  {q2 ? q2.q.slice(0,46)+(q2.q.length>46?'…':'') : '?'}
                </span>
                <span style={{
                  color: isLuckyAns ? luckyCol : a.correct ? '#44ff44' : '#ff4444',
                  fontWeight:700, minWidth:70, textAlign:'right',
                }}>
                  {isLuckyAns
                    ? (luckyPts > 0 ? `+${luckyPts}` : luckyPts === 0 ? '0' : String(luckyPts))
                    : a.correct ? `+${a.pts}${a.comboBonus>0?' 🔥':''}` : '0'
                  }
                </span>
              </div>
            );
          })}
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button className="btn" onClick={onBoard} style={{background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'13px 26px',borderRadius:10,fontSize:12,color:'#fff',letterSpacing:2}}>🏆 ŽEBŘÍČEK</button>
          <button className="btn" onClick={onHome} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'13px 26px',borderRadius:10,fontSize:12,color:'#88aaff',letterSpacing:2}}>← DOMŮ</button>
        </div>
      </div>
    </div>
  );
}

// ─── ARCHIVE ROW ─────────────────────────────────────────
function ArchiveRow({ s }) {
  const [open, setOpen] = useState(false);
  const isPerfect = s.perfect;
  const hasLog = s.play_log && s.play_log.length > 0;

  // Vyber správný pool podle módu záznamu
  const qPool = (s.quiz_mode || QUIZ_MODES.IT) === QUIZ_MODES.GENERAL ? ALL_GENERAL_QUESTIONS
              : (s.quiz_mode || QUIZ_MODES.IT) === QUIZ_MODES.FILM    ? ALL_FILM_QUESTIONS
              : ALL_QUESTIONS;

  // Lucky Box se nepočítá do otázek — odfiltruj ho
  const normalLog   = hasLog ? s.play_log.filter(e => e.qId !== 'lucky') : [];
  const luckyLog    = hasLog ? s.play_log.filter(e => e.qId === 'lucky')  : [];
  // Použij uložený total z DB jako základ, play_log jako doplněk
  const storedTotal = s.total > 0 ? s.total : 15;
  const totalNormal = hasLog ? Math.max(normalLog.length, storedTotal) : storedTotal;
  const correctN    = hasLog ? normalLog.filter(e => e.correct).length : s.correct;
  const pct         = totalNormal > 0 ? Math.round((correctN / totalNormal) * 100) : 0;
  const col         = pct >= 80 ? '#44ffaa' : pct >= 60 ? '#ffd700' : '#ff8844';
  const luckyPts    = luckyLog.length > 0 ? (luckyLog[0].chosen || 0) : null;

  return (
    <div style={{marginBottom:6}}>
      {/* Hlavička */}
      <div onClick={()=>setOpen(o=>!o)} style={{
        display:'flex',alignItems:'center',gap:10,
        padding:'10px 14px',cursor:'pointer',
        background: open ? 'rgba(20,35,80,0.9)' : 'rgba(12,18,52,0.8)',
        border:`1px solid ${open?'#4488ff':'#2a3a6a'}`,
        borderRadius: open ? '8px 8px 0 0' : 8,
        transition:'all 0.15s',
      }}>
        <div style={{fontSize:11,color:'#445566',minWidth:72,flexShrink:0}}>{s.date}</div>
        <div style={{flex:1,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:11,fontWeight:700,color:col}}>{correctN}/{totalNormal} správně ({pct}%)</span>
          {isPerfect && <span style={{fontSize:9,color:'#ffd700',background:'rgba(255,215,0,0.1)',border:'1px solid #ffd70044',borderRadius:10,padding:'1px 7px'}}>💎 PERFECT</span>}
          {luckyPts !== null && <span style={{fontSize:9,color: luckyPts>0?'#ffd700':luckyPts<0?'#ff4444':'#8899bb',background:'rgba(100,50,200,0.1)',border:'1px solid #bb44ff44',borderRadius:10,padding:'1px 7px'}}>🎲 {luckyPts>0?'+':''}{luckyPts}</span>}
          {s.time_saved>0 && <span style={{fontSize:9,color:'#44ffaa',background:'rgba(0,80,50,0.2)',border:'1px solid #44ffaa33',borderRadius:10,padding:'1px 7px'}}>⏰ +{s.time_saved}s</span>}
        </div>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,fontWeight:900,color:'#4488ff',flexShrink:0}}>{s.score.toLocaleString()}</div>
        <div style={{fontSize:10,color:'#445566',transition:'transform 0.2s',transform:open?'rotate(180deg)':'none',flexShrink:0}}>▼</div>
      </div>

      {/* Detail */}
      {open && (
        <div style={{background:'rgba(8,12,35,0.95)',border:'1px solid #4488ff',borderTop:'none',borderRadius:'0 0 8px 8px',padding:'10px 14px'}}>
          {hasLog ? (
            <div>
              {/* Normální otázky */}
              {normalLog.map((entry, idx) => {
                const q = qPool.find(q=>String(q.id)===String(entry.qId));
                // chosenText = text uložený při hraní (správné pořadí)
                // fallback na opts[chosen] pro starší záznamy
                const chosenOpt = entry.chosenText || (q && entry.chosen !== undefined ? q.opts[entry.chosen] : null);
                const correctOpt = q ? q.opts[q.a] : null;
                return (
                  <div key={idx} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'6px 0',borderBottom:'1px solid #121830',fontSize:11}}>
                    <span style={{flexShrink:0,fontSize:13}}>{entry.correct?'✅':'❌'}</span>
                    <div style={{flex:1,minWidth:0}}>
                      {q ? (
                        <>
                          <div style={{color:'#aabbcc',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:2}}>{q.q}</div>
                          <div style={{fontSize:9,color:'#334466'}}>
                            <span style={{color:'#556688'}}>{q.cat}</span>
                            {entry.correct ? (
                              <span style={{color:'#44aa44'}}> · ✓ {correctOpt}</span>
                            ) : (
                              <>
                                <span style={{color:'#aa3333'}}> · ✗ zvoleno: {chosenOpt || '?'}</span>
                                <span style={{color:'#44aa44'}}> · ✓ správně: {correctOpt}</span>
                              </>
                            )}
                          </div>
                        </>
                      ) : (
                        <span style={{color:'#445566'}}>Otázka #{entry.qId}</span>
                      )}
                    </div>
                    <div style={{textAlign:'right',flexShrink:0,minWidth:40}}>
                      <div style={{fontSize:9,color:'#334466'}}>{entry.time_spent||0}s</div>
                      <div style={{fontWeight:700,color:entry.correct?'#44ff44':'#ff4444',fontSize:11}}>
                        {entry.correct ? `+${entry.pts||0}` : '0'}
                      </div>
                    </div>
                  </div>
                );
              })}

              {/* Lucky Box sekce */}
              {luckyLog.length > 0 && (
                <div style={{marginTop:8,padding:'8px 10px',background:'rgba(100,50,200,0.08)',border:'1px solid #bb44ff33',borderRadius:6}}>
                  {luckyLog.map((entry, idx) => {
                    const v = entry.chosen || 0;
                    const lcol = v >= 500 ? '#ffd700' : v > 0 ? '#44ffaa' : v === 0 ? '#8899bb' : '#ff4444';
                    const emoji = v === 1000 ? '🏆' : v === -500 ? '💣' : v > 0 ? '💰' : v === 0 ? '📦' : '🪦';
                    return (
                      <div key={idx} style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
                        <span style={{fontSize:16}}>{emoji}</span>
                        <span style={{color:'#8866aa',flex:1}}>Lucky Box</span>
                        <span style={{color:lcol,fontWeight:700,fontFamily:"'Orbitron',sans-serif",fontSize:12}}>
                          {v > 0 ? `+${v}` : String(v)}
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          ) : (
            <span style={{color:'#445566',fontSize:11}}>
              Kvíz odehrán před zavedením detailního záznamu.
              Výsledek: {correctN}/{totalNormal} správně, {s.score.toLocaleString()} bodů.
            </span>
          )}
        </div>
      )}
    </div>
  );
}

// ─── BOARD SCREEN ─────────────────────────────────────────
function BoardScreen({ scores, user, todayKey, monthlyChampions, quizMode, onBack }) {
  const [tab, setTab] = useState('today');
  const [profileView, setProfileView] = useState(null);
  const [profileLoading, setProfileLoading] = useState(false);
  const [avatarCache, setAvatarCache] = useState({});
  const [profileScores, setProfileScores] = useState([]);
  const [profileTab, setProfileTab] = useState('stats');

  const currentMonth = getCurrentMonthKey();
  const mode = quizMode || QUIZ_MODES.IT;
  // Filtruj podle módu — starší záznamy bez quiz_mode jsou IT
  const modeScores = scores.filter(s => (s.quiz_mode || QUIZ_MODES.IT) === mode);
  const isFilm = mode === QUIZ_MODES.FILM;

  const todayList = modeScores.filter(s=>s.date===todayKey).sort((a,b)=>b.score-a.score);

  // Celkové skóre (all-time) — aktuální mód
  const allMap = {};
  modeScores.forEach(s=>{
    if(!allMap[s.user_id]) allMap[s.user_id]={id:s.user_id,user_id:s.user_id,name:s.user_name,total:0,played:0,best:0,perfects:0,totalCorrect:0,totalWrong:0};
    allMap[s.user_id].total+=s.score;
    allMap[s.user_id].played+=1;
    allMap[s.user_id].best=Math.max(allMap[s.user_id].best,s.score);
    if(s.perfect) allMap[s.user_id].perfects+=1;
    allMap[s.user_id].totalCorrect+=(s.correct||0);
    allMap[s.user_id].totalWrong+=Math.max(0,(s.total||15)-(s.correct||0));
  });
  const allList = Object.values(allMap).sort((a,b)=>b.total-a.total);

  // Měsíční skóre (aktuální měsíc)
  const monthMap = {};
  modeScores.filter(s=>s.date.startsWith(currentMonth)).forEach(s=>{
    if(!monthMap[s.user_id]) monthMap[s.user_id]={id:s.user_id,user_id:s.user_id,name:s.user_name,total:0,played:0,best:0,perfects:0};
    monthMap[s.user_id].total+=s.score; monthMap[s.user_id].played+=1;
    monthMap[s.user_id].best=Math.max(monthMap[s.user_id].best,s.score);
    if(s.perfect) monthMap[s.user_id].perfects+=1;
  });
  const monthList = Object.values(monthMap).sort((a,b)=>b.total-a.total);

  // Kombinovaný žebříček — všechny módy dohromady
  const combinedMap = {};
  scores.forEach(s=>{
    if(!combinedMap[s.user_id]) combinedMap[s.user_id]={id:s.user_id,user_id:s.user_id,name:s.user_name,total:0,played:0,best:0,it:0,general:0,film:0,totalCorrect:0,totalWrong:0};
    combinedMap[s.user_id].total+=s.score;
    combinedMap[s.user_id].played+=1;
    combinedMap[s.user_id].best=Math.max(combinedMap[s.user_id].best,s.score);
    combinedMap[s.user_id].totalCorrect+=(s.correct||0);
    combinedMap[s.user_id].totalWrong+=Math.max(0,(s.total||15)-(s.correct||0));
    const m = s.quiz_mode||'it';
    combinedMap[s.user_id][m]=(combinedMap[s.user_id][m]||0)+s.score;
  });
  const combinedList = Object.values(combinedMap).sort((a,b)=>b.total-a.total);

  const list = tab==='today' ? todayList : tab==='month' ? monthList : tab==='all' ? allList : tab==='combined' ? combinedList : [];
  const rc = ['#ffdd00','#cccccc','#cd7f32'];

  // Prefetch avatarů pro viditelné hráče (dávkově)
  useEffect(() => {
    const visible = (tab==='today' ? todayList : tab==='month' ? monthList : tab==='combined' ? combinedList : allList);
    const missing = visible.map(e=>e.user_id||e.id).filter(id => id && !(id in avatarCache));
    if (missing.length === 0) return;
    // Označ jako "načítá se" aby se netriggeroval znovu
    setAvatarCache(prev => {
      const next = {...prev};
      missing.forEach(id => { next[id] = null; }); // null = načítá se / nenalezeno
      return next;
    });
    // Batch fetch — načte avatar i cheater flag
    db.from('users').select('id,avatar_url').in('id', missing)
      .then(({data}) => {
        if (!data) return;
        setAvatarCache(prev => {
          const next = {...prev};
          data.forEach(u => { next[u.id] = u.avatar_url||null; });
          return next;
        });
        setCheaterCache(prev => {
          const next = {...prev};

          return next;
        });
      }).catch(()=>{});
  }, [tab, scores]);

  async function openProfile(userId) {
    setProfileLoading(true);
    setProfileScores([]);
    setProfileTab('stats');
    try {
      const [{ data: userData }, { data: scoresData }] = await Promise.all([
        db.from('users').select('*').eq('id', userId).single(),
        db.from('scores').select('*').eq('user_id', userId).order('date', { ascending: true }),
      ]);
      if (userData) {
        setAvatarCache(prev => ({...prev, [userId]: userData.avatar_url||null}));
        setProfileView(userData);
      } else { setProfileView({name:'?', id: userId}); }
      setProfileScores(scoresData || []);
    } catch(e) { setProfileView({name:'?', id: userId}); }
    setProfileLoading(false);
  }

  const OS_LABELS = {linux:'🐧 Linux', windows:'🪟 Windows', macos:' macOS', bsd:'👹 BSD', arch:'💀 Arch (btw)'};
  const DEBUG_LABELS = {printstatements:'Print statements',debugger:'Debugger – profesionál',stackoverflow:'Stack Overflow + modlitba',rubber:'Gumová kachnička',restart:'Restart a doufám',ai:'Ptám se AI a nedůvěřuji',blame:'Blame git'};
  const COFFEE_LABELS = {'0':'0 – robot','1':'1☕','2':'2☕','3':'3☕','5':'5+☕ závislák',iv:'IV infuze rovnou do žíly'};

  return (
    <div style={{minHeight:'100vh',padding:20,maxWidth:660,margin:'0 auto'}}>

      {/* PROFILE MODAL — fullscreen stejný jako StatsScreen */}
      {profileView && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'#0a0a0f',zIndex:200,overflowY:'auto'}}>
          <div style={{maxWidth:700,margin:'0 auto',padding:'16px 20px 40px'}}>

            {/* Zpět */}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:20,paddingTop:12}}>
              <button onClick={()=>{setProfileView(null);setProfileScores([]);setProfileTab('stats');}}
                style={{background:'transparent',border:'none',color:'#4488ff',fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
                ← ZPĚT DO ŽEBŘÍČKU
              </button>
            </div>

            {/* Hlavička hráče */}
            <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:20,padding:'16px 20px',background:'rgba(15,25,60,0.8)',border:'1px solid #2a3a6a',borderRadius:14}}>
              <div style={{width:72,height:72,borderRadius:'50%',border:'2px solid #2a3a6a',overflow:'hidden',background:'#0a0a1f',flexShrink:0}}>
                {profileView.avatar_url
                  ? <img src={avatarSrc(profileView.avatar_url)} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,color:'#2a3a6a'}}>👤</div>
                }
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,fontWeight:900,color:'#fff',marginBottom:4}}>{profileView.name}</div>

                {(profileView.company||profileView.position) && (
                  <div style={{fontSize:13,color:'#556688'}}>
                    {profileView.company&&`🏢 ${profileView.company}`}{profileView.company&&profileView.position?' · ':''}{profileView.position&&`💼 ${profileView.position}`}
                  </div>
                )}
                {(profileView.fav_hw||profileView.os_religion||profileView.debug_style||profileView.coffee_cups) && (
                  <div style={{display:'flex',gap:12,flexWrap:'wrap',marginTop:4,fontSize:11,color:'#445566'}}>
                    {profileView.os_religion && <span>{OS_LABELS[profileView.os_religion]||profileView.os_religion}</span>}
                    {profileView.coffee_cups && <span>☕ {COFFEE_LABELS[profileView.coffee_cups]||profileView.coffee_cups}</span>}
                    {profileView.debug_style && <span>🐛 {DEBUG_LABELS[profileView.debug_style]||profileView.debug_style}</span>}
                    {profileView.fav_hw && <span>💻 {profileView.fav_hw}</span>}
                  </div>
                )}
                {profileView.superpower && <div style={{fontSize:11,color:'#334455',marginTop:3}}>🦸 {profileView.superpower}</div>}
              </div>
            </div>

            {/* Vtipný fakt */}
            <div style={{background:'rgba(68,136,255,0.06)',border:'1px dashed #2a3a6a',borderRadius:10,padding:'10px 14px',marginBottom:20,display:'flex',gap:10,alignItems:'flex-start'}}>
              <span style={{fontSize:18,flexShrink:0}}>💡</span>
              <div style={{fontSize:12,color:'#556688',lineHeight:1.55,fontStyle:'italic'}}>{getPlayerFact(profileView.name)}</div>
            </div>

            {/* Tabs — Statistiky / Archiv */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:20,background:'rgba(10,15,40,0.6)',borderRadius:10,padding:4,border:'1px solid #1e2a4a'}}>
              {[{k:'stats',l:'📊 Statistiky'},{k:'archive',l:'📋 Archiv kvízů'}].map(t=>(
                <button key={t.k} onClick={()=>setProfileTab(t.k)} style={{
                  padding:'9px',borderRadius:8,border:'none',cursor:'pointer',
                  fontFamily:'inherit',fontSize:12,fontWeight:700,letterSpacing:0.5,
                  transition:'all 0.2s',
                  background: profileTab===t.k ? 'linear-gradient(135deg,#1a3a8a,#2255cc)' : 'transparent',
                  color: profileTab===t.k ? '#fff' : '#4a5a7a',
                  boxShadow: profileTab===t.k ? '0 0 15px rgba(68,136,255,0.3)' : 'none',
                }}>{t.l}</button>
              ))}
            </div>

            {/* ARCHIV TAB */}
            {profileTab==='archive' && (() => {
              // Archiv je přístupný jen pokud prohlížející hráč dnes hrál (nebo je to jeho vlastní profil)
              const viewerPlayedToday = user && scores.some(s =>
                s.user_id === user.id && s.date === getTodayKey()
              );
              const isOwnProfile = user && profileView && user.id === profileView.id;
              if (!isOwnProfile && !viewerPlayedToday) {
                return (

              ) : (
                <div>
                  <div style={{fontSize:11,color:'#445566',marginBottom:12,textAlign:'center'}}>
                    Celkem {profileScores.length} {profileScores.length===1?'kvíz':'kvízů'} · od nejnovějšího
                  </div>
                  {[...profileScores].reverse().map((s,idx)=>{
                    return <ArchiveRow key={s.id||idx} s={s}/>;
                  })}
                </div>
              );

            {/* STATS TAB */}
            {profileTab==='stats' && profileLoading && (
              <div style={{textAlign:'center',padding:'60px 0',color:'#445566',fontSize:14}}>
                <div style={{fontSize:32,marginBottom:12}}>⏳</div>
