function getTodayKey() { return new Date().toISOString().slice(0,10); }

function seededShuffle(arr, seed) {
  const a=[...arr]; let s=seed;
  for(let i=a.length-1;i>0;i--){
      s=(s*1664525+1013904223)&0xffffffff;
      const j=Math.abs(s)%(i+1);
      [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getDailyQuestions(dateKey) {
  const seed=dateKey.split('-').reduce((a,b)=>a*31+parseInt(b),0);
  const selectedQs = seededShuffle(ALL_QUESTIONS,seed).slice(0,QUESTIONS_PER_QUIZ);
  
  // DYNAMICKÉ PROMÍCHÁNÍ ODPOVĚDÍ (Aby B nebylo pořád správně)
  // Používáme seed + index otázky, aby mixování bylo pro daný den u všech hráčů stejné
  return selectedQs.map((q, idx) => {
    const optSeed = seed + idx; 
    const mappedOpts = q.opts.map((opt, originalIndex) => ({ opt, originalIndex }));
    const shuffledOpts = seededShuffle(mappedOpts, optSeed);
    
    // Najdeme, kam se přesunula správná odpověď
    const newA = shuffledOpts.findIndex(o => o.originalIndex === q.a);
    
    return {
      ...q,
      opts: shuffledOpts.map(o => o.opt),
      a: newA
    };
  });
}

function calcPoints(tl) { return Math.round(MIN_PTS+(MAX_PTS-MIN_PTS)*(tl/QUIZ_DURATION)); }

// ─── HLAVNÍ APP ───────────────────────────────────────
function App() {
  const [screen, setScreen] = useState(SCREENS.HOME);
  const [user, setUser] = useState(() => ls('itq_user', null));
  const [scores, setScores] = useState([]);
  const [loading, setLoading] = useState(false);
  const [currentQuiz, setCurrentQuiz] = useState(null);
  const [insult, setInsult] = useState('');
  const [showInsult, setShowInsult] = useState(false);
  const [dbOk, setDbOk] = useState(true);

  const todayKey = getTodayKey();
  const todayQuestions = getDailyQuestions(todayKey);
  const hasPlayedToday = user && scores.some(s => s.user_id === user.id && s.date === todayKey);

  useEffect(() => { loadScores(); }, []);

  async function loadScores() {
    try {
      const { data, error } = await db.from('scores').select('*').order('score', { ascending: false });
      if (error) { setDbOk(false); return; }
      setScores(data || []);
    } catch { setDbOk(false); }
  }

  async function registerUser(name, password) {
    setLoading(true);
    try {
      const username = name.trim();
      const pwd = password.trim();

      const { data: ex } = await db.from('users').select('*').ilike('name', username).maybeSingle();

      let u = ex;

      if (u) {
        if (u.password !== pwd) {
          alert('Špatné heslo!');
          setLoading(false);
          return;
        }
      } else {
        const { data, error } = await db.from('users').insert({
          id: Date.now().toString(),
          name: username,
          password: pwd
        }).select().single();

        if (error) {
          alert('Chyba: ' + error.message);
          setLoading(false);
          return;
        }
        u = data;
      }

      setUser(u);
      lss('itq_user', u);
      setScreen(SCREENS.HOME);

    } catch(e) {
      alert('Chyba připojení k databázi');
    }

    setLoading(false);
  }

  async function finishQuiz(quiz) {
    const entry = {
      id: Date.now().toString(), user_id: user.id, user_name: user.name,
      date: todayKey, score: quiz.totalScore,
      correct: quiz.answers.filter(a => a.correct).length,
      total: quiz.questions.length, timestamp: Date.now(),
    };
    await db.from('scores').upsert(entry, { onConflict: 'user_id,date' });
    await loadScores();
    setCurrentQuiz(quiz);
    setScreen(SCREENS.RESULT);
  }

  const S = {
    wrap: { minHeight:'100vh', background:'#0a0a0f', fontFamily:"'Inter', sans-serif", color:'#e0e8ff', position:'relative', overflowX:'hidden' },
    grid: { position:'fixed', top:0, left:0, right:0, bottom:0, backgroundImage:'linear-gradient(rgba(30,60,150,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,60,150,0.07) 1px,transparent 1px)', backgroundSize:'50px 50px', pointerEvents:'none', zIndex:0 },
    scan: { position:'fixed', top:0, left:0, right:0, bottom:0, background:'repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,50,100,0.025) 2px,rgba(0,50,100,0.025) 4px)', pointerEvents:'none', zIndex:0 },
    content: { position:'relative', zIndex:1 },
  };

  return (
    <div style={S.wrap}>
      <style>{`
        *{box-sizing:border-box;margin:0;padding:0}
        input{background:#0d1428;border:1px solid #2a3a6a;color:#e0e8ff;padding:12px 16px;border-radius:8px;font-family:inherit;font-size:16px;width:100%;outline:none;transition:border-color 0.2s}
        input:focus{border-color:#4488ff;box-shadow:0 0 0 3px rgba(68,136,255,0.15)}
        .btn{cursor:pointer;border:none;font-family:inherit;letter-spacing:2px;text-transform:uppercase;font-weight:700;transition:all 0.2s}
        .btn:hover{transform:translateY(-2px);filter:brightness(1.15)}
        .btn:active{transform:translateY(0)}
        .glow{text-shadow:0 0 20px #4488ff,0 0 40px #2255cc}
        @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
        .slide-in{animation:slideIn 0.4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
        .shake{animation:shake 0.5s}
        .tab-btn{background:transparent;border:1px solid #2a3a6a;color:#8899bb;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:1px;transition:all 0.2s}
        .tab-btn.active{background:#1a2a5a;border-color:#4488ff;color:#88aaff}
      `}</style>
      <div style={S.grid}/>
      <div style={S.scan}/>
      {!dbOk && (
        <div style={{position:'fixed',top:0,left:0,right:0,background:'#440000',padding:'10px',textAlign:'center',zIndex:999,fontSize:13,color:'#ff8888'}}>
          ⚠️ Databáze není připojena — vyplň SUPABASE_URL a SUPABASE_KEY v HTML souboru
        </div>
      )}
      {showInsult && (
        <div onClick={()=>setShowInsult(false)} style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.9)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
          <div className="shake" style={{textAlign:'center',padding:40,maxWidth:480}}>
            <div style={{fontSize:80,marginBottom:20}}>💀</div>
            <div style={{fontSize:22,color:'#ff4444',fontWeight:700,lineHeight:1.5}}>{insult}</div>
            <div style={{marginTop:20,color:'#6677aa',fontSize:12,letterSpacing:2}}>KLIKNI PRO POKRAČOVÁNÍ</div>
          </div>
        </div>
      )}
      <div style={S.content}>
        {screen===SCREENS.HOME && <HomeScreen user={user} hasPlayedToday={hasPlayedToday} todayKey={todayKey} todayQuestions={todayQuestions} onRegister={()=>setScreen(SCREENS.REGISTER)} onStart={()=>{setCurrentQuiz({questions:todayQuestions,answers:[],current:0,timeLeft:QUIZ_DURATION,totalScore:0});setScreen(SCREENS.QUIZ);}} onBoard={()=>setScreen(SCREENS.BOARD)} onLogout={()=>{setUser(null);lss('itq_user',null);}} loading={loading}/>}
        {screen===SCREENS.REGISTER && <RegisterScreen onRegister={registerUser} onBack={()=>setScreen(SCREENS.HOME)} loading={loading}/>}
        {screen===SCREENS.QUIZ && currentQuiz && <QuizScreen quiz={currentQuiz} onFinish={finishQuiz} onWrong={()=>{setInsult(INSULTS[Math.floor(Math.random()*INSULTS.length)]);setShowInsult(true);}}/>}
        {screen===SCREENS.RESULT && currentQuiz && <ResultScreen quiz={currentQuiz} onHome={()=>setScreen(SCREENS.HOME)} onBoard={()=>setScreen(SCREENS.BOARD)}/>}
        {screen===SCREENS.BOARD && <BoardScreen scores={scores} user={user} todayKey={todayKey} onBack={()=>setScreen(SCREENS.HOME)}/>}
      </div>
    </div>
  );
}

// ─── HOME ─────────────────────────────────────────────
function HomeScreen({ user, hasPlayedToday, todayKey, todayQuestions, onRegister, onStart, onBoard, onLogout, loading }) {
  const cats = [...new Set(todayQuestions.map(q=>q.cat))];
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
      <div className="slide-in" style={{width:'100%',maxWidth:640,textAlign:'center'}}>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:6,color:'#4488ff',marginBottom:8,opacity:0.8}}>DAILY CHALLENGE</div>
        <h1 className="glow" style={{fontFamily:"'Orbitron', sans-serif",fontSize:'clamp(40px,9vw,80px)',fontWeight:900,letterSpacing:4,color:'#fff',lineHeight:1}}>
          IT<span style={{color:'#4488ff'}}>QUIZ</span>
        </h1>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:3,color:'#4a5a7a',marginTop:4,marginBottom:36}}>500 OTÁZEK • KAŽDÝ DEN NOVÝ KVÍZ</div>

        <div style={{background:'rgba(20,35,80,0.55)',border:'1px solid #2a3a6a',borderRadius:14,padding:'20px 28px',marginBottom:28,backdropFilter:'blur(8px)'}}>
          <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,color:'#4488ff',letterSpacing:3,marginBottom:10}}>DNEŠNÍ KVÍZ — {todayKey}</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center',marginBottom:14}}>
            {cats.map(c=><span key={c} style={{background:'rgba(68,136,255,0.12)',border:'1px solid rgba(68,136,255,0.25)',borderRadius:20,padding:'3px 12px',fontSize:11,color:'#88aaff',letterSpacing:0.5}}>{c}</span>)}
          </div>
          <div style={{color:'#6677aa',fontSize:12}}>⏱ {QUIZ_DURATION}s &nbsp;•&nbsp; {QUESTIONS_PER_QUIZ} otázek &nbsp;•&nbsp; max {MAX_PTS} bodů/otázka</div>
        </div>

        {user ? (
          <div style={{marginBottom:24}}>
            <div style={{fontSize:12,color:'#4a5a7a',marginBottom:4}}>Přihlášen jako</div>
            <div style={{fontSize:24,color:'#88aaff',fontWeight:700,letterSpacing:2}}>{user.name}</div>
            <button onClick={onLogout} style={{marginTop:6,background:'transparent',border:'none',color:'#334455',fontSize:11,cursor:'pointer',letterSpacing:1}}>ODHLÁSIT SE</button>
          </div>
        ) : (
          <div style={{marginBottom:24,color:'#ff9944',fontSize:13}}>⚠ Nejsi přihlášen</div>
        )}

        <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:340,margin:'0 auto'}}>
          {user ? (
            hasPlayedToday
              ? <div style={{background:'rgba(20,60,20,0.5)',border:'1px solid #334433',borderRadius:10,padding:16,color:'#66aa66',fontSize:12,letterSpacing:1}}>✓ DNES JSI UŽ HRÁL</div>
              : <button className="btn" onClick={onStart} style={{background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'18px 40px',borderRadius:10,fontSize:17,color:'#fff',letterSpacing:3,boxShadow:'0 0 30px rgba(68,136,255,0.35)'}}>▶ SPUSTIT KVÍZ</button>
          ) : (
            <button className="btn" onClick={onRegister} style={{background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'18px 40px',borderRadius:10,fontSize:17,color:'#fff',letterSpacing:3,boxShadow:'0 0 30px rgba(68,136,255,0.35)'}}>REGISTROVAT SE</button>
          )}
          <button className="btn" onClick={onBoard} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'13px 40px',borderRadius:10,fontSize:13,color:'#88aaff',letterSpacing:2}}>🏆 ŽEBŘÍČEK</button>
        </div>
      </div>
    </div>
  );
}

// ─── REGISTER ────────────────────────────────────────
function RegisterScreen({ onRegister, onBack, loading }) {
  const [name, setName] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');

  function submit() {
    const n = name.trim();
    const p = password.trim();

    if (!n || n.length < 2) { setErr('Aspoň 2 znaky pro jméno!'); return; }
    if (n.length > 20) { setErr('Max 20 znaků!'); return; }
    if (!p || p.length < 4) { setErr('Heslo musí mít alespoň 4 znaky!'); return; }

    onRegister(n, p);
  }

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div className="slide-in" style={{width:'100%',maxWidth:380,textAlign:'center'}}>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:4,color:'#4488ff',marginBottom:10}}>REGISTRACE</div>
        <h2 style={{fontFamily:"'Orbitron', sans-serif",fontSize:30,fontWeight:900,color:'#fff',marginBottom:32}}>Kdo jsi?</h2>
        <div style={{background:'rgba(20,35,80,0.6)',border:'1px solid #2a3a6a',borderRadius:12,padding:28}}>
          <input value={name} onChange={e=>{setName(e.target.value);setErr('');}} placeholder="Tvá přezdívka..." maxLength={20} autoFocus/>

          <input
            type="password"
            value={password}
            onChange={e=>{setPassword(e.target.value);setErr('');}}
            onKeyDown={e=>e.key==='Enter'&&submit()}
            placeholder="Heslo..."
            maxLength={50}
            style={{marginTop:12}}
          />
          {err && <div style={{color:'#ff4444',fontSize:12,marginTop:8}}>{err}</div>}
          <button className="btn" onClick={submit} disabled={loading} style={{marginTop:18,width:'100%',background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'13px',borderRadius:8,fontSize:14,color:'#fff',letterSpacing:3}}>
            {loading ? 'UKLÁDÁM...' : 'POTVRDIT'}
          </button>
        </div>
        <button onClick={onBack} style={{marginTop:16,background:'transparent',border:'none',color:'#334455',fontSize:12,cursor:'pointer',letterSpacing:1}}>← ZPĚT</button>
      </div>
    </div>
  );
}

// ─── QUIZ ─────────────────────────────────────────────
function QuizScreen({ quiz: initQuiz, onFinish, onWrong }) {
  const [quiz, setQuiz] = useState({...initQuiz});
  const [selected, setSelected] = useState(null);
  const [locked, setLocked] = useState(false);
  const [flash, setFlash] = useState(null);
  const timer = useRef(null);

  const q = quiz.questions[quiz.current];

  useEffect(() => {
    timer.current = setInterval(() => {
      setQuiz(prev => {
        if (prev.timeLeft <= 1) { clearInterval(timer.current); onFinish({...prev,timeLeft:0}); return {...prev,timeLeft:0}; }
        return {...prev,timeLeft:prev.timeLeft-1};
      });
    }, 1000);
    return () => clearInterval(timer.current);
  }, []);

  function answer(idx) {
    if (locked) return;
    setLocked(true); setSelected(idx);
    const ok = idx === q.a;
    const pts = ok ? calcPoints(quiz.timeLeft) : 0;
    setFlash(ok ? 'ok' : 'no');
    if (!ok) onWrong();
    setTimeout(() => {
      setFlash(null);
      const newAns = [...quiz.answers, {q:q.id,chosen:idx,correct:ok,pts}];
      const newScore = quiz.totalScore + pts;
      const next = quiz.current + 1;
      if (next >= quiz.questions.length) { clearInterval(timer.current); onFinish({...quiz,answers:newAns,totalScore:newScore,current:next}); }
      else { setQuiz(p=>({...p,answers:newAns,totalScore:newScore,current:next})); setSelected(null); setLocked(false); }
    }, 1100);
  }

  const tc = quiz.timeLeft > 30 ? '#4488ff' : quiz.timeLeft > 10 ? '#ffaa22' : '#ff3333';
  const labels = ['A','B','C','D'];

  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',padding:20,maxWidth:660,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:20,marginBottom:16}}>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:2,color:'#556688'}}>OTÁZKA {quiz.current+1}/{quiz.questions.length}</div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:30,fontWeight:900,color:tc,letterSpacing:2,textShadow:`0 0 15px ${tc}`}}>{quiz.timeLeft}s</div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:13,color:'#88aaff',letterSpacing:1}}>{quiz.totalScore.toLocaleString()} b</div>
      </div>
      <div style={{background:'#1a2040',borderRadius:4,height:4,marginBottom:6,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(quiz.current/quiz.questions.length)*100}%`,background:'linear-gradient(90deg,#2255cc,#4488ff)',transition:'width 0.3s'}}/>
      </div>
      <div style={{background:'#1a2040',borderRadius:4,height:4,marginBottom:22,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${(quiz.timeLeft/QUIZ_DURATION)*100}%`,background:tc,transition:'width 1s linear',boxShadow:`0 0 6px ${tc}`}}/>
      </div>
      <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,letterSpacing:3,color:'#4488ff',marginBottom:10,textAlign:'center'}}>{q.cat}</div>
      <div className="slide-in" style={{background:flash==='ok'?'rgba(0,70,0,0.35)':flash==='no'?'rgba(70,0,0,0.35)':'rgba(15,28,70,0.65)',border:`1px solid ${flash==='ok'?'#22aa22':flash==='no'?'#aa2222':'#2a3a6a'}`,borderRadius:16,padding:'28px 22px',marginBottom:18,transition:'all 0.3s'}}>
        {q.img && <div style={{textAlign:'center',fontSize:44,marginBottom:14}}>{q.img}</div>}
        {q.hint && <div style={{fontSize:11,color:'#556688',marginBottom:10,textAlign:'center'}}>{q.hint}</div>}
        <div style={{fontSize:'clamp(16px,2.4vw,20px)',fontWeight:500,lineHeight:1.55,textAlign:'center',color:'#ddeeff'}}>{q.q}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,flex:1}}>
        {q.opts.map((opt,i)=>{
          let bg='rgba(12,20,52,0.85)',br='#2a3a6a',col='#bbc8ee';
          if(selected!==null){ if(i===q.a){bg='rgba(0,70,0,0.55)';br='#22aa22';col='#88ff88';} else if(i===selected&&selected!==q.a){bg='rgba(70,0,0,0.55)';br='#aa2222';col='#ff8888';} }
          return (
            <button key={i} onClick={()=>answer(i)} disabled={locked} style={{background:bg,border:`1px solid ${br}`,borderRadius:10,padding:'13px 11px',cursor:locked?'default':'pointer',color:col,fontFamily:'inherit',textAlign:'left',transition:'all 0.2s',fontSize:'clamp(12px,1.7vw,14px)',fontWeight:500,letterSpacing:0.3,lineHeight:1.45,display:'flex',alignItems:'center',gap:9}}
              onMouseEnter={e=>{if(!locked)e.currentTarget.style.borderColor='#4488ff';}}
              onMouseLeave={e=>{if(!locked)e.currentTarget.style.borderColor=br;}}>
              <span style={{minWidth:22,height:22,background:'rgba(68,136,255,0.18)',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#4488ff',flexShrink:0}}>{labels[i]}</span>
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── RESULT ───────────────────────────────────────────
function ResultScreen({ quiz, onHome, onBoard }) {
  const correct = quiz.answers.filter(a=>a.correct).length;
  const pct = Math.round((correct/quiz.questions.length)*100);
  const g = pct>=90?{e:'🏆',l:'LEGENDA',c:'#ffdd00'}:pct>=70?{e:'🥇',l:'EXPERT',c:'#4488ff'}:pct>=50?{e:'🥈',l:'POKROČILÝ',c:'#88aaff'}:pct>=30?{e:'🥉',l:'ZAČÁTEČNÍK',c:'#ff8844'}:{e:'💀',l:'IT GHOST',c:'#ff4444'};
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div className="slide-in" style={{width:'100%',maxWidth:480,textAlign:'center'}}>
        <div style={{fontSize:72,marginBottom:10}}>{g.e}</div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:13,letterSpacing:4,color:g.c,marginBottom:6}}>{g.l}</div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:52,fontWeight:900,color:'#fff',marginBottom:2}}>{quiz.totalScore.toLocaleString()}</div>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,color:'#4a5a7a',letterSpacing:2,marginBottom:28}}>BODŮ</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:24}}>
          {[{l:'Správně',v:`${correct}/${quiz.questions.length}`,c:'#22aa22'},{l:'Přesnost',v:`${pct}%`,c:g.c},{l:'Body',v:quiz.totalScore.toLocaleString(),c:'#4488ff'}].map(s=>(
            <div key={s.l} style={{background:'rgba(20,35,80,0.6)',border:'1px solid #2a3a6a',borderRadius:10,padding:'14px 6px'}}>
              <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
              <div style={{fontSize:10,color:'#556688',letterSpacing:1,marginTop:3}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{background:'rgba(8,12,35,0.85)',border:'1px solid #1a2a5a',borderRadius:12,padding:14,marginBottom:22,maxHeight:190,overflowY:'auto',textAlign:'left'}}>
          {quiz.answers.map((a,i)=>{
            const q2=quiz.questions[i];
            return <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid #121830',fontSize:11}}>
              <span>{a.correct?'✅':'❌'}</span>
              <span style={{color:'#7788aa',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{q2.q.slice(0,48)}{q2.q.length>48?'…':''}</span>
              <span style={{color:a.correct?'#44ff44':'#ff4444',fontWeight:700,minWidth:45,textAlign:'right'}}>{a.correct?`+${a.pts}`:'0'}</span>
            </div>;
          })}
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button className="btn" onClick={onBoard} style={{background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'13px 26px',borderRadius:10,fontSize:12,color:'#fff',letterSpacing:2}}>🏆 ŽEBŘÍČEK</button>
          <button className="btn" onClick={onHome} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'13px 26px',borderRadius:10,fontSize:12,color:'#88aaff',letterSpacing:2}}>← DOMŮ</button>
        </div>
      </div>
    </div>
  );
}

// ─── SCOREBOARD ───────────────────────────────────────
function BoardScreen({ scores, user, todayKey, onBack }) {
  const [tab, setTab] = useState('today');
  const todayList = scores.filter(s=>s.date===todayKey).sort((a,b)=>b.score-a.score);
  const allMap = {};
  scores.forEach(s=>{
    if(!allMap[s.user_id]) allMap[s.user_id]={id:s.user_id,name:s.user_name,total:0,played:0,best:0};
    allMap[s.user_id].total+=s.score; allMap[s.user_id].played+=1; allMap[s.user_id].best=Math.max(allMap[s.user_id].best,s.score);
  });
  const allList = Object.values(allMap).sort((a,b)=>b.total-a.total);
  const list = tab==='today' ? todayList : allList;
  const rc = ['#ffdd00','#cccccc','#cd7f32'];
  return (
    <div style={{minHeight:'100vh',padding:20,maxWidth:640,margin:'0 auto'}}>
      <div className="slide-in">
        <div style={{textAlign:'center',paddingTop:28,marginBottom:28}}>
          <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,letterSpacing:4,color:'#4488ff',marginBottom:6}}>HALL OF FAME</div>
          <h2 className="glow" style={{fontFamily:"'Orbitron', sans-serif",fontSize:32,fontWeight:900,color:'#fff'}}>ŽEBŘÍČEK</h2>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:22,justifyContent:'center'}}>
          {[{k:'today',l:'Dnes'},{k:'all',l:'Celkově'}].map(t=>(
            <button key={t.k} className={`tab-btn${tab===t.k?' active':''}`} onClick={()=>setTab(t.k)}>{t.l}</button>
          ))}
        </div>
        {list.length===0 ? (
          <div style={{textAlign:'center',color:'#334455',padding:50,fontSize:13}}>{tab==='today'?'Dnes ještě nikdo nehrál':'Žádná data'}</div>
        ) : (
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {list.map((e,i)=>{
              const me = e.user_id===user?.id || e.id===user?.id;
              const sc = tab==='today' ? e.score : e.total;
              return (
                <div key={e.user_id||e.id} style={{background:me?'rgba(68,136,255,0.13)':'rgba(12,20,52,0.75)',border:`1px solid ${me?'#4488ff':'#2a3a6a'}`,borderRadius:10,padding:'13px 18px',display:'flex',alignItems:'center',gap:14}}>
                  <div style={{width:34,height:34,borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',background:i<3?'rgba(255,220,0,0.1)':'rgba(25,38,80,0.6)',fontSize:i<3?16:13,fontWeight:900,color:rc[i]||'#334466',flexShrink:0}}>
                    {i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:700,color:me?'#88aaff':'#ccdaff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      {e.user_name||e.name} {me&&'(ty)'}
                    </div>
                    {tab==='all' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.played} {e.played===1?'kvíz':'kvízy'} • nejlepší: {e.best.toLocaleString()} b</div>}
                    {tab==='today' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.correct}/{e.total} správně</div>}
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:19,fontWeight:900,color:i===0?'#ffdd00':'#4488ff'}}>{sc.toLocaleString()}</div>
                    <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,color:'#334466',letterSpacing:1}}>BODŮ</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
        <div style={{textAlign:'center',marginTop:28}}>
          <button className="btn" onClick={onBack} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 30px',borderRadius:8,fontSize:12,color:'#88aaff',letterSpacing:2}}>← ZPĚT</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
