              </div>
            )}
            {profileTab==='stats' && !profileLoading && profileScores.length===0 && (
              <div style={{textAlign:'center',padding:'60px 0'}}>
                <div style={{fontSize:48,marginBottom:12}}>🥚</div>
                <div style={{color:'#445566',fontSize:14}}>Zatím žádné odehrané kvízy.</div>
              </div>
            )}
            {profileTab==='stats' && !profileLoading && profileScores.length>0 && (()=>{
              const ps = profileScores;
              const pMode = (ps[0]?.quiz_mode || QUIZ_MODES.IT);
              const pIsGeneral = pMode === QUIZ_MODES.GENERAL;

              // Play log analýza — správný pool otázek

              maxSerie=Math.max(maxSerie,curSerie);

              const catList=Object.entries(catData)

              const avgCatAcc=catList.length?Math.round(catList.reduce((s,c)=>s+c.acc,0)/catList.length):50;

              // Odvětvová analýza — IT vs Obecný
              const SECTORS_IT={'Sítě & Infrastruktura':['Sítě','WiFi','Konektory','Telco','DC'],'Bezpečnost':['Bezpečnost','Šifrování'],'Cloud & DevOps':['Cloud','Virtualizace','Správa'],'Systémy & OS':['OS','Linux','Windows'],'Data & Protokoly':['Databáze','Protokoly','Email'],'Hardware':['Hardware','Periferie','Úložiště','Zálohy'],'AI & Moderní tech':['AI/ML','IoT','Telco']};

              // Verdikt a persóna — různé pro IT a obecný

              const accR=accuracyRoast(accPct);

              const C={gold:'#ffd700',blue:'#4488ff',green:'#44ffaa',red:'#ff4444',gray:'#556688',purple:'#bb44ff',orange:'#ff9900'};

              return (

                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
                    {[

                      {e:'🏅',l:'Rank',v:rank?`#${rank}`:'—',c:rank<=3?C.gold:rank<=10?C.blue:C.gray,sub:`z ${allPlayers} hráčů`},

                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:9,color:'#334455'}}>avg čas</div>

                  {/* Odvětvová analýza */}
                  {sectorData.length>=2 && (
                    <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>

// ─── STATS SCREEN ─────────────────────────────────────
function StatsScreen({ user, scores, quizMode, onBack }) {
  const [localMode, setLocalMode] = useState(quizMode || QUIZ_MODES.IT);
  const mode = localMode;
  const isGeneral = mode === QUIZ_MODES.GENERAL;
  const isFilm    = mode === QUIZ_MODES.FILM;
  const qPool = isFilm ? ALL_FILM_QUESTIONS : isGeneral ? ALL_GENERAL_QUESTIONS : ALL_QUESTIONS;

  const myScores = scores
    .filter(s => s.user_id === user.id && (s.quiz_mode || QUIZ_MODES.IT) === mode)
    .sort((a,b) => a.date.localeCompare(b.date));

  const totalPlayed  = myScores.length;
  const totalScore   = myScores.reduce((s,r) => s+r.score, 0);
  const avgScore     = totalPlayed ? Math.round(totalScore/totalPlayed) : 0;
  const bestScore    = totalPlayed ? Math.max(...myScores.map(r=>r.score)) : 0;
  const perfectCount = myScores.filter(r=>r.perfect).length;
  const totalCorrect = myScores.reduce((s,r) => s+(r.correct||0), 0);
  const totalQs      = myScores.reduce((s,r) => s+(r.total||0), 0);
  const accuracy     = totalQs ? Math.round((totalCorrect/totalQs)*100) : 0;

  // Streak
  let maxStreak=0, tempStreak=0, currentStreak=0;
  const sortedDays = [...new Set(myScores.map(r=>r.date))].sort();
  for (let i=0; i<sortedDays.length; i++) {
    if (i===0){tempStreak=1;}
    else {
      const prev=new Date(sortedDays[i-1]); prev.setDate(prev.getDate()+1);
      tempStreak = prev.toISOString().slice(0,10)===sortedDays[i] ? tempStreak+1 : 1;
    }
    maxStreak=Math.max(maxStreak,tempStreak);
  }
  const today=getTodayKey();
  for (let i=sortedDays.length-1; i>=0; i--) {
    const exp=new Date(today); exp.setDate(exp.getDate()-(sortedDays.length-1-i));
    if (sortedDays[i]===exp.toISOString().slice(0,10)) currentStreak++;
    else break;
  }

  // Analýza play_log — použij správný pool otázek
  const questionPool = isFilm ? ALL_FILM_QUESTIONS : isGeneral ? ALL_GENERAL_QUESTIONS : ALL_QUESTIONS;
  const catData = {};
  let totalAnswers=0, totalAnswerTime=0, fastAnswers=0, slowAnswers=0;
  let maxAnswerStreak=0, curAnswerStreak=0;

  myScores.forEach(s => {
    if (!s.play_log || !s.play_log.length) return;
    s.play_log.forEach(e => {
      if (e.qId==='lucky') return;
      const q = questionPool.find(q=>String(q.id)===String(e.qId));
      const cat = q ? q.cat : 'Ostatní';
      if (!catData[cat]) catData[cat]={correct:0,total:0,totalTime:0};
      catData[cat].total++;
      if (e.correct) catData[cat].correct++;
      const t = e.time_spent || 0;
      catData[cat].totalTime += t;
      totalAnswers++; totalAnswerTime += t;
      if (t <= 3) fastAnswers++;
      if (t >= 15) slowAnswers++;
      if (e.correct) { curAnswerStreak++; }
      else { maxAnswerStreak=Math.max(maxAnswerStreak,curAnswerStreak); curAnswerStreak=0; }
    });
    maxAnswerStreak=Math.max(maxAnswerStreak,curAnswerStreak);
  });

  const avgAnswerTime = totalAnswers ? (totalAnswerTime/totalAnswers).toFixed(1) : 0;
  const fastPct = totalAnswers ? Math.round((fastAnswers/totalAnswers)*100) : 0;
  const slowPct = totalAnswers ? Math.round((slowAnswers/totalAnswers)*100) : 0;

  const catList = Object.entries(catData)
    .filter(([,d])=>d.total>=2)
    .map(([cat,d])=>({
      cat,
      acc: Math.round((d.correct/d.total)*100),
      total: d.total,
      avgTime: d.total ? (d.totalTime/d.total).toFixed(1) : 0,
    }))
    .sort((a,b)=>b.acc-a.acc);
  const avgCatAcc = catList.length ? Math.round(catList.reduce((s,c)=>s+c.acc,0)/catList.length) : 50;
  const topCats  = catList.filter(c=>c.acc>avgCatAcc).slice(0,4);
  const weakCats = catList.filter(c=>c.acc<=avgCatAcc).sort((a,b)=>a.acc-b.acc).slice(0,4);

  // Odvětví — IT vs Obecný
  const SECTORS_IT = {
    'Sítě & Infrastruktura': ['Sítě','WiFi','Konektory','Telco','DC'],
    'Bezpečnost': ['Bezpečnost','Šifrování'],
    'Cloud & DevOps': ['Cloud','Virtualizace','Správa'],
    'Systémy & OS': ['OS','Linux','Windows'],
    'Data & Protokoly': ['Databáze','Protokoly','Email'],
    'Hardware': ['Hardware','Periferie','Úložiště','Zálohy'],
    'AI & Moderní tech': ['AI/ML','IoT','Telco'],
  };
  const SECTORS_GENERAL = {
    'Geografie': ['🌍 Geografie'],
    'Historie': ['🏛️ Historie'],
    'Věda': ['🔬 Věda'],
    'Film & TV': ['🎬 Film & TV'],
    'Hudba': ['🎵 Hudba'],
    'Sport': ['⚽ Sport'],
    'Jídlo': ['🍕 Jídlo'],
    'Příroda': ['🐾 Příroda'],
    'Logika': ['🧠 Logika'],
    'Zajímavosti': ['💡 Zajímavosti'],
  };
  const SECTORS_FILM = {'Citáty':['🎬 Citáty'],'České filmy':['🇨🇿 Česko'],'Ocenění':['🏆 Ocenění'],'Režie':['🎬 Režie'],'Klasika':['🌍 Klasika'],'Marvel':['🦸 Marvel'],'Komedie':['😂 Komedie'],'Horor':['👻 Horor'],'Sci-Fi':['🚀 Sci-Fi'],'Drama':['💕 Drama'],'Thriller':['🔍 Thriller'],'Animace':['🌟 Animace'],'Herci':['🎭 Herci']};
  const SECTORS = isFilm ? SECTORS_FILM : isGeneral ? SECTORS_GENERAL : SECTORS_IT;
  const sectorData = Object.entries(SECTORS).map(([sector, cats]) => {
    let correct=0, total=0;
    cats.forEach(c => {
      // Pro obecný kvíz kategorie jsou přesné shody (včetně emoji)
      Object.entries(catData).forEach(([cat, d]) => {
        if (cat === c || cat.includes(c.replace(/^[^ ]+ /,''))) {
          correct += d.correct; total += d.total;
        }
      });
    });
    return { sector, acc: total ? Math.round((correct/total)*100) : null, total };
  }).filter(s=>s.total>=2).sort((a,b)=>b.acc-a.acc);

  // Lucky Box
  const lucky={total:0,wins:0,losses:0,jackpots:0,bombs:0,zeros:0,totalPts:0};
  myScores.forEach(s=>{
    if(!s.play_log) return;
    s.play_log.filter(e=>e.qId==='lucky').forEach(e=>{
      lucky.total++;
      const v=e.chosen||0; lucky.totalPts+=v;
      if(v===1000) lucky.jackpots++;
      else if(v===-500) lucky.bombs++;
      else if(v===0) lucky.zeros++;
      else if(v>0) lucky.wins++;
      else lucky.losses++;
    });
  });

  const timeScores = myScores.filter(s=>s.time_saved!=null);
  const avgTimeSaved = timeScores.length ? Math.round(timeScores.reduce((a,s)=>a+(s.time_saved||0),0)/timeScores.length) : 0;

  // Globální průměr jen ze stejného módu
  const modeAll = scores.filter(s=>(s.quiz_mode||QUIZ_MODES.IT)===mode);
  const allAvg = modeAll.length ? Math.round(modeAll.reduce((s,r)=>s+r.score,0)/modeAll.length) : 0;
  const allPlayers = new Set(modeAll.map(s=>s.user_id)).size;
  const myRank = [...new Set(modeAll.map(s=>s.user_id))]
    .map(uid=>({uid,t:modeAll.filter(s=>s.user_id===uid).reduce((a,r)=>a+r.score,0)}))
    .sort((a,b)=>b.t-a.t).findIndex(r=>r.uid===user.id)+1;

  // ── VTIPNÉ HODNOCENÍ ──────────────────────────────────
  function speedRoast(avg) {
    const a=parseFloat(avg);
    if (isGeneral) {
      if(a<=2) return {e:'⚡',t:'Klikací automat',d:'Odpovídáš rychleji než přečteš otázku. Buď jsi génius, nebo máš zavřené oči a klikáš naslepo. Výsledky napovídají.'};
      if(a<=4) return {e:'🚀',t:'Překvapivě funkční',d:'Pod 4 sekundy. Někdo zřejmě četl aspoň jednu knížku. Nebo titulky k filmům. Počítáme obojí.'};
      if(a<=7) return {e:'🐌',t:'Průměrný člověk',d:'Přemýšlíš kolem 7 sekund. Průměr. Jako všechno ostatní v tvém životě.'};
      if(a<=12) return {e:'🦴',t:'Mozek se zahřívá',d:'12 sekund na otázku z obecného přehledu. Buď přemýšlíš hodně, nebo hodně málo. Výsledky mluví za sebe.'};
      return {e:'🐠',t:'Zlatá rybka',d:'Víc než 12 sekund na otázku. Buď čteš pomalu, nebo čteš otázku vícekrát v naději že se změní. Nezmění.'};
    }
    if(a<=2) return {e:'⚡',t:'Kvantový procesor',d:'Odpovídáš rychleji než si stihneš přečíst otázku. Hazard nebo génius?'};
    if(a<=4) return {e:'🚀',t:'Rychlý jako NVMe',d:'Průměr pod 4s. Jsi připravený. Nebo odhazuješ naslepo.'};
    if(a<=7) return {e:'🎯',t:'Rozvážný expert',d:'Přemýšlíš před kliknutím. Starý zvyk správného admina.'};
    if(a<=12) return {e:'🐢',t:'Důkladný čtenář',d:'Čteš otázku třikrát. Jednou by stačilo, ale respektujeme pečlivost.'};
    return {e:'🦥',t:'Filosof v IT',d:'Každá odpověď je existenciální rozhodnutí. Nebo jsi šel uvařit kávu.'};
  }

  function accuracyRoast(acc) {
    if (isGeneral) {
      if(acc>=95) return {e:'🧠',t:'Podezřele chytrý',d:'95 % přesnost v obecném kvízu. Buď jsi výjimečně vzdělaný, nebo máš výjimečně dobrou paměť na náhodné věci. Každopádně ostatní tě nesnáší na teambuildingu.'};
      if(acc>=85) return {e:'📚',t:'Ten co četl knížky',d:'85 % přesnost. Zřejmě jsi v životě otevřel knihu. Nebo aspoň Wikipedia doporučené články. Vzácný druh.'};
      if(acc>=70) return {e:'💡',t:'Nadprůměrný smrtelník',d:'70 % přesnost. Nad průměrem — ale ten průměr je tak nízko, že je to trochu smutné. Přesto gratulujeme.'};
      if(acc>=55) return {e:'🤷',t:'Náhodou správně',d:'55 % přesnost. Statisticky jen o málo lepší než náhodné tipování. Ale aspoň se snažíš. Nebo ne?'};
      if(acc>=40) return {e:'🪨',t:'Vzdělanostní beton',d:'40 % přesnost. Pevný, nepropustný pro nové informace. Kde leží Afrika? Kdoví.'};
      return {e:'🌵',t:'Poušť vědomostí',d:'Pod 40 %. Sucho. Nic neroste. Naposledy ses učil ve škole a i tam to bylo sporné. Ale kvíz hraješ, takže něco.'};
    }
    if(acc>=95) return {e:'🧠',t:'Kyborg v lidském těle',d:'Podezřele správně. IT oddělení tě sleduje.'};
    if(acc>=85) return {e:'🎯',t:'Ostrý jako nový SSD',d:'Nemáš odpovědi, ty jsi odpověď.'};
    if(acc>=70) return {e:'💪',t:'Nadprůměrný člověk',d:'Ve firmě bys byl ten co opravuje ostatní.'};
    if(acc>=55) return {e:'🤔',t:'Slušný pokus',d:'Senior developer styl — polovina správně, polovina kreativně.'};
    if(acc>=40) return {e:'😅',t:'Optimistický začátečník',d:'Aspoň heslo na WiFi víš. Doufáme.'};
    return {e:'💀',t:'Živoucí důkaz chaosu',d:'Tiskárna by tě přechytračila.'};
  }

  function streakRoast(s) {
    if (isGeneral) {
      if(s>=30) return {e:'🔥',t:'Závislák na vědomostech',d:`${s} dní v kuse. V práci na tě čekají emaily. Rodina si zvykla. Terapeut ví o kvízu víc než o tobě.`};
      if(s>=14) return {e:'📅',t:'Pravidelný jako léky',d:`${s} dní. Přísně vzato — toto je jedinkrát kdy "pravidelně" nezní pozitivně. Ale IQ roste. Pomalu.`};
      if(s>=7)  return {e:'🌱',t:'Týden naděje',d:'7 dní v kuse. Začínáš budovat návyk. Nebo prokrastinuješ od něčeho důležitějšího. Pravděpodobně to druhé.'};
      if(s>=3)  return {e:'🐣',t:'Tři dny slavný',d:'3 dny. Skoro jako rekord. Uvidíme jestli to vydržíš déle než gym membership ze Silvestra.'};
      if(s>=1)  return {e:'👶',t:'Odhodlaný nováček',d:'Aspoň jeden den. To je víc než spousta lidí kteří si „chtěli rozšířit přehled" a pak sledovali Netflix.'};
      return {e:'📺',t:'Streak? Jaký streak?',d:'Nula dní v kuse. Vzdělanost nevznikne sama od sebe. I když — podle tvých výsledků možná neškodí.'};
    }
    if(s>=30) return {e:'🔥',t:'Na dovolené s laptopem',d:'Normální lidé odpočívají. Ty kvízuješ.'};
    if(s>=14) return {e:'⚡',t:'Pravidelný jako cron job',d:`${s} dní v kuse. Tvůj terapeut o tom neví.`};
    if(s>=7)  return {e:'📅',t:'Solidní návyk',d:'Týden v kuse. Víc než většina projektů.'};
    if(s>=3)  return {e:'🌱',t:'Roste to',d:'Nezruš to zítra jako gym membership.'};
    if(s>=1)  return {e:'🐢',t:'Začátek je těžký',d:'Aspoň jsi tady. Na rozdíl od dokumentace.'};
    return {e:'👻',t:'Přízrak čtenář',d:'Streak = 0. Ani cron by tě nenaplánoval.'};
  }

  const accR  = accuracyRoast(accuracy);
  const spdR  = speedRoast(avgAnswerTime);
  const strR  = streakRoast(currentStreak);
  const C={gold:'#ffd700',blue:'#4488ff',green:'#44ffaa',red:'#ff4444',gray:'#556688',purple:'#bb44ff',orange:'#ff9900'};

  // Doporučení — obecný vs IT
  const trainingTips = [];
  if (isGeneral) {
    if (accuracy<60)  trainingTips.push({e:'📖',t:'Čti cokoliv',d:'Noviny, knihy, Wikipedia, záložky ve WC — cokoliv. Aktuální stav je alarmující.'});
    if (weakCats.length && weakCats[0].acc<50) trainingTips.push({e:'🌍',t:weakCats[0].cat.replace(/^[^ ]+ /,''),d:`${weakCats[0].acc}% přesnost. To není slabina, to je díra. Doporučujeme Google, nebo aspoň otevřít okno a podívat se na svět.`});
    if (parseFloat(avgAnswerTime)>12) trainingTips.push({e:'⚡',t:'Rozhoduj rychleji',d:'Buď to víš, nebo nevíš. 12 sekund nezmění fakt, že to nevíš.'});
    if (perfectCount===0 && totalPlayed>=5) trainingTips.push({e:'💎',t:'Perfect run? Vzdálený sen',d:'Po pěti kvízech stále žádný perfect. Stačí 15/15. Ani jednou. Zamyšlení hodné.'});
    if (lucky.bombs>lucky.jackpots && lucky.total>=3) trainingTips.push({e:'🎲',t:'Smolař roku',d:'Lucky Box tě nenávidí. Nebo ty jeho. Každopádně — statisticky tragické.'});
  } else {
    if (accuracy<60)  trainingTips.push({e:'🎓',t:'IT základy',d:'Kurz "Proč je kabel důležitý a jiné záhady"'});
    if (parseFloat(avgAnswerTime)>12) trainingTips.push({e:'⚡',t:'Rychlost rozhodování',d:'Trénink rychlého rozhodování — ideálně bez Google a kávy'});
    if (perfectCount===0 && totalPlayed>=5) trainingTips.push({e:'💎',t:'Konzistence',d:'Na perfect run potřebuješ znalosti, ne štěstí'});
    if (weakCats.length && weakCats[0].acc<50) trainingTips.push({e:'📚',t:weakCats[0].cat,d:`Přesnost ${weakCats[0].acc}% — tady by pomohlo pořádné školení`});
    if (lucky.bombs>lucky.jackpots && lucky.total>=3) trainingTips.push({e:'🎲',t:'Risk management',d:'Tvůj instinkt na Lucky Box je statisticky tragický'});
    if (currentStreak===0 && totalPlayed>=3) trainingTips.push({e:'📅',t:'Pravidelnost',d:'Nepravidelné hraní = nepravidelné znalosti'});
  }

  return (
    <div style={{minHeight:'100vh',padding:'20px',maxWidth:700,margin:'0 auto'}}>
      <div className="slide-in">
        <div style={{textAlign:'center',paddingTop:24,marginBottom:16}}>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,letterSpacing:4,color:'#4488ff',marginBottom:6}}>ANALÝZA HRÁČE</div>
          <h2 className="glow" style={{fontFamily:"'Orbitron',sans-serif",fontSize:28,fontWeight:900,color:'#fff',marginBottom:4}}>MÉ STATISTIKY</h2>
          <div style={{fontSize:12,color:'#445566',marginBottom:16}}>{user.name}</div>
        </div>

        {/* Přepínač módu */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:20,background:'rgba(10,15,40,0.6)',borderRadius:10,padding:4,border:'1px solid #1e2a4a'}}>
          {[{m:QUIZ_MODES.IT,l:'💻 IT'},{m:QUIZ_MODES.GENERAL,l:'🌍 Obecný'},{m:QUIZ_MODES.FILM,l:'🎬 Film'}].map(({m,l})=>(
            <button key={m} onClick={()=>setLocalMode(m)} style={{
              padding:'10px',borderRadius:8,border:'none',cursor:'pointer',
              fontFamily:'inherit',fontSize:13,fontWeight:700,
              transition:'all 0.2s',
              background: localMode===m ? 'linear-gradient(135deg,#1a3a8a,#2255cc)' : 'transparent',
              color: localMode===m ? '#fff' : '#4a5a7a',
              boxShadow: localMode===m ? '0 0 20px rgba(68,136,255,0.3)' : 'none',
            }}>{l}</button>
          ))}
        </div>
        <div style={{fontSize:12,color:'#445566',textAlign:'center',marginBottom:16}}>
          {user.name} · {myScores.length} {myScores.length===1?'kvíz':'kvízů'}
        </div>

        {totalPlayed===0 ? (
          <div style={{textAlign:'center',padding:'60px 0'}}>
            <div style={{fontSize:48,marginBottom:16}}>🥚</div>
            <div style={{color:'#445566',fontSize:14}}>Zatím žádná data.</div>
            <div style={{color:'#334455',fontSize:12,marginTop:6}}>Zahraj první kvíz a uvidíš co z tebe vyleze.</div>
          </div>
        ) : (<>

          {/* ── PERSÓNA ── */}
          <div style={{background:'linear-gradient(135deg,rgba(68,136,255,0.12),rgba(34,85,200,0.06))',border:'1px solid #2a3a6a',borderRadius:14,padding:'16px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
            <span style={{fontSize:42,flexShrink:0}}>{accR.e}</span>
            <div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,fontWeight:900,color:'#88aaff',letterSpacing:2,marginBottom:4}}>{accR.t}</div>
              <div style={{fontSize:12,color:'#556688',lineHeight:1.5}}>{accR.d}</div>
            </div>
          </div>

          {/* ── HLAVNÍ ČÍSLA (2×3 grid) ── */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:8}}>
            {[
              {e:'🎯',l:'Přesnost',v:`${accuracy}%`,c:accuracy>=70?C.green:accuracy>=50?C.gold:C.red},
              {e:'⚡',l:'Průměrný čas',v:`${avgAnswerTime}s`,c:parseFloat(avgAnswerTime)<=5?C.green:parseFloat(avgAnswerTime)<=10?C.gold:C.red},
              {e:'📊',l:'Průměr/kvíz',v:avgScore.toLocaleString(),c:avgScore>=allAvg?C.green:C.blue},
              {e:'🏆',l:'Nejlepší kvíz',v:bestScore.toLocaleString(),c:C.gold},
              {e:'💎',l:'Perfect runs',v:perfectCount,c:perfectCount>0?C.gold:C.gray},
              {e:'🔥',l:'Streak',v:`${currentStreak}d`,c:currentStreak>=7?C.purple:currentStreak>=3?C.gold:C.gray},
            ].map(s=>(
              <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'12px 6px',textAlign:'center'}}>
                <div style={{fontSize:18,marginBottom:4}}>{s.e}</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:9,color:'#445566',marginTop:3}}>{s.l}</div>
              </div>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
            {[
              {e:'🚀',l:'Rychlé odpovědi',v:`${fastPct}%`,c:C.blue, sub:'do 3s'},
              {e:'🐢',l:'Pomalé odpovědi',v:`${slowPct}%`,c:slowPct>40?C.red:C.gray, sub:'nad 15s'},
              {e:'🏅',l:'Rank',v:myRank?`#${myRank}`:'—',c:myRank<=3?C.gold:myRank<=10?C.blue:C.gray, sub:`z ${allPlayers} hráčů`},
              {e:'📈',l:'vs průměr',v:`${avgScore>=allAvg?'+':''}${avgScore-allAvg}`,c:avgScore>=allAvg?C.green:C.red, sub:`avg ${allAvg.toLocaleString()} b`},
              {e:'⏱️',l:'Ušetřený čas',v:`${avgTimeSaved}s`,c:avgTimeSaved>=20?C.green:avgTimeSaved>=10?C.gold:C.gray, sub:'průměr/kvíz'},
              {e:'🎯',l:'Nejdelší série',v:`${maxAnswerStreak}×`,c:maxAnswerStreak>=10?C.gold:maxAnswerStreak>=5?C.blue:C.gray, sub:'správných za sebou'},
            ].map(s=>(
              <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 6px',textAlign:'center'}}>
                <div style={{fontSize:16,marginBottom:3}}>{s.e}</div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:9,color:'#445566',marginTop:1}}>{s.l}</div>
                {s.sub&&<div style={{fontSize:8,color:'#334455',marginTop:1}}>{s.sub}</div>}
              </div>
            ))}
          </div>

          {/* ── RYCHLOST komentář ── */}
          <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:28,flexShrink:0}}>{spdR.e}</span>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'#88aaff',marginBottom:2}}>{spdR.t}</div>
              <div style={{fontSize:11,color:'#556688'}}>{spdR.d}</div>
            </div>
            <div style={{marginLeft:'auto',textAlign:'right',flexShrink:0}}>
              <div style={{fontSize:9,color:'#334455',marginBottom:2}}>průměrný čas</div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:C.blue}}>{avgAnswerTime}s</div>
            </div>
          </div>

          {/* ── ODVĚTVOVÁ ANALÝZA ── */}
          {sectorData.length >= 2 && (
            <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:14}}>
                {isGeneral ? '🌍 JAKÁ TÉMATA TI JDOU' : '🏭 JAKÁ ODVĚTVÍ TI JDOU'}
              </div>
              {sectorData.map((s,i)=>{
                const col=s.acc>=80?C.green:s.acc>=60?C.gold:s.acc>=40?C.orange:C.red;
                const emoji=s.acc>=80?'✅':s.acc>=60?'🟡':s.acc>=40?'⚠️':'❌';

          {/* ── VERDIKT ── */}
          <div style={{background:'rgba(12,18,50,0.8)',border:'1px dashed #2a3a6a',borderRadius:12,padding:16,marginBottom:16,textAlign:'center'}}>
            <div style={{fontSize:9,color:'#334455',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>CELKOVÝ VERDIKT</div>

              {isGeneral ? (

                  : accuracy>=75&&avgScore>=allAvg
                  ? `${user.name}, přesnost výborná, skóre slušné. Jen ta rychlost — ale chápeme, přemýšlení nějaký čas trvá. Aspoň u tebe.`
                  : accuracy>=75
                  ? `${user.name}, vědomosti máš, ale skóre je průměrné. Buď klikáš pomalu, nebo oslavuješ každou správnou odpověď příliš dlouho.`
                  : avgScore>=allAvg
                  ? `${user.name}, rychlý jsi — ale tipuješ. Rychlé špatné odpovědi jsou pořád špatné odpovědi. Jen rychleji.`
                  : `${user.name}, výsledky jsou... zajímavé. Existuje věc zvaná kniha. Taky internet. Taky škola. Třeba jsi to minul.`
              ) : (
                accuracy>=75&&avgScore>=allAvg&&parseFloat(avgAnswerTime)<=6
                  ? `${user.name}, jsi ten člověk ve firmě co opravdu ví co dělá, dělá to rychle a nepotřebuje Stack Overflow. Ostatní to jen předstírají.`
                  : accuracy>=75&&avgScore>=allAvg
                  ? `${user.name}, znalosti i skóre máš výborné. Jen ta rychlost — ale kdo se nespěchá, taky někam dojde.`
                  : accuracy>=75&&parseFloat(avgAnswerTime)<=6
                  ? `${user.name}, rychlý a přesný. Jen to skóre by mohlo být vyšší.`
                  : accuracy>=75
                  ? `${user.name}, přesnost výborná, zbytek má potenciál. Potenciál se ale nenapíše do CV.`
                  : avgScore>=allAvg
                  ? `${user.name}, skóre nad průměrem, ale přesnost to trochu kazí.`
                  : `${user.name}, máš co zlepšovat — to je pozitivní zpráva.`
              )}
            </div>
          </div>

        </>)}
        <div style={{textAlign:'center',marginBottom:24}}>

        </div>
      </div>
    </div>
  );
}

async function loadMiniBoard(game, setter) {
  try {
    const { data, error } = await db.from('minigame_scores')
      .select('user_id,user_name,score').eq('game', game)
      .order('score',{ascending:false}).limit(100);
    if (error) return;
    const best = {};
    (data||[]).forEach(r => { if (!best[r.user_id] || r.score > best[r.user_id].score) best[r.user_id]=r; });
    setter(Object.values(best).sort((a,b)=>b.score-a.score).slice(0,10));
  } catch(e) {}
}

async function saveMiniScore(user, game, score, detail, onScoreSaved) {
  if (!user) return;
  try {
    const { error } = await db.from('minigame_scores').insert({
      id: Date.now().toString(), user_id: user.id, user_name: user.name,
      game, score, detail: detail || null, played_at: new Date().toISOString(),
    });
    if (error) console.error('saveMini:', error.message);
    if (onScoreSaved) onScoreSaved();
  } catch(e) { console.error(e); }
}

function MiniBoard({ game, title, color, onBack }) {
  const [board, setBoard] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);

  useEffect(() => {
    async function load() {
      try {
        const { data, error } = await db.from('minigame_scores')
          .select('user_id,user_name,score,detail').eq('game', game)
          .order('score',{ascending:false}).limit(200);
        if (error) return;
        const best = {};
        (data||[]).forEach(r => {
          if (!best[r.user_id] || r.score > best[r.user_id].score) best[r.user_id]=r;
        });
        setBoard(Object.values(best).sort((a,b)=>b.score-a.score).slice(0,10));
      } catch(e) {}
      setLoading(false);
    }
    load();
  }, [game]);

  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:color,letterSpacing:3,marginBottom:16}}>{title}</div>
      {loading
        ? <div style={{color:'#445566',fontSize:13,padding:'20px 0'}}>Načítám...</div>
        : board.length===0
          ? <div style={{color:'#445566',fontSize:13,padding:'30px 0'}}>Zatím žádné záznamy</div>
          : board.map((e,i)=>{
              const isOpen = expanded === i;
              // Parsuj detail pro stopky — klíče "Kolo X — cíl Y s"
              const rounds = e.detail ? Object.entries(e.detail).filter(([k])=>k.startsWith('Kolo')) : [];
              const hasDetail = game === 'stopwatch' && rounds.length > 0;
              return (
                <div key={i} style={{background:'rgba(12,18,52,.8)',border:`1px solid ${isOpen?color+'44':'#1e2a4a'}`,borderRadius:10,marginBottom:6,overflow:'hidden',transition:'border-color .2s'}}>
                  {/* Hlavní řádek */}
                  <div
                    onClick={()=>hasDetail&&setExpanded(isOpen?null:i)}
                    style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',cursor:hasDetail?'pointer':'default'}}
                  >
                    <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:i===0?'#ffd700':i===1?'#cccccc':i===2?'#cd7f32':'#334455',minWidth:24}}>{i+1}.</div>
                    <div style={{flex:1,fontSize:13,color:'#88aaff',fontWeight:700,textAlign:'left'}}>{e.user_name}</div>
                    <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:'#ffd700'}}>{e.score.toLocaleString()}</div>
                    {hasDetail && <div style={{fontSize:11,color:'#334455',marginLeft:4}}>{isOpen?'▲':'▼'}</div>}
                  </div>
                  {/* Detail kol — jen stopky */}
                  {isOpen && hasDetail && (
                    <div style={{padding:'0 14px 12px',borderTop:'1px solid #151f3a'}}>
                      {rounds.map(([k,v],ri)=>{
                        // "Kolo 1 — cíl 5 s" → "5.000000 s → +12 345 b"
                        const cil = k.match(/cíl (\d+)/)?.[1];
                        const parts = v.split(' → ');
                        const time = parts[0];
                        const pts  = parts[1];
                        // Odchylka z času
                        const t = parseFloat(time);
                        const target = parseInt(cil||'0');
                        const diff = Math.abs(t - target);
                        const diffCol = diff<0.001?'#44ffaa':diff<0.1?'#ffd700':'#ff6644';
                        return (
                          <div key={ri} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:ri<rounds.length-1?'1px solid #0e1428':'none'}}>
                            <div style={{width:28,height:28,borderRadius:'50%',background:'rgba(68,136,255,.15)',border:'1px solid #2a4a9a',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                              <span style={{fontSize:11,fontWeight:900,color:'#88aaff'}}>{cil}s</span>
                            </div>
                            <div style={{flex:1}}>
                              <div style={{fontSize:11,color:'#88aaff',fontFamily:"'Courier New',monospace",fontWeight:700}}>{time}</div>
                              <div style={{fontSize:10,color:diffCol}}>± {diff.toFixed(6)} s od cíle</div>
                            </div>
                            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:900,color:'#ffd700'}}>{pts}</div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })
      }
      <button onClick={onBack} style={{background:'transparent',border:'none',color:'#334455',fontSize:12,cursor:'pointer',letterSpacing:1,marginTop:16}}>← ZPĚT</button>
    </div>
  );
}

  const [twResult, setTwResult] = useState(null);
  const [slResult, setSlResult] = useState(null);
  const [saving, setSaving]     = useState(false);
  const [leaders, setLeaders]   = useState({});
  const [newRecord, setNewRecord] = useState(null); // {game, pts, prev}
  const myBestRef = useRef({});

  useEffect(() => {
    async function loadLeaders() {
      const games = ['stopwatch','targets','balance','tower','slash','mapbattle'];
      const result = {};
      const myBest = {};
      for (const game of games) {
        try {
          const { data } = await db.from('minigame_scores')
            .select('user_id,user_name,score').eq('game', game)
            .order('score',{ascending:false}).limit(100);
          if (data && data.length > 0) {
            const best = {};
            data.forEach(r => { if (!best[r.user_id] || r.score > best[r.user_id].score) best[r.user_id]=r; });
            const sorted = Object.values(best).sort((a,b)=>b.score-a.score);
            result[game] = sorted[0];
            // Osobní rekord hráče
            if (user && best[user.id]) myBest[game] = best[user.id].score;
          }
        } catch(e) {}
      }
      setLeaders(result);
      myBestRef.current = myBest;
    }
    loadLeaders();
  }, []);

  async function handleSave(game, pts, detail) {
    setSaving(true);
    // Zkontroluj osobní rekord a světový rekord PŘED uložením
    const prevPersonal = myBestRef.current[game] || 0;
    const prevWorld    = leaders[game]?.score || 0;
    const isPersonalRecord = pts > prevPersonal;
    const isWorldRecord    = pts > prevWorld;

    await saveMiniScore(user, game, pts, detail, onScoreSaved);
    setSaving(false);

    // Zobraz animaci rekordu
    if (isPersonalRecord || isWorldRecord) {
      setNewRecord({ game, pts, prev: prevPersonal, isWorld: isWorldRecord });
      setTimeout(() => setNewRecord(null), 5000);
    }

    // Refresh leaderů
    try {
      const { data } = await db.from('minigame_scores')
        .select('user_id,user_name,score').eq('game', game)
        .order('score',{ascending:false}).limit(100);
      if (data) {
        const best = {};
        data.forEach(r => { if (!best[r.user_id] || r.score > best[r.user_id].score) best[r.user_id]=r; });
        const sorted = Object.values(best).sort((a,b)=>b.score-a.score);
        setLeaders(prev => ({...prev, [game]: sorted[0]}));
        if (user && best[user.id]) myBestRef.current[game] = best[user.id].score;
      }
    } catch(e) {}
  }

  const GAMES = [
    { key:'sw',  emoji:'⏱', title:'Zastavte čas',      desc:'Trefte 5 s, 10 s, 15 s a 20 s', color:'#4488ff', boardKey:'board_sw', game:'stopwatch' },
    { key:'tg',  emoji:'🎯', title:'Terčová střelnice',  desc:'Zasáhni terče za 20 s',          color:'#ff4488', boardKey:'board_tg', game:'targets'   },
    { key:'bl',  emoji:'⚖️', title:'Rovnováha',          desc:'Udrž tyč co nejdéle',            color:'#44ffaa', boardKey:'board_bl', game:'balance'   },
    { key:'tw',  emoji:'🏗️', title:'Tower Builder',     desc:'Skládej bloky co nejpřesněji',   color:'#ffaa44', boardKey:'board_tw', game:'tower'     },
    { key:'sl',  emoji:'⚔️', title:'Slash Master',       desc:'Fruit Ninja stylem, fullscreen', color:'#44ffaa', boardKey:'board_sl', game:'slash'     },
    { key:'mp',  emoji:'🗺️', title:'Slepá mapa ČR',      desc:'Online multiplayer 2-6 hráčů',   color:'#44ddff', boardKey:'board_mp', game:'mapbattle', multiplayer:true },
  ];

  return (
    <div className="slide-in" style={{width:'100%',maxWidth:480,textAlign:'center',position:'relative'}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#bb44ff',letterSpacing:4,marginBottom:6}}>BONUS</div>
      <h2 className="glow" style={{fontFamily:"'Orbitron',sans-serif",fontSize:28,fontWeight:900,color:'#fff',marginBottom:16}}>MINIHRY</h2>

      {/* REKORD OVERLAY */}
      {newRecord && (
        <div style={{
          position:'fixed',top:0,left:0,right:0,bottom:0,
          zIndex:999,pointerEvents:'none',
          display:'flex',alignItems:'center',justifyContent:'center',
        }}>
          {/* Konfety efekt */}
          <div style={{position:'absolute',inset:0,overflow:'hidden'}}>
            {Array.from({length:newRecord.isWorld?24:16}).map((_,i)=>(
              <div key={i} style={{
                position:'absolute',
                left: (i*37+13)%100+'%',
                top:'-10px',
                width: 8+i%4,
                height: 8+i%3,
                background:['#ffd700','#ff4488','#44ffaa','#4488ff','#bb44ff','#ff9944'][i%6],
                borderRadius: i%2?'50%':'2px',
                animation:`confettiFall ${1.5+i%3*0.4}s ease-in ${i*0.08}s forwards`,
                transform:`rotate(${i*47}deg)`,
              }}/>
            ))}
          </div>
          {/* Hlavní karta */}
          <div style={{
            background:'linear-gradient(135deg,rgba(10,15,40,.97),rgba(20,10,50,.97))',
            border:`2px solid ${newRecord.isWorld?'#ffd700':'#44ffaa'}`,
            borderRadius:20,padding:'28px 32px',textAlign:'center',
            boxShadow:`0 0 60px ${newRecord.isWorld?'rgba(255,215,0,.5)':'rgba(68,255,170,.4)'}`,
            animation:'recordReveal .4s cubic-bezier(.175,.885,.32,1.275)',
            maxWidth:320,
          }}>
            <div style={{fontSize:52,marginBottom:8,animation:'spin 1s ease'}}>
              {newRecord.isWorld ? '🏆' : '🥇'}
            </div>
            <div style={{
              fontFamily:"'Orbitron',sans-serif",fontSize:11,letterSpacing:4,
              color:newRecord.isWorld?'#ffd700':'#44ffaa',marginBottom:6,
            }}>
              {newRecord.isWorld ? 'SVĚTOVÝ REKORD' : 'OSOBNÍ REKORD'}
            </div>
            <div style={{
              fontFamily:"'Orbitron',sans-serif",fontSize:38,fontWeight:900,
              color:'#fff',marginBottom:4,
              textShadow:`0 0 20px ${newRecord.isWorld?'rgba(255,215,0,.6)':'rgba(68,255,170,.6)'}`,
              animation:'scorePulse .6s ease .2s both',
            }}>{newRecord.pts.toLocaleString()}</div>
            {newRecord.prev > 0 && (
              <div style={{fontSize:12,color:'#445566',marginBottom:4}}>
                Předchozí: {newRecord.prev.toLocaleString()} b
                <span style={{color:'#44ffaa',marginLeft:6}}>+{(newRecord.pts-newRecord.prev).toLocaleString()}</span>
              </div>
            )}
            <div style={{fontSize:13,color:'#886600',fontStyle:'italic',marginTop:8}}>
              {newRecord.isWorld
                ? ['Uchyl od klávesnice. Rekordman.','Vesmír si o tobě povídá.','Zarámuj si to, přijdou hosté.','Ostatní mohou přestat zkoušet.'][newRecord.pts%4]
                : ['Lepšíš se. Nebo máš štěstí.','Nový osobní rekord. Skromně.','Píšeš historii. Svoji.','Progress je reálný.'][newRecord.pts%4]
              }
            </div>
          </div>
        </div>
      )}

      {/* MENU */}
      {screen==='menu' && (
        <div style={{animation:'slideIn .3s ease'}}>
          {GAMES.map(g=>{
            const leader = leaders[g.game];
            return (
              <div key={g.key} style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:14,padding:14,marginBottom:10,textAlign:'left'}}>
                <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:leader?10:0}}>
                  <span style={{fontSize:30,flexShrink:0}}>{g.emoji}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:15,fontWeight:700,color:'#fff',marginBottom:2}}>{g.title}</div>
                    <div style={{fontSize:11,color:'#445566'}}>{g.desc}</div>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:5,flexShrink:0}}>
                    <button onClick={()=>setScreen(g.key)} style={{background:`linear-gradient(135deg,${g.color}33,${g.color}55)`,border:`1px solid ${g.color}66`,borderRadius:8,padding:'7px 14px',fontSize:12,color:g.color,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>{g.multiplayer?'🌐 Online':'▶ Hrát'}</button>
                    {g.boardKey && <button onClick={()=>setScreen(g.boardKey)} style={{background:'transparent',border:'1px solid #1e2a4a',borderRadius:8,padding:'7px 14px',fontSize:11,color:'#445566',cursor:'pointer',whiteSpace:'nowrap'}}>🏆 Žebříček</button>}
                    {g.multiplayer && <div style={{textAlign:'center',fontSize:9,color:'#44ddff',letterSpacing:1,padding:'2px'}}>2-6 HRÁČŮ</div>}
                  </div>
                </div>
                {/* Leader */}
                {leader && (
                  <div style={{display:'flex',alignItems:'center',gap:8,background:'rgba(255,215,0,.06)',border:'1px solid rgba(255,215,0,.15)',borderRadius:8,padding:'6px 10px'}}>
                    <span style={{fontSize:14}}>👑</span>
                    <div style={{flex:1}}>
                      <span style={{fontSize:12,fontWeight:700,color:'#ffd700'}}>{leader.user_name}</span>
                      <span style={{fontSize:10,color:'#886600',marginLeft:6}}>leader</span>
                    </div>
                    <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:900,color:'#ffd700'}}>{leader.score.toLocaleString()}</div>
                  </div>
                )}
              </div>
            );
          })}
          <button onClick={onBack} style={{background:'transparent',border:'none',color:'#334455',fontSize:12,cursor:'pointer',letterSpacing:1,marginTop:8}}>← ZPĚT</button>
        </div>
      )}

      {/* STOPKY */}
      {screen==='sw' && !swResult && <StopwatchGame onResult={(pts,detail)=>{setSwResult({pts,detail});handleSave('stopwatch',pts,detail);}}/>}
      {screen==='sw' && swResult && (
        <MiniResult emoji="⏱" title="ZASTAVTE ČAS" result={swResult} color="#4488ff" saving={saving}
          onRetry={()=>setSwResult(null)}
          onBoard={()=>setScreen('board_sw')}
          onBack={()=>{setSwResult(null);setScreen('menu');}}/>
      )}

      {/* TERČE */}
      {screen==='tg' && !tgResult && <TargetsGame onResult={(pts,detail)=>{setTgResult({pts,detail});handleSave('targets',pts);}} swPts={0} phase={1}/>}
      {screen==='tg' && tgResult && (
        <MiniResult emoji="🎯" title="TERČOVÁ STŘELNICE" result={tgResult} color="#ff4488" saving={saving}
          onRetry={()=>setTgResult(null)}
          onBoard={()=>setScreen('board_tg')}
          onBack={()=>{setTgResult(null);setScreen('menu');}}/>
      )}

      {/* ROVNOVÁHA */}
      {screen==='bl' && !blResult && <BalanceGame onResult={(pts,detail)=>{setBlResult({pts,detail});handleSave('balance',pts);}} prevPts={0} phase={1}/>}
      {screen==='bl' && blResult && (
        <MiniResult emoji="⚖️" title="ROVNOVÁHA" result={blResult} color="#44ffaa" saving={saving}
          onRetry={()=>setBlResult(null)}
          onBoard={()=>setScreen('board_bl')}
          onBack={()=>{setBlResult(null);setScreen('menu');}}/>
      )}

      {/* TOWER BUILDER */}
      {screen==='tw' && !twResult && <TowerGame onResult={(pts,detail)=>{setTwResult({pts,detail});handleSave('tower',pts);}}/>}
      {screen==='tw' && twResult && (
        <MiniResult emoji="🏗️" title="TOWER BUILDER" result={twResult} color="#ffaa44" saving={saving}
          onRetry={()=>setTwResult(null)}
          onBoard={()=>setScreen('board_tw')}
          onBack={()=>{setTwResult(null);setScreen('menu');}}/>
      )}

      {/* SLASH MASTER */}
      {screen==='sl' && !slResult && <SlashMasterGame onResult={(pts,detail)=>{setSlResult({pts,detail});handleSave('slash',pts);}}/>}
      {screen==='sl' && slResult && (
        <MiniResult emoji="⚔️" title="SLASH MASTER" result={slResult} color="#44ffaa" saving={saving}
          onRetry={()=>setSlResult(null)}
          onBoard={()=>setScreen('board_sl')}
          onBack={()=>{setSlResult(null);setScreen('menu');}}/>
      )}

      {/* SLEPÁ MAPA ČR - multiplayer */}
      {screen==='mp' && <MapBattleGame user={user} onExit={()=>setScreen('menu')}/>}

      {/* ŽEBŘÍČKY */}
      {screen==='board_sw' && <MiniBoard game="stopwatch" title="⏱ ZASTAVTE ČAS"     color="#4488ff" onBack={()=>setScreen('menu')}/>}
      {screen==='board_tg' && <MiniBoard game="targets"   title="🎯 TERČOVÁ STŘELNICE" color="#ff4488" onBack={()=>setScreen('menu')}/>}
      {screen==='board_bl' && <MiniBoard game="balance"   title="⚖️ ROVNOVÁHA"         color="#44ffaa" onBack={()=>setScreen('menu')}/>}
      {screen==='board_tw' && <MiniBoard game="tower"     title="🏗️ TOWER BUILDER"     color="#ffaa44" onBack={()=>setScreen('menu')}/>}
      {screen==='board_sl' && <MiniBoard game="slash"     title="⚔️ SLASH MASTER"       color="#44ffaa" onBack={()=>setScreen('menu')}/>}
      {screen==='board_mp' && <MiniBoard game="mapbattle" title="🗺️ SLEPÁ MAPA ČR" color="#44ddff" onBack={()=>setScreen('menu')}/>}
    </div>
  );
}

function MiniResult({ emoji, title, result, color, saving, onRetry, onBoard, onBack }) {
  const { pts, detail } = result;
  return (
    <div style={{animation:'slideIn .3s ease'}}>
      <div style={{fontSize:52,marginBottom:8}}>{pts>=4000?'🏆':pts>=2000?'🥈':'🥉'}</div>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:38,fontWeight:900,color:'#ffd700',marginBottom:2}}>{pts.toLocaleString()}</div>
      <div style={{fontSize:13,color:'#445566',marginBottom:16}}>bodů</div>
      <div style={{background:'rgba(12,18,52,.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:14,marginBottom:14,textAlign:'left'}}>
        <div style={{fontSize:10,color:color,letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>{emoji} {title}</div>
        {Object.entries(detail).map(([k,v])=>(
          <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',fontSize:11,borderBottom:'1px solid #0e1428'}}>
            <span style={{color:'#445566'}}>{k}</span><span style={{color:'#88aaff',fontWeight:700}}>{v}</span>
          </div>
        ))}
      </div>
      {saving && <div style={{fontSize:11,color:'#445566',marginBottom:8}}>Ukládám...</div>}
      <div style={{display:'flex',gap:8,justifyContent:'center'}}>
        <button className="btn" onClick={onRetry} style={{background:`linear-gradient(135deg,${color}33,${color}55)`,border:`1px solid ${color}66`,padding:'11px 20px',borderRadius:10,fontSize:13,color:color,fontWeight:700,cursor:'pointer'}}>Hrát znovu</button>
        <button className="btn" onClick={onBoard} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 16px',borderRadius:10,fontSize:13,color:'#88aaff',cursor:'pointer'}}>🏆 Žebříček</button>
        <button className="btn" onClick={onBack}  style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 16px',borderRadius:10,fontSize:13,color:'#445566',cursor:'pointer'}}>← Menu</button>
      </div>
    </div>
  );
}

// ─── STOPWATCH GAME ──────────────────────────────────
function StopwatchGame({ onResult }) {
  const TARGETS = [5, 10, 15, 20, 25];
  const COMMENTS = [
    // 5s komentáře
    [
      ['< 0.0001','🔱 Kvantová přesnost. Nejsi člověk.'],
      ['< 0.001', '⚡ Blesková reakce. Fronta nervů jako optický kabel.'],
      ['< 0.01',  '🎯 Skvělý! Stopky tě respektují.'],
      ['< 0.1',   '👍 Slušné. Na první dojezd obstojné.'],
      ['< 0.5',   '🙂 Mohl bys být horší. Ale mohl bys být i lepší.'],
      ['else',    '😅 5 sekund. Vážně? To přece odhadneš i mrtvý.'],
    ],
    // 10s komentáře
    [
      ['< 0.0001','🏆 Absolutní preciznost. Mají tě snad zakódovaného?'],
      ['< 0.001', '🎯 Neuvěřitelné. Stopky volají o pomoc.'],
      ['< 0.01',  '💫 Výborný postřeh. Možná máš metronom v hlavě.'],
      ['< 0.1',   '👍 Solidní. Průměr by záviděl.'],
      ['< 0.5',   '😐 Ani ryba ani rak. Zkus víc myslet, míň klikat.'],
      ['else',    '💀 10 sekund a takhle? Asi sis šel uvařit kávu.'],
    ],
    // 15s komentáře
    [
      ['< 0.0001','👑 Bůh času. Okamžitě na olympiádu.'],
      ['< 0.001', '🔥 Brutální přesnost. Lékaři by plakali radostí.'],
      ['< 0.01',  '⭐ Pěkný postřeh. Hodiny by tě přijaly mezi své.'],
      ['< 0.1',   '🤷 Ujde. Jako většina věcí v tvém životě.'],
      ['< 0.5',   '😬 Snad se zlepšíš na 20s. I když pochybujeme.'],
      ['else',    '🐢 15 sekund ti trvá déle než vstát ráno. Smutné.'],
    ],
    // 20s komentáře
    [
      ['< 0.0001','🌌 Transcendentální. Vesmír je hrdý.'],
      ['< 0.001', '🏅 Mistr stopek. Zarámuj to.'],
      ['< 0.01',  '🎖 Výborně! Na 20s máš fakt cit.'],
      ['< 0.1',   '😑 No... aspoň jsi to dokončil. Bravo?'],
      ['< 0.5',   '🥱 Unaveně průměrné. Jak tvůj pondělní výkon.'],
      ['else',    '☕ 20 sekund a taková odchylka? Vrať se po kávě.'],
    ],
    // 25s komentáře
    [
      ['< 0.0001','🌠 Nadlidský. Čas se tě bojí.'],
      ['< 0.001', '🏆 Absolutní legenda. 25 sekund přesně!'],
      ['< 0.01',  '🎖 Brilantní! Vnitřní hodiny jako Švýcar.'],
      ['< 0.1',   '👏 Slušné na 25s. Klobouk dolů.'],
      ['< 0.5',   '😬 Po 25 sekundách se dalo čekat víc.'],
      ['else',    '🐌 25 sekund a takhle? To radši používej budík.'],
    ],
  ];

  function getComment(round, diff) {
    const tiers = COMMENTS[round];
    for (const [cond, msg] of tiers) {
      if (cond === 'else') return msg;
      const val = parseFloat(cond.replace('< ',''));
      if (diff < val) return msg;
    }
    return tiers[tiers.length-1][1];
  }

  const [round, setRound]       = useState(0);
  const [phase, setPhase]       = useState('idle'); // idle|running|paused|done
  const [display, setDisplay]   = useState('00.000000');
  const [barW, setBarW]         = useState(0);
  const [hits, setHits]         = useState([]);  // [{pts,diff,stopped,comment}]
  const [showHit, setShowHit]   = useState(false);
  const startRef  = useRef(0);
  const offsetRef = useRef(0);
  const rafRef    = useRef(0);
  const valRef    = useRef(0);
  const hitsRef   = useRef([]);
  const roundRef  = useRef(0);

  function calcPts(diff) {
    // 0.000000s = 50 000, 0.1s ≈ 25 000, 0.5s ≈ 3 000, 1.0s ≈ 200, 2s+ ≈ pár bodů
    const pts = Math.round(50000 * Math.pow(0.5, diff / 0.1));
    return Math.max(0, pts);
  }

  function tick() {
    const v  = offsetRef.current + (Date.now() - startRef.current) / 1000;
    const vd = v * 2;
    valRef.current = vd;
    const secs = Math.floor(vd);
    const frac = Math.floor((vd - secs) * 1000000);
    setDisplay(`${String(secs).padStart(2,'0')}.${String(frac).padStart(6,'0')}`);
    const target = TARGETS[roundRef.current];
    setBarW(Math.min(vd / target * 100, 100));
    if (vd < target * 3) rafRef.current = requestAnimationFrame(tick);
  }

  function handleStart() {
    offsetRef.current = 0; roundRef.current = 0;
    hitsRef.current = [];
    setHits([]); setRound(0); setShowHit(false);
    setDisplay('00.000000'); setBarW(0);
    startRef.current = Date.now();
    setPhase('running');
    rafRef.current = requestAnimationFrame(tick);
  }

  function handleStop() {
    cancelAnimationFrame(rafRef.current);
    const stopped = valRef.current;
    const target  = TARGETS[roundRef.current];
    const diff    = Math.abs(stopped - target);
    const pts     = calcPts(diff);
    const comment = getComment(roundRef.current, diff);
    const hit = { pts, diff, stopped, target, comment };
    hitsRef.current = [...hitsRef.current, hit];
    setHits([...hitsRef.current]);
    offsetRef.current = stopped / 2;

    const isLastRound = roundRef.current >= TARGETS.length - 1;
    setPhase('paused');
    setShowHit(true);

    if (isLastRound) {
      // Poslední kolo — po zobrazení výsledku automaticky pokračuj
      const total = hitsRef.current.reduce((s,h)=>s+h.pts, 0);
      setTimeout(() => {
        setPhase('done');
        const detail = {};
        hitsRef.current.forEach((h,i) => {
          detail[`Kolo ${i+1} — cíl ${h.target} s`] = `${h.stopped.toFixed(6)} s → +${h.pts.toLocaleString()} b`;
        });
        // Drzý komentář na základě celkového skóre
        const total = hitsRef.current.reduce((s,h)=>s+h.pts,0);
        const maxPossible = 50000 * TARGETS.length;
        const pct = total / maxPossible;
        const worstComment = hitsRef.current.reduce((w,h)=>h.diff>w.diff?h:w, hitsRef.current[0]);
        detail['💬'] = pct > 0.9 ? '🔱 Transcendentální. Patříš do muzea přesnosti.'
          : pct > 0.7 ? '⚡ Solidní výkon. Hodiny by tě vzaly mezi sebe.'
          : pct > 0.5 ? `🤔 Ušlo by to. Hlavně to kolo ${hitsRef.current.indexOf(worstComment)+1} bylo… tragické.`
          : pct > 0.3 ? '😬 Průměr jako tvůj ranní nálada. Lze zlepšit.'
          : '🐌 I slepá kura zrno najde. Ty zatím ne.';
        onResult(total, detail);
      }, 2500);
    }
  }

  function handleResume() {
    const nextRound = roundRef.current + 1;
    roundRef.current = nextRound;
    setRound(nextRound);
    setShowHit(false);
    startRef.current = Date.now();
    setPhase('running');
    rafRef.current = requestAnimationFrame(tick);
  }

  useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

  const target   = TARGETS[round];
  const running  = phase === 'running';
  const isClose  = running && barW >= 88 && barW <= 112;

                  {done

      <div style={{

        borderRadius:16,padding:'20px 10px 12px',marginBottom:14,position:'relative',overflow:'hidden',

        <div style={{

        <div style={{fontSize:10,color:'#334455',marginTop:5,letterSpacing:1}}>SEKUND · přesnost 0.000001</div>
        {running && totalSoFar > 0 && (
          <div style={{fontSize:11,color:'#334455',marginTop:4}}>Průběžně: <span style={{color:'#ffd700',fontWeight:700}}>{totalSoFar.toLocaleString()} b</span></div>

      <div style={{padding:'0 4px',marginBottom:16}}>
        <div style={{height:8,background:'rgba(20,30,70,.8)',borderRadius:4,overflow:'hidden',border:'1px solid #1e2a4a',position:'relative',marginBottom:4}}>

          <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:2,background:'rgba(255,215,0,.5)',transform:'translateX(-50%)'}}/>

        <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'#334455'}}>
