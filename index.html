      { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0f'/%3E%3Ctext y='.9em' font-size='80' x='10'%3E💻%3C/text%3E%3C/svg%3E", sizes: "512x512", type: "image/svg+xml" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = url;
  document.head.appendChild(link);

  // Service Worker inline jako blob pro offline support
  const swCode = `
    const CACHE = 'itquiz-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      // Smaž staré cache při aktivaci nové verze
      e.waitUntil(
        caches.keys().then(keys =>
          Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
        )
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }

  // Zachyť install prompt — uložíme pro pozdější použití
  window._pwaInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window._pwaInstallPrompt = e;
    // Vyvolej React event aby se tlačítko zobrazilo
    window.dispatchEvent(new Event('pwa-installable'));
  });
})();
</script>

  35: 'Cache procesoru je ultrarychlá paměť přímo v CPU. L1 (~100 KB) nejrychlejší, L3 (~32 MB) největší ale pomalejší.',
  36: 'ECC (Error Correcting Code) paměť detekuje a opravuje jednobiotové chyby. Klíčová pro servery a vědecké výpočty.',
  37: 'PSU (Power Supply Unit) převádí střídavé napětí (230V AC) na stejnosměrné (12V, 5V, 3.3V DC) pro komponenty.',
  38: 'M.2 je malý formátový faktor pro SSD a WiFi karty. Podporuje SATA i NVMe protokol. Délky: 2242, 2260, 2280 mm.',
  39: 'Teplovodivá pasta vyplňuje mikroskopické nerovnosti mezi CPU a chladičem. Bez ní vzduch degraduje přenos tepla 10×.',
  40: 'POST (Power-On Self Test) je diagnostika HW při startu: testuje RAM, CPU, GPU, disky. Chyby hlásí pípáním nebo kódy.',
  41: 'Overclocking = provoz nad specifikací výrobce. Zvyšuje výkon, ale i spotřebu, teplo a může zkrátit životnost.',
  42: 'Hot-swap umožňuje výměnu disku/PSU/NIC za provozu bez výpadku. Kritické pro RAID pole a serverové systémy.',
  43: 'JBOD (Just a Bunch of Disks) = disky bez RAID, každý disk je samostatný svazek. Žádná redundance, žádný striping.',
  44: 'Blade server = tenký serverový modul (blade) zasunutý do chassis. Sdílí napájení, chlazení a síťové prvky šasi.',
  45: 'CMOS baterie (CR2032) napájí RTC čip a uchovává BIOS nastavení při vypnutém PC. Vydrží 5–10 let.',
  // BEZPEČNOST
  46: 'Phishing je podvod napodobující důvěryhodnou entitu (banka, IT helpdesk). Cílem je získat přihlašovací údaje nebo platby.',
  47: 'DDoS (Distributed Denial of Service) = zahlcení cíle provozem z tisíců zdrojů (botnet). Legitimní uživatelé se nedostanou.',
  48: 'SSL/TLS šifruje komunikaci pomocí asymetrického handshake (výměna klíčů) + symetrického šifrování (data). TLS 1.3 je aktuální.',
  49: 'Brute force systematicky zkouší všechny kombinace hesel. Ochrana: dlouhá hesla, rate limiting, CAPTCHA, MFA.',
  50: 'Zero-day = zranitelnost bez záplaty, o které výrobce (zatím) neví. Útočníci ji aktivně exploitují před vydáním patche.',
  51: 'Ransomware šifruje soubory a požaduje výkupné (crypto). Ochrana: zálohy 3-2-1, aktuální SW, segmentace sítě.',
  52: '2FA (Two-Factor Authentication) kombinuje "co víš" (heslo) + "co máš" (TOTP, SMS, hardwarový klíč).',
  53: 'SQL injection vkládá škodlivý SQL kód přes vstupní pole (login, vyhledávání). Obrana: parametrizované dotazy, ORM.',
  54: 'HTTPS = HTTP přes TLS. Šifruje komunikaci, ověřuje identitu serveru certifikátem a chrání před odposloucháváním.',
  55: 'Malware = malicious software. Zahrnuje viry, trojany, ransomware, spyware, adware, rootkity a další škodlivý SW.',
  56: 'Penetrační test = simulovaný útok s písemným souhlasem. Cílem je najít zranitelnosti dříve než útočník.',
  57: 'Botnet = síť infikovaných PC (zombie) ovládaná C&C serverem. Používá se pro DDoS, spam, těžbu crypto, krádež dat.',
  58: 'XSS (Cross-Site Scripting) vkládá JS kód do webové stránky jiného uživatele. Krade session cookies, přesměrovává.',
  59: 'MITM (Man-In-The-Middle) = útočník se vloží mezi komunikaci. Dešifruje, čte nebo modifikuje provoz.',
  60: 'AES (Advanced Encryption Standard) je symetrická bloková šifra (128/192/256 bitů). Standard vlády USA od 2001.',
  61: 'RSA je asymetrický algoritmus (veřejný klíč šifruje, soukromý dešifruje). Jména: Rivest, Shamir, Adleman, MIT 1977.',
  62: 'SHA-256 produkuje 256bitový hash. Používá se v HTTPS certifikátech, Bitcoinu, podpisech. SHA-1 je zastaralý.',
  63: 'SIEM (Security Information and Event Management) sbírá, koreluje a analyzuje bezpečnostní události v reálném čase.',
  64: 'WAF (Web Application Firewall) chrání webové aplikace filtrováním HTTP provoz. Blokuje SQL injection, XSS, CSRF.',
  65: 'Zero trust = "never trust, always verify". Každý přístup se ověřuje bez ohledu na polohu (i uvnitř sítě).',
  // OS
  66: 'Kernel (jádro) je základ OS – řídí HW, procesy, paměť, soubory. Userspace aplikace komunikují přes systémová volání.',
  67: 'NTFS (New Technology File System) je standardní FS Windows. Podporuje oprávnění, šifrování (EFS), žurnálování, soubory >4 GB.',
  68: 'Swap je diskový prostor sloužící jako "náhradní RAM". Pomalý (100× pomalejší než RAM), ale lepší než OOM killer.',
  69: 'Virtualizace spouští více OS na jednom HW. Hypervisor (VMware, KVM, Hyper-V) izoluje VM a sdílí fyzické zdroje.',
  70: 'Hypervisor spravuje VM. Type 1 (bare-metal) běží přímo na HW. Type 2 (hosted) běží nad OS (VirtualBox, VMware Workstation).',
  71: 'Root (UID 0) je superuživatel Linuxu s neomezenými právy. Doporučuje se používat sudo místo trvalého přihlášení jako root.',
  72: 'Cron je plánovač úloh v Unixu. Formát: minuta hodina den měsíc den_týdne příkaz. Crontab -e edituje plán.',
  73: 'Docker kontejnerizuje aplikace s jejich závislostmi. Lehčí než VM (sdílí kernel), přenositelné a rychle startují.',
  74: 'GPT (GUID Partition Table) nahrazuje MBR. Podporuje disky >2 TB, až 128 oddílů, zálohu tabulky na konci disku.',
  75: 'Zombie proces = ukončený proces, jehož rodič ještě nepřečetl exit kód (wait()). Zabírá místo v tabulce procesů.',
  76: 'systemd je init systém (PID 1) v moderních Linuxech. Řídí bootování, spouštění/zastavení služeb a logování (journald).',
  77: 'Memory leak = aplikace alokuje paměť, ale neuvolňuje ji. Postupně vyčerpá RAM a způsobí zpomalení nebo pád.',
  78: 'Deadlock = cyklické čekání: proces A čeká na zdroj B, proces B čeká na zdroj A. Řeší se timeouty nebo prevencí.',
  79: 'Context switch = uložení stavu procesu (registry, PC) a obnovení jiného. Umožňuje multitasking, ale stojí CPU čas.',
  80: '/proc je virtuální (pseudo) filesystem poskytující informace o procesech a kernelu. /proc/cpuinfo, /proc/meminfo, atd.',
  // DATABÁZE
  81: 'SQL (Structured Query Language) je jazyk pro manipulaci s relačními databázemi. SELECT, INSERT, UPDATE, DELETE jsou základní příkazy.',
  82: 'Primární klíč jednoznačně identifikuje každý řádek tabulky. Musí být unikátní a NOT NULL. Automaticky vytváří index.',
  83: 'NoSQL DB nevyužívají relační model. Typy: dokumentové (MongoDB), key-value (Redis), sloupcové (Cassandra), grafové (Neo4j).',
  84: 'ACID = Atomicity (vše nebo nic), Consistency (data splňují pravidla), Isolation (transakce se neovlivňují), Durability (přežije pád).',
  85: 'Index je datová struktura (B-tree, hash) urychlující vyhledávání. Zrychluje SELECT, ale zpomaluje INSERT/UPDATE/DELETE.',
  86: 'JOIN spojuje řádky ze dvou tabulek podle podmínky. INNER JOIN = průnik, LEFT JOIN = všechny z levé + shody z pravé.',
  87: 'Transakce je atomická sekvence operací. BEGIN → operace → COMMIT (uloží) nebo ROLLBACK (vrátí zpět změny).',
  88: 'MongoDB ukládá data jako JSON-like dokumenty (BSON). Flexibilní schéma, horizontální škálování, vhodné pro nestrukturovaná data.',
  89: 'Redis je in-memory databáze (key-value). Extrémně rychlá (ns latence). Používá se pro cache, sessions, message queues.',
  90: 'Sharding rozděluje data horizontálně mezi více DB serverů (shardů). Umožňuje škálování nad kapacitu jednoho serveru.',
  // CLOUD
  91: 'IaaS (Infrastructure as a Service) = virtuální HW v cloudu. Spravuješ OS a aplikace, provider spravuje fyzický HW (AWS EC2).',
  92: 'SaaS (Software as a Service) = hotová aplikace přes internet. Nestaráš se o nic – jen používáš (Gmail, Office 365, Salesforce).',
  93: 'PaaS (Platform as a Service) = platforma pro vývoj aplikací. Spravuješ kód, provider spravuje OS a runtime (Heroku, GAE).',
  94: 'AWS má největší podíl na cloudovém trhu (~32 %). Azure je druhý (~22 %), Google Cloud třetí (~11 %). Stav 2024.',
  95: 'CDN (Content Delivery Network) = síť serverů po světě cachující obsah blíže uživatelům. Snižuje latenci a zatížení originu.',
  96: 'Serverless = spouštíš funkce bez správy serverů. Provider škáluje automaticky, platíš za spuštění (AWS Lambda, Azure Functions).',
  97: 'Kubernetes (K8s) orchestruje kontejnery: nasazení, škálování, self-healing, load balancing. Open source od Google.',
  98: 'Auto-scaling automaticky přidává/odebírá instance podle zatížení (CPU, paměť, počet požadavků). Šetří náklady i v špičkách.',
  99: 'CI/CD: Continuous Integration = automatický build a testy při každém commitu. CD = automatické nasazení do produkce.',
  100: 'Multi-cloud = využití více providerů (AWS + Azure + GCP). Výhody: vendor lock-in prevence, nejlepší služby od každého.',
  // KONEKTORY
  101: 'DisplayPort má 20 pinů. Podporuje vyšší rozlišení a refresh rate než HDMI. DisplayPort 2.1 = až 77.4 Gbit/s.',
  102: 'HDMI Type A má 19 pinů. Přenáší video (až 8K) i audio. Type C je mini HDMI (10 pinů), Type D je micro.',
  103: 'SATA konektor: datový (7 pin, L-tvar), napájecí (15 pin). SATA III = 6 Gbit/s (reálně ~550 MB/s).',
  104: 'TOSLINK (Toshiba Link) je optický audio konektor. Přenáší digitální audio bez elektrického rušení. Dosah ~10 m.',
  105: 'PCIe x16 má 82 pinů. Používá se výhradně pro GPU. x16 v Gen 4 = 32 GB/s obousměrně.',
  106: 'VGA (D-Sub 15 pin) přenáší analogový RGB video signál. Dnes zastaralý, nahrazen HDMI a DisplayPort.',
  107: 'PoE (Power over Ethernet, IEEE 802.3af/at/bt) napájí IP kamery, WiFi AP, VoIP telefony přes Cat5e/6 kabel.',
  108: 'Cat6 podporuje 10 Gbit/s na vzdálenost do 55 m (Cat6A až 100 m). Cat5e zvládne Gigabit na 100 m.',
  109: 'SFP (Small Form-factor Pluggable) je hot-pluggable transceiver pro optiku nebo měď. SFP+ = 10G, QSFP+ = 40G.',
  110: 'DB-9 (DE-9) je 9pinový D-sub konektor pro RS-232 sériovou komunikaci. Používán u průmyslových zařízení a starých PC.',
  // WIFI
  111: 'WiFi 6 (802.11ax) přináší OFDMA, MU-MIMO, BSS Coloring pro lepší výkon v hustých sítích. Max rychlost ~9,6 Gbit/s.',
  112: '802.11b pracuje na 2,4 GHz, max 11 Mbit/s. 2,4 GHz má větší dosah ale více rušení než 5 GHz.',
  113: 'SSID (Service Set Identifier) je název WiFi sítě. Může být skrytý (hidden SSID), ale to neposkytuje reálnou bezpečnost.',
  114: 'WPA3 (2018) nahrazuje WPA2. Přináší SAE (nahrazuje PSK), 192bit šifrování pro Enterprise a lepší ochranu open sítí.',
  115: 'WPS (WiFi Protected Setup) umožňuje připojení stiskem tlačítka nebo PIN kódem. PIN metoda má bezpečnostní zranitelnosti.',
  116: 'NFC (Near Field Communication) pracuje na 13,56 MHz, dosah <20 cm. Používá se pro platby (Apple Pay), párovačky a přístupové karty.',
  117: 'MIMO (Multiple Input Multiple Output) používá více antén pro paralelní přenos dat. Zvyšuje rychlost i spolehlivost spojení.',
  118: 'MU-MIMO (Multi-User MIMO) umožňuje AP komunikovat s více zařízeními zároveň místo postupně. WiFi 5 = 4×4 MU-MIMO.',
  119: 'WiFi 6E rozšiřuje WiFi 6 na 6 GHz pásmo (1200 MHz šířky). Méně rušení, ale kratší dosah než 2,4/5 GHz.',
  120: 'OFDMA (Orthogonal Frequency Division Multiple Access) rozděluje kanál na malé podkanály (RU) pro různá zařízení současně.',
  // TEORIE
  121: "Moore's Law (1965): počet tranzistorů na čipu se zdvojnásobí každé ~2 roky. Platilo cca do roku 2012, dnes se zpomaluje.",
  122: 'Open source = volně dostupný zdrojový kód. Licence: MIT (permisivní), GPL (copyleft), Apache 2.0. Bezplatný ≠ open source.',
  123: 'API (Application Programming Interface) = smlouva mezi systémy. Definuje, jak si aplikace předávají data a funkce.',
  124: 'Latence = zpoždění (ms) od odeslání po přijetí. Bandwidth = objem dat za sekundu. Latence se nelepší šířkou pásma.',
  125: 'Bandwidth (šířka pásma) = maximální přenosová kapacita. Throughput = skutečně dosažená rychlost (vždy ≤ bandwidth).',
  126: 'DevOps = kultura spolupráce Dev (vývoj) + Ops (provoz). Cílem je rychlejší, spolehlivější dodávka SW přes CI/CD, automatizaci.',
  127: 'Agile = iterativní vývoj v sprintech (1–4 týdny). Pravidelné dodávky hodnoty, zpětná vazba, přizpůsobivost změnám.',
  128: 'TCP three-way handshake: 1) SYN (klient), 2) SYN-ACK (server), 3) ACK (klient). Poté je spojení navázáno.',
  129: 'TTL v DNS = čas cachování záznamu. TTL v IP paketech = max. počet skoků (routerů). Každý router sníží o 1.',
  130: 'Redundance = záložní komponenty (druhý PSU, RAID, failover server). Zvyšuje dostupnost a odolnost vůči selhání.',
  // ÚLOŽIŠTĚ
  131: 'RAID 0 = striping: data rozdělena mezi disky pro vyšší rychlost. Výpadek jednoho disku = ztráta všech dat!',
  132: 'RAID 5 = striping s paritou. Min. 3 disky. Přežije výpadek 1 disku. Kapacita = (N-1) × velikost disku.',
  133: 'NAS (Network Attached Storage) = úložiště připojené k síti (NFS, SMB/CIFS). Přístupné všem zařízením v síti.',
  134: 'SAN (Storage Area Network) = dedikovaná síť pro storage (Fibre Channel, iSCSI). Vyšší výkon a škálovatelnost než NAS.',
  135: 'LVM (Logical Volume Management) = virtualizace diskového prostoru. Umožňuje online resize, snapshoty, RAID-like funkce.',
  136: 'iSCSI = SCSI příkazy přes IP síť. Levnější alternativa k Fibre Channel pro SAN. Vyžaduje dedikovanou síť pro výkon.',
  137: 'Enterprise HDD mají 10 000–15 000 RPM (SAS). Desktopové mají 7 200 RPM (SATA). Vyšší RPM = nižší latence přístupu.',
  138: 'Thin provisioning = alokace úložiště virtuálně. Disk "hlásí" 1 TB, ale fyzicky zabírá jen použitá data. Šetří místo.',
  139: '3-2-1 backup: 3 kopie dat, na 2 různých médiích, 1 kopie off-site (cloud/jiná budova). Zlatý standard zálohování.',
  140: 'Journaling zaznamenává plánované změny před jejich provedením. Po pádu obnoví konzistenci (ext4, NTFS, XFS, APFS).',
  // SPRÁVA
  141: 'SNMP (Simple Network Management Protocol) monitoruje síťová zařízení. Verze 3 přidává šifrování a autentizaci.',
  142: 'Ansible = agentless konfigurační management (SSH + YAML playbooks). Idempotentní operace, velká komunita.',
  143: 'Terraform = IaC nástroj od HashiCorp. Deklarativní HCL jazyk. Provider pro AWS, Azure, GCP a stovky dalších.',
  144: 'SLA (Service Level Agreement) = smlouva o úrovni služby. Definuje dostupnost (99,9% = 8,7 h výpadku/rok), RTO, RPO.',
  145: 'RTO (Recovery Time Objective) = maximální přijatelná doba výpadku. Čas od incidentu do obnovení provozu.',
  146: 'RPO (Recovery Point Objective) = maximální přijatelná ztráta dat. Jak stará záloha je ještě akceptovatelná?',
  147: 'Prometheus = open-source monitoring. Sbírá metriky přes HTTP (pull model), ukládá v time-series DB, má AlertManager.',
  148: 'Grafana = vizualizační platforma. Připojuje se na Prometheus, InfluxDB, Elasticsearch a další. Dashboardy, alerty.',
  149: 'Uptime = procento času, kdy systém funguje. 99,9% = 8,76 h výpadku/rok. 99,999% (five nines) = 5,26 min/rok.',
  150: 'ITIL = sada best practices pro IT service management. Pokrývá incident, change, problem, configuration management.',
  // PROTOKOLY
  151: 'HTTP 404 = Not Found. Server nenašel požadovaný zdroj. 4xx jsou chyby klienta, 5xx jsou chyby serveru.',
  152: 'HTTP 200 = OK. Požadavek byl úspěšně zpracován a server vrátil požadovaný obsah.',
  153: 'HTTP 500 = Internal Server Error. Obecná chyba serveru – něco se pokazilo na straně serveru.',
  154: 'HTTP 301 = Moved Permanently. Prohlížeč cachuje přesměrování. 302 = Found (dočasné přesměrování).',
  155: 'HTTP 403 = Forbidden. Server pochopil požadavek, ale odmítá ho vykonat (nedostatečná oprávnění).',
  156: 'REST API = architektura nad HTTP. Principy: stateless, resource-based URL, standardní HTTP metody (GET/POST/PUT/DELETE).',
  157: 'WebSocket = full-duplex komunikace přes TCP. Navázání přes HTTP Upgrade, poté trvalé spojení. Vhodné pro real-time apps.',
  158: 'SMTP (Simple Mail Transfer Protocol) odesílá poštu na portu 25 (server-server) nebo 587 (klient-server, STARTTLS).',
  159: 'IMAP (Internet Message Access Protocol) synchronizuje poštu ze serveru. E-maily zůstávají na serveru (na rozdíl od POP3).',
  160: 'JWT (JSON Web Token) = Base64-encoded header.payload.signature. Stateless autentizace – server nepotřebuje session store.',
  // VIRTUALIZACE
  161: 'VMware ESXi je Type-1 hypervisor (bare-metal). Běží přímo na HW bez host OS. Základ vSphere platformy.',
  162: 'Kontejner sdílí kernel hostitele (isolace přes namespaces/cgroups). VM má vlastní OS. Kontejner startuje v ms, VM v minutách.',
  163: 'VM snapshot zachytí stav (disk + RAM + konfigurace) v daném okamžiku. Umožňuje rychlý rollback. Není náhradou zálohy!',
  164: 'Live migration (vMotion, KVM live migrate) přesune běžící VM mezi hostiteli bez výpadku. Sdílené úložiště nutné.',
  165: 'Type-1 (bare-metal): ESXi, KVM, Hyper-V – běží přímo na HW. Type-2 (hosted): VirtualBox, VMware Workstation – nad OS.',
  166: 'Docker Compose definuje multi-kontejnerové aplikace v YAML (docker-compose.yml). Jeden příkaz spustí celý stack.',
  167: 'KVM (Kernel-based Virtual Machine) je Type-1 hypervisor v Linux kernelu (od 2007). Základ OpenStack a cloudů.',
  168: 'Hyper-V je Microsoft hypervisor. Integrovaný ve Windows Server a Windows 10/11 Pro. Podporuje live migration.',
  169: 'vMotion (VMware) migruje běžící VM mezi ESXi hostiteli bez výpadku. Vyžaduje sdílené úložiště a dobrou síť.',
  170: 'LXC (Linux Containers) je lehká virtualizace na úrovni OS. Základ pro Docker. Sdílí kernel, izoluje procesy.',
  // WINDOWS
  171: 'Active Directory (AD) je LDAP/Kerberos adresářová služba. Spravuje uživatele, počítače, skupiny a politiky v doméně.',
  172: 'Group Policy (GPO) centrálně konfiguruje Windows klienty a servery přes AD. Nastavení, skripty, software deployment.',
  173: 'LDAP (Lightweight Directory Access Protocol) je protokol pro přístup k adresářovým službám (Active Directory, OpenLDAP).',
  174: 'RDP (Remote Desktop Protocol, port 3389) umožňuje vzdálený grafický přístup k Windows. Šifrovaný od Windows Vista+.',
  175: 'BitLocker šifruje celý disk pomocí AES-256. Využívá TPM čip pro uložení klíče. Chrání data při ztrátě zařízení.',
  176: 'PowerShell je shell i skriptovací jazyk .NET. Pracuje s objekty místo textu. Klíčový pro správu Windows i Azure.',
  177: 'DNS A záznam mapuje doménové jméno na IPv4 adresu. AAAA je pro IPv6, CNAME je alias, MX je pro mail.',
  178: 'MX (Mail Exchanger) záznam definuje mailový server pro doménu. Má prioritu (nižší číslo = vyšší priorita).',
  179: 'NTP (Network Time Protocol, port 123/UDP) synchronizuje čas. Kerberos autentizace vyžaduje odchylku max 5 minut.',
  180: 'WSUS (Windows Server Update Services) centrálně spravuje Windows aktualizace v organizaci. Šetří bandwidth.',
  // LINUX
  181: 'chmod 755 = rwxr-xr-x. Vlastník: čtení+zápis+spuštění. Skupina a ostatní: čtení+spuštění. Typické pro skripty.',
  182: 'grep (Global Regular Expression Print) hledá vzor v textu. grep -r rekurzivně, grep -i ignoruje velikost, grep -v invertuje.',
  183: 'SSH klíče: privátní klíč (~/.ssh/id_rsa) zůstane u klienta, veřejný klíč (~/.ssh/authorized_keys) se nakopíruje na server.',
  184: 'tar -czf archiv.tar.gz složka/ = vytvoří gzip komprimovaný archiv. -x rozbalí, -t vypíše obsah, -v zobrazí průběh.',

  186: 'df -h zobrazí využití diskového prostoru v čitelném formátu (K/M/G). df bez -h ukazuje bloky. du -sh zobrazí velikost adresáře.',
  187: 'SELinux (Security Enhanced Linux) přidává povinné řízení přístupu (MAC) nad standardní Unix oprávnění. Mody: enforcing/permissive/disabled.',
  188: 'Inode uchovává metadata souboru (vlastník, oprávnění, časy, ukazatele na datové bloky). Jméno souboru v inode není.',

  // ŠIFROVÁNÍ
  196: 'Symetrické šifrování = stejný klíč pro šifrování i dešifrování (AES, 3DES). Rychlé, ale problém s distribucí klíče.',

  199: 'Salt je náhodná hodnota přidaná k heslu před hashováním. Zabraňuje rainbow table útokům. Každé heslo má jiný salt.',

  201: 'PUE = celková spotřeba DC / spotřeba IT zařízení. Ideální PUE = 1,0. Průměr industriální ~1,5. Google DC ~1,1.',

  211: 'GPU má tisíce malých jader pro paralelní výpočty ideální pro maticové operace v neuronových sítích. 10–100× rychlejší než CPU.',

  214: 'CUDA (Compute Unified Device Architecture) = NVIDIA platforma pro GPU výpočty. PyTorch a TensorFlow ji využívají.',

  216: 'OSPF (Open Shortest Path First) = link-state IGP protokol. Rychlá konvergence, hierarchie oblastí, metrika = cost (bandwidth).',
  217: 'QoS (Quality of Service) prioritizuje síťový provoz. VoIP a videokonference mají přednost před stahováním souborů.',
  218: '127.0.0.1 je loopback adresa (localhost). Pakety na tuto adresu nikdy neopustí hostitel. IPv6 ekvivalent: ::1.',
  219: 'MTU (Maximum Transmission Unit) = největší paket přenositelný bez fragmentace. Ethernet standard: 1500 bytů. Jumbo frame: 9000 B.',
  220: 'LACP (Link Aggregation Control Protocol, 802.3ad) dynamicky sdružuje fyzické linky do jednoho logického rozhraní (bonding).',

  226: 'Garbage collection automaticky uvolňuje paměť. Přístupy: mark-and-sweep, reference counting, generační GC (Java, Python, .NET).',

  246: 'CAP theorem: distribuovaný systém nemůže zároveň garantovat Consistency, Availability a Partition tolerance. Musíš si vybrat 2.',

  263: 'HA (High Availability) = systém funguje s minimálním výpadkem. Dosahuje se redundancí, failoverem a load balancingem.',

  276: 'Diffie-Hellman umožňuje dvěma stranám odvodit společný tajný klíč přes nezabezpečený kanál. Základ TLS key exchange.',

  338: 'Cloud bursting = automatický přeliv workloadu z privátního na veřejný cloud při špičce. Hybridní cloud pattern.',
  339: 'Hybrid cloud = privátní cloud + veřejný cloud. Citlivá data on-premise, elastické workloady v public cloudu.',
  340: 'FinOps = praxe optimalizace cloudových nákladů. Viditelnost, accountability a optimalizace (right-sizing, reserved instances).',
  // TEORIE pokračování
  341: 'A/B testing = dva varianty (A=kontrolní, B=testovaná) pro náhodné části uživatelů. Statistická signifikance rozhoduje.',
  342: 'Stress testing = zatěžování nad normální kapacitu. Cílem je najít bod selhání a chování pod extrémní zátěží.',
  343: 'Smoke test = minimální sada testů ověřující základní funkčnost po nasazení. "Smoke" = zda SW nezačne hořet.',
  344: 'Idempotence = operace aplikovaná vícekrát dá stejný výsledek jako jednou. PUT je idempotentní, POST není.',
  345: 'Race condition = výsledek závisí na načasování vláken/procesů. Řeší se synchronizací (mutex, semaphore, atomic ops).',
  // BEZPEČNOST pokračování
  346: 'Spyware tajně monitoruje aktivitu uživatele (stisky kláves, snímky obrazovky, přihlašovací údaje) a odesílá útočníkovi.',
  347: 'PKI (Public Key Infrastructure) = systém pro správu CA, certifikátů, klíčů. Základ HTTPS, e-mailových podpisů, VPN.',
  348: 'CSRF (Cross-Site Request Forgery) = oběť klikne na odkaz, který nevědomě provede akci na jiném webu kde je přihlášena.',
  349: 'Certificate pinning = aplikace přijímá pouze konkrétní certifikát/klíč. Zabraňuje MITM s podvrženým certifikátem.',
  350: 'SOC (Security Operations Center) = tým a centrum pro 24/7 monitoring, detekci a reakci na bezpečnostní incidenty.',
  // HARDWARE pokračování
  351: 'TRIM informuje SSD o blocích, které již nejsou používány. Umožňuje garbage collection a udržuje výkon v čase.',
  352: 'iGPU (integrated GPU) je grafická karta integrovaná přímo v procesoru (Intel UHD, AMD Radeon Graphics). Slabší než dGPU.',
  353: 'KVM over IP (IPMI, iDRAC, iLO) = vzdálená KVM konzole přes síť. Přístup i při vypnutém OS, mountování ISO.',
  354: 'iDRAC (Dell) a iLO (HPE) jsou management karty pro out-of-band správu serverů nezávisle na OS (power, BIOS, HW info).',
  355: 'Bottleneck = komponenta omezující výkon celého systému. Identifikace: CPU 100% + GPU nízké = CPU bottleneck.',
  // SÍTĚ pokračování 4
  356: 'Hvězdicová topologie = centrální switch/hub. Výhoda: snadná správa, izolace poruch. Nevýhoda: SPOF (single point of failure).',
  357: 'Mesh topologie: úplná (každý-s-každým) nebo částečná (redundantní cesty). Odolná, ale nákladná na implementaci.',
  358: 'IS-IS (Intermediate System to Intermediate System) = link-state IGP protokol. Preferován ISP pro škálovatelnost.',
  359: 'Anycast = jedna IP adresa sdílená více uzly. Provoz jde k nejbližšímu. Základ DNS (root servery) a CDN.',
  360: 'IKE (Internet Key Exchange) je protokol pro vyjednání SA (Security Association) a výměnu klíčů pro IPsec VPN.',
  // AI/ML pokračování
  361: 'Neuronová síť = vrstvy propojenývh neuronů. Vstupní, skryté a výstupní vrstvy. Váhy se upravují backpropagací.',
  362: 'Deep learning = neuronové sítě s mnoha skrytými vrstvami. Automaticky extrahuje features z raw dat (obraz, text, audio).',
  363: 'NLP (Natural Language Processing) = porozumění a generování přirozeného jazyka. Tokenizace, embedding, transformer architektury.',
  364: 'Computer vision = AI porozumění obrazu. CNN, detekce objektů (YOLO), segmentace, klasifikace obrázků.',
  365: 'Inference latency = čas od vstupu po odpověď modelu. Kritické pro real-time aplikace. Optimalizace: quantization, pruning.',
  // DATABÁZE pokračování
  366: 'Materialized view = předpočítaný výsledek dotazu uložený fyzicky. Rychlejší čtení, ale vyžaduje pravidelný refresh.',
  367: 'Cassandra = distribuovaná wide-column DB. Masterless (peer-to-peer), lineárně škálovatelná, AP v CAP. Základ Netflix.',
  368: 'Replikace kopíruje data na více uzlů: master-slave (jeden zdroj pravdy), multi-master (více zapisujících uzlů).',
  369: 'Cizí klíč (FK) referenčně integruje tabulky. FK v tabulce A odkazuje na PK tabulky B. Zabraňuje osiřelým záznamům.',
  370: 'INSERT INTO tabulka (sloupce) VALUES (hodnoty) přidá nový záznam. UPDATE modifikuje existující, DELETE maže.',
  // SPRÁVA pokračování
  371: 'Change management (ITIL) = RFC → CAB schválení → implementace → review. Minimalizuje riziko nedostatečně otestovaných změn.',
  372: 'Knowledge base = databáze Known Errors a workaroundů. Zkracuje MTTR při opakovaných incidentech. Základ Level 1 supportu.',
  373: 'Problem management hledá root cause opakujících se incidentů. Known Error → workaround → permanent fix (change management).',
  374: 'Kapacitní plánování = predikce budoucích potřeb HW/SW zdrojů na základě trendů. Zabraňuje nečekaným výpadkům.',
  375: 'Ticketing systém (ServiceNow, Jira, Zendesk) sleduje IT požadavky od vzniku po uzavření. SLA tracking, eskalace, reporting.',
  // TEORIE pokračování
  376: "Conway's Law (1967): organizace navrhují systémy zrcadlící jejich komunikační strukturu. Micro-teams → microservices.",
  377: "DRY (Don't Repeat Yourself) = každý kus znalosti má jedno autoritativní místo. Duplicita vede k nekonzistenci a bugům.",
  378: 'KISS (Keep It Simple, Stupid) = jednoduchost jako cíl návrhu. Komplexita je nepřítel udržovatelnosti a spolehlivosti.',
  379: 'ORM (Object Relational Mapping) mapuje objekty na DB tabulky. Abstrahuje SQL, ale může generovat neefektivní dotazy (N+1).',
  380: 'Graceful degradation = systém funguje s omezenou funkcionalitou při selhání části. Lepší než úplný výpadek.',
  // OS pokračování
  381: '/boot obsahuje kernel (vmlinuz), initrd/initramfs (dočasný root FS při startu) a GRUB konfiguraci.',
  382: 'MBR (první 512 bytů disku): 446 B bootloader + 64 B tabulka oddílů (4 záznamy, max 2 TB) + 2 B podpis 0xAA55.',
  383: 'chroot = izoluje proces do podstromu souborového systému. Jednoduchá "jail". Containers jsou bezpečnější alternativou.',
  384: 'Preemptive scheduling = OS může přerušit proces před dokončením a přidělit CPU jinému. Standard moderních OS.',
  385: 'Semaphore = synchronizační primitivum (Dijkstra). Binární (mutex) nebo počítací. P()/wait() dekrementuje, V()/signal() inkrementuje.',
  // KONEKTORY pokračování
  386: 'IEC 60320 C13 = "Mickey Mouse" konektor. C14 je zástrčka na přístroji. Standardní pro PC, monitory, síťové prvky.',
  387: 'DVI-D = pouze digitální signal. DVI-I = digitální + analogový (VGA kompatibilita). DVI-A = pouze analogový (vzácný).',
  388: 'QSFP+ (Quad SFP+) = 4× 10G lane = 40G celkem. QSFP28 = 4×25G = 100G. Používá LC duplex nebo MPO konektory.',
  389: 'LC (Lucent Connector) = 1,25mm ferrule, kompaktní. SC (Subscriber Connector) = 2,5mm ferrule, větší. LC preferován v DC.',
  390: 'Mini DisplayPort (mDP) má 20 pinů. Apple ho přejmenoval na Thunderbolt (stejný konektor, jiný protokol).',
  // WIFI pokračování
  391: 'BSS Coloring (802.11ax) = AP označuje rámce "barvou" (BSS Color). Klienti ignorují rámce s jinou barvou → méně kolizí.',
  392: 'Channel bonding spojuje 2+ kanály (20 MHz + 20 MHz = 40 MHz). Více bandwidth, ale méně dostupných kanálů.',
  393: 'Bluetooth 5.0 vs 4.2: 2× rychlost (2 Mbit/s), 4× dosah (200 m), 8× broadcasting kapacita. Zpětně kompatibilní.',
  394: 'Zigbee (IEEE 802.15.4) = mesh síť pro IoT. 2,4 GHz, nízká spotřeba, dosah 10–100 m. Základ Philips Hue, Amazon Alexa.',
  395: 'WiFi 5 (802.11ac) Wave 2: max 3,5 Gbit/s (4 streamy × 867 Mbit/s). Reálně 300–600 Mbit/s. Pouze 5 GHz.',
  // ŠIFROVÁNÍ pokračování
  396: 'Blockchain = distribuovaný, neměnný řetěz bloků dat. Každý blok obsahuje hash předchozího. Proof-of-Work/Stake konsensus.',
  397: 'MD5 produkuje 128bitový hash. Kryptograficky prolomený (kolize 2004). Stále používán pro checksum souborů, ne pro hesla.',
  398: 'KDF (Key Derivation Function) = PBKDF2, bcrypt, Argon2. Záměrně pomalé pro hašování hesel. Odolné vůči brute force.',
  399: 'CA (Certificate Authority) vydává digitální certifikáty a ověřuje identitu. Root CA → Intermediate CA → End-entity cert.',
  400: 'CSRF token = unikátní token vložený do formuláře. Server ověří token při odeslání. Zabraňuje CSRF útokům.',
  // TEORIE pokračování
  401: 'TCO (Total Cost of Ownership) = pořizovací cena + provozní náklady + maintenance + ukončení. Reálná cena vlastnictví.',
  402: 'CAPEX = kapitálové výdaje (jednorázové, aktivum). OPEX = provozní výdaje (průběžné). Cloud mění CAPEX na OPEX.',
  403: 'Polling = pravidelné dotazování serveru na nové události. Neefektivní (zbytečná zátěž). Alternativa: webhooky, WebSocket.',
  404: 'Hot standby = ihned připraven (aktivní replika). Warm standby = částečně připraven (minuty). Cold standby = minuty až hodiny.',
  405: 'Checkpoint = uložení stavu systému pro možnost obnovy od tohoto bodu. Základ fault tolerance v DB a distribuovaných systémech.',
  // SÍTĚ pokračování 5
  406: 'SSL VPN tuneluje přes HTTPS (port 443). Snadno prochází firewally. Clientless (webový prohlížeč) nebo full-tunnel klient.',
  407: 'VRRP (Virtual Router Redundancy Protocol, RFC 5798) = otevřený standard pro redundantní gateway. Cisco HSRP je proprietární.',
  408: 'Multicast = efektivní přenos jedné kopie dat skupině příjemců. IGMP (IPv4), MLD (IPv6) spravují skupiny.',
  409: 'Broadcast = přenos všem v broadcast doméně (255.255.255.255 nebo MAC ff:ff:ff:ff:ff:ff). ARP, DHCP Discovery ho využívají.',
  410: 'WiMAX (802.16) = širokopásmová bezdrátová technologie. Dosah desítky km. Dnes převážně nahrazen LTE/5G.',
  // HARDWARE pokračování
  411: 'SPD (Serial Presence Detect) = EEPROM čip na RAM obsahující parametry (frekvence, latence, napětí). BIOS ho čte pro autoconfig.',
  412: 'XMP (Extreme Memory Profile) = Intel standard pro OC profily RAM uložené v SPD. AMD používá EXPO pro DDR5.',
  413: 'TDP (Thermal Design Power) = maximální teplo generované CPU za normálního provozu. Základ pro dimenzování chlazení.',
  414: 'PWM (Pulse Width Modulation) = rychlé zapínání/vypínání napájení pro plynulou regulaci. Ventilátor 4pin PWM = přesné řízení.',
  415: '24-pinový ATX konektor napájí základní desku. Je to rozšíření původního 20-pin ATX konektoru (přidány 4 piny pro PCI-E).',
  // OS pokračování
  416: 'seccomp (secure computing mode) omezuje systémová volání dostupná procesu. Základ Docker bezpečnosti (seccomp profily).',
  417: '/etc (et cetera) = adresář pro konfigurační soubory celého systému. /etc/hosts, /etc/passwd, /etc/ssh/sshd_config atd.',
  418: 'Swap space = diskový prostor pro stránkování (paging). Jádro přesune méně používané stránky RAM na disk při nedostatku paměti.',
  419: 'Init proces (PID 1) = první proces spuštěný kernelem. Spouští všechny ostatní procesy. systemd, SysV init, OpenRC.',
  420: 'Runlevel (SysV) = 0 (vypnutí), 1 (single user), 3 (multi-user, bez GUI), 5 (multi-user, GUI), 6 (restart). systemd používá targets.',
  // DATABÁZE pokračování
  421: 'Trigger = procedura automaticky spuštěná BEFORE/AFTER INSERT/UPDATE/DELETE. Validace, audit log, kaskádové operace.',
  422: 'View = virtuální tabulka definovaná SELECT dotazem. Zjednodušuje komplexní dotazy, skrývá implementaci, bezpečnost.',
  423: 'Normalizace (1NF, 2NF, 3NF, BCNF) eliminuje redundanci a update anomálie. Denormalizace = kompromis pro výkon.',
  424: 'Deadlock v DB = dvě transakce čekají na zámky navzájem. DB detekuje deadlock a rollbackuje jednu transakci.',
  425: 'Connection pooling = pool předpřipravených DB spojení. Eliminuje overhead vytváření nového spojení pro každý dotaz.',
  // CLOUD pokračování
  426: 'Immutable infrastructure = servery se nikdy nemění – při updatu se vytvoří nová instance. Zabraňuje configuration drift.',
  427: 'Feature flag = runtime přepínač funkcionality bez deploymentu. A/B testing, postupné rollout, kill switch pro problémy.',
  428: 'Distributed tracing sleduje request přes mikroslužby (Jaeger, Zipkin, OpenTelemetry). Trace ID propagováno v hlavičkách.',
  429: 'Elasticsearch = distribuovaný full-text vyhledávač (Apache Lucene). REST API, JSON dokumenty, horizontálně škálovatelný.',
  430: 'Azure AD (Entra ID) = cloudová IAM pro Microsoft ekosystém. SSO, MFA, conditional access, device management.',
  // BEZPEČNOST pokračování
  431: 'Threat intelligence = informace o aktérech, TTP (Tactics/Techniques/Procedures), IoC (Indicators of Compromise). MITRE ATT&CK framework.',
  432: 'DAC (Discretionary Access Control) = vlastník zdroje určuje kdo má přístup (Unix chmod, Windows ACL). Flexibilní, ale méně bezpečné.',
  433: 'MAC (Mandatory Access Control) = systém (admin) určuje politiku, ne vlastník. SELinux, AppArmor. Bezpečnější než DAC.',
  434: 'NIST CSF (Cybersecurity Framework) = Identify, Protect, Detect, Respond, Recover. Dobrovolný framework pro řízení cyber rizik.',
  435: 'Burp Suite = platforma pro testování bezpečnosti web aplikací. Proxy, scanner, intruder, repeater. Community i Pro verze.',
  // LINUX pokračování
  436: 'systemd unit file = INI-style konfigurační soubor. Sekce [Unit], [Service/Timer/Mount], [Install]. Definuje chování služby.',
  437: 'journald = systemd komponent pro strukturované logování do binárního formátu. journalctl -u nginx, journalctl -f, journalctl --since.',
  438: '/var/log = adresář systémových logů. /var/log/syslog, auth.log, kern.log, nginx/, atd. Logrotate spravuje rotaci.',
  439: 'top zobrazuje procesy seřazené dle CPU. htop = vylepšená verze s barevným UI a stromovým zobrazením. q pro ukončení.',
  440: 'Package manager: apt (Debian/Ubuntu), yum/dnf (RHEL/Fedora), pacman (Arch), zypper (SUSE). Instalace: apt install nginx.',
  // DC pokračování
  441: 'Managed hosting = provider spravuje HW, OS, zálohy, monitoring. Zákazník jen aplikace. Vyšší cena, nižší zodpovědnost.',
  442: 'Out-of-band management = správa přes dedikovaný management port (IPMI, iDRAC, iLO) oddělený od produkční sítě.',
  443: 'DCIM (Data Center Infrastructure Management) = software pro správu napájení, chlazení, kapacity a aktiv v DC.',
  444: 'UPS (Uninterruptible Power Supply) v DC: online double-conversion (nejlepší) nebo line-interactive. Runtime: minuty → hodiny.',
  445: 'Network backbone = páteřní infrastruktura propojující různé sítě nebo části sítě. Vysoká bandwidth, nízká latence.',
  // PROTOKOLY pokračování
  446: "YAML = \"YAML Ain't Markup Language\". Human-readable serializace dat. Základ Kubernetes manifestů, Ansible playbooků.",
  447: 'JSON (JavaScript Object Notation) = lehký formát pro výměnu dat. Klíč-hodnota páry, pole, vnořené objekty. Čitelný.',
  448: 'XML (Extensible Markup Language) = značkovací jazyk. Verbose ale validovatelný (XSD). Základ SOAP, SVG, RSS.',
  449: 'Protocol Buffers (protobuf) = binární serializace od Google. Schéma v .proto souboru. 3–10× menší a rychlejší než JSON.',
  450: 'GraphQL (Facebook 2015) = query language pro API. Klient specifikuje přesně co chce. Eliminuje over/under-fetching.',
  // SÍTĚ pokračování 6
  451: '802.1Q = IEEE standard pro VLAN tagování. Přidává 4bytovou tag do Ethernet rámce obsahující VLAN ID (0–4094).',
  452: 'LLDP (Link Layer Discovery Protocol, IEEE 802.1AB) = otevřená alternativa CDP. Sdílí informace o zařízení a rozhraní.',
  453: 'Síťová smyčka = paket obíhá nekonečně (broadcast storm). STP/RSTP zabraňuje smyčkám blokováním redundantních portů.',
  454: 'CDP (Cisco Discovery Protocol) = Cisco proprietární L2 protokol. Sdílí hostname, IP, model, IOS verzi se sousedy.',
  455: 'Proxy server = zprostředkovatel mezi klientem a serverem. Forward proxy (klient → internet), reverse proxy (internet → servery).',
  // HARDWARE pokračování
  456: 'ATX (Advanced Technology Extended, Intel 1995) = standardní formát základní desky. Rozměry: 305×244 mm. microATX, Mini-ITX jsou menší.',
  457: 'Thunderbolt 4 (Intel) = USB-C konektor, min 40 Gbit/s, 2x DisplayPort 4K, USB4, PD 100W. Zpětně kompatibilní s USB-C.',
  458: 'Latency = zpoždění jedné operace (ms, µs). Throughput = objem operací/dat za sekundu. Lze optimalizovat nezávisle.',
  459: 'PCIe Gen 5 (32 GT/s/lane) = 2× rychlost Gen 4 (16 GT/s). x4 Gen 5 NVMe SSD: až ~14 GB/s sekvenční čtení.',
  460: 'DIMM (288 pinů) = desktoopový formát DDR4/5. SO-DIMM (260 pinů DDR4, 262 pinů DDR5) = laptop/compact PC formát.',
  // TEORIE pokračování
  461: 'Docs as code = dokumentace v Markdownu/RST v Git repozitáři. Review přes pull requesty, CI testy, automatické publikování.',
  462: 'GitFlow: main (produkce), develop (vývoj), feature/*, release/*, hotfix/*. Strukturovaný workflow pro větší týmy.',
  463: 'SOLID: Single responsibility, Open/closed, Liskov substitution, Interface segregation, Dependency inversion. OOP principy.',
  464: 'Event-driven = komponenty reagují na události (events). Loose coupling, asynchronní komunikace. Kafka, RabbitMQ, SNS.',
  465: 'Idempotent API = opakování stejného requestu = stejný výsledek. GET, PUT, DELETE jsou idempotentní. POST není.',
  // BEZPEČNOST pokračování
  466: 'Supply chain útok kompromituje software/HW v dodavatelském řetězci (SolarWinds 2020, npm balíčky). Těžko detekovatelný.',
  467: 'Obfuskace kódu záměrně znesnadňuje čtení (minifikace, renaming, virtualizace). Používá malware i komerční software.',
  468: 'Fuzzing = automatické testování náhodnými/mutovanými vstupy. AFL, libFuzzer. Nalézá buffer overflow, crash bugs.',
  469: 'Security by design = bezpečnost od začátku (threat modeling v design fázi), ne přidaná dodatečně. OWASP SAMM, SDL.',
  470: 'Patch management = inventář SW, detekce zranitelností, testování, nasazení záplat v definovaném okně. WSUS, Ansible.',
  // CLOUD pokračování
  471: 'Serverless funkce: AWS Lambda, Azure Functions, GCP Cloud Functions. Event-triggered, platíš za invokaci a CPU/ms.',
  472: 'Cloud-native = navrženo pro cloud od základu. 12-factor app, kontejnery, microservices, managed services, CI/CD.',
  473: 'Infrastructure drift = skutečný stav infrastruktury se liší od IaC definice. Terraform plan detekuje drift.',
  474: 'Zero-downtime deployment = blue-green, canary, rolling update. Load balancer postupně přeposílá provoz na novou verzi.',
  475: 'Kubernetes pod = nejmenší K8s jednotka. 1+ kontejnerů sdílí network namespace a storage volumes. Ephemeral by design.',
  // IoT pokračování
  476: 'Z-Wave = 868/908 MHz mesh protokol pro domácí automatizaci. Max 232 zařízení, dosah 30 m. Méně rušení než Zigbee.',
  477: 'Digital twin = virtuální replika fyzického objektu nebo procesu. Real-time synchronizace dat pro monitoring a simulace.',
  478: 'OTA (Over-The-Air) update = vzdálená aktualizace firmware zařízení. Kritické pro IoT fleet management a bezpečnostní záplaty.',
  479: 'IoT gateway = překladač protokolů (MQTT/Zigbee → HTTPS/AMQP). Lokální preprocessing, buffering při výpadku cloudu.',
  480: 'Matter (2022) = otevřený standard pro smart home (Apple, Google, Amazon, Samsung). IPv6 over Thread nebo WiFi.',
  // SPRÁVA pokračování
  481: 'Runbook = krok-za-krokem instrukce pro rutinní operace (restart služby, disaster recovery). Základ pro automatizaci.',
  482: 'Post-mortem = blameless analýza incidentu. Co se stalo, timeline, root cause, action items. Kultura učení, ne trestání.',
  483: 'On-call rotace = inženýři se střídají v primární/sekundární pohotovosti. PagerDuty, OpsGenie spravují eskalace a alerty.',
  484: 'Error budget = 100% - SLO (99,9% dostupnost = 0,1% error budget = 43,8 min/měsíc). Pokud vyčerpán, stop feature vývoje.',
  485: 'Toil = manuální, opakující se, automatizovatelná práce (SRE). Redukce toil → více času na engineering a inovace.',
  // DATABÁZE pokračování
  486: 'Table partitioning rozděluje velkou tabulku na fyzické části (range, list, hash). Výkon dotazů, správa dat, archivace.',
  487: 'Full-text search (Elasticsearch, PostgreSQL FTS) prohledává text nad rámec LIKE. Tokenizace, stemming, relevance ranking.',
  488: 'BASE = Basically Available (systém funguje), Soft state (data mohou být dočasně nekonzistentní), Eventual consistency.',
  489: 'Time-series DB (InfluxDB, TimescaleDB, Prometheus) optimalizovaná pro timestampovaná data. Efektivní komprimace a agregace.',
  490: 'Graf DB (Neo4j, Amazon Neptune) ukládá uzly (entity) a hrany (vztahy). Efektivní pro traversal vztahů (sociální sítě, doporučování).',

function getPlayerFact(name) {
  // Deterministický výběr podle jména — stejný hráč = stejný fakt
  const seed = name.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7);
  return PLAYER_FACTS[Math.abs(seed) % PLAYER_FACTS.length];
}
// Přidá cache-busting aby prohlížeč vždy načetl aktuální verzi avataru
function avatarSrc(url) {
  if (!url) return null;
  const base = url.split('?')[0];
  // Používáme hodinu jako cache-klíč — stačí, mění se max 1× za hodinu
  const hour = Math.floor(Date.now() / 3600000);
  return `${base}?v=${hour}`;
}
function getYesterdayKey() {
  const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);
}
function getCurrentMonthKey() {
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getPrevMonthKey() {
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(key) {
  if (!key) return '';
  const [y,m] = key.split('-');
  const names=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  return `${names[parseInt(m)-1]} ${y}`;
}

function seededShuffle(arr, seed) {
  const a=[...arr]; let s=seed;
  for(let i=a.length-1;i>0;i--){
      s=(s*1664525+1013904223)&0xffffffff;
      const j=Math.abs(s)%(i+1);
      [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function getDailyQuestions(dateKey, mode) {
  const pool = mode === QUIZ_MODES.GENERAL ? ALL_GENERAL_QUESTIONS : ALL_QUESTIONS;
  const seed = dateKey.split('-').reduce((a,b) => a*31+parseInt(b), 0);
  const selectedQs = seededShuffle(pool, seed).slice(0, QUESTIONS_PER_QUIZ);

  selectedQs.push({
    id: 'lucky', type: 'lucky', cat: '🎲 Lucky Box',
    q: 'Zkus štěstí! Vyber jednu ze 4 skrytých truhliček.',

  });

  return selectedQs;
}

// Náhodné zamíchání Lucky Box prizes (volá se při startu kvízu, různé pro každého hráče)
function randomLuckyPrizes() {
  const pool = [...LUCKY_PRIZES];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 4);
}

// Zamíchá otázky i odpovědi náhodně (Math.random) — každý hráč, každý start jinak
function shuffleQuestionsAndAnswers(questions) {
  // 1) Zamíchej pořadí otázek (Lucky Box zůstane vždy poslední)
  const normal = questions.filter(q => q.type !== 'lucky');
  const lucky  = questions.filter(q => q.type === 'lucky');
  for (let i = normal.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [normal[i], normal[j]] = [normal[j], normal[i]];
  }
  const ordered = [...normal, ...lucky];

  // 2) Zamíchej odpovědi každé otázky
  return ordered.map(q => {
    if (q.type === 'lucky') return { ...q, prizes: randomLuckyPrizes() };
    const opts = q.opts.map((opt, i) => ({ opt, i }));
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    const newA = opts.findIndex(o => o.i === q.a);
    return { ...q, opts: opts.map(o => o.opt), a: newA };
  });
}

// Uloží rozehraný kvíz do localStorage
function saveActiveQuiz(quiz) {
  lss('itq_active_quiz', {
    ...quiz,
    savedAt: getTodayKey(), // den kdy byl kvíz uložen
  });
}

// Načte rozehraný kvíz — vrátí null pokud neexistuje nebo je ze starého dne
function loadActiveQuiz(todayKey) {
  const saved = ls('itq_active_quiz', null);
  if (!saved) return null;
  if (saved.savedAt !== todayKey) { lsDel('itq_active_quiz'); return null; }
  // Kvíz byl dokončen nebo výsledky zobrazeny
  if (saved.finished) { lsDel('itq_active_quiz'); return null; }
  return saved;
}

function App() {
  const [screen, setScreen] = useState(SCREENS.HOME);
  const [user, setUser] = useState(() => ls('itq_user', null));
  const [scores, setScores] = useState([]);
  const [loading, setLoading] = useState(false);
  const [currentQuiz, setCurrentQuiz] = useState(null);
  const [wrongData, setWrongData] = useState(null);
  const [comboPopup, setComboPopup] = useState(null);
  const [dbOk, setDbOk] = useState(true);
  const [timeBonusToday, setTimeBonusToday] = useState(0);
  const [monthlyChampions, setMonthlyChampions] = useState([]);
  const [resumableQuiz, setResumableQuiz] = useState(null);
  const [quizMode, setQuizMode] = useState(QUIZ_MODES.IT); // 'it' nebo 'general' // rozehraný kvíz z localStorage

  const todayKey = getTodayKey();
  const yesterdayKey = getYesterdayKey();
  const todayQuestions = getDailyQuestions(todayKey, quizMode);
  const hasPlayedToday = user && scores.some(s => s.user_id === user.id && s.date === todayKey && (s.quiz_mode||QUIZ_MODES.IT) === quizMode);

  useEffect(() => {
    loadScores();
    loadMonthlyChampions();
    // Zkontroluj rozehraný kvíz z dnešního dne
    const saved = loadActiveQuiz(getTodayKey());
    if (saved) setResumableQuiz(saved);
  }, []);

  // Načti time bonus z předchozího dne jakmile je user přihlášen
  useEffect(() => {
    if (user) loadTimeBonus();
  }, [user?.id]);

  async function loadScores() {
    try {
      const { data, error } = await db.from('scores').select('*').order('score', { ascending: false });
      if (error) { setDbOk(false); return; }
      setScores(data || []);
    } catch { setDbOk(false); }
  }

  async function loadMonthlyChampions() {
    try {
      const { data } = await db.from('monthly_champions')
        .select('*').order('month', { ascending: false }).limit(12);
      setMonthlyChampions(data || []);
    } catch { /* tabulka nemusí existovat */ }
  }

  async function loadTimeBonus() {
    try {
      // Hledáme včerejší výsledek tohoto hráče a jeho time_saved
      const { data } = await db.from('scores')
        .select('time_saved')
        .eq('user_id', user.id)
        .eq('date', yesterdayKey)
        .maybeSingle();
      if (data?.time_saved > 0) {
        const bonus = Math.min(Math.round(data.time_saved * TIME_BONUS_RATIO), MAX_TIME_BONUS);
        setTimeBonusToday(bonus);
      } else {
        setTimeBonusToday(0);
      }
    } catch { setTimeBonusToday(0); }
  }

  async function registerUser(name, password, profile) {
    setLoading(true);
    const isLogin = profile === null; // null = přihlášení, object = registrace
    try {
      const username = name.trim();
      const pwd = password.trim();
      const { data: ex } = await db.from('users').select('*').ilike('name', username).maybeSingle();
      let u = ex;
      if (u) {
        if (u.password !== pwd) {
          alert('Špatné heslo!');
          setLoading(false); return;
        }
        if (profile) {
          const { data: upd } = await db.from('users').update(profile).eq('id', u.id).select().single();
          if (upd) u = upd;
        }
      } else {
        if (isLogin) {
          alert('Hráč "' + username + '" neexistuje. Zkus se nejdřív zaregistrovat.');
          setLoading(false); return;
        }
        const { data, error } = await db.from('users').insert({
          id: Date.now().toString(), name: username, password: pwd, ...(profile||{})
        }).select().single();
        if (error) { alert('Chyba: ' + error.message); setLoading(false); return; }
        u = data;
      }
      setUser(u); lss('itq_user', u);
      setScreen(SCREENS.HOME);
    } catch(e) { alert('Chyba připojení k databázi'); }
    setLoading(false);
  }

  async function activatePremium(code) {
    const clean = code.trim().toUpperCase();
    try {
      const { data: codeRow, error } = await db.from('premium_codes')
        .select('*').eq('code', clean).maybeSingle();
      if (error || !codeRow) return { ok: false, msg: 'Kód neexistuje.' };
      if (codeRow.used_by) return { ok: false, msg: 'Kód byl již použit.' };
      await db.from('premium_codes').update({
        used_by: user.id, used_at: new Date().toISOString()
      }).eq('code', clean);
      const { data: updated } = await db.from('users')
        .update({ premium: true }).eq('id', user.id).select().single();
      if (updated) { setUser(updated); lss('itq_user', updated); }
      else { const u = {...user, premium: true}; setUser(u); lss('itq_user', u); }
      return { ok: true };
    } catch(e) { return { ok: false, msg: 'Chyba připojení.' }; }
  }

  async function saveProfile(profileData) {
    setLoading(true);
    try {
      const { data, error } = await db.from('users')
        .update(profileData)
        .eq('id', user.id)
        .select()
        .single();
      if (data) {
        setUser(data); lss('itq_user', data);
      } else {
        const updated = { ...user, ...profileData };
        setUser(updated); lss('itq_user', updated);
      }
    } catch(e) {
      const updated = { ...user, ...profileData };
      setUser(updated);
      lss('itq_user', updated);
    }
    setLoading(false);
    setScreen(SCREENS.HOME);
  }

  async function finishQuiz(quiz) {
    // Perfect = všechny normální otázky správně (lucky box se nepočítá)
    const normalAnswers = quiz.answers.filter(a => a.q !== 'lucky');
    const allCorrect = normalAnswers.length > 0 && normalAnswers.every(a => a.correct);
    const perfectBonus = allCorrect ? PERFECT_BONUS : 0;
    // Skóre nesmí klesnout pod 0
    const finalScore = Math.max(quiz.totalScore + perfectBonus, 0);
    const timeSaved = quiz.timeLeft > 0 ? quiz.timeLeft : 0;
    const monthKey = getCurrentMonthKey();

    const playLog = quiz.playLog || [];
    // Jednoduchý checksum: součet (qId hash + time_spent + pts) pro každou odpověď
    const checksum = playLog.reduce((sum, e) => {
      const qHash = String(e.qId).split('').reduce((a,c) => a + c.charCodeAt(0), 0);
      return sum + qHash + (e.time_spent||0) + (e.pts||0);
    }, 0).toString(16);

    const entry = {
      id: Date.now().toString(), user_id: user.id, user_name: user.name,
      date: todayKey, score: finalScore,
      correct: quiz.answers.filter(a => a.correct).length,
      total: quiz.questions.length, timestamp: Date.now(),
      time_saved: timeSaved,
      perfect: allCorrect,
      play_log: playLog.length > 0 ? playLog : null,
      play_checksum: checksum,
      quiz_mode: quizMode,
    };
    // upsert podle user_id + date + quiz_mode (IT a obecný kvíz jsou oddělené záznamy)
    await db.from('scores').upsert(entry, { onConflict: 'user_id,date,quiz_mode' }).catch(() =>
      db.from('scores').upsert(entry, { onConflict: 'user_id,date' })
    );
    // Kvíz dokončen — smaž uložený stav
    lsDel('itq_active_quiz');
    setResumableQuiz(null);

    // Zkusíme korunovat měsíčního vítěze (spustí se jen pokud ještě nikdo není korunován)
    await tryCoronateMonthlyChampion(monthKey);

    await loadScores();
    setCurrentQuiz({...quiz, totalScore: finalScore, perfectBonus, timeSaved, allCorrect});
    setScreen(SCREENS.RESULT);
  }

  // Zkontroluje jestli je konec měsíce a korunuje vítěze předchozího měsíce
  async function tryCoronateMonthlyChampion(currentMonthKey) {
    try {
      const prevMonth = getPrevMonthKey();
      // Jestli už existuje champion za minulý měsíc, nic neděláme
      const { data: existing } = await db.from('monthly_champions')
        .select('id').eq('month', prevMonth).maybeSingle();
      if (existing) return;

      // Spočítáme top hráče za minulý měsíc
      const { data: prevScores } = await db.from('scores')
        .select('user_id, user_name, score')
        .like('date', `${prevMonth}-%`);
      if (!prevScores || prevScores.length === 0) return;

      // Agregujeme score per user
      const agg = {};
      prevScores.forEach(s => {
        if (!agg[s.user_id]) agg[s.user_id] = { user_id: s.user_id, user_name: s.user_name, total: 0, days: 0 };
        agg[s.user_id].total += s.score;
        agg[s.user_id].days += 1;
      });
      const sorted = Object.values(agg).sort((a,b) => b.total - a.total);
      if (sorted.length === 0) return;

      const winner = sorted[0];
      await db.from('monthly_champions').insert({
        id: `${prevMonth}-${winner.user_id}`,
        month: prevMonth,
        user_id: winner.user_id,
        user_name: winner.user_name,
        total_score: winner.total,
        days_played: winner.days,
      });
    } catch(e) { /* silent — tabulka nemusí existovat */ }
  }

  const S = {
    wrap: { minHeight:'100vh', background:'#0a0a0f', fontFamily:"'Inter', sans-serif", color:'#e0e8ff', position:'relative', overflowX:'hidden' },
    grid: { position:'fixed', top:0, left:0, right:0, bottom:0, backgroundImage:'linear-gradient(rgba(30,60,150,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,60,150,0.07) 1px,transparent 1px)', backgroundSize:'50px 50px', pointerEvents:'none', zIndex:0 },
    scan: { position:'fixed', top:0, left:0, right:0, bottom:0, background:'repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,50,100,0.025) 2px,rgba(0,50,100,0.025) 4px)', pointerEvents:'none', zIndex:0 },
    content: { position:'relative', zIndex:1 },
  };

  return (
    <div style={S.wrap}>
      <style>{`
        *{box-sizing:border-box;margin:0;padding:0}
        input{background:#0d1428;border:1px solid #2a3a6a;color:#e0e8ff;padding:12px 16px;border-radius:8px;font-family:inherit;font-size:16px;width:100%;outline:none;transition:border-color 0.2s}

        .shake{animation:shake 0.5s}
        @keyframes comboPop{
          0%{transform:scale(0.2) translateY(60px) rotate(-5deg);opacity:0}
          50%{transform:scale(1.25) translateY(-12px) rotate(2deg);opacity:1}
          70%{transform:scale(0.92) translateY(4px) rotate(-1deg)}

        }

          0%{opacity:1;transform:scale(1) translateY(0)}
          80%{opacity:0.8;transform:scale(1.08) translateY(-10px)}

        }

          0%{transform:translateX(0);opacity:1}
          100%{transform:translateX(120px);opacity:0}
        }        @keyframes edgeFlash{
          0%{opacity:0}10%{opacity:1}50%{opacity:0.5}100%{opacity:0}
        }
        @keyframes particleFly{

        @keyframes comboStreakIn{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}

        @keyframes perfectStarSpin{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.3)}100%{transform:rotate(360deg) scale(1)}}
        @keyframes perfectRain{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
        @keyframes chestShake{0%,100%{transform:rotate(0deg) scale(1)}20%{transform:rotate(-8deg) scale(1.1)}40%{transform:rotate(8deg) scale(1.1)}60%{transform:rotate(-5deg) scale(1.05)}80%{transform:rotate(5deg) scale(1.05)}}
        @keyframes chestOpen{0%{transform:scale(1) translateY(0)}30%{transform:scale(1.3) translateY(-10px)}60%{transform:scale(0.95) translateY(5px)}100%{transform:scale(1.1) translateY(-5px)}}
        @keyframes prizePop{0%{transform:scale(0) translateY(20px);opacity:0}60%{transform:scale(1.2) translateY(-5px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
        @keyframes chestGlow{0%,100%{box-shadow:0 0 10px #ffd70044}50%{box-shadow:0 0 30px #ffd700aa,0 0 60px #ffd70044}}
        .chest-btn{cursor:pointer;border:none;background:transparent;transition:transform 0.2s}
        .chest-btn:hover:not(:disabled){transform:translateY(-4px) scale(1.05)}
        .avatar-upload-wrap{position:relative;display:inline-block;cursor:pointer}
        .avatar-upload-wrap:hover .avatar-overlay{opacity:1}
        .avatar-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;font-size:22px}
        .tab-btn{background:transparent;border:1px solid #2a3a6a;color:#8899bb;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:1px;transition:all 0.2s}
        .tab-btn.active{background:#1a2a5a;border-color:#4488ff;color:#88aaff}
        input,select,textarea{background:#0d1428;border:1px solid #2a3a6a;color:#e0e8ff;padding:12px 16px;border-radius:8px;font-family:inherit;font-size:15px;width:100%;outline:none;transition:border-color 0.2s}
        input:focus,select:focus,textarea:focus{border-color:#4488ff;box-shadow:0 0 0 3px rgba(68,136,255,0.15)}
        select option{background:#0d1428}
        .field-label{font-size:11px;color:#4a5a7a;letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
      `}</style>
      <div style={S.grid}/>
      <div style={S.scan}/>
      {!dbOk && (
        <div style={{position:'fixed',top:0,left:0,right:0,background:'#440000',padding:'10px',textAlign:'center',zIndex:999,fontSize:13,color:'#ff8888'}}>
          ⚠️ Databáze není připojena — vyplň SUPABASE_URL a SUPABASE_KEY v HTML souboru
        </div>
      )}
      {/* KOMBO POPUP — efektní s edge flashem a particles */}
      {comboPopup && (() => {
        const cfg = {
          3:{emoji:'🔥',label:'SUPER KOMBO', c1:'#ff9900', border:'#ff9900'},
          4:{emoji:'⚡',label:'MEGA KOMBO',  c1:'#bb44ff', border:'#bb44ff'},
          5:{emoji:'💥',label:'ULTRA KOMBO', c1:'#ff2255', border:'#ff2255'},
        }[comboPopup.level] || {emoji:'🔥',label:'KOMBO',c1:'#ff9900',border:'#ff9900'};
        return (
          <div key={comboPopup.key} style={{
            position:'fixed', top:16, right:16, zIndex:150,
            pointerEvents:'none',
            animation:'comboToast 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards, comboToastOut 0.3s ease 0.85s forwards',
          }}>
            <div style={{
              display:'flex',alignItems:'center',gap:10,
              background:'rgba(10,14,35,0.92)',
              border:`1px solid ${cfg.border}88`,
              borderRadius:12,
              padding:'10px 16px',
              boxShadow:`0 0 20px ${cfg.border}44`,
              backdropFilter:'blur(8px)',
            }}>
              <span style={{fontSize:22,lineHeight:1}}>{cfg.emoji}</span>
              <div>
                <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,fontWeight:900,color:cfg.c1,letterSpacing:2}}>{cfg.label}</div>
                <div style={{fontSize:12,color:cfg.c1,fontWeight:700,letterSpacing:1}}>+{comboPopup.bonus.toLocaleString()} bodů</div>
              </div>
            </div>
          </div>
        );
      })()}

      {wrongData && (
        <div onClick={()=>{
          if(window._quizResumeCallback) window._quizResumeCallback();
          setWrongData(null);
        }} style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,0.93)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',padding:'20px',overflowY:'auto'}}>
          <div className="shake" style={{textAlign:'center',maxWidth:540,width:'100%',paddingBottom:10}}>
            <div style={{fontSize:64,marginBottom:10}}>💀</div>
            <div style={{fontSize:'clamp(15px,2.8vw,21px)',color:'#ff4444',fontWeight:700,lineHeight:1.45,marginBottom:22,padding:'0 8px'}}>
              {wrongData.insult}
            </div>
            <div style={{background:'rgba(0,80,0,0.4)',border:'1px solid #22aa44',borderRadius:12,padding:'14px 18px',marginBottom:12,textAlign:'left'}}>
              <div style={{fontSize:10,color:'#22aa44',letterSpacing:2,marginBottom:6,fontFamily:"'Orbitron',sans-serif"}}>✅ SPRÁVNÁ ODPOVĚĎ</div>
              <div style={{fontSize:16,fontWeight:700,color:'#88ff88'}}>{wrongData.correctAnswer}</div>
            </div>
            <div style={{background:'rgba(10,20,60,0.8)',border:'1px solid #2a3a6a',borderRadius:12,padding:'14px 18px',marginBottom:14,textAlign:'left'}}>
              <div style={{fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>💡 PROČ JE TO TAK</div>
              <div style={{fontSize:14,color:'#b0c4e8',lineHeight:1.65}}>{wrongData.explanation}</div>
            </div>
            <div style={{fontSize:13,color:'#445566',fontStyle:'italic',marginBottom:18,padding:'0 8px'}}>{wrongData.ending}</div>
            <div style={{fontSize:11,color:'#2a3a5a',letterSpacing:2}}>— KLIKNI KAMKOLIV PRO POKRAČOVÁNÍ —</div>
          </div>
        </div>
      )}

      <div style={S.content}>
        {screen===SCREENS.HOME && <HomeScreen user={user} hasPlayedToday={hasPlayedToday} todayKey={todayKey} todayQuestions={todayQuestions}
          timeBonusToday={timeBonusToday}
          resumableQuiz={resumableQuiz}
          quizMode={quizMode}
          onSwitchMode={(m)=>{ setQuizMode(m); setResumableQuiz(loadActiveQuiz(getTodayKey()+'_'+m)||null); }}
          onResume={()=>{
            setCurrentQuiz(resumableQuiz);
            setResumableQuiz(null);
            setScreen(SCREENS.QUIZ);
          }}
          onRegister={()=>setScreen(SCREENS.REGISTER)}
          onLogin={()=>setScreen(SCREENS.LOGIN)}
          onProfile={()=>setScreen(SCREENS.PROFILE)}
          onStart={()=>{
            const totalTime = QUIZ_DURATION + timeBonusToday;
            // Zamíchej otázky i odpovědi náhodně pro tohoto hráče
            const questions = shuffleQuestionsAndAnswers(todayQuestions);
            const newQuiz = {
              questions, answers: [], current: 0,
              timeLeft: totalTime, totalDuration: totalTime,
              totalScore: 0, timeBonusUsed: timeBonusToday,
              savedAt: getTodayKey(),
            };
            saveActiveQuiz(newQuiz);
            setResumableQuiz(null);
            setCurrentQuiz(newQuiz);
            setScreen(SCREENS.QUIZ);
          }}
          onBoard={()=>setScreen(SCREENS.BOARD)}
          onStats={()=>setScreen(SCREENS.STATS)}
          onLogout={()=>{setUser(null);lss('itq_user',null);}}
          loading={loading}/>}
        {screen===SCREENS.REGISTER && <RegisterScreen onRegister={registerUser} onBack={()=>setScreen(SCREENS.HOME)} loading={loading} initialTab="register"/>}
        {screen===SCREENS.LOGIN    && <RegisterScreen onRegister={registerUser} onBack={()=>setScreen(SCREENS.HOME)} loading={loading} initialTab="login"/>}
        {screen===SCREENS.PROFILE && user && <ProfileScreen user={user} onSave={saveProfile} onBack={()=>setScreen(SCREENS.HOME)} loading={loading}/>}
        {screen===SCREENS.QUIZ && currentQuiz && <QuizScreen quiz={currentQuiz} onFinish={finishQuiz}
          onWrong={(q)=>{
            if(!q) return;
            const insult=INSULTS[Math.floor(Math.random()*INSULTS.length)];
            const ending=INSULT_ENDINGS[Math.floor(Math.random()*INSULTS.length%INSULT_ENDINGS.length)];
            const correctAnswer=q.opts[q.a];
            const explanation=EXPLANATIONS[q.id]||`Správná odpověď je: "${correctAnswer}".`;
            setWrongData({insult,ending,correctAnswer,explanation});
          }}
          onCombo={(level,bonus)=>{
            setComboPopup({level,bonus,key:Date.now()});
            setTimeout(()=>setComboPopup(null),1200);
          }}
        />}
        {screen===SCREENS.RESULT && currentQuiz && <ResultScreen quiz={currentQuiz} timeSaved={currentQuiz.timeSaved||0} onHome={()=>setScreen(SCREENS.HOME)} onBoard={()=>setScreen(SCREENS.BOARD)}/>}
        {screen===SCREENS.BOARD && <BoardScreen scores={scores} user={user} todayKey={todayKey} monthlyChampions={monthlyChampions} quizMode={quizMode} onBack={()=>setScreen(SCREENS.HOME)}/>}
        {screen===SCREENS.STATS && user && <StatsScreen user={user} scores={scores} onBack={()=>setScreen(SCREENS.HOME)}/>}
      </div>
    </div>
  );
}

// ─── HOME ─────────────────────────────────────────────
function HomeScreen({ user, hasPlayedToday, todayKey, todayQuestions, timeBonusToday, resumableQuiz, quizMode, onSwitchMode, onResume, onRegister, onLogin, onStart, onBoard, onStats, onLogout, onProfile, loading }) {
  const cats = [...new Set(todayQuestions.map(q=>q.cat).filter(c=>c!=='🎲 Lucky Box'))];
  const isGeneral = quizMode === QUIZ_MODES.GENERAL;
  const OS_LABELS = {linux:'🐧 Linux', windows:'🪟 Windows', macos:' macOS', bsd:'👹 BSD', arch:'💀 Arch (btw)'};
  const totalTime = QUIZ_DURATION + (timeBonusToday||0);
  const resumeProgress = resumableQuiz ? resumableQuiz.answers.length : 0;
  const resumeTotal = resumableQuiz ? resumableQuiz.questions.length : 0;

  // PWA install logika
  const [installable, setInstallable] = useState(!!window._pwaInstallPrompt);
  const [installed, setInstalled] = useState(
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true
  );
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  useEffect(() => {
    const onInstallable = () => setInstallable(true);
    const onAppInstalled = () => { setInstalled(true); setInstallable(false); };
    window.addEventListener('pwa-installable', onInstallable);
    window.addEventListener('appinstalled', onAppInstalled);
    return () => {
      window.removeEventListener('pwa-installable', onInstallable);
      window.removeEventListener('appinstalled', onAppInstalled);
    };
  }, []);

  async function handleInstall() {
    if (window._pwaInstallPrompt) {
      await window._pwaInstallPrompt.prompt();
      const result = await window._pwaInstallPrompt.userChoice;
      if (result.outcome === 'accepted') { setInstalled(true); setInstallable(false); }
      window._pwaInstallPrompt = null;
    }
  }

  // Zobraz install banner: jen mobil, není nainstalováno, buď installable nebo iOS
  const showInstallBanner = isMobile && !installed && (installable || isIOS);
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}>
      <div className="slide-in" style={{width:'100%',maxWidth:640,textAlign:'center'}}>

        {/* PWA Install Banner — jen mobil, jen pokud není nainstalováno */}
        {showInstallBanner && (
          <div style={{
            background:'linear-gradient(135deg,rgba(68,136,255,0.18),rgba(34,85,200,0.1))',
            border:'1px solid #4488ff66',borderRadius:12,
            padding:'12px 16px',marginBottom:20,
            display:'flex',alignItems:'center',gap:12,
          }}>
            <div style={{fontSize:26,flexShrink:0}}>📲</div>
            <div style={{flex:1,textAlign:'left'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#88aaff',marginBottom:2}}>Přidat na plochu</div>
              <div style={{fontSize:11,color:'#4a6a9a'}}>
                {isIOS
                  ? 'Klepni na Sdílet → Přidat na plochu'
                  : 'Nainstaluj appku pro rychlý přístup'}
              </div>
            </div>
            {!isIOS && (
              <button onClick={handleInstall} className="btn" style={{
                background:'linear-gradient(135deg,#1a3a8a,#2255cc)',
                padding:'8px 16px',borderRadius:8,fontSize:12,
                color:'#fff',letterSpacing:1,flexShrink:0,
              }}>INSTALOVAT</button>
            )}
            {isIOS && (
              <div style={{fontSize:20,flexShrink:0}}>⬆️</div>
            )}
          </div>
        )}

        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:6,color:'#4488ff',marginBottom:8,opacity:0.8}}>DAILY CHALLENGE</div>
        <h1 className="glow" style={{fontFamily:"'Orbitron', sans-serif",fontSize:'clamp(40px,9vw,80px)',fontWeight:900,letterSpacing:4,color:'#fff',lineHeight:1}}>
          IT<span style={{color:'#4488ff'}}>QUIZ</span>
        </h1>
        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:11,letterSpacing:3,color:'#4a5a7a',marginTop:4,marginBottom:20}}>KAŽDÝ DEN NOVÉ OTÁZKY</div>

        {/* Přepínač módu */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:24,background:'rgba(10,15,40,0.6)',borderRadius:10,padding:4,border:'1px solid #1e2a4a',maxWidth:400,margin:'0 auto 24px'}}>
          {[{m:QUIZ_MODES.IT,l:'💻 IT Kvíz'},{m:QUIZ_MODES.GENERAL,l:'🌍 Obecný kvíz'}].map(({m,l})=>(
            <button key={m} onClick={()=>onSwitchMode(m)} style={{
              padding:'11px',borderRadius:8,border:'none',cursor:'pointer',
              fontFamily:'inherit',fontSize:13,fontWeight:700,
              transition:'all 0.2s',
              background: quizMode===m ? 'linear-gradient(135deg,#1a3a8a,#2255cc)' : 'transparent',
              color: quizMode===m ? '#fff' : '#4a5a7a',
              boxShadow: quizMode===m ? '0 0 20px rgba(68,136,255,0.3)' : 'none',
            }}>{l}</button>
          ))}
        </div>

        <div style={{background:'rgba(20,35,80,0.55)',border:'1px solid #2a3a6a',borderRadius:14,padding:'20px 28px',marginBottom:timeBonusToday>0?12:28,backdropFilter:'blur(8px)'}}>
          <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,color:'#4488ff',letterSpacing:3,marginBottom:10}}>
            {isGeneral ? '🌍 OBECNÝ KVÍZ' : '💻 IT KVÍZ'} — {todayKey}
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center',marginBottom:14}}>
            {cats.map(c=><span key={c} style={{background:'rgba(68,136,255,0.12)',border:'1px solid rgba(68,136,255,0.25)',borderRadius:20,padding:'3px 12px',fontSize:11,color:'#88aaff',letterSpacing:0.5}}>{c}</span>)}
          </div>
          <div style={{color:'#6677aa',fontSize:12}}>
            ⏱ {totalTime}s
            {timeBonusToday > 0 && <span style={{color:'#22cc88'}}> ({QUIZ_DURATION}s + {timeBonusToday}s bonus)</span>}
            &nbsp;•&nbsp; {QUESTIONS_PER_QUIZ} otázek &nbsp;•&nbsp; max {MAX_PTS} bodů/otázka
          </div>
          <div style={{color:'#445566',fontSize:11,marginTop:5}}>🔥 3× rychle = SUPER KOMBO &nbsp;⚡ 4× = MEGA &nbsp;💥 5× = ULTRA</div>
          <div style={{color:'#cc9900',fontSize:11,marginTop:4}}>💎 Bez jediné chyby = PERFECT RUN +{PERFECT_BONUS.toLocaleString()} prémiových bodů</div>
          <div style={{color:'#4a6a44',fontSize:11,marginTop:4}}>🎲 Poslední otázka = Lucky Box — bedny s skrytými body (+1000 až -500)</div>
        </div>

        {/* Time bonus banner */}
        {timeBonusToday > 0 && !hasPlayedToday && (
          <div style={{background:'rgba(0,80,50,0.4)',border:'1px solid #22cc88',borderRadius:10,padding:'12px 18px',marginBottom:24,display:'flex',alignItems:'center',gap:12,justifyContent:'center'}}>
            <span style={{fontSize:22}}>⏰</span>
            <div style={{textAlign:'left'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#44ffaa',letterSpacing:0.5}}>Máš {timeBonusToday}s bonusový čas!</div>
              <div style={{fontSize:11,color:'#338866'}}>Ušetřils ho včera dokončením kvízu dřív. Dnes ho využij.</div>
            </div>
          </div>
        )}

        {/* Resume banner — rozehraný kvíz */}
        {user && resumableQuiz && !hasPlayedToday && (
          <div style={{
            background:'linear-gradient(135deg,rgba(68,136,255,0.18),rgba(34,85,200,0.1))',
            border:'1px solid #4488ff88', borderRadius:12,
            padding:'14px 18px', marginBottom:16,
            display:'flex', alignItems:'center', gap:14,
          }}>
            <div style={{fontSize:28,flexShrink:0}}>⏯️</div>
            <div style={{flex:1,textAlign:'left'}}>
              <div style={{fontSize:13,fontWeight:700,color:'#88aaff',marginBottom:3}}>
                Máš rozehraný kvíz!
              </div>
              <div style={{fontSize:11,color:'#4a6a9a',lineHeight:1.4}}>
                Zodpovězeno {resumeProgress}/{resumeTotal} otázek
                &nbsp;•&nbsp; {resumableQuiz.totalScore?.toLocaleString()||0} bodů
                &nbsp;•&nbsp; zbývá ~{resumableQuiz.timeLeft}s
              </div>
            </div>
            <button className="btn" onClick={onResume} style={{
              background:'linear-gradient(135deg,#1a3a8a,#2255cc)',
              padding:'9px 18px', borderRadius:8, fontSize:12,
              color:'#fff', letterSpacing:1, flexShrink:0,
            }}>POKRAČOVAT</button>
          </div>
        )}

        {user ? (
          <div style={{marginBottom:24}}>
            <div style={{fontSize:12,color:'#4a5a7a',marginBottom:8}}>Přihlášen jako</div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginBottom:6}}>
              {/* Avatar */}
              <div style={{width:48,height:48,borderRadius:'50%',border:'2px solid #2a3a6a',overflow:'hidden',background:'#0d1428',flexShrink:0}}>
                {user.avatar_url
                  ? <img src={avatarSrc(user.avatar_url)} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,color:'#2a3a6a'}}>👤</div>
                }
              </div>
              <div style={{textAlign:'left'}}>
                <div style={{fontSize:20,color:'#88aaff',fontWeight:700,letterSpacing:1}}>{user.name}</div>
                {(user.company||user.position) && (
                  <div style={{fontSize:12,color:'#4a5a7a',marginTop:1}}>
                    {user.company && `🏢 ${user.company}`}{user.company&&user.position?' · ':''}{user.position&&`💼 ${user.position}`}
                  </div>
                )}
                {user.os_religion && <div style={{fontSize:11,color:'#334455',marginTop:1}}>{OS_LABELS[user.os_religion]||user.os_religion}</div>}
              </div>
            </div>
            <div style={{display:'flex',gap:14,justifyContent:'center',marginTop:4}}>
              <button onClick={onProfile} style={{background:'transparent',border:'none',color:'#4488ff',fontSize:11,cursor:'pointer',letterSpacing:1,textDecoration:'underline'}}>✏️ UPRAVIT PROFIL</button>
              <button onClick={onLogout} style={{background:'transparent',border:'none',color:'#334455',fontSize:11,cursor:'pointer',letterSpacing:1}}>ODHLÁSIT SE</button>
              {installed && <button onClick={()=>window.close()} style={{background:'transparent',border:'none',color:'#2a3a4a',fontSize:11,cursor:'pointer',letterSpacing:1}}>✕ ZAVŘÍT</button>}
            </div>
          </div>
        ) : (
          <div style={{marginBottom:24,color:'#ff9944',fontSize:13}}>⚠ Nejsi přihlášen</div>
        )}

        <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:340,margin:'0 auto'}}>
          {user ? (
            hasPlayedToday
              ? <div style={{background:'rgba(20,60,20,0.5)',border:'1px solid #334433',borderRadius:10,padding:16,color:'#66aa66',fontSize:12,letterSpacing:1}}>✓ DNES JSI UŽ HRÁL</div>
              : resumableQuiz
                ? null  // pokud je rozehraný kvíz, tlačítko "spustit" se nezobrazuje — jen banner POKRAČOVAT nahoře
                : <button className="btn" onClick={onStart} style={{background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'18px 40px',borderRadius:10,fontSize:17,color:'#fff',letterSpacing:3,boxShadow:'0 0 30px rgba(68,136,255,0.35)'}}>▶ SPUSTIT KVÍZ</button>
          ) : (
            <>
              <button className="btn" onClick={onRegister} style={{background:'linear-gradient(135deg,#1a3a8a,#2255cc)',padding:'16px 40px',borderRadius:10,fontSize:16,color:'#fff',letterSpacing:3,boxShadow:'0 0 30px rgba(68,136,255,0.35)'}}>✦ REGISTROVAT SE</button>
              <button className="btn" onClick={onLogin} style={{background:'transparent',border:'1px solid #4488ff',padding:'13px 40px',borderRadius:10,fontSize:13,color:'#88aaff',letterSpacing:2}}>↩ PŘIHLÁSIT SE</button>
            </>
          )}
          <button className="btn" onClick={onBoard} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'13px 40px',borderRadius:10,fontSize:13,color:'#88aaff',letterSpacing:2}}>🏆 ŽEBŘÍČEK</button>
          {user && <button className="btn" onClick={onStats} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'13px 40px',borderRadius:10,fontSize:13,color:'#88aaff',letterSpacing:2}}>
            📊 MÉ STATISTIKY
          </button>}
        </div>
      </div>
    </div>
  );
}

// ─── SDÍLENÉ POLE PROFILU ─────────────────────────────
function ProfileFields({ profile, setProfile }) {
  const p = (k,v) => setProfile(prev=>({...prev,[k]:v}));
  return (
    <div style={{textAlign:'left',marginTop:14}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div>
          <div className="field-label">🏢 Firma</div>
          <input value={profile.company||''} onChange={e=>p('company',e.target.value)} placeholder="ACME Corp..." maxLength={40}/>
        </div>
