                if(accPct<60) trainingTips.push({e:'📖',t:'Čti více',d:'Noviny, knihy, Wikipedia — cokoliv. Přehled to ocení.'});
                if(weakCats.length&&weakCats[0].acc<50) trainingTips.push({e:'🌍',t:weakCats[0].cat.replace(/^[^ ]+ /,''),d:`${weakCats[0].acc}% — existují knihy, YouTube i věc zvaná "cestování".`});
                if(parseFloat(avgT)>12) trainingTips.push({e:'⚡',t:'Rozhoduj rychleji',d:'Buď to víš, nebo nevíš. 15 sekund výsledek nezmění.'});
              } else {
                if(accPct<60) trainingTips.push({e:'🎓',t:'IT základy',d:'Kurz "Proč je kabel důležitý a jiné záhady"'});
                if(parseFloat(avgT)>12) trainingTips.push({e:'⚡',t:'Rychlost rozhodování',d:'Trénink rychlého rozhodování — ideálně bez Google'});
                if(weakCats.length&&weakCats[0].acc<50) trainingTips.push({e:'📚',t:weakCats[0].cat,d:`Přesnost ${weakCats[0].acc}% — tady by pomohlo školení`});
              }
              if(perfects===0&&totalPlayed>=5) trainingTips.push({e:'💎',t:'Konzistence',d:'Na perfect run potřebuje znalosti, ne štěstí'});
              if(lBomb>lJack&&lTot>=3) trainingTips.push({e:'🎲',t:'Risk management',d:'Instinkt na Lucky Box je statisticky tragický'});

              return (
                <div>
                  {/* Persóna */}
                  <div style={{background:'linear-gradient(135deg,rgba(68,136,255,0.12),rgba(34,85,200,0.06))',border:'1px solid #2a3a6a',borderRadius:14,padding:'14px 18px',marginBottom:16,display:'flex',alignItems:'center',gap:14}}>
                    <span style={{fontSize:38,flexShrink:0}}>{accR.e}</span>
                    <div>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:'#88aaff',letterSpacing:2,marginBottom:3}}>{accR.t}</div>
                      <div style={{fontSize:12,color:'#556688',lineHeight:1.5}}>{accR.d}</div>
                    </div>
                  </div>

                  {/* 12 čísel */}
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:8}}>
                    {[
                      {e:'🎯',l:'Přesnost',v:`${accPct}%`,c:accPct>=70?C.green:accPct>=50?C.gold:C.red},
                      {e:'⚡',l:'Průměrný čas',v:`${avgT}s`,c:parseFloat(avgT)<=5?C.green:parseFloat(avgT)<=10?C.gold:C.red},
                      {e:'📊',l:'Průměr/kvíz',v:avgSc.toLocaleString(),c:avgSc>=globalAvg?C.green:C.blue},
                      {e:'🏆',l:'Nejlepší kvíz',v:bestSc.toLocaleString(),c:C.gold},
                      {e:'💎',l:'Perfect runs',v:perfects,c:perfects>0?C.gold:C.gray},
                      {e:'🔥',l:'Streak',v:`${curStreak2}d`,c:curStreak2>=7?C.purple:curStreak2>=3?C.gold:C.gray},
                    ].map(s=>(
                      <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'12px 6px',textAlign:'center'}}>
                        <div style={{fontSize:16,marginBottom:4}}>{s.e}</div>
                        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:900,color:s.c}}>{s.v}</div>
                        <div style={{fontSize:9,color:'#445566',marginTop:3}}>{s.l}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:16}}>
                    {[
                      {e:'🚀',l:'Rychlé ans.',v:`${fastPct}%`,c:C.blue,sub:'do 3s'},
                      {e:'🐢',l:'Pomalé ans.',v:`${slowPct}%`,c:slowPct>40?C.red:C.gray,sub:'nad 15s'},
                      {e:'🏅',l:'Rank',v:rank?`#${rank}`:'—',c:rank<=3?C.gold:rank<=10?C.blue:C.gray,sub:`z ${allPlayers} hráčů`},
                      {e:'📈',l:'vs průměr',v:`${avgSc>=globalAvg?'+':''}${avgSc-globalAvg}`,c:avgSc>=globalAvg?C.green:C.red,sub:`avg ${globalAvg.toLocaleString()} b`},
                      {e:'⏱️',l:'Ušetřený čas',v:`${avgTimeSaved}s`,c:avgTimeSaved>=20?C.green:avgTimeSaved>=10?C.gold:C.gray,sub:'průměr/kvíz'},
                      {e:'🎯',l:'Nejdelší série',v:`${maxSerie}×`,c:maxSerie>=10?C.gold:maxSerie>=5?C.blue:C.gray,sub:'správných za sebou'},
                    ].map(s=>(
                      <div key={s.l} style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:10,padding:'10px 6px',textAlign:'center'}}>
                        <div style={{fontSize:14,marginBottom:3}}>{s.e}</div>
                        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,fontWeight:900,color:s.c}}>{s.v}</div>
                        <div style={{fontSize:9,color:'#445566',marginTop:1}}>{s.l}</div>
                        {s.sub&&<div style={{fontSize:8,color:'#334455',marginTop:1}}>{s.sub}</div>}
                      </div>
                    ))}
                  </div>

                  {/* Rychlost komentář */}
                  <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
                    <span style={{fontSize:26,flexShrink:0}}>{spdR.e}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:700,color:'#88aaff',marginBottom:2}}>{spdR.t}</div>
                      <div style={{fontSize:11,color:'#556688'}}>{spdR.d}</div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:9,color:'#334455'}}>avg čas</div>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:C.blue}}>{avgT}s</div>
                    </div>
                  </div>

                  {/* Odvětvová analýza */}
                  {sectorData.length>=2 && (
                    <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:14}}>
                        {pIsGeneral ? '🌍 JAKÁ TÉMATA MU JDOU' : '🏭 ODVĚTVOVÁ ANALÝZA'}
                      </div>
                      {sectorData.map((s,i)=>{
                        const col=s.acc>=80?C.green:s.acc>=60?C.gold:s.acc>=40?C.orange:C.red;
                        const emoji=s.acc>=80?'✅':s.acc>=60?'🟡':s.acc>=40?'⚠️':'❌';
                        const label=s.acc>=80?'Ovládá':s.acc>=60?'Solidní':s.acc>=40?'Slabší':'Potřebuje práci';
                        return (
                          <div key={s.sector} style={{display:'flex',alignItems:'center',gap:10,marginBottom:i<sectorData.length-1?10:0,padding:'5px 0',borderBottom:i<sectorData.length-1?'1px solid #1a2040':'none'}}>
                            <span style={{fontSize:13,flexShrink:0}}>{emoji}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                                <span style={{fontSize:12,color:'#aabbdd',fontWeight:600}}>{s.sector}</span>
                                <span style={{fontSize:11,color:col,fontWeight:700,flexShrink:0,marginLeft:8}}>{s.acc}% — {label}</span>
                              </div>
                              <div style={{background:'#1a2040',borderRadius:3,height:6,overflow:'hidden'}}>
                                <div style={{height:'100%',width:`${s.acc}%`,background:col,borderRadius:3}}/>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                      <div style={{marginTop:10,fontSize:11,color:'#445566',textAlign:'center'}}>
                        {sectorData[0]&&`💪 Nejsilnější: ${sectorData[0].sector} (${sectorData[0].acc}%)`}
                        {sectorData.length>1&&` · 📚 Zlepšit: ${sectorData[sectorData.length-1].sector} (${sectorData[sectorData.length-1].acc}%)`}
                      </div>
                    </div>
                  )}

                  {/* Silné / slabé */}
                  {catList.length>=2 && (
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
                      <div style={{background:'rgba(0,50,30,0.3)',border:'1px solid #226644',borderRadius:10,padding:'12px'}}>
                        <div style={{fontSize:9,color:'#44ffaa',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>✅ SILNÉ STRÁNKY</div>
                        {strongCats.length===0
                          ? <div style={{fontSize:11,color:'#334455'}}>Zatím málo dat</div>
                          : strongCats.map(c=>(
                            <div key={c.cat} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',borderBottom:'1px solid #1a3020',fontSize:11}}>
                              <div style={{flex:1,overflow:'hidden'}}>
                                <span style={{color:'#8899bb',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.cat}</span>
                                <span style={{fontSize:9,color:'#334455'}}>⏱ {c.avgTime}s</span>
                              </div>
                              <span style={{color:C.green,fontWeight:700,marginLeft:6,flexShrink:0}}>{c.acc}%</span>
                            </div>
                          ))
                        }
                      </div>
                      <div style={{background:'rgba(60,10,10,0.3)',border:'1px solid #662222',borderRadius:10,padding:'12px'}}>
                        <div style={{fontSize:9,color:'#ff8888',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>⚠️ SLABINY</div>
                        {weakCats.length===0
                          ? <div style={{fontSize:11,color:'#334455'}}>Zatím málo dat</div>
                          : weakCats.map(c=>(
                            <div key={c.cat} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',borderBottom:'1px solid #301a1a',fontSize:11}}>
                              <div style={{flex:1,overflow:'hidden'}}>
                                <span style={{color:'#8899bb',display:'block',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.cat}</span>
                                <span style={{fontSize:9,color:'#334455'}}>⏱ {c.avgTime}s</span>
                              </div>
                              <span style={{color:C.red,fontWeight:700,marginLeft:6,flexShrink:0}}>{c.acc}%</span>
                            </div>
                          ))
                        }
                      </div>
                    </div>
                  )}

                  {/* Bar graf kategorií */}
                  {catList.length>=3 && (
                    <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:12}}>📊 PŘESNOST + RYCHLOST PER KATEGORIE</div>
                      {catList.slice(0,8).map(c=>{
                        const col=c.acc>=80?C.green:c.acc>=60?C.gold:C.red;
                        const speedCol=parseFloat(c.avgTime)<=4?C.green:parseFloat(c.avgTime)<=8?C.gold:C.red;
                        return (
                          <div key={c.cat} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                            <div style={{fontSize:10,color:'#778899',width:80,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.cat}</div>
                            <div style={{flex:1,background:'#1a2040',borderRadius:3,height:7,overflow:'hidden'}}>
                              <div style={{height:'100%',width:`${c.acc}%`,background:col,borderRadius:3,boxShadow:`0 0 4px ${col}44`}}/>
                            </div>
                            <div style={{fontSize:10,color:col,fontWeight:700,minWidth:28,textAlign:'right'}}>{c.acc}%</div>
                            <div style={{fontSize:9,color:speedCol,minWidth:26,textAlign:'right',opacity:0.8}}>{c.avgTime}s</div>
                          </div>
                        );
                      })}
                      <div style={{fontSize:9,color:'#334455',textAlign:'right',marginTop:4}}>% přesnost · čas/odpověď</div>
                    </div>
                  )}

                  {/* Graf 14 dní */}
                  {(() => {
                    const last14=[];
                    for(let i=13;i>=0;i--){
                      const d=new Date();d.setDate(d.getDate()-i);
                      const dk=d.toISOString().slice(0,10);
                      const r=ps.find(s=>s.date===dk);
                      last14.push({date:dk,score:r?.score||0,played:!!r,perfect:r?.perfect||false});
                    }
                    const maxB=Math.max(...last14.map(d=>d.score),1);
                    return (
                      <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
                        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:14}}>📈 POSLEDNÍCH 14 DNÍ</div>
                        <div style={{display:'flex',alignItems:'flex-end',gap:3,height:72}}>
                          {last14.map((d,i)=>{
                            const h=d.played?Math.max(Math.round((d.score/maxB)*68),4):0;
                            const col=d.perfect?C.gold:d.played?C.blue:'#1a2040';
                            return (
                              <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,height:'100%',justifyContent:'flex-end'}}>
                                <div title={d.played?`${d.date}: ${d.score.toLocaleString()} b`:'Nehrál'}
                                  style={{width:'100%',height:h||2,background:col,borderRadius:'2px 2px 0 0',opacity:d.played?1:0.2,boxShadow:d.played?`0 0 4px ${col}66`:'none'}}/>
                                <div style={{fontSize:7,color:'#334455'}}>{new Date(d.date).getDate()}</div>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{display:'flex',gap:12,marginTop:6,fontSize:10,color:'#445566',justifyContent:'center'}}>
                          <span><span style={{color:C.gold}}>■</span> Perfect</span>
                          <span><span style={{color:C.blue}}>■</span> Odehráno</span>
                        </div>
                      </div>
                    );
                  })()}

                  {/* Lucky Box */}
                  {lTot>=1 && (
                    <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:16,marginBottom:16}}>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:12}}>🎲 LUCKY BOX PROFIL</div>
                      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:10}}>
                        {[
                          {e:'🏆',l:'Jackpoty',v:lJack,c:C.gold},
                          {e:'💣',l:'Bomby',v:lBomb,c:C.red},
                          {e:'💰',l:'Výhry',v:lWins,c:C.green},
                          {e:'📦',l:'Celkem',v:lTot,c:C.blue},
                        ].map(s=>(
                          <div key={s.l} style={{padding:'8px 4px',background:'rgba(8,12,35,0.6)',borderRadius:8,textAlign:'center',border:'1px solid #1a2a4a'}}>
                            <div style={{fontSize:18,marginBottom:3}}>{s.e}</div>
                            <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:s.c}}>{s.v}</div>
                            <div style={{fontSize:9,color:'#445566',marginTop:2}}>{s.l}</div>
                          </div>
                        ))}
                      </div>
                      {/* Celkový zisk/ztráta — velké číslo */}
                      <div style={{background:'rgba(8,12,35,0.6)',border:`1px solid ${lPts>=0?'#44ffaa44':'#ff444444'}`,borderRadius:8,padding:'10px',textAlign:'center'}}>
                        <div style={{fontSize:9,color:'#445566',letterSpacing:2,marginBottom:4}}>CELKOVÝ ZISK / ZTRÁTA Z LUCKY BOXU</div>
                        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:22,fontWeight:900,color:lPts>0?C.green:lPts<0?C.red:C.gray}}>
                          {lPts>0?'+':''}{lPts.toLocaleString()} b
                        </div>
                        <div style={{fontSize:10,color:'#445566',marginTop:3}}>
                          {lPts>0
                            ? `Lucky box ti přinesl ${lPts} bodů navíc`
                            : lPts<0
                            ? `Lucky box tě stál ${Math.abs(lPts)} bodů`
                            : 'Lucky box — přesná nula. Karmatická rovnováha.'}
                          {lJack>lBomb && <span style={{color:C.gold}}> · šťastlivec 🍀</span>}
                          {lBomb>lJack && <span style={{color:C.red}}> · smolař 💣</span>}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Streak komentář */}
                  <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #1e2a4a',borderRadius:12,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
                    <span style={{fontSize:26,flexShrink:0}}>{strR.e}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:700,color:'#88aaff',marginBottom:2}}>{strR.t}</div>
                      <div style={{fontSize:11,color:'#556688'}}>{strR.d}</div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:9,color:'#334455'}}>max streak</div>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,fontWeight:900,color:C.purple}}>{maxStreak2}d</div>
                    </div>
                  </div>

                  {/* Školení */}
                  {trainingTips.length>0 && (
                    <div style={{background:'rgba(12,18,50,0.8)',border:'1px solid #2a3a6a',borderRadius:12,padding:16,marginBottom:16}}>
                      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:10,color:'#4488ff',letterSpacing:2,marginBottom:12}}>🎓 DOPORUČENÉ ŠKOLENÍ</div>
                      {trainingTips.map((t,i)=>(
                        <div key={i} style={{display:'flex',gap:10,padding:'7px 0',borderBottom:i<trainingTips.length-1?'1px solid #1a2040':'none'}}>
                          <span style={{fontSize:18,flexShrink:0}}>{t.e}</span>
                          <div>
                            <div style={{fontSize:12,fontWeight:700,color:'#88aaff'}}>{t.t}</div>
                            <div style={{fontSize:11,color:'#556688',marginTop:2}}>{t.d}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Verdikt */}
                  <div style={{background:'rgba(12,18,50,0.8)',border:'1px dashed #2a3a6a',borderRadius:12,padding:16,textAlign:'center'}}>
                    <div style={{fontSize:9,color:'#334455',letterSpacing:2,marginBottom:8,fontFamily:"'Orbitron',sans-serif"}}>CELKOVÝ VERDIKT</div>
                    <div style={{fontSize:12,color:'#556688',lineHeight:1.8}}>
                      {pIsGeneral ? (
                        accPct>=75&&avgSc>=globalAvg&&parseFloat(avgT)<=6
                          ? `${profileView.name} ví kde leží Madagaskar, pamatuje si bitvy i chemické vzorce. Ostatní ho nesnáší na hospodských kvízech.`
                          : accPct>=75&&avgSc>=globalAvg
                          ? `${profileView.name} má výborný přehled a dobré skóre. Jen ta rychlost — ale rozhled se nesází na čas.`
                          : accPct>=75
                          ? `${profileView.name} je přesný, ale skóre pokulhává. Víc rychlosti, míň filozofování.`
                          : avgSc>=globalAvg
                          ? `${profileView.name} je rychlý, ale občas střílí od boku. Znalosti se nedají nahradit odhadem.`
                          : `${profileView.name} má co zlepšovat. Existuje věc zvaná kniha. A také Wikipedia. A okna.`
                      ) : (
                        accPct>=75&&avgSc>=globalAvg&&parseFloat(avgT)<=6
                          ? `${profileView.name} ví co dělá, dělá to rychle a nepotřebuje Stack Overflow. Ostatní to jen předstírají.`
                          : accPct>=75&&avgSc>=globalAvg
                          ? `${profileView.name} má znalosti i skóre výborné. Jen ta rychlost — ale kdo se nespěchá, taky někam dojde.`
                          : accPct>=75
                          ? `${profileView.name} je přesný, ale skóre by mohlo být vyšší.`
                          : avgSc>=globalAvg
                          ? `${profileView.name} má skóre nad průměrem, ale přesnost to trochu kazí.`
                          : `${profileView.name} má co zlepšovat. To je pozitivní zpráva.`
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

          </div>
        </div>
      )}

      <div className="slide-in">
        <div style={{textAlign:'center',paddingTop:28,marginBottom:20}}>
          <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,letterSpacing:4,color:'#4488ff',marginBottom:6}}>HALL OF FAME</div>
          <h2 className="glow" style={{fontFamily:"'Orbitron', sans-serif",fontSize:32,fontWeight:900,color:'#fff'}}>ŽEBŘÍČEK</h2>
          <div style={{fontSize:12,color:'#445566',marginTop:4}}>{mode===QUIZ_MODES.GENERAL?'🌍 Obecný kvíz':'💻 IT Kvíz'}</div>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',gap:6,marginBottom:20,justifyContent:'center',flexWrap:'wrap'}}>
          {[{k:'today',l:'Dnes'},{k:'month',l:`${monthLabel(currentMonth)}`},{k:'all',l:'Celkově'},{k:'champions',l:'🏅 Šampioni'}].map(t=>(
            <button key={t.k} className={`tab-btn${tab===t.k?' active':''}`} onClick={()=>setTab(t.k)}>{t.l}</button>
          ))}
        </div>

        {/* ŠAMPIONI TAB */}
        {tab==='champions' && (
          <div>
            <div style={{textAlign:'center',marginBottom:20}}>
              <div style={{fontSize:11,color:'#4a5a7a',letterSpacing:1}}>Vítězové měsíčního žebříčku</div>
            </div>
            {monthlyChampions.length === 0 ? (
              <div style={{textAlign:'center',padding:'40px 0'}}>
                <div style={{fontSize:40,marginBottom:12}}>🏅</div>
                <div style={{color:'#334455',fontSize:13}}>Zatím žádní korunovaní šampioni.</div>
                <div style={{color:'#2a3a5a',fontSize:11,marginTop:6}}>První šampion se korunuje automaticky na začátku nového měsíce.</div>
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {monthlyChampions.map((c,i)=>(
                  <div key={c.id} style={{
                    background: i===0 ? 'linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,150,0,0.08))' : 'rgba(12,20,52,0.75)',
                    border: `1px solid ${i===0?'#ffd700':'#2a3a6a'}`,
                    borderRadius:12, padding:'16px 20px',
                  }}>
                    <div style={{display:'flex',alignItems:'center',gap:14}}>
                      <div style={{fontSize:28,flexShrink:0}}>{i===0?'👑':'🏅'}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
                          <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,fontWeight:900,color:i===0?'#ffd700':'#88aaff'}}>
                            {c.user_name}
                          </span>
                          <span style={{fontSize:10,color:'#556688',letterSpacing:2,background:'rgba(255,215,0,0.1)',padding:'2px 8px',borderRadius:20,border:`1px solid ${i===0?'#ffd70044':'#2a3a6a'}`}}>
                            {monthLabel(c.month)}
                          </span>
                        </div>
                        <div style={{fontSize:11,color:'#445566'}}>
                          {c.days_played} {c.days_played===1?'den':'dní'} hraní
                        </div>
                      </div>
                      <div style={{textAlign:'right',flexShrink:0}}>
                        <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,fontWeight:900,color:i===0?'#ffd700':'#4488ff'}}>{c.total_score.toLocaleString()}</div>
                        <div style={{fontSize:10,color:'#334466',letterSpacing:1}}>BODŮ</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* STANDARDNÍ TABY */}
        {tab !== 'champions' && (
          <>
            {tab === 'month' && (
              <div style={{textAlign:'center',marginBottom:14,fontSize:11,color:'#4a5a7a'}}>
                Aktuální měsíc — nejlepší se korunuje 1. dne příštího měsíce
              </div>
            )}
            {list.length===0 ? (
              <div style={{textAlign:'center',color:'#334455',padding:50,fontSize:13}}>
                {tab==='today'?'Dnes ještě nikdo nehrál':tab==='month'?'Tento měsíc ještě nikdo nehrál':'Žádná data'}
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:7}}>
                {list.map((e,i)=>{
                  const me = e.user_id===user?.id || e.id===user?.id;
                  const sc = tab==='today' ? e.score : e.total;
                  const uid = e.user_id || e.id;
                  const isPerfectToday = tab==='today' && e.perfect;
                  const perfects = e.perfects || 0;

                  return (
                    <div key={uid} style={{
                      background: isPerfectToday
                        ? 'linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,140,0,0.06))'
                        : me ? 'rgba(68,136,255,0.13)' : 'rgba(12,20,52,0.75)',
                      border: `1px solid ${isPerfectToday?'#ffd700':me?'#4488ff':'#2a3a6a'}`,
                      borderRadius:10, padding:'13px 18px',
                      display:'flex', alignItems:'center', gap:14,
                      boxShadow: isPerfectToday ? '0 0 20px rgba(255,215,0,0.15)' : 'none',
                    }}>
                    {/* Rank + mini avatar */}
                    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flexShrink:0}}>
                      <div style={{width:32,height:32,borderRadius:'50%',overflow:'hidden',border:`1px solid ${isPerfectToday?'#ffd70066':me?'#4488ff44':'#1a2a5a'}`,background:'#0d1428',flexShrink:0}}>
                        {avatarCache[uid]
                          ? <img src={avatarSrc(avatarCache[uid])} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                          : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#2a3a5a'}}>
                              {i===0?'🥇':i===1?'🥈':i===2?'🥉':<span style={{fontSize:11,color:'#334466',fontWeight:700}}>{i+1}</span>}
                            </div>
                        }
                      </div>
                      {avatarCache[uid] && (
                        <div style={{fontSize:10,color:rc[i]||'#334466',fontWeight:700}}>
                          {i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}
                        </div>
                      )}
                    </div>

                      {/* Info */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                          <button onClick={()=>openProfile(uid)}
                            style={{background:'transparent',border:'none',cursor:'pointer',padding:0,textAlign:'left'}}>
                            <span style={{fontSize:14,fontWeight:700,color:isPerfectToday?'#ffd700':me?'#88aaff':'#ccdaff',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',textDecoration:'underline',textDecorationColor:'#2a3a6a',textUnderlineOffset:3}}>
                              {e.user_name||e.name} {me&&'(ty)'}
                            </span>
                          </button>
                          {isPerfectToday && (
                            <span style={{fontSize:10,background:'rgba(255,215,0,0.2)',color:'#ffd700',border:'1px solid #ffd70066',borderRadius:20,padding:'1px 8px',letterSpacing:0.5,flexShrink:0}}>
                              💎 PERFECT
                            </span>
                          )}
                          {tab!=='today' && perfects > 0 && (
                            <span style={{fontSize:10,background:'rgba(255,215,0,0.1)',color:'#cc9900',border:'1px solid #ffd70033',borderRadius:20,padding:'1px 7px',flexShrink:0}}>
                              💎 ×{perfects}
                            </span>
                          )}
                          {/* Komentář odstraněn — anti-cheat systém odebrán */}
                        </div>
                        {tab==='all' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.played} {e.played===1?'kvíz':'kvízy'} • nejlepší: {e.best.toLocaleString()} b</div>}
                        {tab==='month' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.played} {e.played===1?'den':'dní'} • nejlepší: {e.best.toLocaleString()} b</div>}
                        {tab==='today' && <div style={{fontSize:11,color:'#445566',marginTop:1}}>{e.correct}/{Math.max((e.total||16)-1,15)} správně</div>}
                      </div>

                      {/* Score */}
                      <div style={{textAlign:'right',flexShrink:0}}>
                        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:19,fontWeight:900,color:isPerfectToday?'#ffd700':i===0?'#ffdd00':'#4488ff'}}>{sc.toLocaleString()}</div>
                        <div style={{fontFamily:"'Orbitron', sans-serif",fontSize:10,color:'#334466',letterSpacing:1}}>BODŮ</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </>
        )}

        <div style={{textAlign:'center',marginTop:28}}>
          <button className="btn" onClick={onBack} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 30px',borderRadius:8,fontSize:12,color:'#88aaff',letterSpacing:2}}>← ZPĚT</button>
        </div>
      </div>
    </div>
  );
}

// ─── STATS SCREEN ─────────────────────────────────────
function StatsScreen({ user, scores, quizMode, onBack }) {
  const [localMode, setLocalMode] = useState(quizMode || QUIZ_MODES.IT);
  const mode = localMode;
  const isGeneral = mode === QUIZ_MODES.GENERAL;

  // Filtruj podle módu
  const myScores = scores
    .filter(s => s.user_id === user.id && (s.quiz_mode || QUIZ_MODES.IT) === mode)
    .sort((a,b) => a.date.localeCompare(b.date));

  const totalPlayed  = myScores.length;
  const totalScore   = myScores.reduce((s,r) => s+r.score, 0);
  const avgScore     = totalPlayed ? Math.round(totalScore/totalPlayed) : 0;
  const bestScore    = totalPlayed ? Math.max(...myScores.map(r=>r.score)) : 0;
  const perfectCount = myScores.filter(r=>r.perfect).length;
  const totalCorrect = myScores.reduce((s,r) => s+(r.correct||0), 0);
  const totalQs      = myScores.reduce((s,r) => s+(r.total||0), 0);
  const accuracy     = totalQs ? Math.round((totalCorrect/totalQs)*100) : 0;

  // Streak
  let maxStreak=0, tempStreak=0, currentStreak=0;
  const sortedDays = [...new Set(myScores.map(r=>r.date))].sort();
  for (let i=0; i<sortedDays.length; i++) {
    if (i===0){tempStreak=1;}
    else {
      const prev=new Date(sortedDays[i-1]); prev.setDate(prev.getDate()+1);
      tempStreak = prev.toISOString().slice(0,10)===sortedDays[i] ? tempStreak+1 : 1;
    }
    maxStreak=Math.max(maxStreak,tempStreak);
  }
  const today=getTodayKey();
  for (let i=sortedDays.length-1; i>=0; i--) {
    const exp=new Date(today); exp.setDate(exp.getDate()-(sortedDays.length-1-i));
    if (sortedDays[i]===exp.toISOString().slice(0,10)) currentStreak++;
    else break;
  }

  // Analýza play_log — použij správný pool otázek
  const questionPool = isGeneral ? ALL_GENERAL_QUESTIONS : ALL_QUESTIONS;
  const catData = {};
  let totalAnswers=0, totalAnswerTime=0, fastAnswers=0, slowAnswers=0;
  let maxAnswerStreak=0, curAnswerStreak=0;

  myScores.forEach(s => {
    if (!s.play_log || !s.play_log.length) return;
    s.play_log.forEach(e => {
      if (e.qId==='lucky') return;
      const q = questionPool.find(q=>String(q.id)===String(e.qId));
      const cat = q ? q.cat : 'Ostatní';
      if (!catData[cat]) catData[cat]={correct:0,total:0,totalTime:0};
      catData[cat].total++;
      if (e.correct) catData[cat].correct++;
      const t = e.time_spent || 0;
      catData[cat].totalTime += t;
      totalAnswers++; totalAnswerTime += t;
      if (t <= 3) fastAnswers++;
      if (t >= 15) slowAnswers++;
      if (e.correct) { curAnswerStreak++; }
      else { maxAnswerStreak=Math.max(maxAnswerStreak,curAnswerStreak); curAnswerStreak=0; }
    });
    maxAnswerStreak=Math.max(maxAnswerStreak,curAnswerStreak);
  });

  const avgAnswerTime = totalAnswers ? (totalAnswerTime/totalAnswers).toFixed(1) : 0;
  const fastPct = totalAnswers ? Math.round((fastAnswers/totalAnswers)*100) : 0;
  const slowPct = totalAnswers ? Math.round((slowAnswers/totalAnswers)*100) : 0;

  const catList = Object.entries(catData)
    .filter(([,d])=>d.total>=2)
    .map(([cat,d])=>({
      cat,
      acc: Math.round((d.correct/d.total)*100),
      total: d.total,
      avgTime: d.total ? (d.totalTime/d.total).toFixed(1) : 0,
    }))
    .sort((a,b)=>b.acc-a.acc);
  const avgCatAcc = catList.length ? Math.round(catList.reduce((s,c)=>s+c.acc,0)/catList.length) : 50;
  const topCats  = catList.filter(c=>c.acc>avgCatAcc).slice(0,4);
  const weakCats = catList.filter(c=>c.acc<=avgCatAcc).sort((a,b)=>a.acc-b.acc).slice(0,4);

  // Odvětví — IT vs Obecný
  const SECTORS_IT = {
    'Sítě & Infrastruktura': ['Sítě','WiFi','Konektory','Telco','DC'],
    'Bezpečnost': ['Bezpečnost','Šifrování'],
    'Cloud & DevOps': ['Cloud','Virtualizace','Správa'],
    'Systémy & OS': ['OS','Linux','Windows'],
    'Data & Protokoly': ['Databáze','Protokoly','Email'],
    'Hardware': ['Hardware','Periferie','Úložiště','Zálohy'],
    'AI & Moderní tech': ['AI/ML','IoT','Telco'],
  };
  const SECTORS_GENERAL = {
    'Geografie': ['🌍 Geografie'],
    'Historie': ['🏛️ Historie'],
    'Věda': ['🔬 Věda'],
    'Film & TV': ['🎬 Film & TV'],
    'Hudba': ['🎵 Hudba'],
    'Sport': ['⚽ Sport'],
    'Jídlo': ['🍕 Jídlo'],
    'Příroda': ['🐾 Příroda'],
    'Logika': ['🧠 Logika'],
    'Zajímavosti': ['💡 Zajímavosti'],
  };
  const SECTORS = isGeneral ? SECTORS_GENERAL : SECTORS_IT;
  const sectorData = Object.entries(SECTORS).map(([sector, cats]) => {
    let correct=0, total=0;
    cats.forEach(c => {
      // Pro obecný kvíz kategorie jsou přesné shody (včetně emoji)
      Object.entries(catData).forEach(([cat, d]) => {
        if (cat === c || cat.includes(c.replace(/^[^ ]+ /,''))) {
          correct += d.correct; total += d.total;
        }
      });
    });
    return { sector, acc: total ? Math.round((correct/total)*100) : null, total };
  }).filter(s=>s.total>=2).sort((a,b)=>b.acc-a.acc);

  // Lucky Box
  const lucky={total:0,wins:0,losses:0,jackpots:0,bombs:0,zeros:0,totalPts:0};
  myScores.forEach(s=>{
    if(!s.play_log) return;
    s.play_log.filter(e=>e.qId==='lucky').forEach(e=>{
      lucky.total++;
      const v=e.chosen||0; lucky.totalPts+=v;
      if(v===1000) lucky.jackpots++;
      else if(v===-500) lucky.bombs++;
      else if(v===0) lucky.zeros++;
      else if(v>0) lucky.wins++;
      else lucky.losses++;
    });
  });

  const timeScores = myScores.filter(s=>s.time_saved!=null);
  const avgTimeSaved = timeScores.length ? Math.round(timeScores.reduce((a,s)=>a+(s.time_saved||0),0)/timeScores.length) : 0;

  // Globální průměr jen ze stejného módu
  const modeAll = scores.filter(s=>(s.quiz_mode||QUIZ_MODES.IT)===mode);
  const allAvg = modeAll.length ? Math.round(modeAll.reduce((s,r)=>s+r.score,0)/modeAll.length) : 0;
  const allPlayers = new Set(modeAll.map(s=>s.user_id)).size;
  const myRank = [...new Set(modeAll.map(s=>s.user_id))]
    .map(uid=>({uid,t:modeAll.filter(s=>s.user_id===uid).reduce((a,r)=>a+r.score,0)}))
    .sort((a,b)=>b.t-a.t).findIndex(r=>r.uid===user.id)+1;

  // ── VTIPNÉ HODNOCENÍ ──────────────────────────────────
  function speedRoast(avg) {
    const a=parseFloat(avg);
    if (isGeneral) {
      if(a<=2) return {e:'⚡',t:'Speedrunner vědomostí',d:'Odpovídáš rychleji než Wikipedie načte stránku. Buď jsi génius, nebo tipuješ.'};
      if(a<=4) return {e:'🚀',t:'Encyklopedie na nohou',d:'Pod 4 sekundy. Buď to víš, nebo máš štěstí. Obojí funguje.'};
      if(a<=7) return {e:'🎯',t:'Rozumný znalec',d:'Přemýšlíš, ale ne moc dlouho. Zlatá střední cesta vzdělance.'};
      if(a<=12) return {e:'🐢',t:'Hluboký myslitel',d:'Dlouhé přemýšlení. Nebo si vzpomínáš kde jsi to četl. Nebo obojí.'};
      return {e:'🦥',t:'Filosof v křesle',d:'Každá otázka je výzva k zamyšlení nad smyslem existence. A pak klikneš B.'};
    }
    if(a<=2) return {e:'⚡',t:'Kvantový procesor',d:'Odpovídáš rychleji než si stihneš přečíst otázku. Hazard nebo génius?'};
    if(a<=4) return {e:'🚀',t:'Rychlý jako NVMe',d:'Průměr pod 4s. Jsi připravený. Nebo odhazuješ naslepo.'};
    if(a<=7) return {e:'🎯',t:'Rozvážný expert',d:'Přemýšlíš před kliknutím. Starý zvyk správného admina.'};
    if(a<=12) return {e:'🐢',t:'Důkladný čtenář',d:'Čteš otázku třikrát. Jednou by stačilo, ale respektujeme pečlivost.'};
    return {e:'🦥',t:'Filosof v IT',d:'Každá odpověď je existenciální rozhodnutí. Nebo jsi šel uvařit kávu.'};
  }

  function accuracyRoast(acc) {
    if (isGeneral) {
      if(acc>=95) return {e:'🧠',t:'Živoucí Wikipedie',d:'Víš všechno. Nebo si to myslíš. Ostatní se tě bojí na kvízy.'};
      if(acc>=85) return {e:'📚',t:'Vzdělaný člověk',d:'Četl jsi knihy. Nebo sleduješ Discovery. Každopádně ti to jde.'};
      if(acc>=70) return {e:'💡',t:'Solidní všeobecný přehled',d:'Nad průměrem. V hospodském kvízu bys byl ten užitečný člen týmu.'};
      if(acc>=55) return {e:'🤔',t:'Průměrný středoškolák',d:'Polovina správně. Maturitu bys asi udělal. Asi.'};
      if(acc>=40) return {e:'😅',t:'Optimistický nevzdělanec',d:'Aspoň víš kde leží Francie. Doufáme.'};
      return {e:'🌍',t:'Záhada přírody',d:'Statisticky vzato, náhodné tipování by dopadlo lépe. A to říká hodně.'};
    }
    if(acc>=95) return {e:'🧠',t:'Kyborg v lidském těle',d:'Podezřele správně. IT oddělení tě sleduje.'};
    if(acc>=85) return {e:'🎯',t:'Ostrý jako nový SSD',d:'Nemáš odpovědi, ty jsi odpověď.'};
    if(acc>=70) return {e:'💪',t:'Nadprůměrný člověk',d:'Ve firmě bys byl ten co opravuje ostatní.'};
    if(acc>=55) return {e:'🤔',t:'Slušný pokus',d:'Senior developer styl — polovina správně, polovina kreativně.'};
    if(acc>=40) return {e:'😅',t:'Optimistický začátečník',d:'Aspoň heslo na WiFi víš. Doufáme.'};
    return {e:'💀',t:'Živoucí důkaz chaosu',d:'Tiskárna by tě přechytračila.'};
  }

  function streakRoast(s) {
    if (isGeneral) {
      if(s>=30) return {e:'🔥',t:'Encyklopedie na steroidech',d:'Měsíc denního kvízu. Twoje všeobecná vzdělanost dosáhla NPC úrovně.'};
      if(s>=14) return {e:'📅',t:'Věrný student světa',d:`${s} dní v kuse. Twoje IQ roste pomaleji než to číslo, ale roste.`};
      if(s>=7)  return {e:'🌱',t:'Týdenní znalec',d:'Týden bez přerušení. To je víc než tvoje dieta vydržela.'};
      if(s>=3)  return {e:'🐣',t:'Začínající polymath',d:'3 dny. Malý krok pro člověka, velký krok pro tvůj přehled.'};
      if(s>=1)  return {e:'👶',t:'Jeden malý krok',d:'Aspoň jsi tu. Svět je plný lidí kteří nevědí kde leží Brazílie.'};
      return {e:'📺',t:'Trochu více televize',d:'Streak = 0. I seriály by tě naučily víc.'};
    }
    if(s>=30) return {e:'🔥',t:'Na dovolené s laptopem',d:'Normální lidé odpočívají. Ty kvízuješ.'};
    if(s>=14) return {e:'⚡',t:'Pravidelný jako cron job',d:`${s} dní v kuse. Tvůj terapeut o tom neví.`};
    if(s>=7)  return {e:'📅',t:'Solidní návyk',d:'Týden v kuse. Víc než většina projektů.'};
    if(s>=3)  return {e:'🌱',t:'Roste to',d:'Nezruš to zítra jako gym membership.'};
    if(s>=1)  return {e:'🐢',t:'Začátek je těžký',d:'Aspoň jsi tady. Na rozdíl od dokumentace.'};
    return {e:'👻',t:'Přízrak čtenář',d:'Streak = 0. Ani cron by tě nenaplánoval.'};
  }

  const accR  = accuracyRoast(accuracy);
  const spdR  = speedRoast(avgAnswerTime);
  const strR  = streakRoast(currentStreak);
  const C={gold:'#ffd700',blue:'#4488ff',green:'#44ffaa',red:'#ff4444',gray:'#556688',purple:'#bb44ff',orange:'#ff9900'};

  // Doporučení — obecný vs IT
  const trainingTips = [];
  if (isGeneral) {
    if (accuracy<60)  trainingTips.push({e:'📖',t:'Čti více',d:'Noviny, knihy, Wikipedia — cokoliv. Tvůj přehled to ocení.'});
    if (weakCats.length && weakCats[0].acc<50) trainingTips.push({e:'🌍',t:weakCats[0].cat.replace(/^[^ ]+ /,''),d:`${weakCats[0].acc}% přesnost. Existuje YouTube, documentaries, a věci zvané "knihy".`});
    if (parseFloat(avgAnswerTime)>12) trainingTips.push({e:'⚡',t:'Rozhoduj rychleji',d:'Buď to víš, nebo nevíš. 15 sekund přemýšlení výsledek nezmění.'});
    if (perfectCount===0 && totalPlayed>=5) trainingTips.push({e:'💎',t:'Míř na perfekt',d:'15/15 čeká. Stačí trochu více BBC, National Geographic, nebo prostě víc žít.'});
    if (lucky.bombs>lucky.jackpots && lucky.total>=3) trainingTips.push({e:'🎲',t:'Lucky Box smolař',d:'Ani náhoda tě nemá ráda. Zkus jinou bednu. Nebo ne.'});
  } else {
    if (accuracy<60)  trainingTips.push({e:'🎓',t:'IT základy',d:'Kurz "Proč je kabel důležitý a jiné záhady"'});
    if (parseFloat(avgAnswerTime)>12) trainingTips.push({e:'⚡',t:'Rychlost rozhodování',d:'Trénink rychlého rozhodování — ideálně bez Google a kávy'});
    if (perfectCount===0 && totalPlayed>=5) trainingTips.push({e:'💎',t:'Konzistence',d:'Na perfect run potřebuješ znalosti, ne štěstí'});
    if (weakCats.length && weakCats[0].acc<50) trainingTips.push({e:'📚',t:weakCats[0].cat,d:`Přesnost ${weakCats[0].acc}% — tady by pomohlo pořádné školení`});
    if (lucky.bombs>lucky.jackpots && lucky.total>=3) trainingTips.push({e:'🎲',t:'Risk management',d:'Tvůj instinkt na Lucky Box je statisticky tragický'});
    if (currentStreak===0 && totalPlayed>=3) trainingTips.push({e:'📅',t:'Pravidelnost',d:'Nepravidelné hraní = nepravidelné znalosti'});
  }

  return (
    <div style={{minHeight:'100vh',padding:'20px',maxWidth:700,margin:'0 auto'}}>
      <div className="slide-in">
        <div style={{textAlign:'center',paddingTop:24,marginBottom:16}}>

              {isGeneral ? (
                accuracy>=75&&avgScore>=allAvg&&parseFloat(avgAnswerTime)<=6

                  ? `${user.name}, máš výborný přehled. Jen ta rychlost — ale rozhled se nesází na čas.`

                  ? `${user.name}, vědomosti máš, ale skóre trochu pokulhává. Víc rychlosti, míň filozofování.`
                  : avgScore>=allAvg
                  ? `${user.name}, rychlý jsi, ale občas střílíš od boku. Znalosti se nedají nahradit odhadem.`
                  : `${user.name}, máš co zlepšovat. Existuje věc zvaná kniha. A také Wikipedia. A televize. A okna.`
              ) : (
                accuracy>=75&&avgScore>=allAvg&&parseFloat(avgAnswerTime)<=6
                  ? `${user.name}, jsi ten člověk ve firmě co opravdu ví co dělá, dělá to rychle a nepotřebuje Stack Overflow. Ostatní to jen předstírají.`
                  : accuracy>=75&&avgScore>=allAvg
                  ? `${user.name}, znalosti i skóre máš výborné. Jen ta rychlost — ale kdo se nespěchá, taky někam dojde.`
                  : accuracy>=75&&parseFloat(avgAnswerTime)<=6
                  ? `${user.name}, rychlý a přesný. Jen to skóre by mohlo být vyšší.`
                  : accuracy>=75
                  ? `${user.name}, přesnost výborná, zbytek má potenciál. Potenciál se ale nenapíše do CV.`
                  : avgScore>=allAvg
                  ? `${user.name}, skóre nad průměrem, ale přesnost to trochu kazí.`
                  : `${user.name}, máš co zlepšovat — to je pozitivní zpráva.`
              )}
            </div>
          </div>

        </>)}
        <div style={{textAlign:'center',marginBottom:24}}>
          <button className="btn" onClick={onBack} style={{background:'transparent',border:'1px solid #2a3a6a',padding:'11px 30px',borderRadius:8,fontSize:12,color:'#88aaff',letterSpacing:2}}>← ZPĚT</button>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
